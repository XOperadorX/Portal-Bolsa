<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Login - MM Quase Tudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002e5d, #001a33);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #002e5d;
        }

        .logo span {
            font-size: 1.2rem;
            color: #4a6f8f;
        }

        .descricao {
            text-align: center;
            color: #4a6f8f;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #002e5d;
            background: white;
            box-shadow: 0 0 0 4px rgba(0,46,93,0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,92,246,0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .links a {
            color: #002e5d;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #f59e0b;
            text-decoration: underline;
        }

        .mensagem-erro {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #b91c1c;
        }

        .mensagem-erro.show {
            display: block;
        }

        .mensagem-sucesso {
            background: #dcfce7;
            color: #0a5c3e;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #10b981;
        }

        .mensagem-sucesso.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-supabase {
            text-align: center;
            font-size: 0.75rem;
            color: #6c86a3;
            margin-top: 20px;
            padding: 8px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .status-supabase.online {
            color: #10b981;
        }

        .status-supabase.offline {
            color: #ef4444;
        }

        .resultado-login {
            background: #f0fdf4;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .resultado-login.show {
            display: block;
        }

        .resultado-login p {
            font-size: 0.95rem;
            color: #0a5c3e;
            margin-bottom: 4px;
        }

        .resultado-login .login-encontrado {
            font-size: 1.2rem;
            font-weight: 700;
            color: #002e5d;
            word-break: break-all;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏦 MM Quase Tudo</h1>
            <span>Recuperar Login</span>
        </div>

        <div class="descricao">
            Digite seu nome completo para recuperar seu login.
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="mensagemSucesso" class="mensagem-sucesso"></div>

        <form id="formRecuperarLogin">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <button type="submit" class="btn-submit" id="btnRecuperar">🔍 Recuperar Login</button>
        </form>

        <div id="resultadoLogin" class="resultado-login">
            <p>✅ Seu login é:</p>
            <p class="login-encontrado" id="loginEncontrado"></p>
        </div>

        <div class="links">
            <a href="login.html">🔐 Voltar para o login</a>
        </div>

        <div id="statusSupabase" class="status-supabase">☁️ Verificando conexão...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        const TABELA = 'Geral';

        const formRecuperar = document.getElementById('formRecuperarLogin');
        const nomeInput = document.getElementById('nome');
        const btnRecuperar = document.getElementById('btnRecuperar');
        const mensagemErro = document.getElementById('mensagemErro');
        const mensagemSucesso = document.getElementById('mensagemSucesso');
        const statusSupabase = document.getElementById('statusSupabase');
        const resultadoLogin = document.getElementById('resultadoLogin');
        const loginEncontrado = document.getElementById('loginEncontrado');

        function mostrarErro(mensagem) {
            mensagemErro.textContent = mensagem;
            mensagemErro.className = 'mensagem-erro show';
            mensagemSucesso.className = 'mensagem-sucesso';
            resultadoLogin.className = 'resultado-login';
        }

        function mostrarSucesso(mensagem) {
            mensagemSucesso.textContent = mensagem;
            mensagemSucesso.className = 'mensagem-sucesso show';
            mensagemErro.className = 'mensagem-erro';
        }

        function ocultarMensagens() {
            mensagemErro.className = 'mensagem-erro';
            mensagemSucesso.className = 'mensagem-sucesso';
        }

        async function verificarSupabase() {
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('id')
                    .limit(1);
                
                if (error) {
                    statusSupabase.textContent = '⚠️ Erro ao conectar';
                    statusSupabase.className = 'status-supabase offline';
                    return false;
                }
                
                statusSupabase.textContent = '✅ Conectado ao Supabase';
                statusSupabase.className = 'status-supabase online';
                return true;
            } catch (error) {
                statusSupabase.textContent = '❌ Erro ao conectar';
                statusSupabase.className = 'status-supabase offline';
                return false;
            }
        }

        async function recuperarLogin(nome) {
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('login')
                    .ilike('nome', `%${nome}%`)
                    .limit(5);

                if (error) {
                    mostrarErro('❌ Erro ao buscar usuário. Tente novamente.');
                    return false;
                }

                if (!data || data.length === 0) {
                    mostrarErro('❌ Nenhum usuário encontrado com este nome.');
                    return false;
                }

                if (data.length === 1) {
                    loginEncontrado.textContent = data[0].login;
                    resultadoLogin.className = 'resultado-login show';
                    mostrarSucesso('✅ Login encontrado!');
                } else {
                    const logins = data.map(u => u.login).join(', ');
                    loginEncontrado.textContent = logins;
                    resultadoLogin.className = 'resultado-login show';
                    mostrarSucesso(`✅ Encontrados ${data.length} usuários:`);
                }

                return true;

            } catch (error) {
                console.error('Erro:', error);
                mostrarErro('❌ Erro ao recuperar login. Tente novamente.');
                return false;
            }
        }

        formRecuperar.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensagens();
            resultadoLogin.className = 'resultado-login';

            const nome = nomeInput.value.trim();

            if (!nome || nome.length < 3) {
                mostrarErro('⚠️ Digite seu nome completo (mínimo 3 caracteres).');
                return;
            }

            const online = await verificarSupabase();
            if (!online) {
                mostrarErro('❌ Sem conexão com o banco de dados.');
                return;
            }

            btnRecuperar.disabled = true;
            btnRecuperar.innerHTML = '<span class="loading"></span> Buscando...';

            await recuperarLogin(nome);

            btnRecuperar.disabled = false;
            btnRecuperar.innerHTML = '🔍 Recuperar Login';
        });

        verificarSupabase();
    </script>
</body>
</html>
