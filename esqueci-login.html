<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Login - MM Quase Tudo</title>
    <link rel="stylesheet" href="style/esqueci-login.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🏦 MM Quase Tudo</h1>
            <span>Recuperar Login</span>
        </div>

        <div class="descricao">
            Digite seu nome completo para recuperar seu login.
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="mensagemSucesso" class="mensagem-sucesso"></div>

        <form id="formRecuperarLogin">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <button type="submit" class="btn-submit" id="btnRecuperar">🔍 Recuperar Login</button>
        </form>

        <div id="resultadoLogin" class="resultado-login" style="display:none;">
            <p>✅ Seu login é:</p>
            <p class="login-encontrado" id="loginEncontrado"></p>
        </div>

        <div class="links">
            <a href="./login.html">🔐 Voltar para o login</a>
        </div>

        <div id="statusSupabase" class="status-supabase">☁️ Verificando conexão...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
        const TABELA = 'Geral';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('formRecuperarLogin');
        const nomeInput = document.getElementById('nome');
        const btn = document.getElementById('btnRecuperar');
        const mensagemErro = document.getElementById('mensagemErro');
        const mensagemSucesso = document.getElementById('mensagemSucesso');
        const resultado = document.getElementById('resultadoLogin');
        const loginEncontrado = document.getElementById('loginEncontrado');
        const statusSupabase = document.getElementById('statusSupabase');

        function mostrarErro(m) {
            mensagemErro.textContent = m;
            mensagemErro.className = 'mensagem-erro show';
            mensagemSucesso.className = 'mensagem-sucesso';
        }
        function mostrarSucesso(m) {
            mensagemSucesso.textContent = m;
            mensagemSucesso.className = 'mensagem-sucesso show';
            mensagemErro.className = 'mensagem-erro';
        }
        function ocultar() {
            mensagemErro.className = 'mensagem-erro';
            mensagemSucesso.className = 'mensagem-sucesso';
        }

        async function verificarConexao() {
            try {
                const { error } = await supabaseClient.from(TABELA).select('id').limit(1);
                if (error) throw error;
                statusSupabase.textContent = '✅ Conectado';
                statusSupabase.className = 'status-supabase online';
                return true;
            } catch {
                statusSupabase.textContent = '❌ Sem conexão';
                statusSupabase.className = 'status-supabase offline';
                return false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultar();
            resultado.style.display = 'none';

            const nome = nomeInput.value.trim();
            if (!nome) { mostrarErro('⚠️ Digite seu nome completo.'); return; }

            if (!(await verificarConexao())) {
                mostrarErro('❌ Sem conexão com o banco.');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Buscando...';

            try {
                const { data, error } = await supabaseClient
                    .from(TABELA)
                    .select('login, nome')
                    .ilike('nome', `%${nome}%`)
                    .limit(5);

                if (error) throw error;

                if (!data || data.length === 0) {
                    mostrarErro('❌ Nenhum usuário encontrado com esse nome.');
                    return;
                }

                if (data.length === 1) {
                    loginEncontrado.textContent = data[0].login;
                    resultado.style.display = 'block';
                    mostrarSucesso('✅ Login encontrado!');
                } else {
                    loginEncontrado.innerHTML = data.map(u => `• <strong>${u.login}</strong> (${u.nome})`).join('<br>');
                    resultado.style.display = 'block';
                    mostrarSucesso(`✅ ${data.length} logins encontrados.`);
                }
            } catch (err) {
                console.error(err);
                mostrarErro('❌ Erro ao buscar. Tente novamente.');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Recuperar Login';
            }
        });

        verificarConexao();
    </script>
</body>
</html>
