  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: #0b0e14; color: #e0e0e0; }

    .menu-container {
      width: 100%;
      background-color: rgb(0, 43, 173);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .logo span { color: #f5c542; font-weight: 900; }
    .logo i { color: #f5c542; font-size: 1.6rem; margin-right: 0.2rem; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-links li a {
      text-decoration: none;
      color: #d0d0d0;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
      padding: 0.5rem 0;
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .nav-links li a i {
      margin-right: 8px;
      font-size: 0.95em;
      color: #f5c542;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .nav-links li a:hover i { color: #ffffff; transform: scale(1.1); }

    .nav-links li a::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 2px;
      background: #f5c542;
      transition: width 0.25s ease;
    }

    .nav-links li a:hover { color: #ffffff; }
    .nav-links li a:hover::after { width: 100%; }

    .btn-discord {
      background: linear-gradient(135deg, #f5c542 0%, #d4a017 100%);
      border: none;
      border-radius: 40px;
      color: #0b0e14;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.7rem 1.6rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 0 15px rgba(245, 197, 66, 0.3);
      text-decoration: none;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .btn-discord i { font-size: 1.1rem; }

    .btn-discord:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(245, 197, 66, 0.6);
      background: linear-gradient(135deg, #f7d25c 0%, #e0b020 100%);
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: none;
      color: #f5c542;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
    }

    @media (max-width: 1024px) {
      .navbar { padding: 0.8rem 1.5rem; }
      .nav-links { gap: 1.5rem; }
      .btn-discord { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
    }

    @media (max-width: 860px) {
      .nav-links {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
        padding: 1.5rem 0 0.5rem 0;
        border-top: 1px solid rgba(255, 215, 0, 0.15);
        margin-top: 1rem;
      }
      .nav-links.active { display: flex; }
      .nav-links li { width: 100%; }
      .nav-links li a { display: flex; width: 100%; padding: 0.6rem 0; font-size: 1.1rem; }
      .menu-toggle { display: block; }
      .navbar { justify-content: space-between; }
      .btn-discord { margin-left: auto; margin-right: 1rem; }
    }

    @media (max-width: 480px) {
      .navbar { padding: 0.7rem 1rem; }
      .logo { font-size: 1.5rem; }
      .logo i { font-size: 1.3rem; }
      .btn-discord { padding: 0.5rem 1rem; font-size: 0.8rem; }
      .btn-discord span { display: none; }
      .btn-discord i { font-size: 1.2rem; margin: 0; }
    }

  <script>
    (function() {
      const toggleBtn = document.getElementById('menuToggle');
      const navLinks = document.getElementById('navLinks');

      if (toggleBtn && navLinks) {
        toggleBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          navLinks.classList.toggle('active');
          const icon = toggleBtn.querySelector('i');
          if (navLinks.classList.contains('active')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-times');
          } else {
            icon.classList.remove('fa-times');
            icon.classList.add('fa-bars');
          }
        });

        navLinks.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            if (window.innerWidth <= 860) {
              navLinks.classList.remove('active');
              const icon = toggleBtn.querySelector('i');
              icon.classList.remove('fa-times');
              icon.classList.add('fa-bars');
            }
          });
        });

        document.addEventListener('click', function(event) {
          if (window.innerWidth <= 860 && navLinks.classList.contains('active')) {
            const isClickInsideNav = navLinks.contains(event.target);
            const isClickOnToggle = toggleBtn.contains(event.target);
            if (!isClickInsideNav && !isClickOnToggle) {
              navLinks.classList.remove('active');
              const icon = toggleBtn.querySelector('i');
              icon.classList.remove('fa-times');
              icon.classList.add('fa-bars');
            }
          }
        });
      }
    })();
