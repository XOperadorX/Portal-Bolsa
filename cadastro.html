<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - 🏦 MM Quase Tudo</title>
    <link rel="stylesheet" href="style/cadastro.css">
</head>
<body>
    <div class="cadastro-container">
        <div class="logo">
            <h1>🏦 MM Quase Tudo</h1>
            <span>Criar Conta</span>
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="mensagemSucesso" class="mensagem-sucesso"></div>

        <form id="formCadastro">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="form-group">
                <label for="login">Login (Usuário) *</label>
                <input type="text" id="login" placeholder="Digite seu email ou nome de usuário" required autocomplete="username">
                <div class="helper-text">Pode ser email ou nome de usuário (mínimo 3 caracteres)</div>
            </div>

            <div class="form-group">
                <label for="senha">Senha *</label>
                <input type="password" id="senha" placeholder="Crie uma senha forte" required autocomplete="new-password">
                <div class="senha-requisitos">
                    <span id="req-length" class="bad">🔴 Mínimo 6 caracteres</span>
                    <span id="req-maiuscula" class="bad">🔴 Pelo menos 1 letra maiúscula</span>
                    <span id="req-minuscula" class="bad">🔴 Pelo menos 1 letra minúscula</span>
                    <span id="req-numero" class="bad">🔴 Pelo menos 1 número</span>
                </div>
            </div>

            <div class="form-group">
                <label for="senha_confirm">Confirmar Senha</label>
                <input type="password" id="senha_confirm" placeholder="Confirme sua senha" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-cadastrar" id="btnCadastrar">📝 Criar Conta</button>
        </form>

        <div class="links">
            <a href="login.html">🔐 Já tenho uma conta</a>
        </div>

        <div id="statusSupabase" class="status-supabase">☁️ Verificando conexão...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>
    <script type="module" src="script/cadastro.js"></script>
</body>
</html>
