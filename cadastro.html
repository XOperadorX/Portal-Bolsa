    // ==================== SHA-256 ====================
    async function sha256(texto) {
        const enc = new TextEncoder().encode(texto);
        const buf = await crypto.subtle.digest('SHA-256', enc);
        return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // ==================== FINGERPRINT (inalterado) ====================
    async function gerarFingerprint() {
        const partes = [];
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 220; canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px "Arial"';
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('Fingerprint🎮🔥', 2, 15);
            ctx.fillStyle = 'rgba(102,204,0,0.7)';
            ctx.fillText('Fingerprint🎮🔥', 4, 17);
            partes.push('canvas:' + canvas.toDataURL());
        } catch { partes.push('canvas:err'); }
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) {
                    partes.push('gl_vendor:' + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
                    partes.push('gl_renderer:' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
                }
                partes.push('gl_version:' + gl.getParameter(gl.VERSION));
                partes.push('gl_ext:' + (gl.getSupportedExtensions() || []).sort().join(','));
            }
        } catch { partes.push('gl:err'); }
        partes.push('ua:' + navigator.userAgent);
        partes.push('platform:' + (navigator.platform || ''));
        partes.push('vendor:' + (navigator.vendor || ''));
        partes.push('lang:' + (navigator.language || ''));
        partes.push('langs:' + (navigator.languages || []).join(','));
        try {
            partes.push('tz:' + Intl.DateTimeFormat().resolvedOptions().timeZone);
            partes.push('tz_off:' + new Date().getTimezoneOffset());
        } catch { partes.push('tz:err'); }
        partes.push('screen:' + screen.width + 'x' + screen.height);
        partes.push('avail:' + screen.availWidth + 'x' + screen.availHeight);
        partes.push('colorDepth:' + screen.colorDepth);
        partes.push('pixelRatio:' + (window.devicePixelRatio || 1));
        partes.push('cores:' + (navigator.hardwareConcurrency || 0));
        partes.push('mem:' + (navigator.deviceMemory || 0));
        partes.push('touch:' + (navigator.maxTouchPoints || 0));
        try {
            const plugins = Array.from(navigator.plugins || []).map(p => p.name).sort().join(',');
            partes.push('plugins:' + plugins);
        } catch {}
        try {
            const baseFonts = ['monospace', 'sans-serif', 'serif'];
            const fontList = ['Arial','Arial Black','Comic Sans MS','Courier New','Georgia','Impact','Lucida Console','Lucida Sans Unicode','Palatino Linotype','Tahoma','Times New Roman','Trebuchet MS','Verdana','Webdings','Calibri','Cambria','Candara','Consolas','Constantia','Corbel','Franklin Gothic Medium','Gabriola','Leelawadee UI','Malgun Gothic','Microsoft Sans Serif','MS Gothic','MV Boli','Nirmala UI','Segoe UI','Segoe UI Emoji','SimSun','Sylfaen','Symbol','Wingdings','Yu Gothic'];
            const span = document.createElement('span');
            span.style.position = 'absolute';
            span.style.left = '-9999px';
            span.style.fontSize = '72px';
            span.textContent = 'mmmmmmmmmmlli';
            document.body.appendChild(span);
            const baseSizes = {};
            for (const bf of baseFonts) {
                span.style.fontFamily = bf;
                baseSizes[bf] = span.offsetWidth + 'x' + span.offsetHeight;
            }
            const detectadas = [];
            for (const f of fontList) {
                let enc = false;
                for (const bf of baseFonts) {
                    span.style.fontFamily = `'${f}',${bf}`;
                    const tam = span.offsetWidth + 'x' + span.offsetHeight;
                    if (tam !== baseSizes[bf]) { enc = true; break; }
                }
                if (enc) detectadas.push(f);
            }
            document.body.removeChild(span);
            partes.push('fonts:' + detectadas.join(','));
        } catch {}
        return await sha256('fp::' + partes.join('||'));
    }

            let fim = false;
            const finalizar = (v) => { if (fim) return; fim = true; resolve(v); };
            const t = setTimeout(() => finalizar(mac), 2500);
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel('');
                pc.onicecandidate = (e) => {
                    if (!e.candidate) return;
                    const m = e.candidate.candidate.match(/([0-9a-f]{2}[-:]){5}[0-9a-f]{2}/i);
                    if (m && mac === 'desconhecido') mac = m[0].toUpperCase();
                };
                pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => {});
                setTimeout(() => { clearTimeout(t); try { pc.close(); } catch {} finalizar(mac); }, 2000);
            } catch { clearTimeout(t); finalizar('desconhecido'); }
        });
    }

    // ==================== CADASTRO VIA RPC ====================
    async function fazerCadastro(dados) {
        try {
            const { data, error } = await supabaseClient.rpc('criar_usuario', {
                p_login:       dados.login,
                p_senha:       dados.senha,
                p_fingerprint: dados.fingerprint,
                p_mac:         dados.mac_address,
                p_ip:          dados.ip_address
            });

            if (error) {
                console.error('Erro RPC criar_usuario:', error);
                mostrarErro('❌ ' + (error.message || 'Erro ao criar conta.'));
                return false;
            }

            if (!data || !data.ok) {
                const msg = (data && data.erro) ? data.erro : 'Erro ao criar conta.';
                if (msg.toLowerCase().includes('aparelho') || msg.toLowerCase().includes('cadastrado')) {
                    mostrarErro(MSG_APARELHO_DUPLICADO);
                } else {
                    mostrarErro('❌ ' + msg);
                }
                return false;
            }

            // Sucesso — cria sessão local
            const usuarioSessao = {
                id:    data.id,
                login: data.login,
                saldo: 0,
                saldo_poupanca: 0,
                carteira: {}
            };
            salvarSessao(usuarioSessao);

            mostrarSucesso('✅ Conta criada! Redirecionando...');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
            return true;

        } catch (e) {
            console.error('Erro inesperado:', e);
            mostrarErro('❌ ' + (e.message || 'Erro ao criar conta. Tente novamente.'));
            return false;
        }
    }

    // ==================== EVENTOS ====================
    formCadastro.addEventListener('submit', async (e) => {
        e.preventDefault();
        ocultarMensagens();

        const login    = loginInput.value.trim().toLowerCase();
        const senha    = senhaInput.value.trim();
        const confirma = confirmarInput.value.trim();

        if (!login || !senha || !confirma) { mostrarErro('⚠️ Preencha todos os campos!'); return; }
        if (!validarLogin(login)) { mostrarErro('⚠️ Login inválido. Use 3 a 20 caracteres (letras, números e _).'); return; }
        if (senha.length < 6) { mostrarErro('⚠️ A senha deve ter pelo menos 6 caracteres.'); return; }
        if (senha !== confirma) { mostrarErro('⚠️ As senhas não coincidem.'); return; }

        const online = await verificarSupabase();
        if (!online) { mostrarErro('❌ Sem conexão com o banco de dados.'); return; }

        btnCadastrar.disabled = true;
        btnCadastrar.innerHTML = '<span class="loading"></span> Verificando dispositivo...';

        const fingerprint = await gerarFingerprint();
        const mac_address = await obterMAC();
        const ip_address  = await obterIP();

        btnCadastrar.innerHTML = '<span class="loading"></span> Criando conta...';

        await fazerCadastro({ login, senha, fingerprint, mac_address, ip_address });

        btnCadastrar.disabled = false;
        btnCadastrar.innerHTML = '📝 Criar conta';
    });

    // ==================== INICIALIZAÇÃO ====================
    verificarSupabase();
    if (sessaoValida()) {
        window.location.href = 'dashboard.html';
    }
</script>
