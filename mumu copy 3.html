<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo Mumu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
        }
        .card h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitulo {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .usuario-info {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 15px;
            background: #f5f5f5;
            padding: 8px;
            border-radius: 8px;
        }
        .usuario-info strong {
            color: #333;
        }
        .saldo-container {
            background: linear-gradient(90deg, #ffd700, #ffb300);
            border-radius: 15px;
            padding: 28px 20px;
            margin-bottom: 20px;
        }
        .saldo-label {
            color: #856d00;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .saldo-valor {
            color: #000;
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .saldo-valor .simbolo {
            font-size: 1.6rem;
            margin-right: 6px;
        }
        .info {
            font-size: 0.85rem;
            color: #888;
            margin-top: 10px;
        }
        .carregando { color: #555; font-style: italic; }
        .erro { color: #d32f2f; }
        .btn-sair {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            width: auto;
            display: inline-block;
        }
        .btn-sair:hover { background: #c0392b; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #856d00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .atualizando {
            font-size: 0.8rem;
            color: #856d00;
            margin-top: 5px;
        }
        .offline-badge {
            background: #ff6b6b;
            color: #fff;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }
        .online-badge {
            background: #51cf66;
            color: #fff;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }


.btn-voltar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #ffffff !important;
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35);
    transition: all 0.3s ease;
    border: none;
    cursor: pointer;
    }

    .btn-voltar:hover {
        background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.45);
    }

    .btn-voltar:active {
        transform: translateY(0);
        box-shadow: 0 3px 8px rgba(102, 126, 234, 0.3);
    }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Seu Saldo</h2>
        <p class="subtitulo">Moeda Mumu</p>

        <div class="usuario-info" id="usuarioInfo">
            <strong>👤</strong> <span id="nomeUsuario">Carregando...</span>
        </div>

        <div class="saldo-container">
            <div class="saldo-label">Saldo Disponível</div>
            <div class="saldo-valor" id="saldoMumu">
                <span class="carregando"><span class="spinner"></span> Carregando...</span>
            </div>
        </div>

        <p class="info">Última atualização: <span id="ultimaAtualizacao">--</span></p>
        <p class="info erro" id="mensagemErro"></p>
        <div id="statusConexao" class="online-badge">✅ Conectado</div>
        <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>

    </div>

    <script>
        // ====== DADOS DO SEU SUPABASE ======
        const SUPABASE_URL = "https://xrcxvizzdumcxbylmkvn.supabase.co/rest/v1";
        const SUPABASE_KEY = "sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD";
        // ===================================

        let usuarioAtual = null;
        let intervaloAtualizacao = null;
        let estaAtualizando = false;

        function carregarUsuarioLogado() {
            try {
                const dados = localStorage.getItem('usuario_logado');
                if (dados) {
                    usuarioAtual = JSON.parse(dados);
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        function mostrarStatusConexao(online) {
            const badge = document.getElementById('statusConexao');
            if (online) {
                badge.textContent = '✅ Conectado';
                badge.className = 'online-badge';
            } else {
                badge.textContent = '⚠️ Offline';
                badge.className = 'offline-badge';
            }
        }

        function sair() {
            localStorage.removeItem('usuario_logado');
            clearInterval(intervaloAtualizacao);
            window.location.href = 'login.html';
        }

        function formatarData(data) {
            if (!data) return '--';
            const d = new Date(data);
            return d.toLocaleString('pt-BR', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        async function buscarSaldo() {
            if (!usuarioAtual || !usuarioAtual.login) {
                document.getElementById('saldoMumu').innerHTML = `<span class="erro">Sessão expirada. Faça login novamente.</span>`;
                return;
            }

            if (estaAtualizando) return;
            estaAtualizando = true;

            const elemSaldo = document.getElementById("saldoMumu");
            const elemData = document.getElementById("ultimaAtualizacao");
            const elemErro = document.getElementById("mensagemErro");
            const elemNome = document.getElementById("nomeUsuario");

            // Mostra nome do usuário
            elemNome.textContent = usuarioAtual.nome || usuarioAtual.login;

            elemErro.textContent = "";

            try {
                const resposta = await fetch(
                    `${SUPABASE_URL}/Geral?login=eq.${encodeURIComponent(usuarioAtual.login)}&select=mumu,updated_at,nome`,
                    {
                        method: "GET",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        }
                    }
                );

                if (!resposta.ok) throw new Error(`Erro HTTP: ${resposta.status}`);

                const dados = await resposta.json();

                if (!dados || dados.length === 0) {
                    elemSaldo.innerHTML = `<span class="erro">Login não encontrado</span>`;
                    mostrarStatusConexao(true);
                    return;
                }

                const saldo = parseFloat(dados[0].mumu || 0);
                const nome = dados[0].nome || usuarioAtual.nome || usuarioAtual.login;

                // Atualiza nome se mudou
                if (nome !== usuarioAtual.nome) {
                    usuarioAtual.nome = nome;
                    localStorage.setItem('usuario_logado', JSON.stringify(usuarioAtual));
                    elemNome.textContent = nome;
                }

                // Atualiza saldo no localStorage
                usuarioAtual.saldo = saldo;
                localStorage.setItem('usuario_logado', JSON.stringify(usuarioAtual));

                // Exibe saldo formatado
                elemSaldo.innerHTML = `
                    <span class="simbolo">M$</span> ${saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                `;

                const dataBanco = dados[0].updated_at 
                    ? new Date(dados[0].updated_at) 
                    : new Date();
                elemData.textContent = formatarData(dataBanco);

                mostrarStatusConexao(true);

            } catch (erro) {
                // Se falhou, tenta usar dados do localStorage
                if (usuarioAtual.saldo !== undefined) {
                    const saldo = parseFloat(usuarioAtual.saldo || 0);
                    elemSaldo.innerHTML = `
                        <span class="simbolo">M$</span> ${saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                    `;
                    elemData.textContent = formatarData(new Date()) + ' (dados locais)';
                    elemErro.textContent = "⚠️ Usando dados salvos localmente - sem conexão com o servidor";
                } else {
                    elemSaldo.innerHTML = `<span class="erro">Erro ao carregar</span>`;
                    elemErro.textContent = `Detalhe: ${erro.message}`;
                }
                
                mostrarStatusConexao(false);
                console.error("Erro ao buscar saldo:", erro);
            } finally {
                estaAtualizando = false;
            }
        }

        function iniciarAtualizacaoAutomatica() {
            // Atualiza a cada 10 segundos
            if (intervaloAtualizacao) {
                clearInterval(intervaloAtualizacao);
            }
            
            // Primeira atualização imediata
            buscarSaldo();
            
            intervaloAtualizacao = setInterval(() => {
                buscarSaldo();
            }, 10000); // 10 segundos
        }

        // ========== INICIALIZAÇÃO ==========
        if (!carregarUsuarioLogado()) {
            // Não está logado, redireciona
            window.location.href = 'login.html';
        } else {
            iniciarAtualizacaoAutomatica();
        }

        // Atualiza quando a página ganha foco
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                buscarSaldo();
            }
        });

        // Verifica a cada 30 segundos se o usuário ainda está na sessão
        setInterval(() => {
            if (!carregarUsuarioLogado()) {
                clearInterval(intervaloAtualizacao);
                window.location.href = 'login.html';
            }
        }, 30000);

        console.log('🔄 Sistema de saldo Mumu iniciado - atualizando a cada 10 segundos');
    </script>
</body>
</html>
