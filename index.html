<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#002bad">
    <title>MM Quase Tudo</title>

    <meta name="description" content="MM Quase Tudo — Central de jogos, economia virtual e negociações entre jogadores.">
    <meta name="keywords" content="mm quasetudo, jogos, economia virtual, mmorpg, browser game">
    <meta name="author" content="Equipe MM Quase Tudo">

    <meta property="og:type"        content="website">
    <meta property="og:site_name"   content="MM Quase Tudo">
    <meta property="og:title"       content="MM Quase Tudo — Central de Jogos">
    <meta property="og:description" content="Central de jogos, economia virtual e negociações entre jogadores.">
    <meta property="og:image"       content="https://xoperadorx.github.io/Portal-Bolsa/assets/og-image.png">
    <meta property="og:url"         content="https://xoperadorx.github.io/Portal-Bolsa/">
    <meta property="og:locale"      content="pt_BR">

    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="MM Quase Tudo — Central de Jogos">
    <meta name="twitter:description" content="Central de jogos, economia virtual e negociações entre jogadores.">
    <meta name="twitter:image"       content="https://xoperadorx.github.io/Portal-Bolsa/assets/og-image.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002e5d, #001a33);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-container {
            text-align: center;
            color: white;
            padding: 20px;
        }

        .loading-container h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-container p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        .erro-box {
            color: #fca5a5;
            font-size: 1rem;
            line-height: 1.6;
            padding: 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .erro-box a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 700;
        }

        .erro-box a:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <h1>🏦 MM Quase Tudo</h1>
        <div class="spinner" id="spinner"></div>
        <p id="loadingMsg">Carregando...</p>
    </div>

    <script>
        // ══════════════════════════════════════════════════════════════
        // CONFIGURAÇÃO DE SESSÃO
        // ══════════════════════════════════════════════════════════════
        const SESSION_KEY           = 'usuario_logado';
        const SESSION_TIMESTAMP_KEY = 'session_timestamp';
        const SESSION_DURATION      = 24 * 60 * 60 * 1000; // 24h

        function limparSessao() {
            try {
                localStorage.removeItem(SESSION_KEY);
                localStorage.removeItem(SESSION_TIMESTAMP_KEY);
            } catch (e) {}
        }

        function sessaoValida() {
            try {
                const ts = localStorage.getItem(SESSION_TIMESTAMP_KEY);
                const u  = localStorage.getItem(SESSION_KEY);
                if (!ts || !u) return false;
                const t = parseInt(ts, 10);
                if (isNaN(t) || t <= 0) return false;
                return (Date.now() - t) < SESSION_DURATION;
            } catch (e) {
                return false;
            }
        }

        function obterUsuario() {
            try {
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        // ══════════════════════════════════════════════════════════════
        // 🛡️ PROTEÇÃO ANTI-LOOP
        // ══════════════════════════════════════════════════════════════
        const LOOP_KEY    = 'index_loop_count';
        const LOOP_TS_KEY = 'index_loop_timestamp';
        const LOOP_LIMIT  = 3;
        const LOOP_WINDOW = 5000;

        function verificarLoop() {
            const agora = Date.now();
            const ts = parseInt(localStorage.getItem(LOOP_TS_KEY) || '0', 10);
            let count = parseInt(localStorage.getItem(LOOP_KEY) || '0', 10);

            if ((agora - ts) > LOOP_WINDOW) count = 0;

            count++;
            localStorage.setItem(LOOP_KEY, count.toString());
            localStorage.setItem(LOOP_TS_KEY, agora.toString());

            return count >= LOOP_LIMIT;
        }

        function limparLoop() {
            try {
                localStorage.removeItem(LOOP_KEY);
                localStorage.removeItem(LOOP_TS_KEY);
            } catch (e) {}
        }

        // ══════════════════════════════════════════════════════════════
        // FLUXO PRINCIPAL
        // ══════════════════════════════════════════════════════════════
        const msg     = document.getElementById('loadingMsg');
        const spinner = document.getElementById('spinner');

        if (verificarLoop()) {
            // 🚨 Loop detectado — limpa tudo e vai para noticias
            limparLoop();
            limparSessao();

            if (spinner) spinner.style.display = 'none';
            msg.outerHTML = `
                <div class="erro-box">
                    ⚠️ <strong>Erro de redirecionamento detectado.</strong><br>
                    A sessão foi limpa para evitar loop.<br><br>
                    <a href="./noticias.html">→ Ir para a página inicial</a>
                </div>
            `;
            console.error('[index] Loop de redirecionamento detectado — sessão limpa.');

        } else if (sessaoValida()) {
            // ✅ Tem sessão válida → vai para dashboard
            const user = obterUsuario();
            if (user && user.login) {
                msg.textContent = `Bem-vindo, ${user.nome || user.login}!`;
                limparLoop();
                window.location.replace('dashboard.html');
            } else {
                // Sessão corrompida → limpa e vai para noticias (NÃO login)
                limparSessao();
                msg.textContent = 'Sessão corrompida. Redirecionando...';
                setTimeout(() => {
                    window.location.replace('./noticias.html');
                }, 500);
            }

        } else {
            // ❌ Sem sessão válida → página PÚBLICA
            // ✅ NÃO vai para login.html (evita loop)
            limparSessao();
            msg.textContent = 'Redirecionando...';
            setTimeout(() => {
                window.location.replace('./noticias.html');
            }, 500);
        }
    </script>
</body>
</html>
