name: Supabase Keep Alive
on:
  schedule:
    # Faz o ping a cada 3 dias às 09:00 UTC → intervalo seguro
    - cron: '0 9 */3 * *'
  # Permite rodar manualmente para testar AGORA
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pingar para manter projeto ativo
        run: |
          SUPABASE_URL="$(node -p "require('node:fs').readFileSync('config.js','utf8').match(/const SUPABASE_URL = '([^']+)'/)[1]")"
          SUPABASE_KEY="$(node -p "require('node:fs').readFileSync('config.js','utf8').match(/const SUPABASE_KEY = '([^']+)'/)[1]")"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Não foi possível carregar a configuração do Supabase em config.js" >&2
            exit 1
          fi
          curl --fail --silent --show-error "${SUPABASE_URL}/rest/v1/?select=*&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -w "\nStatus: %{http_code}\n"
