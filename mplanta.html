<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Mercado de Plantas - MM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #121520;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-green: #00ff66;
            --neon-pink: #ff00aa;
            --neon-gold: #f59e0b;
            --text-color: #f0f4f8;
            --text-muted: #8a99ad;
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        /* ============================================================
           CARD PRINCIPAL
           ============================================================ */
        .card {
            background: var(--card-bg);
            max-width: 960px;
            width: 100%;
            padding: 1.6rem 1.4rem 1.4rem;
            border-radius: var(--radius);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: var(--shadow-glow), 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: transform var(--transition);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* ============================================================
           NAVEGAÇÃO
           ============================================================ */
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 21, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.08);
            padding: 4px 14px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            cursor: default;
        }

        .user-profile:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .user-nick {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .user-balance {
            font-size: 0.7rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-balance::before {
            content: "💰";
            font-size: 0.6rem;
        }

        .logout-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
            text-decoration: none;
        }

        .logout-btn:hover {
            transform: scale(0.95);
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
        }

        .btn-voltar {
            background: linear-gradient(135deg, #7000ff, #8b5cf6);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-voltar:hover {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
        }

        /* ============================================================
           STATUS BAR
           ============================================================ */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid rgba(0, 240, 255, 0.08);
            margin-bottom: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
        }

        .status-item .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }

        .status-item .dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }

        .status-item .dot.offline {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
        }

        .status-item .dot.checking {
            background: #f59e0b;
            animation: pulse-dot 1s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.7);
            }
        }

        .status-item .value {
            font-weight: 600;
            color: var(--text-color);
        }

        .status-item .value.online {
            color: var(--neon-green);
        }
        .status-item .value.offline {
            color: #ef4444;
        }
        .status-item .value.checking {
            color: #f59e0b;
        }

        .status-reconnect {
            background: none;
            border: none;
            color: #8a99ad;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.7rem;
        }

        .status-reconnect:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* ============================================================
           LEVEL WIDGET
           ============================================================ */
        .level-widget {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 0 0 16px 0;
            border: 1px solid rgba(0, 240, 255, 0.08);
            width: 100%;
        }

        .level-widget .lw-header {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .level-widget .lw-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        .level-widget .lw-badge .lw-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-gold), #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .level-widget .lw-badge .lw-label {
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .level-widget .lw-badge .lw-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--neon-gold);
        }

        .level-widget .lw-exp {
            flex: 1;
            min-width: 120px;
        }

        .level-widget .lw-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2px;
        }

        .level-widget .lw-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
            transition: width 0.6s ease;
        }

        .level-widget .lw-text {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            justify-content: space-between;
        }

        .level-widget .lw-text .lw-cur {
            color: #fff;
            font-weight: 600;
        }
        .level-widget .lw-text .lw-nxt {
            color: var(--neon-gold);
            font-weight: 600;
        }

        .level-widget .lw-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin-top: 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .level-widget .lw-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .level-widget .lw-stats .hp-c {
            color: #ef4444;
            font-weight: 700;
        }
        .level-widget .lw-stats .mp-c {
            color: #3b82f6;
            font-weight: 700;
        }
        .level-widget .lw-stats .sm-c {
            color: #22c55e;
            font-weight: 700;
        }
        .level-widget .lw-stats .atk-c {
            color: #f97316;
            font-weight: 700;
        }
        .level-widget .lw-stats .def-c {
            color: #8b5cf6;
            font-weight: 700;
        }
        .level-widget .lw-stats .mag-c {
            color: #ec4899;
            font-weight: 700;
        }

        /* ============================================================
           MARKET HEADER
           ============================================================ */
        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }

        .market-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            text-shadow: 0 0 20px var(--neon-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .market-header h2 i {
            color: var(--neon-gold);
        }

        .saldo-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .saldo-box .label {
            color: var(--text-muted);
            font-weight: 400;
        }

        .saldo-box .value {
            color: var(--neon-green);
        }

        /* ============================================================
           PRODUÇÃO (COLHER)
           ============================================================ */
        .producao-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 240, 255, 0.05);
        }

        .producao-section h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .producao-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .producao-grid button {
            padding: 10px 0;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            touch-action: manipulation;
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .producao-grid button:active {
            transform: scale(0.94);
        }

        .producao-grid button.colher-madeira {
            background: linear-gradient(135deg, #8d6e63, #6d4c41);
            border-color: #8d6e63;
        }

        .producao-grid button.colher-pedra {
            background: linear-gradient(135deg, #78909c, #546e7a);
            border-color: #78909c;
        }

        .producao-grid button.colher-ouro {
            background: linear-gradient(135deg, #f9a825, #f57f17);
            border-color: #f9a825;
        }

        .producao-grid button.colher-pocao {
            background: linear-gradient(135deg, #ab47bc, #7b1fa2);
            border-color: #ab47bc;
        }

        /* ============================================================
           MARKET GRID
           ============================================================ */
        .market-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .market-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(0, 240, 255, 0.08);
            transition: all 0.3s;
        }

        .market-item:hover {
            border-color: rgba(0, 240, 255, 0.2);
            transform: translateY(-2px);
        }

        .market-item .item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .market-item .item-icon {
            font-size: 2rem;
        }

        .market-item .item-name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .market-item .item-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .market-item .item-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-gold);
            margin: 6px 0;
        }

        .market-item .item-price span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .market-item .item-stock {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .market-item .item-stock strong {
            color: #fff;
        }

        .market-item .item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .market-item .item-actions .btn {
            padding: 4px 14px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .market-item .item-actions .btn:active {
            transform: scale(0.94);
        }

        .market-item .item-actions .btn-buy {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
        }

        .market-item .item-actions .btn-buy:hover {
            box-shadow: 0 0 20px rgba(0, 200, 83, 0.3);
        }

        .market-item .item-actions .btn-sell {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .market-item .item-actions .btn-sell:hover {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .market-item .item-actions .btn-buy:disabled,
        .market-item .item-actions .btn-sell:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .market-item .item-actions .qty-input {
            width: 50px;
            padding: 2px 4px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            outline: none;
        }

        .market-item .item-actions .qty-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .market-item .item-actions .qty-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ============================================================
           PLAYER INVENTORY
           ============================================================ */
        .player-inventory {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 16px;
            border: 1px solid rgba(0, 240, 255, 0.05);
        }

        .player-inventory h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .player-inventory .inv-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .player-inventory .inv-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            border: 1px solid rgba(0, 240, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .player-inventory .inv-item .qty {
            color: var(--neon-gold);
            font-weight: 700;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 0.5rem 1.4rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.8rem;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.1);
            opacity: 0;
            transition: all 0.45s ease;
            pointer-events: none;
            z-index: 999;
            border: 1px solid rgba(0, 240, 255, 0.15);
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
           LOGIN MODAL
           ============================================================ */
        #loginModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        #loginModal.show {
            display: flex;
        }

        #loginModal .modal-box {
            background: #121520;
            border-radius: 16px;
            padding: 2rem 2.2rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.1);
        }

        #loginModal .modal-box h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.3rem;
            color: #fff;
            text-shadow: 0 0 20px #00f0ff;
        }

        #loginModal .modal-box p.sub {
            text-align: center;
            color: #8a99ad;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        #loginModal .modal-box .form-group {
            margin-bottom: 1rem;
        }

        #loginModal .modal-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            color: #8a99ad;
            margin-bottom: 0.2rem;
        }

        #loginModal .modal-box .form-group input {
            width: 100%;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.15);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        #loginModal .modal-box .form-group input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        #loginModal .modal-box .login-error {
            color: #ef4444;
            font-size: 0.8rem;
            text-align: center;
            min-height: 1.2rem;
        }

        #loginModal .modal-box .btn-login-modal {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        #loginModal .modal-box .btn-login-modal:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.3);
        }

        #loginModal .modal-box .btn-login-modal:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        #loginModal .modal-box .modal-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.8rem;
        }

        #loginModal .modal-box .modal-actions button {
            flex: 1;
            padding: 0.4rem;
            border: 1px solid rgba(0, 240, 255, 0.1);
            border-radius: 8px;
            background: transparent;
            color: #8a99ad;
            cursor: pointer;
            font-size: 0.7rem;
            transition: all 0.3s;
        }

        #loginModal .modal-box .modal-actions button:hover {
            background: rgba(0, 240, 255, 0.1);
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============================================================
           RESPONSIVO
           ============================================================ */

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÃO SUPABASE
            // ============================================================
            const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
            const TABELA = 'Geral';

            // ============================================================
            // ESTADO GLOBAL
            // ============================================================
            let supabaseOnline = false;
            let usuarioLogado = null;
            let toastTimeout = null;
            let salvando = false;

            // ============================================================
            // MERCADO - DEFINIÇÃO DOS ITENS
            // ============================================================
            const ITENS_MERCADO = [
                { id: 'sementes', nome: 'Sementes', emoji: '🌰', descricao: 'Plante no milharal', precoBase: 5,
                    precoAtual: 5, variacao: 0, qtdDisponivel: 100, qtdMaxima: 200 },
                { id: 'milho', nome: 'Milho', emoji: '🌽', descricao: 'Colheita do milharal', precoBase: 8,
                    precoAtual: 8, variacao: 0, qtdDisponivel: 80, qtdMaxima: 150 },
                { id: 'ovos', nome: 'Ovos', emoji: '🥚', descricao: 'Produzidos por galinhas', precoBase: 3,
                    precoAtual: 3, variacao: 0, qtdDisponivel: 120, qtdMaxima: 200 },
                { id: 'galinhas', nome: 'Galinhas', emoji: '🐔', descricao: 'Produzem ovos', precoBase: 25,
                    precoAtual: 25, variacao: 0, qtdDisponivel: 30, qtdMaxima: 60 },
                { id: 'madeira', nome: 'Madeira', emoji: '🪵', descricao: 'Recurso básico', precoBase: 10,
                    precoAtual: 10, variacao: 0, qtdDisponivel: 150, qtdMaxima: 300 },
                { id: 'pedra', nome: 'Pedra', emoji: '🪨', descricao: 'Recurso básico', precoBase: 15, precoAtual: 15,
                    variacao: 0, qtdDisponivel: 120, qtdMaxima: 250 },
                { id: 'ouro', nome: 'Ouro', emoji: '💎', descricao: 'Recurso valioso', precoBase: 50, precoAtual: 50,
                    variacao: 0, qtdDisponivel: 40, qtdMaxima: 100 },
                { id: 'pocao', nome: 'Poção', emoji: '🧪', descricao: 'Item mágico', precoBase: 25, precoAtual: 25,
                    variacao: 0, qtdDisponivel: 60, qtdMaxima: 120 },
                { id: 'balde', nome: 'Balde', emoji: '🪣', descricao: 'Útil para carregar líquidos', precoBase: 12,
                    precoAtual: 12, variacao: 0, qtdDisponivel: 80, qtdMaxima: 150 }
            ];

            // ============================================================
            // ESTADO DO JOGADOR
            // ============================================================
            let inventario = {
                sementes: 0,
                milho: 0,
                ovos: 0,
                galinhas: 0,
                madeira: 0,
                pedra: 0,
                ouro: 0,
                pocao: 0,
                balde: 0
            };

            let saldo = 0.00;
            let dadosCompletos = null;

            // ============================================================
            // DOM REFS
            // ============================================================
            const marketGrid = document.getElementById('marketGrid');
            const inventoryGrid = document.getElementById('inventoryGrid');
            const marketSaldo = document.getElementById('marketSaldo');
            const headerSaldo = document.getElementById('headerSaldo');
            const userBalanceDisplay = document.getElementById('userBalanceDisplay');

            // ============================================================
            // FUNÇÕES AUXILIARES
            // ============================================================
            function formatSaldo(valor) {
                return Number(valor).toFixed(2).replace('.', ',');
            }

            function getSaldoTotal() {
                return saldo || 0;
            }

            function atualizarSaldoGlobal() {
                const total = getSaldoTotal();
                headerSaldo.textContent = formatSaldo(total);
                marketSaldo.textContent = `R$ ${formatSaldo(total)}`;
                if (userBalanceDisplay) userBalanceDisplay.textContent = `💰 R$ ${formatSaldo(total)}`;
            }

            function showToast(text, duration = 2200) {
                const toastEl = document.getElementById('toast');
                if (toastTimeout) { clearTimeout(toastTimeout);
                    toastEl.classList.remove('show'); }
                toastEl.textContent = text;
                toastEl.classList.add('show');
                toastTimeout = setTimeout(() => { toastEl.classList.remove('show');
                    toastTimeout = null; }, duration);
            }

            // ============================================================
            // STATUS UI
            // ============================================================
            function atualizarStatusSupabase(online, texto) {
                const dot = document.getElementById('supabaseDot');
                const status = document.getElementById('supabaseStatus');
                dot.className = 'dot ' + (online ? 'online' : 'offline');
                status.className = 'value ' + (online ? 'online' : 'offline');
                status.textContent = texto;
                supabaseOnline = online;
            }

            // ============================================================
            // VERIFICAÇÃO DE CONEXÃO
            // ============================================================
            async function verificarSupabase() {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?select=id&limit=1`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    if (response.ok) {
                        supabaseOnline = true;
                        atualizarStatusSupabase(true, 'Online');
                        return true;
                    } else {
                        supabaseOnline = false;
                        atualizarStatusSupabase(false, `Erro ${response.status}`);
                        return false;
                    }
                } catch (error) {
                    supabaseOnline = false;
                    atualizarStatusSupabase(false, 'Falha');
                    return false;
                }
            }

            // ============================================================
            // AUTENTICAÇÃO
            // ============================================================
            function carregarUsuario() {
                try {
                    const data = localStorage.getItem('usuario_logado');
                    if (data) {
                        usuarioLogado = JSON.parse(data);
                        return true;
                    }
                } catch (e) { console.error(e); }
                return false;
            }

            function salvarUsuarioLocal(usuario) {
                try {
                    localStorage.setItem('usuario_logado', JSON.stringify(usuario));
                    usuarioLogado = usuario;
                } catch (e) { console.error(e); }
            }

            function atualizarInterfaceUsuario() {
                const avatarEl = document.getElementById('userAvatar');
                const nomeEl = document.getElementById('userName');

                if (usuarioLogado && usuarioLogado.login) {
                    const nome = usuarioLogado.nome || usuarioLogado.login;
                    const inicial = nome.charAt(0).toUpperCase();
                    if (avatarEl) avatarEl.textContent = inicial;
                    if (nomeEl) nomeEl.textContent = nome;
                } else {
                    if (avatarEl) avatarEl.textContent = '?';
                    if (nomeEl) nomeEl.textContent = 'Visitante';
                }
                atualizarSaldoGlobal();
            }

            function fazerLogout() {
                localStorage.removeItem('usuario_logado');
                usuarioLogado = null;
                dadosCompletos = null;
                atualizarInterfaceUsuario();
                mostrarLogin();
                showToast('👋 Logout realizado!', 2000);
            }

            // ============================================================
            // LOGIN MODAL
            // ============================================================
            function mostrarLogin() {
                const modal = document.getElementById('loginModal');
                if (modal) modal.classList.add('show');
            }

            function esconderLogin() {
                const modal = document.getElementById('loginModal');
                if (modal) modal.classList.remove('show');
            }

            // ============================================================
            // AUTENTICAÇÃO COM SUPABASE
            // ============================================================
            async function autenticarUsuario(login, senha, criar = false) {
                const url = criar ?
                    `${SUPABASE_URL}/rest/v1/${TABELA}` :
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(login)}`;

                const options = {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                };

                if (criar) {
                    options.method = 'POST';
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify({
                        login: login,
                        nome: login,
                        senha: senha,
                        saldo: 50.00,
                        seeds: 0,
                        carteira: {
                            'Madeira': 0,
                            'Pedra': 0,
                            'Ouro': 0,
                            'Poção': 0,
                            'Balde': 0
                        },
                        fazendinha_dados: {
                            inventario: {
                                sementes: 0,
                                milho: 0,
                                ovos: 0,
                                galinhas: 0,
                                madeira: 0,
                                pedra: 0,
                                ouro: 0,
                                pocao: 0,
                                balde: 0
                            },
                            plantio: { active: false, stage: 0, progress: 0 },
                            incubacao: { active: false, stage: 0, progress: 0 },
                            saldo: 50.00
                        }
                    });
                }

                try {
                    const response = await fetch(url, options);

                    if (!response.ok) {
                        if (criar) {
                            if (response.status === 409) {
                                document.getElementById('loginError').textContent = '❌ Usuário já existe!';
                                return false;
                            }
                        }
                        document.getElementById('loginError').textContent = `❌ Erro ${response.status}`;
                        return false;
                    }

                    if (criar) {
                        document.getElementById('loginError').textContent = '✅ Conta criada! Faça login.';
                        return false;
                    }

                    const data = await response.json();
                    if (!data || data.length === 0) {
                        document.getElementById('loginError').textContent = '❌ Usuário não encontrado';
                        return false;
                    }

                    const usuario = data[0];
                    if (usuario.senha !== senha) {
                        document.getElementById('loginError').textContent = '❌ Senha incorreta';
                        return false;
                    }

                    salvarUsuarioLocal({ login: usuario.login, nome: usuario.nome || usuario.login });
                    document.getElementById('loginError').textContent = '';
                    esconderLogin();
                    atualizarInterfaceUsuario();
                    await carregarDadosDoJogador();
                    showToast(`👋 Bem-vindo, ${usuario.nome || usuario.login}!`, 2500);
                    return true;

                } catch (error) {
                    document.getElementById('loginError').textContent = '❌ Erro de conexão';
                    console.error('Erro autenticação:', error);
                    return false;
                }
            }

            // ============================================================
            // CARREGAR DADOS DO JOGADOR
            // ============================================================
            async function carregarDadosDoJogador() {
                if (!usuarioLogado) return;

                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (!response.ok) throw new Error(`Erro ao carregar: ${response.status}`);

                    const data = await response.json();
                    if (!data || data.length === 0) return;

                    dadosCompletos = data[0];
                    console.log('📥 Dados carregados:', dadosCompletos);

                    saldo = Number(dadosCompletos.saldo ?? 50.00);
                    inventario.sementes = dadosCompletos.seeds || 0;

                    if (dadosCompletos.fazendinha_dados) {
                        const fd = dadosCompletos.fazendinha_dados;
                        if (fd.inventario) {
                            inventario.milho = fd.inventario.milho || 0;
                            inventario.ovos = fd.inventario.ovos || 0;
                            inventario.galinhas = fd.inventario.galinhas || 0;
                            inventario.madeira = fd.inventario.madeira || 0;
                            inventario.pedra = fd.inventario.pedra || 0;
                            inventario.ouro = fd.inventario.ouro || 0;
                            inventario.pocao = fd.inventario.pocao || 0;
                            inventario.balde = fd.inventario.balde || 0;
                        }
                    }

                    if (dadosCompletos.carteira) {
                        // Sincronizar com a carteira
                    }

                    atualizarSaldoGlobal();
                    renderizarMercado();
                    renderizarInventario();

                } catch (error) {
                    console.error('❌ Erro ao carregar dados:', error);
                    showToast('❌ Erro ao carregar dados: ' + error.message, 3000);
                }
            }

            // ============================================================
            // SALVAR DADOS DO JOGADOR
            // ============================================================
            async function salvarDadosDoJogador() {
                if (!usuarioLogado || !supabaseOnline) return;
                if (salvando) return;
                salvando = true;

                try {
                    const responseGet = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    let dadosAtuais = {};
                    if (responseGet.ok) {
                        const data = await responseGet.json();
                        if (data && data.length > 0) {
                            dadosAtuais = data[0];
                        }
                    }

                    const carteira = {
                        'Madeira': inventario.madeira || 0,
                        'Pedra': inventario.pedra || 0,
                        'Ouro': inventario.ouro || 0,
                        'Poção': inventario.pocao || 0,
                        'Balde': inventario.balde || 0
                    };

                    const fazendinhaDados = {
                        inventario: {
                            sementes: inventario.sementes || 0,
                            milho: inventario.milho || 0,
                            ovos: inventario.ovos || 0,
                            galinhas: inventario.galinhas || 0,
                            madeira: inventario.madeira || 0,
                            pedra: inventario.pedra || 0,
                            ouro: inventario.ouro || 0,
                            pocao: inventario.pocao || 0,
                            balde: inventario.balde || 0
                        },
                        plantio: dadosAtuais.fazendinha_dados?.plantio || { active: false, stage: 0,
                        progress: 0 },
                        incubacao: dadosAtuais.fazendinha_dados?.incubacao || { active: false, stage: 0,
                            progress: 0 },
                        saldo: saldo
                    };

                    const payload = {
                        saldo: Number(saldo).toFixed(2),
                        seeds: inventario.sementes || 0,
                        carteira: carteira,
                        fazendinha_dados: fazendinhaDados,
                        updated_at: new Date().toISOString()
                    };

                    console.log('💾 Salvando dados:', payload);

                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify(payload)
                        }
                    );

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('❌ Erro ao salvar:', response.status, errorText);
                        throw new Error(`Erro ao salvar: ${response.status}`);
                    }

                    console.log('✅ Dados salvos com sucesso!');

                } catch (error) {
                    console.error('❌ Erro ao salvar:', error);
                    showToast('❌ Erro ao salvar: ' + error.message, 3000);
                } finally {
                    salvando = false;
                }
            }

            // ============================================================
            // FUNÇÕES DO MERCADO
            // ============================================================
            function gerarPrecos() {
                ITENS_MERCADO.forEach(item => {
                    const variacao = (Math.random() - 0.5) * 0.4;
                    item.variacao = variacao;
                    item.precoAtual = Math.max(0.5, item.precoBase * (1 + variacao));
                    item.precoAtual = Math.round(item.precoAtual * 100) / 100;
                });
            }

            function renderizarMercado() {
                let html = '';
                ITENS_MERCADO.forEach(item => {
                    const qtd = inventario[item.id] || 0;
                    const preco = item.precoAtual.toFixed(2);
                    const variacaoClass = item.variacao > 0 ? 'color:var(--neon-green);' : (item.variacao < 0 ?
                        'color:#ef4444;' : 'color:var(--text-muted);');
                    const variacaoText = item.variacao > 0 ? `+${(item.variacao * 100).toFixed(1)}%` : (item
                        .variacao < 0 ? `${(item.variacao * 100).toFixed(1)}%` : '0%');

                    html += `
                        <div class="market-item">
                            <div class="item-header">
                                <span class="item-icon">${item.emoji}</span>
                                <div>
                                    <div class="item-name">${item.nome}</div>
                                    <div class="item-sub">${item.descricao}</div>
                                </div>
                            </div>
                            <div class="item-price">
                                R$ ${preco} <span>cada</span>
                                <span style="font-size:0.7rem; ${variacaoClass}">(${variacaoText})</span>
                            </div>
                            <div class="item-stock">
                                Você tem: <strong>${qtd}</strong> | Mercado: ${item.qtdDisponivel} disponíveis
                            </div>
                            <div class="item-actions">
                                <div class="qty-group">
                                    <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" max="99">
                                </div>
                                <button class="btn btn-buy" id="buy_${item.id}" onclick="window.comprarItem('${item.id}')">
                                    <i class="fas fa-shopping-cart"></i> Comprar
                                </button>
                                <button class="btn btn-sell" id="sell_${item.id}" onclick="window.venderItem('${item.id}')" ${qtd <= 0 ? 'disabled' : ''}>
                                    <i class="fas fa-coins"></i> Vender
                                </button>
                            </div>
                        </div>
                    `;
                });
                marketGrid.innerHTML = html;
            }

            function renderizarInventario() {
                let html = '';
                const itens = [
                    { id: 'sementes', emoji: '🌰', nome: 'Sementes' },
                    { id: 'milho', emoji: '🌽', nome: 'Milho' },
                    { id: 'ovos', emoji: '🥚', nome: 'Ovos' },
                    { id: 'galinhas', emoji: '🐔', nome: 'Galinhas' },
                    { id: 'madeira', emoji: '🪵', nome: 'Madeira' },
                    { id: 'pedra', emoji: '🪨', nome: 'Pedra' },
                    { id: 'ouro', emoji: '💎', nome: 'Ouro' },
                    { id: 'pocao', emoji: '🧪', nome: 'Poção' },
                    { id: 'balde', emoji: '🪣', nome: 'Balde' }
                ];

                let temItem = false;
                itens.forEach(item => {
                    const qtd = inventario[item.id] || 0;
                    if (qtd > 0) {
                        temItem = true;
                        html += `
                            <span class="inv-item">
                                ${item.emoji} ${item.nome}: <span class="qty">${qtd}</span>
                            </span>
                        `;
                    }
                });

                if (!temItem) {
                    html = '<span style="color:var(--text-muted); font-size:0.8rem;">📭 Nenhum item no estoque</span>';
                }

                inventoryGrid.innerHTML = html;
            }

            // ============================================================
            // COMPRAR E VENDER
            // ============================================================
            window.comprarItem = async function(itemId) {
                if (!usuarioLogado) {
                    showToast('👤 Faça login para comprar!', 2000);
                    return;
                }

                const item = ITENS_MERCADO.find(i => i.id === itemId);
                if (!item) return;

                const qtyInput = document.getElementById(`qty_${itemId}`);
                const qty = parseInt(qtyInput.value) || 1;
                if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

                const custo = item.precoAtual * qty;

                if (saldo < custo) {
                    showToast(`😅 Saldo insuficiente! Precisa de R$ ${formatSaldo(custo)}`, 2000);
                    return;
                }

                if (item.qtdDisponivel < qty) {
                    showToast(`😅 Mercado tem apenas ${item.qtdDisponivel} disponíveis`, 2000);
                    return;
                }

                saldo -= custo;
                saldo = Math.round(saldo * 100) / 100;
                item.qtdDisponivel -= qty;
                inventario[itemId] = (inventario[itemId] || 0) + qty;

                showToast(`✅ Comprou ${qty} ${item.nome} por R$ ${formatSaldo(custo)}`, 2000);

                atualizarSaldoGlobal();
                renderizarMercado();
                renderizarInventario();
                await salvarDadosDoJogador();
            };

            window.venderItem = async function(itemId) {
                if (!usuarioLogado) {
                    showToast('👤 Faça login para vender!', 2000);
                    return;
                }

                const item = ITENS_MERCADO.find(i => i.id === itemId);
                if (!item) return;

                const qtyInput = document.getElementById(`qty_${itemId}`);
                const qty = parseInt(qtyInput.value) || 1;
                if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

                const qtdAtual = inventario[itemId] || 0;
                if (qtdAtual < qty) {
                    showToast(`😅 Você tem apenas ${qtdAtual} ${item.nome}`, 2000);
                    return;
                }

                const precoVenda = item.precoAtual * 0.7;
                const total = precoVenda * qty;

                saldo += total;
                saldo = Math.round(saldo * 100) / 100;
                inventario[itemId] = qtdAtual - qty;
                item.qtdDisponivel += qty;

                showToast(`💰 Vendeu ${qty} ${item.nome} por R$ ${formatSaldo(total)}`, 2000);

                atualizarSaldoGlobal();
                renderizarMercado();
                renderizarInventario();
                await salvarDadosDoJogador();
            };

            // ============================================================
            // FUNÇÕES DE COLHEITA
            // ============================================================
            window.colherItem = async function(itemId, qtd) {
                if (!usuarioLogado) {
                    showToast('👤 Faça login para colher!', 2000);
                    return;
                }

                const nomes = {
                    madeira: 'Madeira',
                    pedra: 'Pedra',
                    ouro: 'Ouro',
                    pocao: 'Poção'
                };

                inventario[itemId] = (inventario[itemId] || 0) + qtd;
                showToast(`🌱 Colheu ${qtd}x ${nomes[itemId] || itemId}!`, 1500);

                atualizarSaldoGlobal();
                renderizarMercado();
                renderizarInventario();
                await salvarDadosDoJogador();
            };

            // ============================================================
            // RESETAR PREÇOS
            // ============================================================
            function resetarPrecos() {
                ITENS_MERCADO.forEach(item => {
                    item.precoAtual = item.precoBase;
                    item.variacao = 0;
                    item.qtdDisponivel = Math.min(item.qtdMaxima, item.qtdDisponivel + 20);
                });
                renderizarMercado();
                showToast('🔄 Preços resetados!', 1500);
            }

            // ============================================================
            // EVENTOS
            // ============================================================
            document.getElementById('btnLogout')?.addEventListener('click', function() {
                if (confirm('Deseja realmente sair?')) {
                    fazerLogout();
                }
            });

            document.getElementById('btnReconnectSupabase')?.addEventListener('click', function() {
                verificarSupabase();
                showToast('🔄 Verificando conexão com Supabase...', 1500);
            });

            // ============================================================
            // LOGIN MODAL - EVENTOS
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                const loginBtn = document.getElementById('btnLogin');
                const registerBtn = document.getElementById('btnRegister');
                const guestBtn = document.getElementById('btnGuest');
                const loginUser = document.getElementById('loginUser');
                const loginPass = document.getElementById('loginPass');

                if (loginBtn) {
                    loginBtn.addEventListener('click', async function() {
                        const user = loginUser.value.trim();
                        const pass = loginPass.value.trim();
                        if (!user || !pass) {
                            document.getElementById('loginError').textContent = '⚠️ Preencha usuário e senha';
                            return;
                        }
                        loginBtn.disabled = true;
                        loginBtn.textContent = '⏳ Entrando...';
                        await autenticarUsuario(user, pass, false);
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Entrar';
                    });
                }

                if (registerBtn) {
                    registerBtn.addEventListener('click', async function() {
                        const user = loginUser.value.trim();
                        const pass = loginPass.value.trim();
                        if (!user || !pass) {
                            document.getElementById('loginError').textContent = '⚠️ Preencha usuário e senha';
                            return;
                        }
                        if (pass.length < 4) {
                            document.getElementById('loginError').textContent =
                                '⚠️ Senha deve ter pelo menos 4 caracteres';
                            return;
                        }
                        registerBtn.disabled = true;
                        registerBtn.textContent = '⏳ Criando...';
                        await autenticarUsuario(user, pass, true);
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Criar conta';
                    });
                }

                if (guestBtn) {
                    guestBtn.addEventListener('click', function() {
                        esconderLogin();
                        showToast('👤 Modo visitante - dados não serão salvos.', 3000);
                        inventario = {
                            sementes: 0,
                            milho: 0,
                            ovos: 0,
                            galinhas: 0,
                            madeira: 0,
                            pedra: 0,
                            ouro: 0,
                            pocao: 0,
                            balde: 0
                        };
                        saldo = 50.00;
                        atualizarInterfaceUsuario();
                        gerarPrecos();
                        renderizarMercado();
                        renderizarInventario();
                    });
                }

                if (loginUser) {
                    loginUser.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') loginPass.focus();
                    });
                }
                if (loginPass) {
                    loginPass.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') loginBtn.click();
                    });
                }

                if (!usuarioLogado && loginUser) {
                    setTimeout(() => loginUser.focus(), 500);
                }
            });

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            verificarSupabase();
            carregarUsuario();
            gerarPrecos();
            renderizarMercado();
            renderizarInventario();
            atualizarInterfaceUsuario();

            if (usuarioLogado) {
                esconderLogin();
                setTimeout(() => {
                    if (supabaseOnline) {
                        carregarDadosDoJogador();
                    } else {
                        showToast('⚠️ Sem conexão com o banco. Dados locais carregados.', 3000);
                    }
                }, 600);
                showToast(`👋 Olá, ${usuarioLogado.nome || usuarioLogado.login}!`, 2500);
            } else {
                mostrarLogin();
                setTimeout(() => showToast('👤 Faça login para comprar e vender.', 3000), 800);
            }

            setInterval(() => {
                gerarPrecos();
                renderizarMercado();
            }, 60000);

            setInterval(() => verificarSupabase(), 30000);

            setInterval(() => {
                if (usuarioLogado && supabaseOnline) {
                    salvarDadosDoJogador();
                }
            }, 30000);

            window.addEventListener('beforeunload', function() {
                if (usuarioLogado && supabaseOnline && !salvando) {
                    salvarDadosDoJogador();
                }
            });

            console.log('🌾 Mercado de Plantas carregado - sincronizado com a Mochila!');

        })();
    </script>

</body>

</html>
