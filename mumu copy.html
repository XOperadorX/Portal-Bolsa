<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saldo Mumu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        .card h2 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        .subtitulo {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .saldo-container {
            background: linear-gradient(90deg, #ffd700, #ffb300);
            border-radius: 15px;
            padding: 28px 20px;
            margin-bottom: 20px;
        }
        .saldo-label {
            color: #856d00;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .saldo-valor {
            color: #000;
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .saldo-valor .simbolo {
            font-size: 1.6rem;
            margin-right: 6px;
        }
        .info {
            font-size: 0.85rem;
            color: #888;
            margin-top: 10px;
        }
        .carregando { color: #555; font-style: italic; }
        .erro { color: #d32f2f; margin-top: 10px; }
        .login-box {
            margin-bottom: 20px;
            text-align: left;
        }
        .login-box label {
            font-size: 0.9rem;
            color: #444;
            font-weight: 500;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        button:hover { background: #5568d3; }
    </style>
</head>
<body>

    <div class="card">
        <h2>💰 Seu Saldo</h2>
        <p class="subtitulo">Moeda Mumu</p>

        <div class="login-box">
            <label for="campoLogin">Seu Login (cadastrado na tabela):</label>
            <input type="text" id="campoLogin" placeholder="Digite seu login...">
        </div>

        <button onclick="buscarSaldo()">🔄 Atualizar Saldo</button>

        <div class="saldo-container">
            <div class="saldo-label">Saldo Disponível</div>
            <div class="saldo-valor" id="saldoMumu">
                <span class="carregando">Informe o login e clique em Atualizar</span>
            </div>
        </div>

        <p class="info">Última atualização: <span id="ultimaAtualizacao">--</span></p>
        <p class="info erro" id="mensagemErro"></p>
    </div>

    <script>
        // ====== DADOS DO SEU SUPABASE ======
        const SUPABASE_URL = "https://xrcxvizzdumcxbylmkvn.supabase.co/rest/v1";
        const SUPABASE_KEY = "sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD";
        // ===================================

        async function buscarSaldo() {
            const login = document.getElementById("campoLogin").value.trim();
            const elemSaldo = document.getElementById("saldoMumu");
            const elemData = document.getElementById("ultimaAtualizacao");
            const elemErro = document.getElementById("mensagemErro");

            elemErro.textContent = "";
            if (!login) {
                elemErro.textContent = "⚠️ Digite seu login!";
                return;
            }

            elemSaldo.innerHTML = `<span class="carregando">Buscando...</span>`;

            try {
                // Consulta direta na tabela "Geral" filtrando pelo login
                const resposta = await fetch(
                    `${SUPABASE_URL}/Geral?login=eq.${encodeURIComponent(login)}&select=mumu,updated_at`,
                    {
                        method: "GET",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Content-Type": "application/json"
                        }
                    }
                );

                if (!resposta.ok) throw new Error(`Erro: ${resposta.status}`);

                const dados = await resposta.json();

                if (!dados || dados.length === 0) {
                    elemSaldo.innerHTML = `<span class="erro">Login não encontrado</span>`;
                    return;
                }

                const saldo = parseFloat(dados[0].mumu || 0);

                // Exibe formatado em PT-BR
                elemSaldo.innerHTML = `
                    <span class="simbolo">M$</span> ${saldo.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                `;

                // Data da última atualização do banco
                const dataBanco = dados[0].updated_at 
                    ? new Date(dados[0].updated_at).toLocaleString('pt-BR') 
                    : new Date().toLocaleString('pt-BR');
                elemData.textContent = dataBanco;

            } catch (erro) {
                elemSaldo.innerHTML = `<span class="erro">Erro ao carregar</span>`;
                elemErro.textContent = `Detalhe: ${erro.message}`;
                console.error("Erro:", erro);
            }
        }
    </script>
</body>
</html>
