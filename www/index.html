<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM Quase Tudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002e5d, #001a33);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        .loading-container h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-container p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #f59e0b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <h1>🏦 MM Quase Tudo</h1>
        <div class="spinner"></div>
        <p>Redirecionando para o login...</p>
    </div>

    <script>
        // ==================== SESSÃO (24h) ====================
        const SESSION_KEY = 'usuario_logado';
        const SESSION_TIMESTAMP_KEY = 'session_timestamp';
        const SESSION_DURATION = 24 * 60 * 60 * 1000;

        function sessaoValida() {
            const ts = localStorage.getItem(SESSION_TIMESTAMP_KEY);
            const u  = localStorage.getItem(SESSION_KEY);
            if (!ts || !u) return false;
            const t = parseInt(ts, 10);
            if (isNaN(t)) return false;
            return (Date.now() - t) < SESSION_DURATION;
        }

        if (sessaoValida()) {
            try {
                const user = JSON.parse(localStorage.getItem(SESSION_KEY));
                if (user && user.login) {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'login.html';
                }
            } catch (e) {
                window.location.href = 'login.html';
            }
        } else {
            // Limpa sessão expirada
            localStorage.removeItem(SESSION_KEY);
            localStorage.removeItem(SESSION_TIMESTAMP_KEY);
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 800);
        }
    </script>
</body>
</html>
