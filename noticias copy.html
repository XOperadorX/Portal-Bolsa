<head>

    <title>Meus Arquivos para Download</title>
      <style>
  
       /* ==================== RESET E BASE ==================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #002e5d 0%, #001a33 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }



        /* ==================== MENU (adaptado do menu.html) ==================== */
        .menu-container {
            width: 100%;
            background-color: rgb(0, 43, 173);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .logo span {
            color: #f5c542;
            font-weight: 900;
        }

        .logo i {
            color: #f5c542;
            font-size: 1.6rem;
            margin-right: 0.2rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links li a {
            text-decoration: none;
            color: #d0d0d0;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.2s ease;
            padding: 0.5rem 0;
            position: relative;
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #f5c542;
            transition: width 0.25s ease;
        }

        .nav-links li a:hover {
            color: #ffffff;
        }

        .nav-links li a:hover::after {
            width: 100%;
        }

        .btn-discord {
            background: linear-gradient(135deg, #f5c542 0%, #d4a017 100%);
            border: none;
            border-radius: 40px;
            color: #0b0e14;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 0.7rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 15px rgba(245, 197, 66, 0.3);
            text-decoration: none;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-discord i {
            font-size: 1.1rem;
        }

        .btn-discord:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(245, 197, 66, 0.6);
            background: linear-gradient(135deg, #f7d25c 0%, #e0b020 100%);
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: #f5c542;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
        }
      </style>
</head>
<body>

            <ul class="nav-links" id="navLinks">

                <li><a href="./suporte.html">Suporte</a></li>
                <li><a href="./loja.html">Loja</a></li>
            </ul>

            <a href="https://discord.gg/ATtu4z9Ewt" class="btn-discord" target="_blank">
                <i class="fab fa-discord"></i>
                <span>Jogue Agora</span>
            </a>
        </nav>
    </div> 
</body>
</html>
