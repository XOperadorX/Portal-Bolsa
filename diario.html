        }

        .header-top {

            justify-content: space-between;

            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cycle-title {
            display: flex;

        .calendar-icon {
            background: linear-gradient(135deg, #f0c040, #d4a020);

            border-radius: 8px;

            color: #000;
            font-size: 20px;
        }

        .cycle-text {
            font-size: 14px;
            color: #d0c8f0;

        .main-title {
            font-size: 22px;
            font-weight: bold;

        }

        .next-day {
            text-align: right;
            color: #a098c0;

        }

        .countdown {
            color: #ffd040;
            font-size: 18px;
            font-weight: bold;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #2a2540;
            border-radius: 3px;
            margin: 16px 0 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f0c840, #ffd040, #f0c840);
            border-radius: 3px;
            transition: width 1s linear;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shine 2s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }

        /* Botão de resgatar */
        .btn-resgatar-container {
            display: flex;

            margin: 20px 0 10px;
        }

        .btn-resgatar {
            padding: 14px 32px;
            background: linear-gradient(135deg, #f0c040, #d4a020);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;

            transition: all 0.3s;
            font-family: inherit;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: pulseBtn 2s ease-in-out infinite;
        }

        .btn-resgatar:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(240, 192, 64, 0.9);
        }

        .btn-resgatar:disabled {
            background: #3b3459;
            color: #6a6a8a;
            cursor: not-allowed;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 20px rgba(240, 192, 64, 0.5); }
            50% { box-shadow: 0 0 30px rgba(240, 192, 64, 0.8); }

            justify-content: center;

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);

            color: #fff;

        }

        .toast.show {
            opacity: 1;

        }

        .toast.sucesso { border-left-color: #60f0a0; }
        .toast.erro    { border-left-color: #ff8080; }
        .toast.info    { border-left-color: #80c0ff; }

        @media (max-width: 700px) {
            .grid-days { grid-template-columns: repeat(5, 1fr); gap: 6px; }
            .main-title { font-size: 18px; }
            .countdown { font-size: 15px; }
            .day-number { font-size: 10px; }
            .reward-text { font-size: 9px; }
            .day-card { padding: 8px 4px; }
            .btn-resgatar { padding: 12px 22px; font-size: 13px; }
        }
    </style>
</head>

    <script type="module">

        // ============================================

            { dia: 11, cristais: 20,  icone: '💛', desc: '30 Perito' },
            { dia: 12, cristais: 20,  icone: '🪙', desc: '52.8K ouro' },
            { dia: 13, cristais: 20,  icone: '🔷', desc: '25 nítidos' },
            { dia: 14, cristais: 40,  icone: '📦', desc: 'Cápsula Prata' },
            { dia: 15, cristais: 20,  icone: '📦', desc: 'Cápsula Bronze' },
            { dia: 16, cristais: 20,  icone: '💰', desc: '50K ouro' },
            { dia: 17, cristais: 20,  icone: '💛', desc: '25 Perito' },
            { dia: 18, cristais: 20,  icone: '💛', desc: '35 Perito' },
            { dia: 19, cristais: 20,  icone: '⚙️', desc: '35 Ferrito' },
            { dia: 20, cristais: 20,  icone: '📦', desc: 'Cápsula Bronze' },
            // Linha 3
            { dia: 21, cristais: 40,  icone: '📦', desc: 'Cápsula Ouro' },
            { dia: 22, cristais: 20,  icone: '💰', desc: '63.5K ouro' },
            { dia: 23, cristais: 20,  icone: '💛', desc: '40 Perito' },
            { dia: 24, cristais: 20,  icone: '🔷', desc: '37 nítidos' },
            { dia: 25, cristais: 20,  icone: '📦', desc: 'Cápsula Bronze' },
            { dia: 26, cristais: 20,  icone: '⚙️', desc: '46 Ferrito' },
            { dia: 27, cristais: 20,  icone: '💰', desc: '154.5K ouro' },
            { dia: 28, cristais: 40,  icone: '🚗', desc: 'Cápsula Prata' },
            { dia: 29, cristais: 20,  icone: '🔷', desc: '37 nítidos' },
            { dia: 30, cristais: 140, icone: '🎁', desc: 'Cápsula Ouro Exclusiva' }
        ];

        // ============================================
        // ESTADO GLOBAL
        // ============================================
        const state = {
            usuario: null,
            diaAtual: 1,
            ultimoResgate: null,
            diasResgatados: [],
            cicloInicio: null,
            totalSegundos: 0,
            intervalId: null,
            carregado: false
        };

        // ============================================
        // UTILITÁRIOS
        // ============================================
        function mostrarToast(msg, tipo = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + tipo;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function setStatus(msg, tipo = '') {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg ' + tipo;
        }

        // ============================================
        // RENDERIZAÇÃO DA GRADE
        // ============================================
        function renderizarGrade() {
            const grid = document.getElementById('gridDays');
            grid.innerHTML = RECOMPENSAS.map(r => {
                const resgatado = state.diasResgatados.includes(r.dia);
                const atual = r.dia === state.diaAtual;
                const bloqueado = r.dia > state.diaAtual;

                let classes = 'day-card';
                if (atual) classes += ' current';
                if (resgatado) classes += ' resgatado';
                if (bloqueado) classes += ' bloqueado';

                const isUltimo = r.dia === 30;
                return `
                    <div class="${classes}">
                        <div class="day-number">${isUltimo ? `DIA ${r.dia} ★` : `DIA ${r.dia}`}</div>
                        <div class="crystals" ${isUltimo ? 'style="color:#ffd040;"' : ''}>
                            <span class="crystal-icon">💎</span> +${r.cristais}
                        </div>
                        <div class="reward-icon">${r.icone}</div>
                        <div class="reward-text">${r.desc}</div>
                    </div>
                `;
            }).join('');

            // Atualiza barra de progresso
            const progresso = ((state.diaAtual - 1) / 30) * 100;
            document.getElementById('progressBar').style.width = progresso + '%';

            // Atualiza botão
            atualizarBotao();
        }

        function atualizarBotao() {
            const btn = document.getElementById('btnResgatar');
            const diaJaResgatado = state.diasResgatados.includes(state.diaAtual);

            if (diaJaResgatado) {
                btn.disabled = true;
                btn.textContent = '✓ Recompensa já resgatada hoje';
                setStatus('⏰ Volte amanhã para o próximo dia!', 'info');
            } else {
                btn.disabled = false;
                btn.innerHTML = `🎁 Resgatar Dia ${state.diaAtual}`;
                setStatus(`Pronto para resgatar o Dia ${state.diaAtual}!`, 'sucesso');
            }
        }

        // ============================================
        // COUNTDOWN PARA PRÓXIMO DIA (24h)
        // ============================================
        function calcularProximoDia() {
            if (!state.ultimoResgate) {
                // Sem resgate anterior: 24h a partir de agora
                return new Date(Date.now() + 24 * 60 * 60 * 1000);
            }
            const ultimo = new Date(state.ultimoResgate);
            return new Date(ultimo.getTime() + 24 * 60 * 60 * 1000);
        }

        function iniciarCountdown() {
            if (state.intervalId) clearInterval(state.intervalId);

            function tick() {
                const proximo = calcularProximoDia();
                const agora = new Date();
                const diff = proximo - agora;

                if (diff <= 0) {
                    document.getElementById('countdown').textContent = '🎁 DISPONÍVEL!';
                    document.getElementById('countdown').style.color = '#60f0a0';
                    // Liberar próximo dia
                    if (state.diasResgatados.includes(state.diaAtual) && state.diaAtual < 30) {
                        state.diaAtual++;
                        state.ultimoResgate = null;
                        salvarProgresso().then(() => {
                            renderizarGrade();
                            mostrarToast(`🎉 Novo dia disponível: Dia ${state.diaAtual}!`, 'sucesso');
                        });
                    }
                    return;
                }

                const horas = Math.floor(diff / (1000 * 60 * 60));
                const minutos = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const segundos = Math.floor((diff % (1000 * 60)) / 1000);

                let texto = '';
                if (horas > 0) texto += `${horas} h `;
                if (minutos > 0 || horas > 0) texto += `${minutos} min`;
                if (horas === 0 && minutos < 10) texto += ` ${segundos} s`;

                document.getElementById('countdown').textContent = texto.trim();
                document.getElementById('countdown').style.color = '#ffd040';
            }

            tick();
            state.intervalId = setInterval(tick, 1000);
        }

        // ============================================
        // PERSISTÊNCIA NO SUPABASE
        // ============================================
        async function carregarProgresso(login) {
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('diario_ciclo, diario_dia, diario_ultimo_resgate, diario_dias_resgatados, diario_ciclo_inicio')
                    .eq('login', login)
                    .maybeSingle();

                if (error) {
                    console.warn('⚠️ Campos diário não existem ainda. Usando padrão.', error.message);
                    // Fallback: tenta carregar dados básicos
                    const { data: basic } = await supabase
                        .from(TABELA)
                        .select('login')
                        .eq('login', login)
                        .maybeSingle();
                    if (!basic) throw new Error('Usuário não encontrado');
                    return;
                }

                if (data) {
                    state.diaAtual = data.diario_dia || 1;
                    state.ultimoResgate = data.diario_ultimo_resgate || null;
                    state.diasResgatados = Array.isArray(data.diario_dias_resgatados)
                        ? data.diario_dias_resgatados
                        : [];
                    state.cicloInicio = data.diario_ciclo_inicio || null;

                    // Verifica se já passou 24h desde o último resgate para avançar
                    if (state.ultimoResgate) {
                        const proximo = new Date(new Date(state.ultimoResgate).getTime() + 24 * 60 * 60 * 1000);
                        if (new Date() >= proximo && state.diasResgatados.includes(state.diaAtual) && state.diaAtual < 30) {
                            state.diaAtual++;
                            state.ultimoResgate = null;
                            await salvarProgresso();
                        }
                    }
                }
            } catch (e) {
                console.error('❌ Erro ao carregar progresso:', e);
            }
        }

        async function salvarProgresso() {
            if (!state.usuario) return false;
            try {
                const payload = {
                    diario_dia: state.diaAtual,
                    diario_ultimo_resgate: state.ultimoResgate,
                    diario_dias_resgatados: state.diasResgatados,
                    diario_ciclo_inicio: state.cicloInicio,
                    updated_at: new Date().toISOString()
                };

                const { error } = await supabase
                    .from(TABELA)
                    .update(payload)
                    .eq('login', state.usuario.login);

                if (error) {
                    console.warn('⚠️ Erro ao salvar progresso do diário:', error.message);
                    return false;
                }
                return true;
            } catch (e) {
                console.error('❌ Exceção ao salvar progresso:', e);
                return false;
            }
        }

        // ============================================
        // RESGATAR RECOMPENSA
        // ============================================
        async function resgatarRecompensa() {
            if (!state.usuario) {
                mostrarToast('⚠️ Faça login primeiro!', 'erro');
                return;
            }

            if (state.diasResgatados.includes(state.diaAtual)) {
                mostrarToast('⚠️ Você já resgatou a recompensa de hoje!', 'erro');
                return;
            }

            const recompensa = RECOMPENSAS.find(r => r.dia === state.diaAtual);
            if (!recompensa) {
                mostrarToast('❌ Recompensa não encontrada', 'erro');
                return;
            }

            const btn = document.getElementById('btnResgatar');
            btn.disabled = true;
            btn.textContent = '⏳ Processando...';

            try {
                // Buscar dados atuais do usuário
                const { data: userData, error: errLoad } = await supabase
                    .from(TABELA)
                    .select('cristais, diario_dias_resgatados, diario_dia')
                    .eq('login', state.usuario.login)
                    .maybeSingle();

                if (errLoad) throw errLoad;

                // Verificar se campo cristais existe
                const cristaisAtuais = userData?.cristais ?? 0;
                const novosCristais = cristaisAtuais + recompensa.cristais;

                // Atualizar estado local
                state.diasResgatados.push(state.diaAtual);
                state.ultimoResgate = new Date().toISOString();
                if (!state.cicloInicio) state.cicloInicio = new Date().toISOString();

                // Salvar no banco: cristais + progresso diário
                const payload = {
                    cristais: novosCristais,
                    diario_dia: state.diaAtual,
                    diario_ultimo_resgate: state.ultimoResgate,
                    diario_dias_resgatados: state.diasResgatados,
                    diario_ciclo_inicio: state.cicloInicio,
                    updated_at: new Date().toISOString()
                };

                const { error: errSave } = await supabase
                    .from(TABELA)
                    .update(payload)
                    .eq('login', state.usuario.login);

                if (errSave) {
                    // Tenta salvar sem o campo cristais (fallback)
                    console.warn('⚠️ Campo cristais não existe, salvando apenas progresso');
                    const payloadFallback = {
                        diario_dia: state.diaAtual,
                        diario_ultimo_resgate: state.ultimoResgate,
                        diario_dias_resgatados: state.diasResgatados,
                        diario_ciclo_inicio: state.cicloInicio,
                        updated_at: new Date().toISOString()
                    };
                    const { error: errFallback } = await supabase
                        .from(TABELA)
                        .update(payloadFallback)
                        .eq('login', state.usuario.login);
                    if (errFallback) throw errFallback;
                }

                // Atualizar interface
                renderizarGrade();
                iniciarCountdown();

                mostrarToast(
                    `🎉 Dia ${recompensa.dia} resgatado! +${recompensa.cristais} 💎 e ${recompensa.desc}`,
                    'sucesso'
                );

                setStatus(`✅ Resgatado: ${recompensa.desc} (+${recompensa.cristais} 💎)`, 'sucesso');

                // Aviso do dashboard (se estiver em iframe)
                if (window.parent && window.parent !== window) {
                    try {
                        window.parent.postMessage({
                            tipo: 'diario_resgatado',
                            dia: recompensa.dia,
                            cristais: recompensa.cristais
                        }, '*');
                    } catch (e) { /* ignora */ }
                }

            } catch (e) {
                console.error('❌ Erro ao resgatar:', e);
                mostrarToast('❌ Erro ao resgatar recompensa. Tente novamente.', 'erro');
                // Reverter estado local
                state.diasResgatados = state.diasResgatados.filter(d => d !== state.diaAtual);
                state.ultimoResgate = null;
                renderizarGrade();
            } finally {
                btn.disabled = false;
                atualizarBotao();
            }
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        async function init() {
            try {
                // Carregar sessão
                const raw = localStorage.getItem(SESSION_KEY);
                if (!raw) {
                    mostrarToast('⚠️ Faça login para acessar o diário', 'erro');
                    setStatus('Você precisa estar logado', 'erro');
                    document.getElementById('loadingOverlay').style.display = 'none';
                    return;
                }

                const sessao = JSON.parse(raw);
                if (!sessao?.login) {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    return;
                }

                state.usuario = sessao;

                // Carregar progresso do banco
                await carregarProgresso(sessao.login);

                // Renderizar interface
                renderizarGrade();
                iniciarCountdown();

                // Configurar botão
                document.getElementById('btnResgatar').addEventListener('click', resgatarRecompensa);

                state.carregado = true;

                // Esconder loading
                document.getElementById('loadingOverlay').style.display = 'none';

                console.log('✅ Diário carregado para:', sessao.login);

            } catch (e) {
                console.error('❌ Erro na inicialização:', e);
                document.getElementById('loadingOverlay').style.display = 'none';
                mostrarToast('❌ Erro ao carregar diário', 'erro');
            }
        }

        // Aguardar DOM
        document.addEventListener('DOMContentLoaded', init);

        // Expor para debug
        window.diarioState = state;
    </script>
