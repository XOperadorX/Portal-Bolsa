<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002bad">

  <title>MM Quase Tudo - Login Diário</title>

  <meta name="description" content="Login diário do MM Quase Tudo — resgate recompensas todos os dias.">
  <meta name="author" content="Equipe MM Quase Tudo">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./shared/menu.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c1a 0%, #1a162e 50%, #12101f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      color: #fff;
    }

    .container {
      background: linear-gradient(180deg, #1e1b30 0%, #171426 100%);
      border: 2px solid #3b3459;
      border-radius: 16px;
      padding: 24px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 0 30px rgba(100, 80, 200, 0.2);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .cycle-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-icon {
      background: linear-gradient(135deg, #f0c040, #d4a020);
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: bold;
      color: #000;
      font-size: 20px;
    }

    .cycle-text {
      font-size: 14px;
      color: #d0c8f0;
    }

    .main-title {
      font-size: 22px;
      font-weight: bold;
      margin-top: 2px;
    }

    .next-day {
      text-align: right;
      color: #a098c0;
      font-size: 14px;
    }

    .countdown {
      color: #ffd040;
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #2a2540;
      border-radius: 3px;
      margin: 16px 0 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0c840, #ffd040, #f0c840);
      border-radius: 3px;
      transition: width 1s linear;
      position: relative;
    }

    .progress-bar::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shine 2s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .btn-resgatar-container {
      display: flex;
      justify-content: center;
      margin: 20px 0 10px;
    }

    .btn-resgatar {
      padding: 14px 32px;
      background: linear-gradient(135deg, #f0c040, #d4a020);
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(240, 192, 64, 0.5);
      transition: all 0.3s;
      font-family: inherit;
      letter-spacing: 1px;
      text-transform: uppercase;
      animation: pulseBtn 2s ease-in-out infinite;
    }

    .btn-resgatar:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(240, 192, 64, 0.9);
    }

    .btn-resgatar:disabled {
      background: #3b3459;
      color: #6a6a8a;
      cursor: not-allowed;
      box-shadow: none;
      animation: none;
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 0 20px rgba(240, 192, 64, 0.5); }
      50% { box-shadow: 0 0 30px rgba(240, 192, 64, 0.8); }
    }

    .status-msg {
      text-align: center;
      font-size: 13px;
      color: #a098c0;
      margin-top: 8px;
      min-height: 18px;
    }

    .status-msg.erro { color: #ff8080; }
    .status-msg.sucesso { color: #60f0a0; }

    .grid-days {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .day-card {
      background: linear-gradient(180deg, #2a2540, #221d35);
      border: 2px solid #3b3459;
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      transition: 0.2s;
      position: relative;
    }

    .day-card.current {
      border-color: #60f0a0;
      box-shadow: 0 0 10px rgba(96, 240, 160, 0.3);
    }

    .day-card.resgatado {
      background: linear-gradient(180deg, #1a3a2a, #122a1e);
      border-color: #2a8a5a;
      opacity: 0.85;
    }

    .day-card.resgatado::after {
      content: '✓';
      position: absolute;
      top: 3px;
      right: 5px;
      color: #60f0a0;
      font-weight: bold;
      font-size: 13px;
    }

    .day-card.bloqueado {
      opacity: 0.5;
    }

    .day-number {
      font-size: 12px;
      color: #a098c0;
      margin-bottom: 6px;
    }

    .sm-reward {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 14px;
      font-weight: bold;
      color: #80e0ff;
      margin-bottom: 6px;
    }

    .sm-icon {
      color: #40c0ff;
      filter: drop-shadow(0 0 3px rgba(80, 200, 255, .6));
    }

    .reward-icon {
      font-size: 22px;
      margin: 6px 0;
    }

    .reward-text {
      font-size: 10px;
      color: #9088b0;
      line-height: 1.2;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 11px;
      color: #8078a0;
      line-height: 1.5;
      text-align: center;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 12, 26, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
      z-index: 9999;
      color: #ffd040;
      font-size: 14px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(240, 192, 64, 0.15);
      border-top-color: #f0c040;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(20, 18, 35, 0.98);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border-left: 4px solid #f0c040;
      z-index: 10000;
      opacity: 0;
      transition: all 0.4s ease;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.sucesso { border-left-color: #60f0a0; }
    .toast.erro    { border-left-color: #ff8080; }
    .toast.info    { border-left-color: #80c0ff; }

    @media (max-width: 700px) {
      .grid-days { grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .main-title { font-size: 18px; }
      .countdown { font-size: 15px; }
      .day-number { font-size: 10px; }
      .reward-text { font-size: 9px; }
      .day-card { padding: 8px 4px; }
      .btn-resgatar { padding: 12px 22px; font-size: 13px; }
    }
  </style>
</head>
<body>


<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div>Carregando login diário...</div>
</div>

<div class="container">
  <div class="header-top">
    <div class="cycle-title">
      <span class="calendar-icon">📅</span>
      <div>
        <div class="cycle-text" id="cycleText">CICLO 1 • DE 30 DIAS</div>
        <h1 class="main-title">LOGIN DIÁRIO</h1>
      </div>
    </div>
    <div class="next-day">
      PRÓXIMO DIA EM
      <div class="countdown" id="countdown">-- h -- min</div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="grid-days" id="gridDays"></div>

  <div class="btn-resgatar-container">
    <button class="btn-resgatar" id="btnResgatar">🎁 Resgatar Recompensa do Dia</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <p class="footer-note">
    ⏰ Volte todos os dias para resgatar recompensas exclusivas.<br>
    💠 Pontos SM (`sm_atual`) são acumulados automaticamente.
  </p>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { db, TABELA } from './config.js';

/* ============================================================
   SESSÃO (mesma lógica do resto do projeto)
============================================================ */
const SESSION_KEYS = [
  'usuario_logado','usuarioLogado','user','usuario','jogador',
  'session','sessao','login','portal_bolsa_user','user_data','dados_usuario'
];

function lerSessao() {
  for (const key of SESSION_KEYS) {
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const obj = JSON.parse(raw);
      const u = obj?.user || obj?.usuario || obj;
      if (u && (u.login || u.nome || u.email || u.id)) {
        return {
          id:    u.id,
          login: u.login || u.nome || u.email?.split('@')[0] || u.username,
          nome:  u.nome || u.login || u.email?.split('@')[0] || u.username
        };
      }
    } catch (_) {
      if (raw.length > 0 && raw.length < 100) {
        return { login: raw, nome: raw };
      }
    }
  }
  return null;
}

/* ============================================================
   RECOMPENSAS — todos os dias dão 10 SM (sm_atual)
============================================================ */
const SM_POR_DIA = 10;          // ⚙️ valor base por dia
const SM_BONUS_DIA_30 = 50;     // ⚙️ bônus no dia 30

const RECOMPENSAS = Array.from({ length: 30 }, (_, i) => {
  const dia = i + 1;
  const bonus = dia === 30 ? SM_BONUS_DIA_30 : 0;
  return {
    dia,
    sm: SM_POR_DIA + bonus,
    icone: dia === 30 ? '🎁' : '💠',
    desc: dia === 30 ? `+${SM_POR_DIA + bonus} SM (Bônus Final)` : `+${SM_POR_DIA} SM`
  };
});

/* ============================================================
   ESTADO
============================================================ */
const state = {
  usuario: null,
  diaAtual: 1,
  ultimoResgate: null,
  diasResgatados: [],
  cicloInicio: null,
  intervalId: null
};

/* ============================================================
   HELPERS DE UI
============================================================ */
function mostrarToast(msg, tipo = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + tipo;
  setTimeout(() => toast.classList.remove('show'), 3500);
}

function setStatus(msg, tipo = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + tipo;
}

/* ============================================================
   RENDERIZAÇÃO
============================================================ */
function renderizarGrade() {
  const grid = document.getElementById('gridDays');
  grid.innerHTML = RECOMPENSAS.map(r => {
    const resgatado  = state.diasResgatados.includes(r.dia);
    const atual      = r.dia === state.diaAtual;
    const bloqueado  = r.dia > state.diaAtual;

    let classes = 'day-card';
    if (atual)     classes += ' current';
    if (resgatado) classes += ' resgatado';
    if (bloqueado) classes += ' bloqueado';

    const isUltimo = r.dia === 30;
    return `
      <div class="${classes}">
        <div class="day-number">${isUltimo ? `DIA ${r.dia} ★` : `DIA ${r.dia}`}</div>
        <div class="sm-reward" ${isUltimo ? 'style="color:#ffd040;"' : ''}>
          <span class="sm-icon">💠</span> +${r.sm}
        </div>
        <div class="reward-icon">${r.icone}</div>
        <div class="reward-text">${r.desc}</div>
      </div>
    `;
  }).join('');

  const progresso = ((state.diaAtual - 1) / 30) * 100;
  document.getElementById('progressBar').style.width = progresso + '%';

  atualizarBotao();
}

function atualizarBotao() {
  const btn = document.getElementById('btnResgatar');
  const diaJaResgatado = state.diasResgatados.includes(state.diaAtual);

  if (diaJaResgatado) {
    btn.disabled = true;
    btn.textContent = '✓ Recompensa já resgatada hoje';
    setStatus('⏰ Volte amanhã para o próximo dia!', 'info');
  } else {
    btn.disabled = false;
    btn.innerHTML = `🎁 Resgatar Dia ${state.diaAtual} (+${RECOMPENSAS[state.diaAtual - 1].sm} SM)`;
    setStatus(`Pronto para resgatar o Dia ${state.diaAtual}!`, 'sucesso');
  }
}

/* ============================================================
   COUNTDOWN
============================================================ */
function calcularProximoDia() {
  if (!state.ultimoResgate) {
    return new Date(Date.now() + 24 * 60 * 60 * 1000);
  }
  const ultimo = new Date(state.ultimoResgate);
  return new Date(ultimo.getTime() + 24 * 60 * 60 * 1000);
}

function iniciarCountdown() {
  if (state.intervalId) clearInterval(state.intervalId);

  function tick() {
    const proximo = calcularProximoDia();
    const diff = proximo - new Date();

    if (diff <= 0) {
      const el = document.getElementById('countdown');
      el.textContent = '🎁 DISPONÍVEL!';
      el.style.color = '#60f0a0';

      if (state.diasResgatados.includes(state.diaAtual) && state.diaAtual < 30) {
        state.diaAtual++;
        state.ultimoResgate = null;
        salvarProgresso().then(() => {
          renderizarGrade();
          mostrarToast(`🎉 Novo dia disponível: Dia ${state.diaAtual}!`, 'sucesso');
        });
      }
      return;
    }

    const horas    = Math.floor(diff / (1000 * 60 * 60));
    const minutos  = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diff % (1000 * 60)) / 1000);

    let texto = '';
    if (horas > 0)   texto += `${horas} h `;
    if (minutos > 0 || horas > 0) texto += `${minutos} min`;
    if (horas === 0 && minutos < 10) texto += ` ${segundos} s`;

    const el = document.getElementById('countdown');
    el.textContent = texto.trim();
    el.style.color = '#ffd040';
  }

  tick();
  state.intervalId = setInterval(tick, 1000);
}

/* ============================================================
   PERSISTÊNCIA
============================================================ */
async function carregarProgresso(login) {
  try {
    const { data, error } = await db
      .from(TABELA)
      .select('diario_dia, diario_ultimo_resgate, diario_dias_resgatados, diario_ciclo_inicio')
      .eq('login', login)
      .maybeSingle();

    if (error) {
      console.warn('⚠️ Erro ao carregar progresso:', error.message);
      return;
    }
    if (!data) return;

    state.diaAtual         = data.diario_dia || 1;
    state.ultimoResgate    = data.diario_ultimo_resgate || null;
    state.diasResgatados   = Array.isArray(data.diario_dias_resgatados)
      ? data.diario_dias_resgatados
      : [];
    state.cicloInicio      = data.diario_ciclo_inicio || null;

    // Avança o dia se já passou 24h
    if (state.ultimoResgate) {
      const proximo = new Date(new Date(state.ultimoResgate).getTime() + 24 * 60 * 60 * 1000);
      if (new Date() >= proximo
          && state.diasResgatados.includes(state.diaAtual)
          && state.diaAtual < 30) {
        state.diaAtual++;
        state.ultimoResgate = null;
        await salvarProgresso();
      }
    }
  } catch (e) {
    console.error('❌ Erro ao carregar progresso:', e);
  }
}

async function salvarProgresso() {
  if (!state.usuario) return false;
  try {
    const { error } = await db
      .from(TABELA)
      .update({
        diario_dia: state.diaAtual,
        diario_ultimo_resgate: state.ultimoResgate,
        diario_dias_resgatados: state.diasResgatados,
        diario_ciclo_inicio: state.cicloInicio,
        updated_at: new Date().toISOString()
      })
      .eq('login', state.usuario.login);

    if (error) {
      console.warn('⚠️ Erro ao salvar progresso:', error.message);
      return false;
    }
    return true;
  } catch (e) {
    console.error('❌ Exceção ao salvar:', e);
    return false;
  }
}

/* ============================================================
   RESGATAR — agora adiciona sm_atual
============================================================ */
async function resgatarRecompensa() {
  if (!state.usuario) {
    mostrarToast('⚠️ Faça login primeiro!', 'erro');
    return;
  }
  if (state.diasResgatados.includes(state.diaAtual)) {
    mostrarToast('⚠️ Você já resgatou a recompensa de hoje!', 'erro');
    return;
  }

  const recompensa = RECOMPENSAS.find(r => r.dia === state.diaAtual);
  if (!recompensa) {
    mostrarToast('❌ Recompensa não encontrada', 'erro');
    return;
  }

  const btn = document.getElementById('btnResgatar');
  btn.disabled = true;
  btn.textContent = '⏳ Processando...';

  try {
    // Busca sm_atual atual
    const { data: userData, error: errLoad } = await db
      .from(TABELA)
      .select('sm_atual, diario_dias_resgatados, diario_dia')
      .eq('login', state.usuario.login)
      .maybeSingle();

    if (errLoad) throw errLoad;

    const smAtual = Number(userData?.sm_atual ?? 0);
    const smNovo  = smAtual + recompensa.sm;

    // Atualiza estado local
    state.diasResgatados.push(state.diaAtual);
    state.ultimoResgate = new Date().toISOString();
    if (!state.cicloInicio) state.cicloInicio = new Date().toISOString();

    // Salva no banco: sm_atual + progresso
    const { error: errSave } = await db
      .from(TABELA)
      .update({
        sm_atual: smNovo,
        diario_dia: state.diaAtual,
        diario_ultimo_resgate: state.ultimoResgate,
        diario_dias_resgatados: state.diasResgatados,
        diario_ciclo_inicio: state.cicloInicio,
        updated_at: new Date().toISOString()
      })
      .eq('login', state.usuario.login);

    if (errSave) throw errSave;

    // Atualiza UI
    renderizarGrade();
    iniciarCountdown();

    mostrarToast(
      `🎉 Dia ${recompensa.dia} resgatado! +${recompensa.sm} 💠 SM`,
      'sucesso'
    );
    setStatus(`✅ Resgatado: +${recompensa.sm} 💠 SM (total: ${smNovo})`, 'sucesso');

    // Avisa o dashboard se estiver em iframe
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          tipo: 'diario_resgatado',
          dia: recompensa.dia,
          sm: recompensa.sm
        }, '*');
      } catch (e) { /* ignora */ }
    }

  } catch (e) {
    console.error('❌ Erro ao resgatar:', e);
    mostrarToast('❌ Erro ao resgatar recompensa. Tente novamente.', 'erro');
    state.diasResgatados = state.diasResgatados.filter(d => d !== state.diaAtual);
    state.ultimoResgate = null;
    renderizarGrade();
  } finally {
    btn.disabled = false;
    atualizarBotao();
  }
}

/* ============================================================
   INIT
============================================================ */
async function init() {
  try {
    const sessao = lerSessao();
    if (!sessao || !sessao.login) {
      mostrarToast('⚠️ Faça login para acessar o diário', 'erro');
      setStatus('Você precisa estar logado', 'erro');
      document.getElementById('loadingOverlay').style.display = 'none';
      return;
    }

    state.usuario = sessao;

    await carregarProgresso(sessao.login);

    renderizarGrade();
    iniciarCountdown();

    document.getElementById('btnResgatar').addEventListener('click', resgatarRecompensa);

    document.getElementById('loadingOverlay').style.display = 'none';

    console.log('✅ Diário carregado para:', sessao.login);

  } catch (e) {
    console.error('❌ Erro na inicialização:', e);
    document.getElementById('loadingOverlay').style.display = 'none';
    mostrarToast('❌ Erro ao carregar diário', 'erro');
  }
}

document.addEventListener('DOMContentLoaded', init);
window.diarioState = state;
</script>

<script type="module">
  import { renderMenu } from './shared/menu.js';
  renderMenu('menu-slot', 'diario');
</script>

</body>
</html>
