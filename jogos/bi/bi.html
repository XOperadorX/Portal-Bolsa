<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Imobiliário Online</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1e3a5f, #2c5364);
    min-height: 100vh;
    padding: 20px;
    color: white;
  }
  h1 {
    text-align: center;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }
  .painel-jogadores {
    background: rgba(0,0,0,0.3);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .jogador-card {
    background: rgba(255,255,255,0.1);
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .jogador-card.vez {
    background: #ffd700;
    color: #000;
    font-weight: bold;
  }
  button {
    background: #ffd700;
    color: #000;
    border: none;
    padding: 8px 16px;
    margin: 5px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #ffed4a; transform: scale(1.05); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .tabuleiro {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 20px auto;
    max-width: 900px;
  }
  .casa {
    background: white;
    color: #333;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    border: 3px solid #ccc;
    transition: 0.3s;
  }
  .casa.ocupada { box-shadow: 0 0 10px #ffd700; }
  .casa .dono-tag {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    background: #16a34a;
    color: #fff;
    padding: 2px 4px;
    border-radius: 4px;
  }
  .controles {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
  }
  #mensagem { margin-top: 10px; font-size: 16px; color: #ffd700; min-height: 22px; }
  #resultado-dados { margin-top: 10px; font-size: 18px; color: #fff; min-height: 22px; }
  .aviso {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
    text-align: center;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .aviso.erro { background: #f8d7da; color: #721c24; }
  .aviso.ok   { background: #d1e7dd; color: #0f5132; }
  .status-online {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fbbf24;
    margin-left: 6px;
    animation: pulse 2s infinite;
  }
  .status-online.on  { background: #4ade80; }
  .status-online.off { background: #f87171; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .badge-dono {
    background: #16a34a;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-left: 4px;
  }
</style>
</head>
<body>

<h1>🏦 BANCO IMOBILIÁRIO ONLINE</h1>

<div class="aviso" id="aviso-login">⚠️ Verificando sessão...</div>

<div class="painel-jogadores">
  <h3>Jogador <span class="status-online" id="status-realtime"></span></h3>
  <p style="font-size:12px; opacity:0.7; margin:6px 0 10px;">
    Entrada com taxa de <strong>S$ 1,00</strong> (você confirma antes).
    Saldo real (S$) da tabela <strong>Geral</strong> é usado no jogo.
    <br>🏠 Propriedades compradas ficam <strong>visíveis para todos os logins</strong>.
  </p>
  <div id="lista-jogadores"></div>
</div>

<div class="tabuleiro" id="tabuleiro"></div>

<div class="controles">
  <div id="dados-jogador">Carregando...</div>
  <br>
  <button id="btn-dados" onclick="jogarDados()">🎲 Jogar Dados</button>
  <button id="btn-comprar" onclick="comprar()">🏠 Comprar Propriedade</button>
  <div id="resultado-dados"></div>
  <div id="mensagem"></div>
</div>

<script>
// ============================================================
// 🐞 DEBUG
// ============================================================
(function () {
  const aviso = document.getElementById('aviso-login');
  const setAviso = (txt, cls) => {
    if (!aviso) return;
    aviso.className = 'aviso ' + (cls || '');
    aviso.innerHTML = txt;
  };
  window.__biDebug = setAviso;

  window.addEventListener('error', (e) => {
    console.error('[BI error]', e);
    setAviso('❌ ' + (e.message || 'Erro') +
      (e.filename ? '<br><small>' + e.filename + ':' + e.lineno + '</small>' : ''), 'erro');
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[BI rejection]', e);
    setAviso('❌ Promise: ' + (e.reason?.message || e.reason), 'erro');
  });
})();
</script>

<script type="module">
// ============================================================
// 🔗 IMPORTA CONFIG
// ============================================================
let cfg;
try {
  cfg = await import('./config.js');
} catch (err) {
  window.__biDebug('❌ Falha ao importar config.js: ' + (err.message || err) +
    '<br><small>Está na mesma pasta? Servindo via http://?</small>', 'erro');
  throw err;
}

const { db, TABELA, SESSION_KEY, fmtSaldo, esc } = cfg;
console.log('[BI] config.js OK. TABELA =', TABELA);

// ============================================================
// ⚙️ CONSTANTES
// ============================================================
const TAXA_ENTRADA  = 1.00;
const BONUS_VOLTA   = 0.00;
const TABELA_COMPRAS = 'banco_imobiliario_compras';

// ============================================================
// 🔐 SESSÃO
// ============================================================
function detectarLogin() {
  const chaves = [SESSION_KEY, 'usuario_logado', 'usuarioLogado', 'usuario', 'user', 'login', 'email'];
  for (const k of chaves) {
    const raw = localStorage.getItem(k);
    if (!raw) continue;
    try {
      const obj = JSON.parse(raw);
      if (typeof obj === 'string' && obj.trim()) return obj.trim();
      if (obj && typeof obj === 'object') {
        const c = obj.login || obj.usuario || obj.email || obj.user || obj.nome;
        if (c && String(c).trim()) return String(c).trim();
      }
    } catch {
      if (raw.trim()) return raw.trim();
    }
  }
  return null;
}

const login = detectarLogin();
if (!login) {
  window.__biDebug('❌ Nenhuma sessão. Chaves: <code>' +
    (Object.keys(localStorage).join(', ') || '(vazio)') + '</code>', 'erro');
  throw new Error('Sem sessão');
}
window.__biDebug('✅ Logado como <strong>' + esc(login) + '</strong>. Carregando...', 'ok');

// ============================================================
// 🎯 ESTADO
// ============================================================
let jogadores       = [];
let jogadorAtual    = 0;
let jogoIniciado    = false;
let canalRealtime   = null;
let canalCompras    = null;
let eu              = null;
let comprasGlobais  = {};   // { [casa_id]: { dono_login, dono_nome, preco } }

const TABULEIRO_PADRAO = [
  { nome: "Início",               preco: 0,   tipo: "inicio"      },
  { nome: "Rua das Flores",       preco: 60,  tipo: "propriedade" },
  { nome: "Sorte ou Azar",        preco: 0,   tipo: "chance"      },
  { nome: "Avenida Brasil",       preco: 100, tipo: "propriedade" },
  { nome: "Serviço de Água",      preco: 150, tipo: "servico"     },
  { nome: "Estação Ferroviária",  preco: 200, tipo: "ferrovia"    },
  { nome: "Rua Azul",             preco: 140, tipo: "propriedade" },
  { nome: "Prisão / Visita",      preco: 0,   tipo: "especial"    },
  { nome: "Avenida Central",      preco: 220, tipo: "propriedade" },
  { nome: "Imposto de Renda",     preco: 100, tipo: "imposto"     },
  { nome: "Praça Nova",           preco: 400, tipo: "propriedade" },
  { nome: "Descanso",             preco: 0,   tipo: "descanso"    }
];
let tabuleiro = JSON.parse(JSON.stringify(TABULEIRO_PADRAO));

// ============================================================
// 🎨 TABULEIRO DOM
// ============================================================
function montarTabuleiroDOM() {
  document.getElementById('tabuleiro').innerHTML = tabuleiro.map((_, i) => `
    <div id="casa-${i}" class="casa"></div>
  `).join('');
}

// ============================================================
// 📥 CARREGAR MEU USUÁRIO
// ============================================================
async function carregarEu() {
  const { data, error } = await db
    .from(TABELA)
    .select('login, nome, saldo')
    .eq('login', login)
    .maybeSingle();

  if (error) { console.error('[BI] erro eu:', error); return null; }
  eu = data;
  console.log('[BI] eu:', eu);
  return eu;
}

// ============================================================
// 📥 CARREGAR COMPRAS GLOBAIS (de todos os usuários)
// ============================================================
async function carregarComprasGlobais() {
  const { data, error } = await db
    .from(TABELA_COMPRAS)
    .select('casa_id, casa_nome, dono_login, dono_nome, preco, comprado_em');

  if (error) {
    console.error('[BI] erro compras globais:', error);
    return;
  }

  comprasGlobais = {};
  for (const c of (data || [])) {
    comprasGlobais[c.casa_id] = {
      dono_login: c.dono_login,
      dono_nome:  c.dono_nome,
      preco:      Number(c.preco) || 0,
      comprado_em: c.comprado_em
    };
  }
  console.log('[BI] compras globais:', Object.keys(comprasGlobais).length);
}

// ============================================================
// 💾 REGISTRAR COMPRA GLOBAL
// ============================================================
async function registrarCompraGlobal(casaId, casaNome, preco) {
  // Tenta inserir; se a casa já tem dono, o UNIQUE (casa_id) bloqueia
  const { error } = await db.from(TABELA_COMPRAS).insert({
    casa_id:    casaId,
    casa_nome:  casaNome,
    dono_login: login,
    dono_nome:  eu?.nome || login,
    preco:      preco
  });

  if (error) {
    console.error('[BI] erro inserir compra global:', error);
    return { ok: false, error };
  }

  comprasGlobais[casaId] = {
    dono_login: login,
    dono_nome:  eu?.nome || login,
    preco
  };
  return { ok: true };
}

// ============================================================
// 📥 CARREGAR JOGO LOCAL
// ============================================================
async function carregarJogo() {
  const { data, error } = await db
    .from(TABELA).select('fazendinha_dados').eq('login', login).maybeSingle();

  if (error) { console.error('[BI] erro carregar:', error); return; }

  const jogo = data?.fazendinha_dados?.banco_imobiliario;
  if (jogo) {
    jogadores    = jogo.jogadores    || [];
    jogadorAtual = jogo.jogadorAtual || 0;
    jogoIniciado = jogo.jogoIniciado || false;
    tabuleiro    = jogo.tabuleiro    || JSON.parse(JSON.stringify(TABULEIRO_PADRAO));
  }
}

// ============================================================
// 💾 SALVAR JOGO LOCAL
// ============================================================
async function salvarJogo() {
  const { data: atual } = await db
    .from(TABELA).select('fazendinha_dados').eq('login', login).maybeSingle();
  const fazendinha = atual?.fazendinha_dados || {};

  const { error } = await db.from(TABELA).update({
    fazendinha_dados: {
      ...fazendinha,
      banco_imobiliario: {
        jogadores, jogadorAtual, jogoIniciado, tabuleiro,
        atualizado_em: new Date().toISOString()
      }
    },
    updated_at: new Date().toISOString()
  }).eq('login', login);

  if (error) console.error('[BI] erro salvar:', error);
}

// ============================================================
// 💸 SALDO REAL
// ============================================================
async function atualizarSaldoReal(loginJogador, deltaS) {
  if (!loginJogador || deltaS === 0) return;

  const { data } = await db
    .from(TABELA).select('saldo').eq('login', loginJogador).maybeSingle();

  const saldoAtual = Number(data?.saldo) || 0;
  const novoSaldo  = Math.max(0, saldoAtual + deltaS);

  const { error } = await db.from(TABELA).update({
    saldo: novoSaldo,
    updated_at: new Date().toISOString()
  }).eq('login', loginJogador);

  if (error) { console.error('[BI] erro saldo:', error); return; }

  const jog = jogadores.find(j => j.login === loginJogador);
  if (jog) jog.saldo = novoSaldo;
  if (loginJogador === login && eu) eu.saldo = novoSaldo;
}

// ============================================================
// 🏆 CODEX
// ============================================================
async function registrarPropriedadeNoCodex(casa, loginDono) {
  const { data: atual } = await db.from(TABELA).select('itens').eq('login', loginDono).maybeSingle();
  const itens = Array.isArray(atual?.itens) ? atual.itens : [];
  const idItem = `bi_${casa.nome.toLowerCase().replace(/\s+/g, '_')}`;
  if (itens.some(i => i.id_item === idItem)) return;

  const raridade = casa.preco >= 400 ? 'lendario' : casa.preco >= 200 ? 'epico' : 'raro';
  itens.push({
    id_item: idItem, nome: casa.nome, tipo_peca: 'Propriedade',
    raridade, tier: Math.min(20, Math.max(1, Math.floor(casa.preco / 20))),
    bonus: { atk: Math.floor(casa.preco / 20), def: Math.floor(casa.preco / 30), hp: casa.preco },
    origem: 'banco_imobiliario', registrado_em: new Date().toISOString()
  });

  await db.from(TABELA).update({ itens, updated_at: new Date().toISOString() }).eq('login', loginDono);
}

// ============================================================
// 💰 TAXA
// ============================================================
async function confirmarECobrarTaxa() {
  const saldoAtual = Number(eu?.saldo) || 0;

  if (saldoAtual < TAXA_ENTRADA) {
    window.__biDebug(
      `❌ Saldo insuficiente para entrar.<br>` +
      `Você tem <strong>${fmtSaldo(saldoAtual)}</strong> ` +
      `mas precisa de <strong>${fmtSaldo(TAXA_ENTRADA)}</strong>.`,
      'erro'
    );
    return false;
  }

  const ok = confirm(
    `🎲 Banco Imobiliário Online\n\n` +
    `Para entrar no jogo é cobrada uma taxa de:\n` +
    `💸 ${fmtSaldo(TAXA_ENTRADA)}\n\n` +
    `Seu saldo atual: ${fmtSaldo(saldoAtual)}\n` +
    `Saldo após pagar: ${fmtSaldo(saldoAtual - TAXA_ENTRADA)}\n\n` +
    `Deseja pagar e entrar?`
  );

  if (!ok) {
    window.__biDebug(`ℹ️ Você optou por <strong>não entrar</strong>. Nada foi cobrado.`, 'erro');
    document.getElementById('btn-dados').disabled = true;
    document.getElementById('btn-comprar').disabled = true;
    document.getElementById('dados-jogador').innerHTML =
      'Você não entrou no jogo. Recarregue para tentar novamente.';
    return false;
  }

  await atualizarSaldoReal(login, -TAXA_ENTRADA);
  return true;
}

// ============================================================
// 🚀 ENTRAR
// ============================================================
async function entrarAutomaticamente() {
  if (jogoIniciado && jogadores.some(j => j.login === login)) {
    console.log('[BI] jogo em andamento');
    return true;
  }

  jogadores    = [];
  jogadorAtual = 0;
  tabuleiro    = JSON.parse(JSON.stringify(TABULEIRO_PADRAO));

  const ok = await confirmarECobrarTaxa();
  if (!ok) return false;

  jogadores.push({
    login: eu.login,
    nome: eu.nome || eu.login,
    saldo: Number(eu.saldo) || 0,
    posicao: 0,
    propriedades: []
  });

  jogoIniciado = true;
  await salvarJogo();
  return true;
}

// ============================================================
// 🎲 JOGAR
// ============================================================
window.jogarDados = async function () {
  if (!jogoIniciado || jogadores.length === 0) return;

  const d1 = Math.floor(Math.random() * 6) + 1;
  const d2 = Math.floor(Math.random() * 6) + 1;
  const total = d1 + d2;

  document.getElementById('resultado-dados').innerHTML =
    `🎲 ${d1} + ${d2} = <strong>${total}</strong>`;

  await moverJogador(total);
};

async function moverJogador(passos) {
  const jog = jogadores[jogadorAtual];
  const passouPartida = jog.posicao + passos >= tabuleiro.length;

  jog.posicao = (jog.posicao + passos) % tabuleiro.length;

  if (passouPartida && BONUS_VOLTA > 0) {
    await atualizarSaldoReal(jog.login, +BONUS_VOLTA);
    mostrarMsg(`🎉 Passou pela partida! +${fmtSaldo(BONUS_VOLTA)}`);
  } else if (passouPartida) {
    mostrarMsg('➡️ Deu a volta (sem bônus).');
  }

  await processarCasa(jog.posicao);

  if (jog.saldo <= 0 && jog.propriedades.length === 0) {
    setTimeout(async () => {
      alert(`💔 ${jog.nome} faliu! Fim de jogo.`);
    }, 800);
    return;
  }

  jogadorAtual = (jogadorAtual + 1) % jogadores.length;
  await salvarJogo();
  atualizarTela();
}

// ============================================================
// 🏠 CASA
// ============================================================
async function processarCasa(pos) {
  const casa = tabuleiro[pos];
  const jog  = jogadores[jogadorAtual];
  const donoGlobal = comprasGlobais[pos];

  switch (casa.tipo) {
    case 'imposto':
      await atualizarSaldoReal(jog.login, -casa.preco);
      mostrarMsg(`💸 Pagou S$ ${casa.preco} de imposto!`);
      break;

    case 'chance': {
      if (Math.random() > 0.5) {
        await atualizarSaldoReal(jog.login, +100);
        mostrarMsg('🍀 Sorte! +S$ 100!');
      } else {
        await atualizarSaldoReal(jog.login, -50);
        mostrarMsg('😬 Azar! -S$ 50!');
      }
      break;
    }

    case 'propriedade':
    case 'servico':
    case 'ferrovia':
      if (!donoGlobal) {
        mostrarMsg(`🏠 ${casa.nome} à venda por ${fmtSaldo(casa.preco)}`);
      } else if (donoGlobal.dono_login !== jog.login) {
        const taxa = casa.tipo === 'propriedade' ? 0.3 : 0.25;
        const aluguel = Math.floor(casa.preco * taxa);
        await atualizarSaldoReal(jog.login, -aluguel);
        await atualizarSaldoReal(donoGlobal.dono_login, +aluguel);
        mostrarMsg(`💵 Aluguel ${fmtSaldo(aluguel)} → ${donoGlobal.dono_nome}`);
      } else {
        mostrarMsg(`🏠 Você já é dono de ${casa.nome}`);
      }
      break;

    case 'inicio':   mostrarMsg('💰 Início.'); break;
    case 'descanso': mostrarMsg('✌️ Descanso.'); break;
    case 'especial': mostrarMsg('🚔 Prisão / Visita.'); break;
  }
}

// ============================================================
// 🏠 COMPRAR — grava global
// ============================================================
window.comprar = async function () {
  if (!jogoIniciado) return;

  const pos  = jogadores[jogadorAtual].posicao;
  const jog  = jogadores[jogadorAtual];
  const casa = tabuleiro[pos];

  if (!['propriedade', 'servico', 'ferrovia'].includes(casa.tipo)) {
    mostrarMsg('❌ Aqui não dá pra comprar!'); return;
  }
  if (comprasGlobais[pos]) {
    mostrarMsg(`❌ Já pertence a ${comprasGlobais[pos].dono_nome}!`);
    return;
  }
  if (jog.saldo < casa.preco) {
    mostrarMsg('❌ Sem saldo!'); return;
  }

  // 1) Cobra do saldo real
  await atualizarSaldoReal(jog.login, -casa.preco);

  // 2) Tenta registrar global (UNIQUE casa_id bloqueia se outro pegou primeiro)
  const res = await registrarCompraGlobal(pos, casa.nome, casa.preco);

  if (!res.ok) {
    // Devolve o dinheiro — outro usuário comprou antes
    await atualizarSaldoReal(jog.login, +casa.preco);
    mostrarMsg('⚠️ Outro jogador comprou primeiro! Dinheiro devolvido.');
    await carregarComprasGlobais();
    atualizarTela();
    return;
  }

  // 3) Marca no tabuleiro local
  casa.dono = jog.login;
  jog.propriedades.push(casa.nome);

  // 4) Codex pessoal
  if (casa.tipo === 'propriedade') {
    await registrarPropriedadeNoCodex(casa, jog.login);
  }

  await salvarJogo();
  atualizarTela();
  mostrarMsg(`✅ Comprou ${casa.nome} por ${fmtSaldo(casa.preco)}! (visível para todos)`);
};

// ============================================================
// 💬 MSG
// ============================================================
function mostrarMsg(texto) {
  document.getElementById('mensagem').innerHTML = `<p>${esc(texto)}</p>`;
}

// ============================================================
// 🖼️ TELA — mostra dono GLOBAL
// ============================================================
function atualizarTela() {
  const lista = document.getElementById('lista-jogadores');

  if (jogadores.length === 0) {
    lista.innerHTML = '<em style="opacity:0.6">Aguardando entrada...</em>';
  } else {
    lista.innerHTML = jogadores.map((j, i) => `
      <div class="jogador-card ${i === jogadorAtual && jogoIniciado ? 'vez' : ''}">
        <span>
          <strong>${esc(j.nome)}</strong>
          <small style="opacity:0.7">(@${esc(j.login)})</small>
          ${j.login === login ? '<span class="badge-dono">VOCÊ</span>' : ''}
        </span>
        <span>
          💰 ${fmtSaldo(j.saldo)} |
          📍 ${esc(tabuleiro[j.posicao]?.nome || '—')}
          ${j.propriedades.length ? ` | 🏠 ${j.propriedades.length}` : ''}
        </span>
      </div>
    `).join('');
  }

  if (jogoIniciado && jogadores.length > 0) {
    const jog = jogadores[jogadorAtual];
    document.getElementById('dados-jogador').innerHTML =
      `<strong>Vez de: ${esc(jog.nome)}</strong> | Saldo: ${fmtSaldo(jog.saldo)}`;
  } else {
    document.getElementById('dados-jogador').innerHTML = 'Carregando...';
  }

  document.getElementById('btn-dados').disabled    = !jogoIniciado;
  document.getElementById('btn-comprar').disabled  = !jogoIniciado;

  const tipos = {
    propriedade: '#FFE4B5', inicio: '#90EE90', chance: '#87CEEB',
    servico: '#DDA0DD', ferrovia: '#D3D3D3', especial: '#CD853F',
    imposto: '#FF6347', descanso: '#98FB98'
  };

  for (let i = 0; i < tabuleiro.length; i++) {
    const el = document.getElementById(`casa-${i}`);
    if (!el) continue;
    const casa = tabuleiro[i];
    const aqui = jogadores.filter(j => j.posicao === i);
    const donoGlobal = comprasGlobais[i];

    let html = esc(casa.nome);
    if (casa.preco > 0) html += `<br>💰 ${fmtSaldo(casa.preco)}`;

    if (aqui.length > 0) {
      html += `<br>👤 ${aqui.map(j => esc(j.nome.charAt(0))).join(', ')}`;
      el.classList.add('ocupada');
    } else {
      el.classList.remove('ocupada');
    }

    // ⭐ Destaque: dono VEM DA TABELA GLOBAL
    if (donoGlobal) {
      html += `<span class="dono-tag">🏠 ${esc(donoGlobal.dono_nome || donoGlobal.dono_login)}</span>`;
      el.style.backgroundColor = donoGlobal.dono_login === login ? '#90EE90' : '#ffd28a';
      el.style.color = '#000';
    } else {
      el.style.backgroundColor = tipos[casa.tipo] || '#fff';
      el.style.color = '#333';
    }

    el.innerHTML = html;
  }
}

// ============================================================
// 🔄 REALTIME — JOGO LOCAL
// ============================================================
function ativarRealtime() {
  canalRealtime = db
    .channel('bi-' + login)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: TABELA, filter: `login=eq.${login}` },
      (payload) => {
        const jogo = payload.new?.fazendinha_dados?.banco_imobiliario;
        if (!jogo) return;
        jogadores    = jogo.jogadores    || [];
        jogadorAtual = jogo.jogadorAtual || 0;
        jogoIniciado = jogo.jogoIniciado || false;
        if (jogo.tabuleiro) tabuleiro = jogo.tabuleiro;
        atualizarTela();
      })
    .subscribe((status) => {
      const dot = document.getElementById('status-realtime');
      dot.classList.remove('on', 'off');
      if (status === 'SUBSCRIBED') dot.classList.add('on');
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') dot.classList.add('off');
    });
}

// ============================================================
// 🌐 REALTIME — COMPRAS GLOBAIS
// ============================================================
function ativarRealtimeCompras() {
  canalCompras = db
    .channel('bi-compras')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: TABELA_COMPRAS },
      (payload) => {
        const row = payload.new || payload.old;
        if (!row) return;

        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
          comprasGlobais[row.casa_id] = {
            dono_login: row.dono_login,
            dono_nome:  row.dono_nome,
            preco:      Number(row.preco) || 0,
            comprado_em: row.comprado_em
          };
        } else if (payload.eventType === 'DELETE') {
          delete comprasGlobais[row.casa_id];
        }

        atualizarTela();
        console.log('[BI] compra atualizada:', row.casa_nome, '→', row.dono_nome);
      })
    .subscribe((status) => {
      console.log('[BI] realtime compras:', status);
    });
}

// ============================================================
// 🚀 INIT
// ============================================================
(async function init() {
  try {
    await carregarEu();

    if (!eu) {
      window.__biDebug('❌ Login <code>' + esc(login) +
        '</code> não encontrado na tabela <code>Geral</code>.', 'erro');
      return;
    }

    await Promise.all([
      carregarJogo(),
      carregarComprasGlobais()
    ]);

    const ok = await entrarAutomaticamente();
    montarTabuleiroDOM();
    atualizarTela();

    if (!ok) return;

    ativarRealtime();
    ativarRealtimeCompras();

    window.__biDebug(
      `✅ Bem-vindo, <strong>${esc(eu.nome || login)}</strong>! ` +
      `Saldo: <strong>${fmtSaldo(eu.saldo)}</strong>. ` +
      `${Object.keys(comprasGlobais).length} propriedade(s) já comprada(s) globalmente.`,
      'ok'
    );
    setTimeout(() => {
      const a = document.getElementById('aviso-login');
      if (a) a.style.display = 'none';
    }, 5000);

    mostrarMsg('🎮 Bem-vindo! Jogue os dados.');

  } catch (err) {
    console.error('[BI] init:', err);
    window.__biDebug('❌ Init: ' + (err.message || err), 'erro');
  }

  window.addEventListener('beforeunload', () => {
    if (canalRealtime) db.removeChannel(canalRealtime);
    if (canalCompras)  db.removeChannel(canalCompras);
  });
})();
</script>
