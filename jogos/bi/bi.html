<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Imobiliário Online</title>
<style>
  * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1e3a5f, #2c5364);
    min-height: 100vh;
    padding: 20px;
    color: white;
  }
  h1 {
    text-align: center;
    color: #ffd700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }
  .painel-jogadores {
    background: rgba(0,0,0,0.3);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .jogador-card {
    background: rgba(255,255,255,0.1);
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .jogador-card.vez {
    background: #ffd700;
    color: #000;
    font-weight: bold;
  }
  .jogador-card button {
    padding: 4px 10px;
    font-size: 12px;
    margin: 0;
  }
  button {
    background: #ffd700;
    color: #000;
    border: none;
    padding: 8px 16px;
    margin: 5px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #ffed4a; transform: scale(1.05); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  button.perigo { background: #ff6b6b; color: white; }
  .tabuleiro {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin: 20px auto;
    max-width: 900px;
  }
  .casa {
    background: white;
    color: #333;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    border: 3px solid #ccc;
    transition: 0.3s;
  }
  .casa.ocupada { box-shadow: 0 0 10px #ffd700; }
  .controles {
    background: rgba(0,0,0,0.3);
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
  }
  #mensagem { margin-top: 10px; font-size: 16px; color: #ffd700; min-height: 22px; }
  #resultado-dados { margin-top: 10px; font-size: 18px; color: #fff; min-height: 22px; }
  .aviso {
    background: #fff3cd;
    color: #856404;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 15px;
    text-align: center;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .aviso.erro { background: #f8d7da; color: #721c24; }
  .aviso.ok   { background: #d1e7dd; color: #0f5132; }
  .status-online {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fbbf24;
    margin-left: 6px;
    animation: pulse 2s infinite;
  }
  .status-online.on  { background: #4ade80; }
  .status-online.off { background: #f87171; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .badge-dono {
    background: #16a34a;
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-left: 4px;
  }
</style>
</head>
<body>

<h1>🏦 BANCO IMOBILIÁRIO ONLINE</h1>

<div class="aviso" id="aviso-login">⚠️ Verificando sessão...</div>

<div class="painel-jogadores">
  <h3>Jogadores <span class="status-online" id="status-realtime"></span></h3>
  <p style="font-size:12px; opacity:0.7; margin:6px 0 10px;">
    Você entra automaticamente. Convide mais gente se quiser (opcional).
    Saldo real (S$) da tabela <strong>Geral</strong> é usado no jogo.
  </p>
  <div id="lista-jogadores"></div>
  <button id="btn-convidar" onclick="convidarJogador()">➕ Convidar Jogador</button>
  <button id="btn-iniciar" onclick="iniciarJogo()">▶️ Iniciar Jogo</button>
  <button id="btn-reiniciar" class="perigo" onclick="reiniciarJogo()">🔄 Reiniciar Jogo</button>
</div>

<div class="tabuleiro" id="tabuleiro"></div>

<div class="controles">
  <div id="dados-jogador">Clique em "Iniciar Jogo" para começar.</div>
  <br>
  <button id="btn-dados" onclick="jogarDados()">🎲 Jogar Dados</button>
  <button id="btn-comprar" onclick="comprar()">🏠 Comprar Propriedade</button>
  <div id="resultado-dados"></div>
  <div id="mensagem"></div>
</div>

<script>
// ============================================================
// 🐞 DEBUG — captura erros antes do módulo carregar
// ============================================================
(function () {
  const aviso = document.getElementById('aviso-login');
  const setAviso = (txt, cls) => {
    if (!aviso) return;
    aviso.className = 'aviso ' + (cls || '');
    aviso.innerHTML = txt;
  };
  window.__biDebug = setAviso;

  window.addEventListener('error', (e) => {
    console.error('[BI error]', e);
    setAviso('❌ ' + (e.message || 'Erro') +
      (e.filename ? '<br><small>' + e.filename + ':' + e.lineno + '</small>' : ''), 'erro');
  });
  window.addEventListener('unhandledrejection', (e) => {
    console.error('[BI rejection]', e);
    setAviso('❌ Promise: ' + (e.reason?.message || e.reason), 'erro');
  });

  console.log('[BI] localStorage:', Object.keys(localStorage));
  for (const k of Object.keys(localStorage)) {
    console.log(`[BI] "${k}" =`, localStorage.getItem(k)?.slice(0, 120));
  }
})();
</script>

<script type="module">
// ============================================================
// 🔗 IMPORTA CONFIG
// ============================================================
let cfg;
try {
  cfg = await import('./config.js');
} catch (err) {
  window.__biDebug('❌ Falha ao importar config.js: ' + (err.message || err) +
    '<br><small>Está na mesma pasta? Servindo via http://?</small>', 'erro');
  throw err;
}

const { db, TABELA, SESSION_KEY, fmtSaldo, esc } = cfg;
console.log('[BI] config.js OK. TABELA =', TABELA);

// ============================================================
// 🔐 SESSÃO (com fallback)
// ============================================================
function detectarLogin() {
  const chaves = [SESSION_KEY, 'usuario_logado', 'usuarioLogado', 'usuario', 'user', 'login', 'email'];
  for (const k of chaves) {
    const raw = localStorage.getItem(k);
    if (!raw) continue;
    try {
      const obj = JSON.parse(raw);
      if (typeof obj === 'string' && obj.trim()) return obj.trim();
      if (obj && typeof obj === 'object') {
        const c = obj.login || obj.usuario || obj.email || obj.user || obj.nome;
        if (c && String(c).trim()) return String(c).trim();
      }
    } catch {
      if (raw.trim()) return raw.trim();
    }
  }
  return null;
}

const login = detectarLogin();
if (!login) {
  window.__biDebug('❌ Nenhuma sessão. Chaves: <code>' +
    (Object.keys(localStorage).join(', ') || '(vazio)') + '</code>', 'erro');
  throw new Error('Sem sessão');
}
window.__biDebug('✅ Logado como <strong>' + esc(login) + '</strong>. Carregando...', 'ok');

// ============================================================
// 🎯 ESTADO
// ============================================================
let jogadores      = [];
let jogadorAtual   = 0;
let jogoIniciado   = false;
let canalRealtime  = null;
let todosUsuarios  = [];
let eu           = null;   // dados do jogador logado

const TABULEIRO_PADRAO = [
  { nome: "Início",               preco: 0,   tipo: "inicio"      },
  { nome: "Rua das Flores",       preco: 60,  tipo: "propriedade" },
  { nome: "Sorte ou Azar",        preco: 0,   tipo: "chance"      },
  { nome: "Avenida Brasil",       preco: 100, tipo: "propriedade" },
  { nome: "Serviço de Água",      preco: 150, tipo: "servico"     },
  { nome: "Estação Ferroviária",  preco: 200, tipo: "ferrovia"    },
  { nome: "Rua Azul",             preco: 140, tipo: "propriedade" },
  { nome: "Prisão / Visita",      preco: 0,   tipo: "especial"    },
  { nome: "Avenida Central",      preco: 220, tipo: "propriedade" },
  { nome: "Imposto de Renda",     preco: 100, tipo: "imposto"     },
  { nome: "Praça Nova",           preco: 400, tipo: "propriedade" },
  { nome: "Descanso",             preco: 0,   tipo: "descanso"    }
];
let tabuleiro = JSON.parse(JSON.stringify(TABULEIRO_PADRAO));

// ============================================================
// 🎨 TABULEIRO DOM
// ============================================================
function montarTabuleiroDOM() {
  document.getElementById('tabuleiro').innerHTML = tabuleiro.map((_, i) => `
    <div id="casa-${i}" class="casa"></div>
  `).join('');
}

// ============================================================
// 📥 CARREGAR USUÁRIOS
// ============================================================
async function carregarUsuarios() {
  const { data, error } = await db
    .from(TABELA)
    .select('login, nome, saldo')
    .not('login', 'is', null)
    .order('login', { ascending: true });

  if (error) {
    console.error('[BI] erro usuários:', error);
    return [];
  }
  todosUsuarios = data || [];
  eu = todosUsuarios.find(u => u.login === login) || null;
  console.log('[BI] usuários:', todosUsuarios.length, '| eu:', eu);
  return todosUsuarios;
}

// ============================================================
// 📥 CARREGAR JOGO
// ============================================================
async function carregarJogo() {
  const { data, error } = await db
    .from(TABELA)
    .select('fazendinha_dados')
    .eq('login', login)
    .maybeSingle();

  if (error) {
    console.error('[BI] erro carregar:', error);
    mostrarMsg('❌ Erro ao carregar.');
    return;
  }

  const jogo = data?.fazendinha_dados?.banco_imobiliario;
  if (jogo) {
    jogadores    = jogo.jogadores    || [];
    jogadorAtual = jogo.jogadorAtual || 0;
    jogoIniciado = jogo.jogoIniciado || false;
    tabuleiro    = jogo.tabuleiro    || JSON.parse(JSON.stringify(TABULEIRO_PADRAO));
  }

  await sincronizarSaldos();
  montarTabuleiroDOM();
  atualizarTela();
}

// ============================================================
// 🔄 SALDOS
// ============================================================
async function sincronizarSaldos() {
  if (jogadores.length === 0) return;
  const logins = jogadores.map(j => j.login);
  const { data } = await db.from(TABELA).select('login, nome, saldo').in('login', logins);
  if (!data) return;
  for (const jog of jogadores) {
    const u = data.find(d => d.login === jog.login);
    if (u) {
      jog.saldo = Number(u.saldo) || 0;
      jog.nome  = u.nome || jog.login;
    }
  }
}

// ============================================================
// 💾 SALVAR
// ============================================================
async function salvarJogo() {
  const { data: atual } = await db
    .from(TABELA).select('fazendinha_dados').eq('login', login).maybeSingle();
  const fazendinha = atual?.fazendinha_dados || {};

  const { error } = await db.from(TABELA).update({
    fazendinha_dados: {
      ...fazendinha,
      banco_imobiliario: {
        jogadores, jogadorAtual, jogoIniciado, tabuleiro,
        atualizado_em: new Date().toISOString()
      }
    },
    updated_at: new Date().toISOString()
  }).eq('login', login);

  if (error) console.error('[BI] erro salvar:', error);
}

// ============================================================
// 💸 SALDO REAL — corrigido, 1 query só
// ============================================================
async function atualizarSaldoReal(loginJogador, deltaS) {
  if (!loginJogador || deltaS === 0) return;

  const { data } = await db
    .from(TABELA)
    .select('saldo')
    .eq('login', loginJogador)
    .maybeSingle();

  const saldoAtual = Number(data?.saldo) || 0;
  const novoSaldo  = Math.max(0, saldoAtual + deltaS);

  const { error } = await db.from(TABELA).update({
    saldo: novoSaldo,
    updated_at: new Date().toISOString()
  }).eq('login', loginJogador);

  if (error) {
    console.error('[BI] erro saldo:', error);
    return;
  }

  const jog = jogadores.find(j => j.login === loginJogador);
  if (jog) jog.saldo = novoSaldo;
}

// ============================================================
// 🏆 CODEX
// ============================================================
async function registrarPropriedadeNoCodex(casa, loginDono) {
  const { data: atual } = await db.from(TABELA).select('itens').eq('login', loginDono).maybeSingle();
  const itens = Array.isArray(atual?.itens) ? atual.itens : [];
  const idItem = `bi_${casa.nome.toLowerCase().replace(/\s+/g, '_')}`;
  if (itens.some(i => i.id_item === idItem)) return;

  const raridade = casa.preco >= 400 ? 'lendario' : casa.preco >= 200 ? 'epico' : 'raro';
  itens.push({
    id_item: idItem, nome: casa.nome, tipo_peca: 'Propriedade',
    raridade, tier: Math.min(20, Math.max(1, Math.floor(casa.preco / 20))),
    bonus: { atk: Math.floor(casa.preco / 20), def: Math.floor(casa.preco / 30), hp: casa.preco },
    origem: 'banco_imobiliario', registrado_em: new Date().toISOString()
  });

  await db.from(TABELA).update({ itens, updated_at: new Date().toISOString() }).eq('login', loginDono);
}

// ============================================================
// 🚀 AUTO-ADICIONA VOCÊ AO ABRIR
// ============================================================
function adicionarEuAutomaticamente() {
  if (!eu) return;
  if (jogadores.some(j => j.login === eu.login)) return;

  jogadores.push({
    login: eu.login,
    nome: eu.nome || eu.login,
    saldo: Number(eu.saldo) || 0,
    posicao: 0,
    propriedades: []
  });
  console.log('[BI] você foi auto-adicionado');
}

// ============================================================
// 🎮 CONVIDAR JOGADOR
// ============================================================
window.convidarJogador = async function () {
  if (jogoIniciado) { alert('Jogo já iniciado!'); return; }
  if (todosUsuarios.length === 0) await carregarUsuarios();

  const disponiveis = todosUsuarios.filter(u => !jogadores.some(j => j.login === u.login));
  if (disponiveis.length === 0) { alert('Todos já foram convidados!'); return; }

  const lista = disponiveis.map((u, i) =>
    `${i + 1}. ${u.nome || u.login} (${u.login}) — ${fmtSaldo(u.saldo)}`).join('\n');

  const escolha = prompt(`Escolha:\n\n${lista}\n\nNúmero:`);
  const idx = parseInt(escolha, 10) - 1;
  if (isNaN(idx) || idx < 0 || idx >= disponiveis.length) return;

  const u = disponiveis[idx];
  jogadores.push({
    login: u.login, nome: u.nome || u.login,
    saldo: Number(u.saldo) || 0, posicao: 0, propriedades: []
  });

  await salvarJogo();
  atualizarTela();
  mostrarMsg(`✅ ${u.nome || u.login} entrou!`);
};

// ============================================================
// ▶️ INICIAR — modo solo permitido
// ============================================================
window.iniciarJogo = async function () {
  // ✅ CORRIGIDO: agora checa corretamente
  adicionarEuAutomaticamente();

  if (jogadores.length < 1) {
    alert('Nenhum jogador! Recarregue a página.');
    return;
  }
  if (jogadores.some(j => (j.saldo ?? 0) <= 0)) {
    alert('Um ou mais jogadores estão com saldo zerado!');
    return;
  }

  await sincronizarSaldos();

  jogoIniciado = true;
  jogadorAtual = 0;
  tabuleiro    = JSON.parse(JSON.stringify(TABULEIRO_PADRAO));

  await salvarJogo();
  atualizarTela();
  mostrarMsg(`🎮 Jogo iniciado! Vez de ${jogadores[0].nome}!`);
};

// ============================================================
// 🔄 REINICIAR
// ============================================================
window.reiniciarJogo = async function () {
  if (!confirm('Reiniciar o jogo? (saldos reais NÃO serão afetados)')) return;

  const { data: atual } = await db.from(TABELA).select('fazendinha_dados').eq('login', login).maybeSingle();
  const fazendinha = atual?.fazendinha_dados || {};
  delete fazendinha.banco_imobiliario;

  await db.from(TABELA).update({
    fazendinha_dados: fazendinha,
    updated_at: new Date().toISOString()
  }).eq('login', login);

  jogadores = []; jogadorAtual = 0; jogoIniciado = false;
  tabuleiro = JSON.parse(JSON.stringify(TABULEIRO_PADRAO));

  adicionarEuAutomaticamente();
  montarTabuleiroDOM();
  atualizarTela();
  mostrarMsg('Jogo reiniciado!');
};

// ============================================================
// 🎲 JOGAR
// ============================================================
window.jogarDados = async function () {
  if (!jogoIniciado || jogadores.length === 0) return;

  const d1 = Math.floor(Math.random() * 6) + 1;
  const d2 = Math.floor(Math.random() * 6) + 1;
  const total = d1 + d2;

  document.getElementById('resultado-dados').innerHTML =
    `🎲 ${d1} + ${d2} = <strong>${total}</strong>`;

  await moverJogador(total);
};

async function moverJogador(passos) {
  const jog = jogadores[jogadorAtual];
  const passouPartida = jog.posicao + passos >= tabuleiro.length;

  jog.posicao = (jog.posicao + passos) % tabuleiro.length;

  if (passouPartida) {
    await atualizarSaldoReal(jog.login, +200);
    mostrarMsg('🎉 Passou pela partida! +S$200');
  }

  await processarCasa(jog.posicao);

  // ✅ Falência só se não tiver propriedades
  if (jog.saldo <= 0 && jog.propriedades.length === 0) {
    setTimeout(async () => {
      alert(`💔 ${jog.nome} faliu! Fim de jogo.`);
      await window.reiniciarJogo();
    }, 800);
    return;
  }
  if (jog.saldo <= 0) {
    mostrarMsg(`⚠️ ${jog.nome} está sem saldo!`);
  }

  // Próximo turno
  jogadorAtual = (jogadorAtual + 1) % jogadores.length;
  await salvarJogo();
  atualizarTela();
  setTimeout(() => mostrarMsg(`⏭️ Vez de ${jogadores[jogadorAtual].nome}`), 1200);
}

// ============================================================
// 🏠 CASA
// ============================================================
async function processarCasa(pos) {
  const casa = tabuleiro[pos];
  const jog  = jogadores[jogadorAtual];

  switch (casa.tipo) {
    case 'imposto':
      await atualizarSaldoReal(jog.login, -casa.preco);
      mostrarMsg(`💸 Pagou S$${casa.preco} de imposto!`);
      break;

    case 'chance': {
      if (Math.random() > 0.5) {
        await atualizarSaldoReal(jog.login, +100);
        mostrarMsg('🍀 Sorte! +S$100!');
      } else {
        await atualizarSaldoReal(jog.login, -50);
        mostrarMsg('😬 Azar! -S$50!');
      }
      break;
    }

    case 'propriedade':
    case 'servico':
    case 'ferrovia':
      if (!casa.dono) {
        mostrarMsg(`🏠 ${casa.nome} à venda por ${fmtSaldo(casa.preco)}`);
      } else if (casa.dono !== jog.login) {
        const taxa = casa.tipo === 'propriedade' ? 0.3 : 0.25;
        const aluguel = Math.floor(casa.preco * taxa);
        await atualizarSaldoReal(jog.login, -aluguel);
        await atualizarSaldoReal(casa.dono, +aluguel);
        const dono = jogadores.find(j => j.login === casa.dono);
        mostrarMsg(`💵 Aluguel ${fmtSaldo(aluguel)} → ${dono?.nome || casa.dono}`);
      } else {
        mostrarMsg(`🏠 Você já é dono de ${casa.nome}`);
      }
      break;

    case 'inicio':   mostrarMsg('💰 Início.'); break;
    case 'descanso': mostrarMsg('✌️ Descanso.'); break;
    case 'especial': mostrarMsg('🚔 Prisão / Visita.'); break;
  }
}

// ============================================================
// 🏠 COMPRAR
// ============================================================
window.comprar = async function () {
  if (!jogoIniciado) return;

  const jog  = jogadores[jogadorAtual];
  const casa = tabuleiro[jog.posicao];

  if (!['propriedade', 'servico', 'ferrovia'].includes(casa.tipo)) {
    mostrarMsg('❌ Aqui não dá pra comprar!');
    return;
  }
  if (casa.dono) { mostrarMsg('❌ Já tem dono!'); return; }
  if (jog.saldo < casa.preco) { mostrarMsg('❌ Sem saldo!'); return; }

  await atualizarSaldoReal(jog.login, -casa.preco);
  casa.dono = jog.login;
  jog.propriedades.push(casa.nome);

  if (casa.tipo === 'propriedade') await registrarPropriedadeNoCodex(casa, jog.login);

  await salvarJogo();
  atualizarTela();
  mostrarMsg(`✅ Comprou ${casa.nome} por ${fmtSaldo(casa.preco)}!`);
};

// ============================================================
// 💬 MSG
// ============================================================
function mostrarMsg(texto) {
  document.getElementById('mensagem').innerHTML = `<p>${esc(texto)}</p>`;
}

// ============================================================
// 🖼️ TELA
// ============================================================
function atualizarTela() {
  const lista = document.getElementById('lista-jogadores');

  if (jogadores.length === 0) {
    lista.innerHTML = '<em style="opacity:0.6">Nenhum jogador. Recarregue.</em>';
  } else {
    lista.innerHTML = jogadores.map((j, i) => `
      <div class="jogador-card ${i === jogadorAtual && jogoIniciado ? 'vez' : ''}">
        <span>
          <strong>${esc(j.nome)}</strong>
          <small style="opacity:0.7">(@${esc(j.login)})</small>
          ${j.login === login ? '<span class="badge-dono">VOCÊ</span>' : ''}
        </span>
        <span>
          💰 ${fmtSaldo(j.saldo)} |
          📍 ${esc(tabuleiro[j.posicao]?.nome || '—')}
          ${j.propriedades.length ? ` | 🏠 ${j.propriedades.length}` : ''}
          ${!jogoIniciado && j.login !== login ? `<button class="perigo" onclick="removerJogador(${i})">✖</button>` : ''}
        </span>
      </div>
    `).join('');
  }

  if (jogoIniciado && jogadores.length > 0) {
    const jog = jogadores[jogadorAtual];
    document.getElementById('dados-jogador').innerHTML =
      `<strong>Vez de: ${esc(jog.nome)}</strong> | Saldo: ${fmtSaldo(jog.saldo)}`;
  } else {
    document.getElementById('dados-jogador').innerHTML =
      jogadores.length === 0
        ? 'Aguardando...'
        : `${jogadores.length} jogador(es). Clique em "Iniciar Jogo".`;
  }

  document.getElementById('btn-convidar').disabled = jogoIniciado;
  // ✅ Iniciar só precisa de 1+ jogador agora
  document.getElementById('btn-iniciar').disabled  = jogoIniciado || jogadores.length < 1;
  document.getElementById('btn-dados').disabled    = !jogoIniciado;
  document.getElementById('btn-comprar').disabled  = !jogoIniciado;

  const tipos = {
    propriedade: '#FFE4B5', inicio: '#90EE90', chance: '#87CEEB',
    servico: '#DDA0DD', ferrovia: '#D3D3D3', especial: '#CD853F',
    imposto: '#FF6347', descanso: '#98FB98'
  };

  for (let i = 0; i < tabuleiro.length; i++) {
    const el = document.getElementById(`casa-${i}`);
    if (!el) continue;
    const casa = tabuleiro[i];
    const aqui = jogadores.filter(j => j.posicao === i);

    let html = esc(casa.nome);
    if (casa.preco > 0) html += `<br>💰 ${fmtSaldo(casa.preco)}`;

    if (aqui.length > 0) {
      html += `<br>👤 ${aqui.map(j => esc(j.nome.charAt(0))).join(', ')}`;
      el.classList.add('ocupada');
    } else el.classList.remove('ocupada');

    if (casa.dono) {
      const dono = jogadores.find(j => j.login === casa.dono);
      html += `<br>🏠 ${esc(dono?.nome || casa.dono)}`;
      el.style.backgroundColor = '#90EE90';
      el.style.color = '#000';
    } else {
      el.style.backgroundColor = tipos[casa.tipo] || '#fff';
      el.style.color = '#333';
    }
    el.innerHTML = html;
  }
}

// ============================================================
// ❌ REMOVER
// ============================================================
window.removerJogador = async function (idx) {
  if (jogoIniciado) return;
  if (jogadores[idx]?.login === login) {
    alert('Você não pode se remover.');
    return;
  }
  if (!confirm(`Remover ${jogadores[idx].nome}?`)) return;
  jogadores.splice(idx, 1);
  await salvarJogo();
  atualizarTela();
};

// ============================================================
// 🔄 REALTIME
// ============================================================
function ativarRealtime() {
  canalRealtime = db
    .channel('bi-' + login)
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: TABELA, filter: `login=eq.${login}` },
      (payload) => {
        const jogo = payload.new?.fazendinha_dados?.banco_imobiliario;
        if (!jogo) return;
        jogadores    = jogo.jogadores    || [];
        jogadorAtual = jogo.jogadorAtual || 0;
        jogoIniciado = jogo.jogoIniciado || false;
        if (jogo.tabuleiro) tabuleiro = jogo.tabuleiro;
        atualizarTela();
      })
    .subscribe((status) => {
      const dot = document.getElementById('status-realtime');
      dot.classList.remove('on', 'off');
      if (status === 'SUBSCRIBED') dot.classList.add('on');
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') dot.classList.add('off');
    });
}

// ============================================================
// 🚀 INIT
// ============================================================
(async function init() {
  try {
    await carregarUsuarios();

    // Garante que "eu" está na lista antes de carregar o jogo
    if (!eu) {
      window.__biDebug('❌ Seu login <code>' + esc(login) +
        '</code> não foi achado na tabela <code>Geral</code>.', 'erro');
      return;
    }

    await carregarJogo();

    // ✅ Auto-adiciona você se ainda não estiver
    adicionarEuAutomaticamente();
    await salvarJogo();
    atualizarTela();

    ativarRealtime();

    window.__biDebug(
      `✅ Pronto, <strong>${esc(eu.nome || login)}</strong>! ` +
      `${jogadores.length} jogador(es). Clique em "Iniciar Jogo".`,
      'ok'
    );
    setTimeout(() => {
      const a = document.getElementById('aviso-login');
      if (a) a.style.display = 'none';
    }, 4000);

  } catch (err) {
    console.error('[BI] init:', err);
    window.__biDebug('❌ Init: ' + (err.message || err), 'erro');
  }

  window.addEventListener('beforeunload', () => {
    if (canalRealtime) db.removeChannel(canalRealtime);
  });
})();
</script>
