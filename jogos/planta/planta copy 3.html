<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌽 Milharal – Sistema Completo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0a0b10;
            --card-bg: #121520;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-green: #00ff66;
            --neon-pink: #ff00aa;
            --text-color: #f0f4f8;
            --text-muted: #8a99ad;
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --gold: #f9a825;
            --gold-dark: #f57f17;
            --soil: #8d6e63;
            --soil-light: #a1887f;
            --water-blue: #42a5f5;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
        }

        .card {
            background: var(--card-bg);
            max-width: 900px;
            width: 100%;
            padding: 1.6rem 1.4rem 1.4rem;
            border-radius: var(--radius);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: var(--shadow-glow), 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: transform var(--transition);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 21, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.08);
            padding: 4px 14px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            cursor: default;
        }
        .user-profile:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .user-avatar {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .user-info { display: flex; flex-direction: column; line-height: 1.2; }
        .user-nick {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .user-balance {
            font-size: 0.7rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-balance::before { content: "💰"; font-size: 0.6rem; }

        .btn-voltar {
            background: linear-gradient(135deg, var(--neon-purple), #8b5cf6);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid rgba(0, 240, 255, 0.08);
            margin-bottom: 16px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
        }
        .status-item .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .status-item .dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }
        .status-item .dot.offline {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
        }
        .status-item .dot.checking {
            background: #f59e0b;
            animation: pulse-dot 1s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .status-item .value { font-weight: 600; color: var(--text-color); }
        .status-item .value.online { color: var(--neon-green); }
        .status-item .value.offline { color: #ef4444; }
        .status-item .value.checking { color: #f59e0b; }

        .status-reconnect {
            background: none;
            border: none;
            color: #8a99ad;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.7rem;
        }
        .status-reconnect:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }

        .level-system-container {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            margin: 0 0 12px 0;
        }
        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .level-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
        }
        .level-badge .level-number {
            font-size: 2rem;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            line-height: 1;
            background: rgba(0, 0, 0, 0.3);
            padding: 0 6px;
            border-radius: 8px;
        }
        .level-badge .level-label {
            font-size: 0.6rem;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .level-badge .level-title {
            font-size: 0.8rem;
            color: #f0f4f8;
            font-weight: 600;
            margin-top: 2px;
        }
        .exp-container { flex: 1; min-width: 120px; }
        .exp-bar {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .exp-bar .exp-fill {
            height: 100%;
            background: linear-gradient(90deg, #7000ff, #00f0ff);
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            width: 0%;
        }
        .exp-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #8a99ad;
            margin-top: 2px;
            font-weight: 600;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #c8d0e0;
            border: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
            justify-content: center;
        }
        .stat-pill .stat-value { color: #fff; font-weight: 700; margin-left: 2px; }
        .stat-pill .stat-value.hp { color: #ef4444; }
        .stat-pill .stat-value.mp { color: #3b82f6; }
        .stat-pill .stat-value.sm { color: #f59e0b; }

        .game-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        .game-section {
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius);
            padding: 0.8rem;
            border: 1px solid rgba(0, 240, 255, 0.05);
        }
        .game-section-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            margin-bottom: 0.5rem;
            padding: 0 0.2rem;
        }
        .field {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 0.8rem;
            aspect-ratio: 1 / 1;
        }
        .plot {
            background: var(--soil);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            min-height: 60px;
            user-select: none;
            border: 2px solid rgba(0, 240, 255, 0.1);
        }
        .plot:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15), inset 0 -4px 0 rgba(0, 0, 0, 0.3);
            z-index: 2;
            border-color: var(--neon-blue);
        }
        .plot:active { transform: scale(0.94); }
        .plot.empty { background: var(--soil); border-color: rgba(0, 240, 255, 0.05); }
        .plot.harvested {
            background: var(--soil-light);
            border-color: rgba(255, 77, 77, 0.2);
        }
        .plot.harvested:hover { background: #bcaaa4; border-color: #ff4d4d; }
        .plot:not(.empty):not(.harvested) {
            background: #6d8f6d;
            border-color: rgba(0, 255, 102, 0.2);
        }
        .plot .stage-label {
            position: absolute;
            bottom: 2px;
            font-size: 0.45rem;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-muted);
            padding: 0 4px;
            border-radius: 8px;
            letter-spacing: 0.3px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            opacity: 0.7;
            pointer-events: none;
            font-weight: 600;
        }
        .plot .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: var(--neon-blue);
            border-radius: 0 0 12px 12px;
            transition: width 0.4s ease;
            width: 0%;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .plot .progress-bar.done {
            background: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
        }
        .plot .plant-emoji {
            line-height: 1;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        .plot.growing .plant-emoji { animation: sway 2.5s ease-in-out infinite; }
        .plot.mature .plant-emoji { animation: glow-neon 1.2s ease-in-out infinite alternate; }
        .plot.sprout .plant-emoji { animation: pop 1s ease-out; }
        .plot.seed .plant-emoji { animation: pulse 1.6s ease-in-out infinite; }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(3deg) scale(1.02); }
        }
        @keyframes glow-neon {
            0% { filter: drop-shadow(0 0 2px var(--neon-green)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 20px var(--neon-green)); transform: scale(1.06); }
        }
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.92); }
        }

        .milharal-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin-bottom: 0.6rem;
        }
        .milharal-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-color);
            padding: 0.05rem 0.4rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
        }
        .milharal-stats .stat-item i { font-size: 0.8rem; color: var(--neon-blue); }
        .milharal-stats .stat-item .num {
            background: rgba(0, 0, 0, 0.4);
            padding: 0 0.3rem;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #fff;
        }

        .milharal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.5rem;
        }
        .saldo-display {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(112, 0, 255, 0.15);
            border: 1px solid var(--neon-purple);
            padding: 0.1rem 0.6rem 0.1rem 0.4rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.2);
        }
        .saldo-display i { font-size: 0.9rem; color: var(--neon-purple); }
        .saldo-display .num { color: #fff; }
        .stock-display {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(255, 214, 0, 0.15);
            border: 1px solid #ffd600;
            padding: 0.1rem 0.6rem 0.1rem 0.4rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            color: #ffd600;
            box-shadow: 0 0 20px rgba(255, 214, 0, 0.15);
        }
        .stock-display i { font-size: 0.9rem; color: #ffd600; }
        .stock-display .num { color: #fff; }

        .milharal-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }
        .milharal-actions .btn {
            padding: 0.3rem 0.8rem;
            font-size: 0.7rem;
            border-radius: 40px;
            font-weight: 700;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            color: #fff;
            flex: 1 1 auto;
            justify-content: center;
        }
        .milharal-actions .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .milharal-actions .btn:active:not(:disabled) { transform: scale(0.94) !important; }
        .milharal-actions .btn-primary { background: linear-gradient(135deg, #00c853, #00e676); color: #000; }
        .milharal-actions .btn-secondary { background: linear-gradient(135deg, #0288d1, #03a9f4); color: #fff; }
        .milharal-actions .btn-gold { background: linear-gradient(135deg, #f9a825, #ffd600); color: #000; }
        .milharal-actions .btn-success { background: linear-gradient(135deg, #10b981, #34d399); color: #fff; }
        .milharal-actions .btn-clear { background: linear-gradient(135deg, #e53935, #b71c1c); color: #fff; }

        .milharal-message {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 0.3rem 0.6rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            border: 1px solid rgba(0, 240, 255, 0.05);
            flex-wrap: wrap;
        }
        .milharal-message .highlight { color: var(--neon-green); font-weight: 700; }
        .milharal-message .exp-highlight { color: #8b5cf6; font-weight: 700; }

        @media (max-width: 820px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .milharal-actions .btn {
                flex: 1 1 45%;
                font-size: 0.65rem;
                padding: 0.25rem 0.5rem;
            }
        }
        @media (max-width: 520px) {
            .card { padding: 0.8rem 0.6rem; }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
                padding: 8px 12px;
            }
            .field { gap: 4px; }
            .plot { font-size: 1.4rem; min-height: 44px; border-radius: 8px; }
            .plot .stage-label { font-size: 0.35rem; bottom: 1px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .level-badge .level-number { font-size: 1.5rem; }
            .milharal-actions .btn {
                flex: 1 1 100%;
                font-size: 0.6rem;
                padding: 0.2rem 0.4rem;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <nav class="nav-bar">
            <div class="user-profile" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-nick" id="userName">Visitante</span>
                    <span class="user-balance" id="userBalanceDisplay">💰 R$ 0,00</span>
                </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>
            </div>

            <div class="status-bar" id="statusBar">
                <div class="status-item">
                    <span class="dot checking" id="supabaseDot"></span>
                    <span class="label">Supabase:</span>
                    <span class="value checking" id="supabaseStatus">Verificando...</span>
                    <button class="status-reconnect" id="btnReconnectSupabase" title="Reconectar">🔄</button>
                </div>
                <div class="status-item" style="margin-left:auto;">
                    <span>💰 R$ <span id="headerSaldo">0,00</span></span>
                </div>
            </div>
        </nav>

        <div class="level-system-container" id="levelSystem">
            <div class="level-header">
                <div class="level-badge">
                    <span class="level-number" id="levelNumber">1</span>
                    <div>
                        <div class="level-label">NÍVEL</div>
                        <div class="level-title" id="levelTitle">🌱 Iniciante</div>
                    </div>
                </div>
                <div class="exp-container">
                    <div class="exp-bar">
                        <div class="exp-fill" id="expFill" style="width: 0%;"></div>
                    </div>
                    <div class="exp-text">
                        <span class="exp-current" id="expCurrent">0</span>
                        <span>/ <span class="exp-next" id="expNext">100</span> EXP</span>
                    </div>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid">
                <span class="stat-pill">❤️ HP <span class="stat-value hp" id="statHp">100/100</span></span>
                <span class="stat-pill">💧 MP <span class="stat-value mp" id="statMp">50/50</span></span>
                <span class="stat-pill">⚡ SM <span class="stat-value sm" id="statSm">100/100</span></span>
                <span class="stat-pill">⚔️ ATK <span class="stat-value" id="statAtk">15</span></span>
                <span class="stat-pill">🛡️ DEF <span class="stat-value" id="statDef">10</span></span>
                <span class="stat-pill">🔮 MAG <span class="stat-value" id="statMag">8</span></span>
            </div>
        </div>

        <div class="game-container">
            <div class="game-section">
                <div class="game-section-title">
                    <i class="fas fa-seedling" style="color:var(--neon-green);"></i>
                    Milharal
                </div>

                <div class="milharal-header">
                    <div class="milharal-stats">
                        <span class="stat-item"><i class="fas fa-seedling"></i><span class="num" id="seedCount">🌰 0</span></span>
                        <span class="stat-item"><i class="fas fa-trowel"></i><span class="num" id="plantedCount">🌱 0</span></span>
                        <span class="stat-item"><i class="fas fa-corn"></i><span class="num" id="harvestCount">🌽 0</span></span>
                        <span class="stat-item"><i class="fas fa-water" style="color:var(--water-blue);"></i><span class="num" id="bucketCount">🪣 0</span></span>
                        <span class="stat-item"><i class="fas fa-star" style="color:#8b5cf6;"></i><span class="num" id="expDisplay">✨ 0</span></span>
                    </div>
                    <div style="display:flex;gap:0.3rem;flex-wrap:wrap;align-items:center;">
                        <span class="stock-display" id="stockDisplay">
                            <i class="fas fa-warehouse"></i>
                            <span class="num" id="stockDisplayValue">🌽 0</span>
                        </span>
                        <span class="saldo-display" id="saldoDisplay">
                            <i class="fas fa-coins"></i>
                            <span class="num" id="saldoDisplayValue">R$ 0,00</span>
                        </span>
                    </div>
                </div>

                <div class="field" id="field"></div>

                <div class="milharal-actions">
                    <button class="btn btn-primary" id="btnPlantAll">🌱 Plantar tudo</button>
                    <button class="btn btn-secondary" id="btnWaterAll">💧 Regar tudo <span class="bucket-icon" id="bucketStatus">🪣 0</span></button>
                    <button class="btn btn-gold" id="btnHarvestAll">🌽 Colher tudo</button>
                    <button class="btn btn-success" id="btnSellAll">💰 Vender estoque</button>
                    <button class="btn btn-clear" id="btnClearAll">🧹 Limpar tudo</button>
                </div>

                <div class="milharal-message" id="message">
                    <i class="fas fa-hand-pointer"></i>
                    Clique em um <span class="highlight">canteiro vazio</span> para plantar.
                    <span class="exp-highlight">✨ Colher dá EXP!</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÕES
            // ============================================================
            const CONFIG = {
                SUPABASE_URL: 'https://xrcxvizzdumcxbylmkvn.supabase.co',
                SUPABASE_KEY: 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD',
                TABELA: 'Geral',
                COLS: 4,
                ROWS: 4,
                TOTAL: 16,
                GROWTH_INTERVAL: 1200,
                WATER_BOOST: 30,
                BASE_GROWTH: 8,
                INITIAL_SEEDS: 5,
                INITIAL_SALDO: 10.00,
                INITIAL_BUCKETS: 0,
                INITIAL_STOCK: 0,
                CLEAR_COST: 5.00,
                AUTO_SAVE_INTERVAL: 30000,
                SYNC_INTERVAL: 5000,
                EXP_PER_HARVEST: 15,
                SEEDS_PER_HARVEST: 1,
                INITIAL_HP: 100,
                INITIAL_MP: 50,
                INITIAL_SM: 100,
                INITIAL_ATK: 15,
                INITIAL_DEF: 10,
                INITIAL_MAG: 8,
                MAX_HP: 100,
                MAX_MP: 50,
                MAX_SM: 100,
                SELL_PRICE_CORN: 10,
            };

            // ============================================================
            // ESTÁGIOS DO MILHO
            // ============================================================
            const STAGES = {
                EMPTY: 'empty',
                SEED: 'seed',
                SPROUT: 'sprout',
                SEEDLING: 'seedling',
                GROWING: 'growing',
                MATURE: 'mature',
                HARVESTED: 'harvested'
            };
            const STAGE_META = {
                [STAGES.EMPTY]: { emoji: '', label: 'vazio' },
                [STAGES.SEED]: { emoji: '🌰', label: 'semente' },
                [STAGES.SPROUT]: { emoji: '🌱', label: 'brotando' },
                [STAGES.SEEDLING]: { emoji: '🌿', label: 'muda' },
                [STAGES.GROWING]: { emoji: '🌾', label: 'crescendo' },
                [STAGES.MATURE]: { emoji: '🌽', label: 'maduro!' },
                [STAGES.HARVESTED]: { emoji: '🟫', label: 'colhido' }
            };
            const STAGE_ORDER = [
                STAGES.EMPTY, STAGES.SEED, STAGES.SPROUT,
                STAGES.SEEDLING, STAGES.GROWING, STAGES.MATURE, STAGES.HARVESTED
            ];

            // ============================================================
            // ESTADO GLOBAL
            // ============================================================
            const state = {
                online: false,
                usuario: null,
                salvando: false,
                toastTimer: null,
                growthTimer: null,
                syncTimer: null,
                dadosDB: null,

                jogo: {
                    seeds: CONFIG.INITIAL_SEEDS,
                    planted: 0,
                    harvested: 0,
                    saldo: CONFIG.INITIAL_SALDO,
                    buckets: CONFIG.INITIAL_BUCKETS,
                    stock: CONFIG.INITIAL_STOCK,
                    plots: [],

                    nivel: 1,
                    experiencia: 0,
                    hpMax: CONFIG.MAX_HP,
                    mpMax: CONFIG.MAX_MP,
                    smMax: CONFIG.MAX_SM,
                    hp: CONFIG.INITIAL_HP,
                    mp: CONFIG.INITIAL_MP,
                    sm: CONFIG.INITIAL_SM,
                    ataqueBase: CONFIG.INITIAL_ATK,
                    defesaBase: CONFIG.INITIAL_DEF,
                    magiaBase: CONFIG.INITIAL_MAG,
                }
            };

            function getJogo() { return state.jogo; }
            function getPlots() { return state.jogo.plots; }

            // ============================================================
            // DOM REFS            // ============================================================
            const DOM = {};

            function initDOM() {
                DOM.field = document.getElementById('field');
                DOM.seedCount = document.getElementById('seedCount');
                DOM.plantedCount = document.getElementById('plantedCount');
                DOM.harvestCount = document.getElementById('harvestCount');
                DOM.bucketCount = document.getElementById('bucketCount');
                DOM.expDisplay = document.getElementById('expDisplay');
                DOM.saldoDisplay = document.getElementById('saldoDisplayValue');
                DOM.stockDisplay = document.getElementById('stockDisplayValue');
                DOM.bucketStatus = document.getElementById('bucketStatus');
                DOM.message = document.getElementById('message');
                DOM.headerSaldo = document.getElementById('headerSaldo');
                DOM.userAvatar = document.getElementById('userAvatar');
                DOM.userName = document.getElementById('userName');
                DOM.userBalance = document.getElementById('userBalanceDisplay');

                DOM.supabaseDot = document.getElementById('supabaseDot');
                DOM.supabaseStatus = document.getElementById('supabaseStatus');

                DOM.expFill = document.getElementById('expFill');
                DOM.expCurrent = document.getElementById('expCurrent');
                DOM.expNext = document.getElementById('expNext');
                DOM.levelNumber = document.getElementById('levelNumber');
                DOM.levelTitle = document.getElementById('levelTitle');
                DOM.statHp = document.getElementById('statHp');
                DOM.statMp = document.getElementById('statMp');
                DOM.statSm = document.getElementById('statSm');
                DOM.statAtk = document.getElementById('statAtk');
                DOM.statDef = document.getElementById('statDef');
                DOM.statMag = document.getElementById('statMag');

                DOM.btnPlantAll = document.getElementById('btnPlantAll');
                DOM.btnWaterAll = document.getElementById('btnWaterAll');
                DOM.btnHarvestAll = document.getElementById('btnHarvestAll');
                DOM.btnSellAll = document.getElementById('btnSellAll');
                DOM.btnClearAll = document.getElementById('btnClearAll');
                DOM.btnReconnectSupabase = document.getElementById('btnReconnectSupabase');
            }

            // ============================================================
            // AUXILIARES
            // ============================================================
            function formatSaldo(valor) {
                return Number(valor).toFixed(2).replace('.', ',');
            }

            function showToast(text, duration = 2200) {
                let toast = document.getElementById('_toast_dynamic');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = '_toast_dynamic';
                    toast.style.cssText = `
                        position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
                        background: rgba(10, 11, 16, 0.95); backdrop-filter: blur(8px); color: #fff;
                        padding: 0.5rem 1.4rem; border-radius: 60px; font-weight: 600; font-size: 0.8rem;
                        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.1);
                        opacity: 0; transition: all 0.45s ease; pointer-events: none; z-index: 999;
                        border: 1px solid rgba(0, 240, 255, 0.15); text-align: center;
                    `;
                    document.body.appendChild(toast);
                }
                if (state.toastTimer) { clearTimeout(state.toastTimer); toast.style.opacity = '0'; toast.style.transform = 'translateX(-50%) translateY(80px)'; }
                toast.textContent = text;
                requestAnimationFrame(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(-50%) translateY(0)';
                });
                state.toastTimer = setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(80px)';
                    state.toastTimer = null;
                }, duration);
            }

            function atualizarStatusSupabase(online, texto) {
                DOM.supabaseDot.className = 'dot ' + (online ? 'online' : 'offline');
                DOM.supabaseStatus.className = 'value ' + (online ? 'online' : 'offline');
                DOM.supabaseStatus.textContent = texto;
                state.online = online;
            }

            function atualizarSaldoGlobal() {
                const total = getJogo().saldo || 0;
                if (DOM.headerSaldo) DOM.headerSaldo.textContent = formatSaldo(total);
                if (DOM.userBalance) DOM.userBalance.textContent = `💰 R$ ${formatSaldo(total)}`;
                if (DOM.saldoDisplay) DOM.saldoDisplay.textContent = `R$ ${formatSaldo(getJogo().saldo || 0)}`;
            }

            function limparTimers() {
                if (state.growthTimer) { clearInterval(state.growthTimer); state.growthTimer = null; }
                if (state.syncTimer) { clearInterval(state.syncTimer); state.syncTimer = null; }
            }

            // ============================================================
            // LEVEL SYSTEM
            // ============================================================
            const levelSystem = {
                titulos: [
                    { min: 1, titulo: '🌱 Iniciante' },
                    { min: 5, titulo: '🌿 Aprendiz' },
                    { min: 10, titulo: '⚔️ Guerreiro' },
                    { min: 20, titulo: '🛡️ Mestre' },
                    { min: 35, titulo: '🏆 Lendário' },
                    { min: 50, titulo: '👑 Herói' },
                    { min: 75, titulo: '⚡ Deus da Guerra' },
                    { min: 100, titulo: '🌟 Imortal' },
                ],

                getAtaque() { return getJogo().ataqueBase + Math.floor(getJogo().nivel * 1.5); },
                getDefesa() { return getJogo().defesaBase + Math.floor(getJogo().nivel * 1.2); },
                getMagia()  { return getJogo().magiaBase  + Math.floor(getJogo().nivel * 1.0); },
                getHpMax()  { return getJogo().hpMax + Math.floor(getJogo().nivel * 6); },
                getMpMax()  { return getJogo().mpMax + Math.floor(getJogo().nivel * 4); },
                getSmMax()  { return getJogo().smMax + Math.floor(getJogo().nivel * 3); },

                getTitulo() {
                    const j = getJogo();
                    let titulo = this.titulos[0].titulo;
                    for (const t of this.titulos) {
                        if (j.nivel >= t.min) titulo = t.titulo;
                    }
                    return titulo;
                },
                getExpProximo() {
                    const j = getJogo();
                    return Math.floor(100 * Math.pow(1.2, j.nivel - 1));
                },

                adicionarExp(quantidade) {
                    const j = getJogo();
                    j.experiencia += quantidade;
                    let subiu = false;
                    while (j.experiencia >= this.getExpProximo()) {
                        j.experiencia -= this.getExpProximo();
                        j.nivel++;
                        subiu = true;
                        j.hp = this.getHpMax();
                        j.mp = this.getMpMax();
                        j.sm = this.getSmMax();
                        showToast(`🎉 SUBIU PARA NÍVEL ${j.nivel}!`, 3000);
                    }
                    this.atualizarUI();
                    if (!subiu && quantidade > 0) {
                        showToast(`✨ +${quantidade} EXP!`, 1500);
                    }
                    salvarDadosCompletos();
                },

                atualizarUI() {
                    const j = getJogo();
                    const expProx = this.getExpProximo();
                    const pct = j.experiencia / expProx * 100;

                    DOM.levelNumber.textContent = j.nivel;
                    DOM.levelTitle.textContent = this.getTitulo();
                    DOM.expFill.style.width = Math.min(pct, 100) + '%';
                    DOM.expCurrent.textContent = j.experiencia;
                    DOM.expNext.textContent = expProx;

                    DOM.statHp.textContent = `${j.hp}/${this.getHpMax()}`;
                    DOM.statMp.textContent = `${j.mp}/${this.getMpMax()}`;
                    DOM.statSm.textContent = `${j.sm}/${this.getSmMax()}`;
                    DOM.statAtk.textContent = this.getAtaque();
                    DOM.statDef.textContent = this.getDefesa();
                    DOM.statMag.textContent = this.getMagia();

                    DOM.expDisplay.textContent = `✨ ${j.experiencia}`;
                }
            };

            // ============================================================
            // MILHARAL
            // ============================================================
            function initPlots() {
                const j = getJogo();
                j.plots = [];
                for (let i = 0; i < CONFIG.TOTAL; i++) {
                    j.plots.push({
                        id: i,
                        stage: STAGES.EMPTY,
                        progress: 0,
                        row: Math.floor(i / CONFIG.COLS),
                        col: i % CONFIG.COLS,
                    });
                }
            }

            function sincronizarComBanco() {
                const db = state.dadosDB;
                if (!db) return;
                const j = getJogo();

                j.seeds       = db.seeds       ?? j.seeds;
                j.planted     = db.planted     ?? j.planted;
                j.harvested   = db.harvested   ?? j.harvested;
                j.buckets     = db.buckets     ?? j.buckets;
                j.stock       = db.stock       ?? j.stock;
                j.saldo       = Number(db.saldo ?? j.saldo);
                j.experiencia = db.experiencia ?? j.experiencia;
                j.nivel       = db.nivel       ?? j.nivel;
                j.hpMax       = db.hp_max      ?? j.hpMax;
                j.mpMax       = db.mp_max      ?? j.mpMax;
                j.smMax       = db.sm_max      ?? j.smMax;
                j.ataqueBase  = db.ataque_base ?? j.ataqueBase;
                j.defesaBase  = db.defesa_base ?? j.defesaBase;
                j.magiaBase   = db.magia_base  ?? j.magiaBase;
                j.hp          = db.hp_atual    ?? j.hp;
                j.mp          = db.mp_atual    ?? j.mp;
                j.sm          = db.sm_atual    ?? j.sm;

                if (Array.isArray(db.plot_data) && db.plot_data.length > 0) {
                    j.plots = db.plot_data.map((p, index) => ({
                        id: index,
                        stage: p.stage || STAGES.EMPTY,
                        progress: p.progress || 0,
                        row: Math.floor(index / CONFIG.COLS),
                        col: index % CONFIG.COLS,
                    }));
                }
            }

            function renderMilharal() {
                sincronizarComBanco();
                const j = getJogo();

                DOM.seedCount.textContent     = `🌰 ${j.seeds || 0}`;
                DOM.plantedCount.textContent  = `🌱 ${j.planted || 0}`;
                DOM.harvestCount.textContent  = `🌽 ${j.harvested || 0}`;
                DOM.bucketCount.textContent   = `🪣 ${j.buckets || 0}`;
                DOM.expDisplay.textContent    = `✨ ${j.experiencia || 0}`;
                DOM.saldoDisplay.textContent  = `R$ ${formatSaldo(j.saldo || 0)}`;
                DOM.stockDisplay.innerHTML    = `<i class="fas fa-warehouse"></i> <span class="num">🌽 ${j.stock || 0}</span>`;
                DOM.bucketStatus.textContent  = `🪣 ${j.buckets || 0}`;
                atualizarSaldoGlobal();

                let html = '';
                for (let i = 0; i < j.plots.length; i++) {
                    const p = j.plots[i];
                    const meta = STAGE_META[p.stage] || { emoji: '❓', label: '?' };
                    const isHarvested = p.stage === STAGES.HARVESTED;
                    const isEmpty = p.stage === STAGES.EMPTY;
                    const isMature = p.stage === STAGES.MATURE;

                    let classes = 'plot ' + p.stage;
                    if (isHarvested) classes += ' harvested';
                    if (isEmpty) classes += ' empty';
                    if (isMature) classes += ' mature';
                    if (p.stage === STAGES.SPROUT) classes += ' sprout';
                    if (p.stage === STAGES.SEED) classes += ' seed';
                    if (p.stage === STAGES.GROWING) classes += ' growing';

                    let progressBar = '';
                    if (!isEmpty && !isHarvested) {
                        const w = Math.min(p.progress || 0, 100);
                        progressBar = `<div class="progress-bar ${w >= 100 ? 'done' : ''}" style="width:${w}%"></div>`;
                    }

                    let emoji = meta.emoji;
                    if (isEmpty) emoji = '<span style="opacity:0.25;font-size:0.6em;">+</span>';
                    if (isHarvested) emoji = '🟫';

                    html += `
                        <div class="${classes}" data-id="${p.id}">
                            <span class="plant-emoji">${emoji}</span>
                            ${progressBar}
                            <span class="stage-label">${meta.label}</span>
                        </div>
                    `;
                }
                DOM.field.innerHTML = html;

                const emptyPlots = j.plots.filter(p => p.stage === STAGES.EMPTY).length;
                DOM.btnPlantAll.disabled = (j.seeds <= 0 || emptyPlots === 0);
                DOM.btnWaterAll.disabled = (j.buckets <= 0);
                const hasMature = j.plots.some(p => p.stage === STAGES.MATURE);
                DOM.btnHarvestAll.disabled = !hasMature;
                DOM.btnSellAll.disabled = (j.stock <= 0);
                updateMessage();
            }

            function updateMessage() {
                const j = getJogo();
                const plots = getPlots();
                const empty = plots.filter(p => p.stage === STAGES.EMPTY).length;
                const mature = plots.filter(p => p.stage === STAGES.MATURE).length;
                const harvested = plots.filter(p => p.stage === STAGES.HARVESTED).length;
                const growing = plots.some(p =>
                    p.stage !== STAGES.EMPTY &&
                    p.stage !== STAGES.HARVESTED &&
                    p.stage !== STAGES.MATURE
                );

                let msg = '';
                if (harvested > 0) {
                    msg = `🟫 ${harvested} colhido(s). Clique para limpar (R$ ${CONFIG.CLEAR_COST.toFixed(2)})`;
                } else if (j.seeds <= 0 && empty > 0) {
                    msg = '😅 <span class="highlight">Sem sementes!</span> Colha milho para conseguir mais.';
                } else if (mature > 0) {
                    msg = `🌽 <span class="highlight">${mature}</span> maduro(s)! Colher dá <span class="exp-highlight">✨ EXP</span> e 🌰 semente.`;
                } else if (growing) {
                    msg = j.buckets > 0 ?
                        '💧 <span class="highlight">Regue tudo</span> para acelerar o crescimento' :
                        '💧 Sem baldes!';
                } else if (empty > 0 && j.seeds > 0) {
                    msg = '🌱 Use o botão <span class="highlight">Plantar tudo</span> ou clique em um canteiro vazio para plantar.';
                } else if (empty === 0 && j.seeds > 0) {
                    msg = '🧑‍🌾 Terreno cheio! Espere crescer ou colha.';
                } else {
                    msg = '🌾 Acompanhe o crescimento do seu milharal!';
                }
                DOM.message.innerHTML = msg;
            }

            // ============================================================
            // CRESCIMENTO
            // ============================================================
            function growPlot(plot) {
                if (plot.stage === STAGES.EMPTY || plot.stage === STAGES.HARVESTED || plot.stage === STAGES.MATURE)
                    return false;
                plot.progress = Math.min((plot.progress || 0) + CONFIG.BASE_GROWTH, 100);
                if (plot.progress >= 100) {
                    const idx = STAGE_ORDER.indexOf(plot.stage);
                    if (idx + 1 < STAGE_ORDER.length) {
                        plot.stage = STAGE_ORDER[idx + 1];
                        plot.progress = 0;
                        if (plot.stage === STAGES.MATURE) showToast(`🌽 Milho maduro na parcela ${plot.id + 1}!`, 1800);
                        return true;
                    }
                }
                return false;
            }

            function autoGrow() {
                let any = false;
                const plots = getPlots();
                for (const p of plots) {
                    if (p.stage !== STAGES.EMPTY && p.stage !== STAGES.HARVESTED && p.stage !== STAGES.MATURE) {
                        if (growPlot(p)) any = true;
                    }
                }
                renderMilharal();
                if (any || plots.some(p => p.progress > 0)) {
                    salvarDadosCompletos();
                }
            }

            function startMilharal() {
                if (state.growthTimer) clearInterval(state.growthTimer);
                state.growthTimer = setInterval(autoGrow, CONFIG.GROWTH_INTERVAL);
            }

            // ============================================================
            // AÇÕES
            // ============================================================
            function plantAt(id) {
                const j = getJogo();
                const p = j.plots[id];
                if (!p || p.stage !== STAGES.EMPTY) return false;
                if (j.seeds <= 0) { showToast('😅 Sem sementes!', 1400); return false; }
                j.seeds--;
                p.stage = STAGES.SEED;
                p.progress = 0;
                j.planted++;
                showToast(`🌱 Plantou na parcela ${id + 1}!`, 1400);
                renderMilharal();
                salvarDadosCompletos();
                return true;
            }

            function plantAll() {
                const j = getJogo();
                const emptyPlots = j.plots.filter(p => p.stage === STAGES.EMPTY);

                if (emptyPlots.length === 0) {
                    showToast('⚠️ Todos os canteiros estão ocupados!', 1400);
                    return 0;
                }
                if (j.seeds <= 0) {
                    showToast('😅 Sem sementes para plantar!', 1400);
                    return 0;
                }

                let planted = 0;
                const toPlant = Math.min(j.seeds, emptyPlots.length);

                for (let i = 0; i < toPlant && planted < toPlant; i++) {
                    const p = emptyPlots[i];
                    if (p.stage === STAGES.EMPTY) {
                        j.seeds--;
                        p.stage = STAGES.SEED;
                        p.progress = 0;
                        j.planted++;
                        planted++;
                    }
                }

                showToast(`🌱 Plantou ${planted} canteiro(s)!`, 2000);
                renderMilharal();
                salvarDadosCompletos();
                return planted;
            }

            function clearPlot(id) {
                const j = getJogo();
                const p = j.plots[id];
                if (!p || p.stage !== STAGES.HARVESTED) return false;
                if (j.saldo < CONFIG.CLEAR_COST) {
                    showToast(`😅 Precisa de R$ ${CONFIG.CLEAR_COST.toFixed(2)}`, 1600);
                    return false;
                }
                j.saldo = (j.saldo || 0) - CONFIG.CLEAR_COST;
                p.stage = STAGES.EMPTY;
                p.progress = 0;
                showToast(`🟫 Canteiro ${id + 1} limpo! (-R$ ${CONFIG.CLEAR_COST.toFixed(2)})`, 1600);
                renderMilharal();
                salvarDadosCompletos();
                return true;
            }

            function waterAt(id) {
                const j = getJogo();
                const p = j.plots[id];
                if (!p || p.stage === STAGES.EMPTY || p.stage === STAGES.HARVESTED || p.stage === STAGES.MATURE) {
                    showToast('💧 Não há o que regar aqui.', 1200);
                    return false;
                }
                if (j.buckets <= 0) { showToast('😅 Sem baldes!', 1400); return false; }
                j.buckets--;
                p.progress = Math.min((p.progress || 0) + CONFIG.WATER_BOOST, 100);
                if (p.progress >= 100) {
                    const idx = STAGE_ORDER.indexOf(p.stage);
                    if (idx + 1 < STAGE_ORDER.length) {
                        p.stage = STAGE_ORDER[idx + 1];
                        p.progress = 0;
                        if (p.stage === STAGES.MATURE) showToast(`🌽 Amadureceu na parcela ${id + 1}!`, 1800);
                        else showToast(`💧 Avançou para ${STAGE_META[p.stage].label}!`, 1400);
                    } else p.progress = 100;
                } else {
                    showToast(`💧 Regado! Progresso: ${Math.round(p.progress)}%`, 1400);
                }
                renderMilharal();
                salvarDadosCompletos();
                return true;
            }

            // 🌽 Colher dá EXP + 1 semente + 1 milho no estoque
            function harvestAt(id) {
                const j = getJogo();
                const p = j.plots[id];
                if (!p || p.stage !== STAGES.MATURE) { showToast('🌽 Só colhe maduro!', 1200); return false; }
                p.stage = STAGES.HARVESTED;
                p.progress = 0;
                j.harvested++;
                j.stock++;
                j.seeds += CONFIG.SEEDS_PER_HARVEST;
                levelSystem.adicionarExp(CONFIG.EXP_PER_HARVEST);
                showToast(`🌽 Colheu 1 milho! ✨ +${CONFIG.EXP_PER_HARVEST} EXP  🌰 +${CONFIG.SEEDS_PER_HARVEST} semente`, 2200);
                renderMilharal();
                salvarDadosCompletos();
                return true;
            }

            // 🌽 Colher tudo dá EXP + N sementes + N milhos no estoque
            function harvestAll() {
                const j = getJogo();
                const maturePlots = j.plots.filter(p => p.stage === STAGES.MATURE);
                const count = maturePlots.length;
                if (count === 0) { showToast('🌽 Nenhum milho maduro para colher.', 1400); return 0; }
                for (const p of maturePlots) {
                    p.stage = STAGES.HARVESTED;
                    p.progress = 0;
                }
                j.harvested += count;
                j.stock += count;
                j.seeds += count * CONFIG.SEEDS_PER_HARVEST;

                const expGanho = count * CONFIG.EXP_PER_HARVEST;
                levelSystem.adicionarExp(expGanho);

                showToast(`🌽 Colheu ${count} milho(s)! ✨ +${expGanho} EXP  🌰 +${count * CONFIG.SEEDS_PER_HARVEST} sementes`, 2600);
                renderMilharal();
                salvarDadosCompletos();
                return count;
            }

            function waterAll() {
                const j = getJogo();
                if (j.buckets <= 0) { showToast('😅 Sem baldes!', 1400); return; }

                const toWater = j.plots.filter(p =>
                    p.stage !== STAGES.EMPTY &&
                    p.stage !== STAGES.HARVESTED &&
                    p.stage !== STAGES.MATURE
                );

                if (toWater.length === 0) {
                    showToast('💧 Nada para regar.', 1200);
                    return;
                }

                let watered = 0;
                let advanced = 0;
                for (const p of toWater) {
                    p.progress = Math.min((p.progress || 0) + CONFIG.WATER_BOOST, 100);
                    if (p.progress >= 100) {
                        const idx = STAGE_ORDER.indexOf(p.stage);
                        if (idx + 1 < STAGE_ORDER.length) {
                            p.stage = STAGE_ORDER[idx + 1];
                            p.progress = 0;
                            advanced++;
                            if (p.stage === STAGES.MATURE) showToast(`🌽 Amadureceu na parcela ${p.id + 1}!`, 1800);
                        } else p.progress = 100;
                    }
                    watered++;
                }

                j.buckets--;
                showToast(`💧 Regou ${watered} canteiro(s)! ${advanced > 0 ? '(' + advanced + ' avançaram)' : ''}`, 2000);
                renderMilharal();
                salvarDadosCompletos();
            }

            function sellAllStock() {
                const j = getJogo();
                if (j.stock <= 0) { showToast('📦 Nenhum milho no estoque para vender.', 1400); return; }

                const price = CONFIG.SELL_PRICE_CORN;
                const total = j.stock * price;
                j.saldo = (j.saldo || 0) + total;
                const sold = j.stock;
                j.stock = 0;

                showToast(`💰 Vendeu ${sold} milho(s) do estoque por R$ ${total.toFixed(2)}!`, 2500);
                renderMilharal();
                salvarDadosCompletos();
            }

            function clearAllPlots() {
                const j = getJogo();
                const plots = getPlots();
                const toClear = plots.filter(p => p.stage !== STAGES.EMPTY);

                if (toClear.length === 0) {
                    showToast('🧹 Todos os canteiros já estão vazios!', 1800);
                    return;
                }

                const harvestedPlots = plots.filter(p => p.stage === STAGES.HARVESTED);
                const nonHarvested = plots.filter(p => p.stage !== STAGES.EMPTY && p.stage !== STAGES.HARVESTED);

                if (nonHarvested.length > 0) {
                    showToast(`🧹 Apenas canteiros colhidos (🟫) podem ser limpos!`, 2500);
                    return;
                }
                if (harvestedPlots.length === 0) {
                    showToast('🧹 Nenhum canteiro colhido para limpar!', 1800);
                    return;
                }

                const custoTotal = harvestedPlots.length * CONFIG.CLEAR_COST;

                if (j.saldo < custoTotal) {
                    showToast(`😅 Precisa de R$ ${custoTotal.toFixed(2)} para limpar ${harvestedPlots.length} canteiro(s).`, 2500);
                    return;
                }
                if (!confirm(`🧹 Limpar ${harvestedPlots.length} canteiro(s) colhido(s) por R$ ${custoTotal.toFixed(2)}?`)) {
                    return;
                }

                j.saldo -= custoTotal;
                for (const p of harvestedPlots) {
                    p.stage = STAGES.EMPTY;
                    p.progress = 0;
                }

                showToast(`🧹 ${harvestedPlots.length} canteiro(s) limpo(s)! (-R$ ${custoTotal.toFixed(2)})`, 2500);
                renderMilharal();
                salvarDadosCompletos();
            }

            // ============================================================
            // SUPABASE - SALVAR/CARREGAR
            // ============================================================
            function prepararDadosParaSalvar() {
                const j = getJogo();
                return {
                    saldo: Number(j.saldo || 0).toFixed(2),
                    seeds: j.seeds || 0,
                    planted: j.planted || 0,
                    harvested: j.harvested || 0,
                    buckets: j.buckets || 0,
                    stock: j.stock || 0,
                    plot_data: j.plots.map(p => ({ stage: p.stage, progress: p.progress || 0 })),
                    nivel: j.nivel || 1,
                    experiencia: j.experiencia || 0,
                    hp_max: j.hpMax || 100,
                    mp_max: j.mpMax || 50,
                    sm_max: j.smMax || 100,
                    ataque_base: j.ataqueBase || 15,
                    defesa_base: j.defesaBase || 10,
                    magia_base: j.magiaBase || 8,
                    hp_atual: j.hp || 100,
                    mp_atual: j.mp || 50,
                    sm_atual: j.sm || 100,
                    updated_at: new Date().toISOString(),
                };
            }

            function carregarDadosDoDB(data) {
                if (!data) return;
                const j = getJogo();

                j.seeds     = data.seeds     ?? CONFIG.INITIAL_SEEDS;
                j.planted   = data.planted   ?? 0;
                j.harvested = data.harvested ?? 0;
                j.saldo     = Number(data.saldo ?? CONFIG.INITIAL_SALDO);
                j.buckets   = data.buckets   ?? CONFIG.INITIAL_BUCKETS;
                j.stock     = data.stock     ?? CONFIG.INITIAL_STOCK;

                if (data.plot_data && Array.isArray(data.plot_data) && data.plot_data.length > 0) {
                    j.plots = data.plot_data.map((p, index) => ({
                        id: index,
                        stage: p.stage || STAGES.EMPTY,
                        progress: p.progress || 0,
                        row: Math.floor(index / CONFIG.COLS),
                        col: index % CONFIG.COLS,
                    }));
                } else {
                    initPlots();
                }

                j.nivel       = data.nivel       || 1;
                j.experiencia = data.experiencia || 0;
                j.hpMax       = data.hp_max      || 100;
                j.mpMax       = data.mp_max      || 50;
                j.smMax       = data.sm_max      || 100;
                j.ataqueBase  = data.ataque_base || 15;
                j.defesaBase  = data.defesa_base || 10;
                j.magiaBase   = data.magia_base  || 8;
                j.hp          = data.hp_atual    || j.hpMax;
                j.mp          = data.mp_atual    || j.mpMax;
                j.sm          = data.sm_atual    || j.smMax;
            }

            async function verificarSupabase() {
                try {
                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?select=id&limit=1`, {
                            headers: {
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                            },
                            cache: 'no-store',
                        }
                    );
                    if (response.ok) {
                        state.online = true;
                        atualizarStatusSupabase(true, 'Online');
                        return true;
                    } else {
                        state.online = false;
                        atualizarStatusSupabase(false, `Erro ${response.status}`);
                        return false;
                    }
                } catch (error) {
                    state.online = false;
                    atualizarStatusSupabase(false, 'Falha');
                    console.error('Erro ao verificar Supabase:', error);
                    return false;
                }
            }

            async function carregarDadosCompletos() {
                if (!state.usuario || !state.online) return;
                try {
                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?login=eq.${encodeURIComponent(state.usuario.login)}&select=*`, {
                            headers: {
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                            },
                            cache: 'no-store',
                        }
                    );
                    if (!response.ok) throw new Error(`Erro ao carregar: ${response.status}`);
                    const data = await response.json();
                    if (!data || data.length === 0) return;

                    state.dadosDB = data[0];
                    carregarDadosDoDB(data[0]);
                    renderMilharal();
                    levelSystem.atualizarUI();
                    startMilharal();
                } catch (error) {
                    console.error('Erro ao carregar:', error);
                }
            }

            async function salvarDadosCompletos() {
                if (!state.usuario || !state.online || state.salvando) return;
                state.salvando = true;
                try {
                    const payload = prepararDadosParaSalvar();
                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?login=eq.${encodeURIComponent(state.usuario.login)}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                                'Prefer': 'return=representation',
                            },
                            body: JSON.stringify(payload),
                        }
                    );
                    if (!response.ok) throw new Error(`Erro ao salvar: ${response.status}`);

                    const updated = await response.json();
                    if (Array.isArray(updated) && updated.length > 0) {
                        state.dadosDB = updated[0];
                    }
                    console.log('💾 Dados salvos e sincronizados!');
                } catch (error) {
                    console.error('Erro ao salvar:', error);
                } finally {
                    state.salvando = false;
                }
            }

            // ============================================================
            // AUTH (simplificado: sem modal, redireciona para login.html)
            // ============================================================
            function carregarUsuario() {
                try {
                    const data = localStorage.getItem('usuario_logado');
                    if (data) { state.usuario = JSON.parse(data); return true; }
                } catch (e) {}
                return false;
            }

            function atualizarInterfaceUsuario() {
                if (state.usuario && state.usuario.login) {
                    const nome = state.usuario.nome || state.usuario.login;
                    DOM.userAvatar.textContent = nome.charAt(0).toUpperCase();
                    DOM.userName.textContent = nome;
                } else {
                    DOM.userAvatar.textContent = '?';
                    DOM.userName.textContent = 'Visitante';
                }
                atualizarSaldoGlobal();
            }

            // ============================================================
            // EVENTOS
            // ============================================================
            function setupEvents() {
                if (DOM.field) {
                    DOM.field.addEventListener('click', function(e) {
                        const div = e.target.closest('.plot');
                        if (!div) return;
                        const id = parseInt(div.dataset.id, 10);
                        if (isNaN(id)) return;
                        const j = getJogo();
                        const p = j.plots[id];
                        if (!p) return;
                        if (p.stage === STAGES.EMPTY) plantAt(id);
                        else if (p.stage === STAGES.MATURE) harvestAt(id);
                        else if (p.stage === STAGES.HARVESTED) clearPlot(id);
                        else waterAt(id);
                    });
                }

                DOM.btnPlantAll?.addEventListener('click', plantAll);
                DOM.btnWaterAll?.addEventListener('click', waterAll);
                DOM.btnHarvestAll?.addEventListener('click', harvestAll);
                DOM.btnSellAll?.addEventListener('click', sellAllStock);
                DOM.btnClearAll?.addEventListener('click', clearAllPlots);

                DOM.btnReconnectSupabase?.addEventListener('click', function() {
                    verificarSupabase();
                    showToast('🔄 Verificando conexão...', 1500);
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            function init() {
                initDOM();
                setupEvents();

                verificarSupabase();
                carregarUsuario();
                initPlots();

                // Se não houver usuário logado, redireciona para login.html
                if (!state.usuario || !state.usuario.login) {
                    window.location.href = 'login.html';
                    return;
                }

                atualizarInterfaceUsuario();

                setTimeout(() => {
                    if (state.online) carregarDadosCompletos();
                    else showToast('⚠️ Sem conexão com o banco.', 3000);
                }, 600);

                showToast(`👋 Olá, ${state.usuario.nome || state.usuario.login}!`, 2500);

                renderMilharal();
                levelSystem.atualizarUI();
                startMilharal();

                state.syncTimer = setInterval(() => {
                    if (state.usuario && state.online && !state.salvando) {
                        carregarDadosCompletos();
                    }
                }, CONFIG.SYNC_INTERVAL);

                setInterval(() => verificarSupabase(), 30000);

                setInterval(() => {
                    if (state.usuario && state.online && !state.salvando) salvarDadosCompletos();
                }, CONFIG.AUTO_SAVE_INTERVAL);

                window.addEventListener('beforeunload', function() {
                    limparTimers();
                    if (state.usuario && state.online && !state.salvando) salvarDadosCompletos();
                });

                console.log('🌽 Milharal carregado!');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
