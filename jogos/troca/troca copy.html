<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troca BTC ↔ Saldo | Fazendinha</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body {
      background: linear-gradient(145deg, #0b1a2b 0%, #1a2f3f 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: rgba(18, 30, 41, 0.9); backdrop-filter: blur(10px);
      border-radius: 2rem; padding: 2rem 2.2rem; max-width: 620px; width: 100%;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.2); color: #eef5ff;
    }
    .btn-voltar {
      display: inline-block; background: #1e3b4f; padding: 0.55rem 1.4rem;
      border-radius: 30px; color: #cfe7ff; text-decoration: none; font-weight: 500;
      font-size: 0.95rem; margin-bottom: 1.6rem; border: 1px solid #3f6b85;
      transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .btn-voltar:hover { background: #2c5775; border-color: #f7d44a; color: #fff; transform: translateY(-2px); }
    h1 {
      font-size: 1.9rem; font-weight: 600; display: flex; align-items: center; gap: 12px;
      color: #f7e05e; text-shadow: 0 2px 8px #f0b30040; border-bottom: 1px solid #3e5a6b;
      padding-bottom: 0.8rem; margin-bottom: 1.8rem;
    }
    .info-login {
      background: #102433; border-radius: 16px; padding: 1rem 1.4rem; margin-bottom: 1.8rem;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border-left: 6px solid #f5c542; box-shadow: inset 0 0 20px #00000030;
    }
    .info-login span { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .info-login .badge {
      background: #254a5e; border-radius: 40px; padding: 0.3rem 1rem;
      font-weight: 600; color: #b9e0ff;
    }
    .saldos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 2rem; }
    .saldo-box {
      background: #0e1e2b; border-radius: 22px; padding: 1.2rem 1rem; text-align: center;
      border: 1px solid #2f4f65; box-shadow: 0 8px 0 #050b10;
    }
    .saldo-box .label {
      font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px;
      color: #9bb7d4; margin-bottom: 6px;
    }
    .saldo-box .value {
      font-size: 1.9rem; font-weight: 800; line-height: 1.3;
      color: #fadf6b; text-shadow: 0 0 10px #f5b81b80; word-break: break-word;
    }
    .taxa-info {
      background: #0a1a24; border-radius: 14px; padding: 0.7rem 1.2rem; font-size: 0.9rem;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      border: 1px dashed #f5c54260; margin-bottom: 1.6rem; color: #b7d1e8;
    }
    .taxa-info strong { color: #f7dc6f; }
    .operacao {
      background: #0f2533; border-radius: 28px; padding: 1.8rem 1.8rem 1.6rem;
      margin-bottom: 1.5rem; border: 1px solid #2d556b;
    }
    .operacao h3 {
      font-size: 1.2rem; font-weight: 500; margin-bottom: 1.2rem;
      color: #c3dfff; display: flex; align-items: center; gap: 12px;
    }
    .input-group {
      display: flex; align-items: center; background: #0c1c26;
      border-radius: 48px; padding: 0.2rem 0.2rem 0.2rem 1.5rem;
      border: 1px solid #37647d; margin-bottom: 1.4rem;
    }
    .input-group input {
      flex: 1; background: transparent; border: none; padding: 0.9rem 0;
      font-size: 1.2rem; color: #fff5d7; font-weight: 500; outline: none; min-width: 0;
    }
    .input-group input::placeholder { color: #6b8fa3; font-weight: 300; font-size: 1rem; }
    .input-group .moeda {
      background: #1e3d51; border-radius: 40px; padding: 0.5rem 1.2rem;
      font-weight: 700; color: #f5d742; letter-spacing: 0.5px; font-size: 0.9rem;
    }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      flex: 1; border: none; border-radius: 60px; padding: 1rem 0.8rem;
      font-weight: 700; font-size: 1rem; letter-spacing: 0.5px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 8px 0 #050e13; border: 1px solid #355f74;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #050e13; }
    .btn-btc-to-saldo { background: #1e5f4b; color: #dcfce7; border-color: #5ee0a0; }
    .btn-btc-to-saldo:hover { background: #267a5e; }
    .btn-saldo-to-btc { background: #6d4b1c; color: #ffefc0; border-color: #f7b731; }
    .btn-saldo-to-btc:hover { background: #8e6324; }
    .btn:disabled { opacity: 0.5; transform: translateY(0); pointer-events: none; filter: grayscale(0.6); }
    .historico { margin-top: 2rem; }
    .historico h3 {
      font-size: 1.2rem; font-weight: 500; margin-bottom: 1rem;
      display: flex; gap: 10px; align-items: center; color: #b9daf5;
    }
    .historico-lista {
      background: #0b1d29; border-radius: 20px; max-height: 260px; overflow-y: auto;
      padding: 0.2rem 0.2rem; border: 1px solid #27495e; box-shadow: inset 0 0 20px #00000040;
    }
    .historico-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.85rem 1.2rem; border-bottom: 1px solid #1b3b4d; font-size: 0.9rem;
    }
    .historico-item:last-child { border-bottom: none; }
    .historico-item .data { color: #7f9fb5; font-size: 0.8rem; display: flex; flex-direction: column; }
    .historico-item .detalhe { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tag { padding: 0.2rem 0.9rem; border-radius: 40px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .tag.btc2saldo { background: #1b5e3f; color: #b6f7d9; }
    .tag.saldo2btc { background: #7a5518; color: #ffe19e; }
    .mensagem {
      margin-top: 12px; padding: 0.8rem 1.2rem; border-radius: 40px;
      font-weight: 500; text-align: center; font-size: 0.95rem; transition: 0.2s;
    }
    .msg-sucesso { background: #155f3e; color: #c6ffdd; border: 1px solid #a5f5c0; }
    .msg-erro { background: #692f2f; color: #ffd6d6; border: 1px solid #ff9b9b; }
    .msg-info { background: #1e4a6b; color: #cfe8ff; border: 1px solid #7ec4f0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a1a24; }
    ::-webkit-scrollbar-thumb { background: #2d5970; border-radius: 10px; }
  </style>
</head>
<body>
<div class="card">
  <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>

  <h1>💱 Troca BTC ↔ Saldo</h1>

  <div class="info-login">
    <span>👤 <span id="nomeUsuario">Carregando...</span></span>
    <span class="badge" id="loginUsuario">@---</span>
  </div>

  <div class="saldos-grid">
    <div class="saldo-box">
      <div class="label">💰 Saldo</div>
      <div class="value" id="saldoDisplay">R$ 0,00</div>
    </div>
    <div class="saldo-box">
      <div class="label">₿ Bitcoin</div>
      <div class="value" id="btcDisplay">0,00000000</div>
    </div>
  </div>

  <div class="taxa-info">
    <span>📈 <strong>1,00000000 BTC = R$ 1,00</strong></span>
    <span>📉 Desfazer: <strong>R$ 0,50 = 0,00050000 BTC</strong></span>
  </div>

  <div class="operacao">
    <h3>🔄 Trocar BTC por Saldo</h3>
    <div class="input-group">
      <input type="number" id="btcInput" placeholder="0.00000000" step="0.00000001" min="0">
      <span class="moeda">BTC</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-btc-to-saldo" id="btnBtcToSaldo">₿ → 💰 Converter</button>
    </div>
  </div>

  <div class="operacao">
    <h3>🔄 Trocar Saldo por BTC (desfazer)</h3>
    <div class="input-group">
      <input type="number" id="saldoInput" placeholder="0.00" step="0.01" min="0">
      <span class="moeda">R$</span>
    </div>
    <div class="btn-group">
      <button class="btn btn-saldo-to-btc" id="btnSaldoToBtc">💰 → ₿ Converter</button>
    </div>
  </div>

  <div id="mensagem" class="mensagem" style="display: none;"></div>

  <div class="historico">
    <h3>📜 Histórico de trocas</h3>
    <div class="historico-lista" id="historicoLista">
      <div class="historico-item" style="justify-content:center; color:#6f8fa3;">Nenhuma troca registrada</div>
    </div>
  </div>
</div>

 

<script>
  // ============================================================
  // CREDENCIAIS SUPABASE
  // ============================================================
  const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let usuarioAtual = null;
  let carregando   = false;

  // ============================================================
  // AUXILIARES
  // ============================================================
  const fmtSaldo = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const fmtBTC   = v => Number(v).toFixed(8).replace('.', ',');

  function mostrarMensagem(texto, tipo = 'sucesso') {
    const el = document.getElementById('mensagem');
    el.textContent = texto;
    el.className = `mensagem msg-${tipo}`;
    el.style.display = 'block';
    clearTimeout(window._msgTimer);
    window._msgTimer = setTimeout(() => { el.style.display = 'none'; }, 4500);
  }
  function setLoading(v) {
    carregando = v;
    document.getElementById('btnBtcToSaldo').disabled = v;
    document.getElementById('btnSaldoToBtc').disabled = v;
  }

  // ============================================================
  // CARREGAR USUÁRIO (usa apenas SELECT — permitido por RLS)
  // ============================================================
  async function carregarUsuario() {
    try {
      const loginSalvo =
        localStorage.getItem('usuario_logado') ||
        localStorage.getItem('login') ||
        sessionStorage.getItem('usuario_logado') ||
        sessionStorage.getItem('login');

      if (!loginSalvo) {
        mostrarMensagem('⚠️ Nenhum usuário logado. Faça login primeiro.', 'erro');
        return;
      }

      const { data, error } = await _supabase
        .from('Geral')
        .select('id, nome, login, saldo, btc, historico')
        .eq('login', loginSalvo)
        .maybeSingle();

      if (error) {
        console.error('Erro Supabase:', error);
        mostrarMensagem('❌ Erro ao carregar: ' + error.message, 'erro');
        return;
      }
      if (!data) {
        mostrarMensagem('❌ Usuário "' + loginSalvo + '" não encontrado.', 'erro');
        return;
      }

      usuarioAtual = {
        id: data.id,
        nome: data.nome || 'Sem nome',
        login: data.login,
        saldo: Number(data.saldo) || 0,
        btc: Number(data.btc) || 0,
        historico: Array.isArray(data.historico) ? data.historico : []
      };

      atualizarUI();
      mostrarMensagem(`✅ Bem-vindo, ${usuarioAtual.nome}!`, 'sucesso');
    } catch (err) {
      console.error(err);
      mostrarMensagem('Erro inesperado ao carregar dados.', 'erro');
    }
  }

  // ============================================================
  // UI
  // ============================================================
  function atualizarUI() {
    if (!usuarioAtual) return;
    document.getElementById('nomeUsuario').textContent = usuarioAtual.nome;
    document.getElementById('loginUsuario').textContent = '@' + usuarioAtual.login;
    document.getElementById('saldoDisplay').textContent = fmtSaldo(usuarioAtual.saldo);
    document.getElementById('btcDisplay').textContent = fmtBTC(usuarioAtual.btc);
    renderizarHistorico();
  }

  function renderizarHistorico() {
    const lista = document.getElementById('historicoLista');
    const hist = usuarioAtual?.historico || [];

    if (hist.length === 0) {
      lista.innerHTML = '<div class="historico-item" style="justify-content:center; color:#6f8fa3;">Nenhuma troca registrada</div>';
      return;
    }

    const ordenado = [...hist].sort((a, b) => new Date(b.data) - new Date(a.data));

    lista.innerHTML = ordenado.map(item => {
      const dt = new Date(item.data);
      const dataStr = dt.toLocaleDateString('pt-BR');
      const horaStr = dt.toLocaleTimeString('pt-BR');
      const isB2S = item.tipo === 'btc_to_saldo';
      const tagClass = isB2S ? 'btc2saldo' : 'saldo2btc';
      const tagTexto = isB2S ? 'BTC → Saldo' : 'Saldo → BTC';
      const detalhe = isB2S
        ? `₿ ${fmtBTC(item.btc)} → ${fmtSaldo(item.saldo)}`
        : `${fmtSaldo(item.saldo)} → ₿ ${fmtBTC(item.btc)}`;

      return `
        <div class="historico-item">
          <div class="data">
            <span>${dataStr}</span>
            <span style="font-size:0.7rem;">${horaStr}</span>
          </div>
          <div class="detalhe">
            <span class="tag ${tagClass}">${tagTexto}</span>
            <span>${detalhe}</span>
          </div>
        </div>`;
    }).join('');
  }

  // ============================================================
  // REFRESH: relê o usuário do banco (após a RPC)
  // ============================================================
  async function recarregarUsuario() {
    const { data, error } = await _supabase
      .from('Geral')
      .select('id, nome, login, saldo, btc, historico')
      .eq('login', usuarioAtual.login)
      .single();

    if (error) {
      console.error('Erro ao recarregar:', error);
      return false;
    }
    usuarioAtual.saldo = Number(data.saldo) || 0;
    usuarioAtual.btc   = Number(data.btc)   || 0;
    usuarioAtual.historico = Array.isArray(data.historico) ? data.historico : [];
    atualizarUI();
    return true;
  }

  // ============================================================
  // BTC → SALDO  (via RPC segura)
  // ============================================================
  async function converterBtcParaSaldo() {
    if (carregando || !usuarioAtual) return;
    const inputBtc = document.getElementById('btcInput');
    const btcQtd = parseFloat(inputBtc.value);

    if (isNaN(btcQtd) || btcQtd <= 0) {
      mostrarMensagem('Digite uma quantidade válida de BTC.', 'erro');
      return;
    }
    if (btcQtd > usuarioAtual.btc) {
      mostrarMensagem('Saldo BTC insuficiente.', 'erro');
      return;
    }

    setLoading(true);

    const { data, error } = await _supabase.rpc('trocar_btc_por_saldo', {
      p_login: usuarioAtual.login,
      p_btc:   btcQtd
    });

    if (error) {
      console.error('Erro RPC:', error);
      mostrarMensagem('❌ ' + (error.message || 'Erro ao converter.'), 'erro');
      setLoading(false);
      return;
    }

    await recarregarUsuario();
    inputBtc.value = '';
    mostrarMensagem(
      `✅ Convertido ₿ ${fmtBTC(data.btc_gasto)} → ${fmtSaldo(data.saldo_ganho)}`,
      'sucesso'
    );
    setLoading(false);
  }

  // ============================================================
  // SALDO → BTC  (via RPC segura)
  // ============================================================
  async function converterSaldoParaBtc() {
    if (carregando || !usuarioAtual) return;
    const inputSaldo = document.getElementById('saldoInput');
    const saldoQtd = parseFloat(inputSaldo.value);

    if (isNaN(saldoQtd) || saldoQtd <= 0) {
      mostrarMensagem('Digite um valor válido em saldo.', 'erro');
      return;
    }
    if (saldoQtd > usuarioAtual.saldo) {
      mostrarMensagem('Saldo insuficiente.', 'erro');
      return;
    }

    setLoading(true);

    const { data, error } = await _supabase.rpc('trocar_saldo_por_btc', {
      p_login: usuarioAtual.login,
      p_saldo: saldoQtd
    });

    if (error) {
      console.error('Erro RPC:', error);
      mostrarMensagem('❌ ' + (error.message || 'Erro ao converter.'), 'erro');
      setLoading(false);
      return;
    }

    await recarregarUsuario();
    inputSaldo.value = '';
    mostrarMensagem(
      `✅ Convertido ${fmtSaldo(data.saldo_gasto)} → ₿ ${fmtBTC(data.btc_recebido)}`,
      'sucesso'
    );
    setLoading(false);
  }

  // ============================================================
  // EVENTOS
  // ============================================================
  document.getElementById('btnBtcToSaldo').addEventListener('click', converterBtcParaSaldo);
  document.getElementById('btnSaldoToBtc').addEventListener('click', converterSaldoParaBtc);
  document.getElementById('btcInput').addEventListener('keypress', e => { if (e.key === 'Enter') converterBtcParaSaldo(); });
  document.getElementById('saldoInput').addEventListener('keypress', e => { if (e.key === 'Enter') converterSaldoParaBtc(); });

  window.addEventListener('DOMContentLoaded', carregarUsuario);
</script>
</body>
</html>
