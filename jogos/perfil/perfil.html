<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar Perfil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    max-width: 520px;
    width: 100%;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
  }
  .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 0.85rem;
    margin-bottom: 24px;
  }
  .status-lock {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.3s;
  }
  .status-lock.locked {
    background: #7f1d1d22;
    border: 1px solid #ef444444;
    color: #f87171;
  }
  .status-lock.unlocked {
    background: #14532d22;
    border: 1px solid #22c55e44;
    color: #4ade80;
  }
  .status-lock .icon {
    font-size: 1.3rem;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-weight: 600;
    color: #94a3b8;
    margin-bottom: 6px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #1e293b;
    border-radius: 10px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.3s;
  }
  .form-group input:focus {
    border-color: #38bdf8;
  }
  .form-group input:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: #0a0f1a;
  }
  .form-group input::placeholder {
    color: #475569;
  }
  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .btn:active { transform: scale(0.97); }
  .btn-resgatar {
    background: linear-gradient(135deg, #00f0ff, #7000ff);
    color: #fff;
    box-shadow: 0 0 12px rgba(0,240,255,0.4);
  }
  .btn-resgatar:hover {
    box-shadow: 0 0 20px rgba(0,240,255,0.8);
    transform: translateY(-2px);
  }
  .btn-salvar {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
  }
  .btn-salvar:hover:not(:disabled) {
    box-shadow: 0 8px 25px rgba(16,185,129,0.3);
    transform: translateY(-2px);
  }
  .btn-salvar:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: #334155;
  }
  .btn-voltar {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
  }
  .btn-voltar:hover {
    color: #fff;
    border-color: #38bdf8;
    background: #1e293b;
  }
  .mensagem {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 0.85rem;
    display: none;
  }
  .mensagem.show { display: block; }
  .mensagem-erro {
    background: #1f1a2a;
    color: #ff6b6b;
    border-left: 4px solid #ef4444;
  }
  .mensagem-sucesso {
    background: #0f2a1a;
    color: #6bff9e;
    border-left: 4px solid #10b981;
  }
  .mensagem-info {
    background: #0f1f2a;
    color: #6bc8ff;
    border-left: 4px solid #3b82f6;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: #475569;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #1e293b;
  }
  .codigo-info {
    font-size: 0.78rem;
    color: #64748b;
    margin-top: 6px;
    text-align: center;
  }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #ffffff44;
    border-top: 2px solid #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>✏️ Alterar Perfil</h1>
  <p class="subtitle">Altere seu <strong>email</strong> e <strong>nome</strong></p>

  <div class="status-lock locked" id="statusLock">
    <span class="icon">🔒</span>
    <span id="statusLockText">Bloqueado — resgate um código para liberar</span>
  </div>

  <div id="mensagem" class="mensagem"></div>

  <!-- Área de resgate do código -->
  <div id="areaResgate">
    <div class="form-group">
      <label for="codigoResgate">🎁 Código de Resgate</label>
      <input type="text" id="codigoResgate" placeholder="Digite o código de resgate" style="text-transform: uppercase;">
      <p class="codigo-info">Use um código criado no painel admin para liberar a alteração</p>
    </div>
    <button class="btn btn-resgatar" id="btnResgatar">🎁 Resgatar Código</button>
  </div>

  <!-- Área de edição (inicialmente oculta) -->
  <div id="areaEdicao" style="display: none;">
    <div class="divider">Perfil Liberado</div>

    <div class="form-group">
      <label for="nomeInput">Nome</label>
      <input type="text" id="nomeInput" placeholder="Digite seu nome" maxlength="50">
    </div>

    <div class="form-group">
      <label for="emailInput">Email</label>
      <input type="email" id="emailInput" placeholder="Digite seu email" maxlength="100">
    </div>

    <button class="btn btn-salvar" id="btnSalvar">💾 Salvar Alterações</button>
  </div>

  <button class="btn btn-voltar" onclick="window.location.href='../../dashboard.html'">🏠 Voltar</button>
</div>

<script>
// ============================================================
// ⚙️ CONFIGURAÇÃO
// ============================================================
const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
const TABELA = 'Geral';
// ============================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- Estado ----------
let usuario = null;
let perfilLiberado = false;
let codigosCache = [];

// ---------- Elementos ----------
const $statusLock = document.getElementById('statusLock');
const $statusLockText = document.getElementById('statusLockText');
const $mensagem = document.getElementById('mensagem');
const $areaResgate = document.getElementById('areaResgate');
const $areaEdicao = document.getElementById('areaEdicao');
const $codigoResgate = document.getElementById('codigoResgate');
const $nomeInput = document.getElementById('nomeInput');
const $emailInput = document.getElementById('emailInput');
const $btnResgatar = document.getElementById('btnResgatar');
const $btnSalvar = document.getElementById('btnSalvar');

// ---------- Utilitários ----------
function mostrarMensagem(texto, tipo = 'info') {
  $mensagem.textContent = texto;
  $mensagem.className = `mensagem show mensagem-${tipo}`;
  setTimeout(() => {
    $mensagem.className = 'mensagem';
  }, 5000);
}

function bloquearPerfil() {
  perfilLiberado = false;
  $statusLock.className = 'status-lock locked';
  $statusLockText.textContent = 'Bloqueado — resgate um código para liberar';
  $areaResgate.style.display = 'block';
  $areaEdicao.style.display = 'none';
  $nomeInput.disabled = true;
  $emailInput.disabled = true;
  $btnSalvar.disabled = true;
}

function liberarPerfil() {
  perfilLiberado = true;
  $statusLock.className = 'status-lock unlocked';
  $statusLockText.textContent = '✅ Perfil liberado — você pode alterar seus dados';
  $areaResgate.style.display = 'none';
  $areaEdicao.style.display = 'block';
  $nomeInput.disabled = false;
  $emailInput.disabled = false;
  $btnSalvar.disabled = false;
}

// ---------- Carregar usuário logado ----------
function carregarUsuarioLogado() {
  const usuarioData = localStorage.getItem('usuario_logado');
  if (!usuarioData) {
    mostrarMensagem('⛔ Você precisa estar logado.', 'erro');
    setTimeout(() => window.location.href = '../../dashboard.html', 1500);
    return false;
  }

  try {
    usuario = JSON.parse(usuarioData);
  } catch (e) {
    mostrarMensagem('⛔ Erro ao carregar dados do usuário.', 'erro');
    setTimeout(() => window.location.href = '../../dashboard.html', 1500);
    return false;
  }

  if (!usuario || !usuario.login) {
    mostrarMensagem('⛔ Sessão inválida.', 'erro');
    setTimeout(() => window.location.href = '../../dashboard.html', 1500);
    return false;
  }

  // Preenche os campos
  $nomeInput.value = usuario.nome || '';
  $emailInput.value = usuario.email || '';

  return true;
}

// ---------- Carregar códigos de resgate ----------
async function carregarCodigos() {
  try {
    const { data, error } = await sb
      .from(TABELA)
      .select('codigos_resgate')
      .eq('id', 1)
      .single();

    if (error) {
      console.warn('Erro ao carregar códigos:', error);
      codigosCache = [];
      return [];
    }

    codigosCache = Array.isArray(data?.codigos_resgate) ? data.codigos_resgate : [];
    return codigosCache;
  } catch (e) {
    console.error('Erro ao carregar códigos:', e);
    codigosCache = [];
    return [];
  }
}

// ---------- Resgatar código ----------
async function resgatarCodigo() {
  const codigo = ($codigoResgate.value || '').trim().toUpperCase();

  if (!codigo) {
    mostrarMensagem('⚠️ Digite um código de resgate.', 'erro');
    return;
  }

  $btnResgatar.disabled = true;
  $btnResgatar.innerHTML = '<span class="spinner"></span>Verificando...';

  try {
    // Recarrega códigos para pegar os mais recentes
    await carregarCodigos();

    const codigoEncontrado = codigosCache.find(
      c => (c.codigo || '').toUpperCase() === codigo
    );

    if (!codigoEncontrado) {
      mostrarMensagem('❌ Código inválido ou não encontrado.', 'erro');
      return;
    }

    if (codigoEncontrado.ativo === false) {
      mostrarMensagem('❌ Este código está desativado.', 'erro');
      return;
    }

    const limite = codigoEncontrado.limite || 0;
    const usos = codigoEncontrado.usos || 0;

    if (limite > 0 && usos >= limite) {
      mostrarMensagem('❌ Este código já atingiu o limite de usos.', 'erro');
      return;
    }

    // Código válido — incrementa usos
    const idx = codigosCache.findIndex(
      c => (c.codigo || '').toUpperCase() === codigo
    );
    if (idx >= 0) {
      codigosCache[idx].usos = (codigosCache[idx].usos || 0) + 1;
    }

    // Salva no banco
    const { error: updateError } = await sb
      .from(TABELA)
      .update({ codigos_resgate: codigosCache })
      .eq('id', 1);

    if (updateError) {
      console.error('Erro ao salvar uso do código:', updateError);
      mostrarMensagem('⚠️ Código válido, mas houve erro ao registrar o uso.', 'erro');
      return;
    }

    // Libera o perfil
    liberarPerfil();
    mostrarMensagem('✅ Código resgatado! Você pode alterar seu perfil agora.', 'sucesso');
    $codigoResgate.value = '';

  } catch (e) {
    console.error('Erro ao resgatar código:', e);
    mostrarMensagem('❌ Erro ao resgatar código.', 'erro');
  } finally {
    $btnResgatar.disabled = false;
    $btnResgatar.textContent = '🎁 Resgatar Código';
  }
}

// ---------- Salvar alterações ----------
async function salvarAlteracoes() {
  if (!perfilLiberado) {
    mostrarMensagem('🔒 Resgate um código para liberar a alteração.', 'erro');
    return;
  }

  const nome = ($nomeInput.value || '').trim();
  const email = ($emailInput.value || '').trim();

  if (!nome) {
    mostrarMensagem('⚠️ O nome não pode ficar vazio.', 'erro');
    return;
  }

  if (!email) {
    mostrarMensagem('⚠️ O email não pode ficar vazio.', 'erro');
    return;
  }

  // Validação simples de email
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    mostrarMensagem('⚠️ Digite um email válido.', 'erro');
    return;
  }

  $btnSalvar.disabled = true;
  $btnSalvar.innerHTML = '<span class="spinner"></span>Salvando...';

  try {
    const { error } = await sb
      .from(TABELA)
      .update({
        nome: nome,
        email: email,
        updated_at: new Date().toISOString()
      })
      .eq('login', usuario.login);

    if (error) {
      console.error('Erro ao salvar:', error);
      mostrarMensagem('❌ Erro ao salvar: ' + error.message, 'erro');
      return;
    }

    // Atualiza localStorage
    usuario.nome = nome;
    usuario.email = email;
    localStorage.setItem('usuario_logado', JSON.stringify(usuario));

    mostrarMensagem('✅ Perfil atualizado com sucesso!', 'sucesso');

    // Bloqueia novamente após salvar
    setTimeout(() => {
      bloquearPerfil();
      mostrarMensagem('🔒 Perfil bloqueado novamente. Resgate outro código para alterar.', 'info');
    }, 2500);

  } catch (e) {
    console.error('Erro ao salvar:', e);
    mostrarMensagem('❌ Erro ao salvar alterações.', 'erro');
  } finally {
    $btnSalvar.disabled = false;
    $btnSalvar.textContent = '💾 Salvar Alterações';
  }
}

// ---------- Eventos ----------
$btnResgatar.addEventListener('click', resgatarCodigo);
$codigoResgate.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') resgatarCodigo();
});
$btnSalvar.addEventListener('click', salvarAlteracoes);

// ---------- Inicialização ----------
async function inicializar() {
  const ok = carregarUsuarioLogado();
  if (!ok) return;

  bloquearPerfil();
  await carregarCodigos();

  console.log('✅ Página carregada. Códigos disponíveis:', codigosCache.length);
}

inicializar();
</script>
</body>
</html>
