<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🌾 Fazenda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }
        #app {
            max-width: 520px;
            width: 100%;
            background: #1a1f2a;
            border-radius: 24px;
            padding: 20px 18px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3344;
        }
        h1 {
            font-size: 28px;
            color: #f0e8d0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8892a8;
            margin-left: auto;
        }
        .saldo-box {
            background: #0f141e;
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2a3344;
            margin-bottom: 10px;
        }
        .saldo-box span {
            font-size: 16px;
            color: #b0baca;
        }
        .saldo-box .valor {
            font-size: 26px;
            font-weight: 800;
            color: #f0c040;
        }

        /* XP box */
        .xp-box {
            background: #0f141e;
            border-radius: 16px;
            padding: 12px 16px;
            border: 1px solid #2a3344;
            margin-bottom: 18px;
        }
        .xp-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .xp-top .nivel {
            font-size: 15px;
            font-weight: 800;
            color: #a855f7;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .xp-top .xp-txt {
            font-size: 12px;
            color: #8892a8;
            font-weight: 600;
        }
        .xp-barra {
            height: 10px;
            background: #0b0e14;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #1e2635;
        }
        .xp-barra .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a855f7, #7c3aed);
            border-radius: 20px;
            transition: width 0.4s ease;
        }

        .secao {
            background: #0f141e;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid #2a3344;
        }
        .secao h3 {
            color: #c8d0e0;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .secao h3 .badge {
            margin-left: auto;
            font-size: 11px;
            background: #2a3344;
            color: #8892a8;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .secao .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .secao .grid button {
            flex: 1 0 calc(50% - 10px);
            min-width: 100px;
            padding: 10px 0 8px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            background: #2a3344;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
            touch-action: manipulation;
            border: 1px solid #3a4458;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            line-height: 1.2;
        }
        .secao .grid button:active {
            transform: scale(0.94);
        }
        .secao .grid button .custo {
            font-size: 10px;
            font-weight: 600;
            color: #f0c040;
            opacity: 0.85;
        }
        .secao .grid button .xp-ganho {
            font-size: 10px;
            font-weight: 600;
            color: #c4b5fd;
            opacity: 0.9;
        }
        .secao .grid button.colher {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            border-color: #27ae60;
        }

        /* Estoque */
        .estoque-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .estoque-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b0e14;
            border: 1px solid #1e2635;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            color: #c8d0e0;
        }
        .estoque-item .nome {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .estoque-item .qtd {
            font-weight: 800;
            color: #f0c040;
            font-size: 16px;
        }
        .estoque-vazio {
            color: #6b7688;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
        }

        /* Histórico */
        .hist-lista {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .hist-lista::-webkit-scrollbar {
            width: 6px;
        }
        .hist-lista::-webkit-scrollbar-thumb {
            background: #2a3344;
            border-radius: 6px;
        }
        .hist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b0e14;
            border: 1px solid #1e2635;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: #b0baca;
        }
        .hist-item .emoji {
            font-size: 18px;
        }
        .hist-item .detalhe {
            flex: 1;
        }
        .hist-item .detalhe .topo {
            color: #f0e8d0;
            font-weight: 700;
        }
        .hist-item .detalhe .hora {
            font-size: 11px;
            color: #6b7688;
            margin-top: 2px;
        }
        .hist-item .tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-end;
        }
        .hist-item .custo-tag {
            font-size: 11px;
            font-weight: 700;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .hist-item .xp-tag {
            font-size: 11px;
            font-weight: 700;
            color: #a855f7;
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 2px 8px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .hist-vazio {
            color: #6b7688;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
        }
        .btn-limpar {
            width: 100%;
            margin-top: 10px;
            padding: 10px 0;
            border-radius: 40px;
            border: 1px solid #e74c3c;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        .btn-limpar:active {
            transform: scale(0.96);
        }

        .log {
            background: #0b0e14;
            border-radius: 12px;
            padding: 10px 14px;
            color: #8892a8;
            font-size: 13px;
            min-height: 44px;
            border: 1px solid #1e2635;
            margin-top: 6px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log .emoji {
            font-size: 20px;
        }
        .log .msg {
            flex: 1;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .nav-links a {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 40px;
            background: #2a3344;
            color: #c8d0e0;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            border: 1px solid #3a4458;
        }
        .nav-links a:active {
            transform: scale(0.94);
        }
        .nav-links a.jogo {
            background: linear-gradient(135deg, #4a90d9, #2a5a8a);
            border-color: #4a90d9;
            color: #fff;
        }
        .status-db {
            font-size: 11px;
            color: #6b7688;
            text-align: right;
            margin-bottom: 8px;
        }
        .status-db.online { color: #27ae60; }
        .status-db.offline { color: #e74c3c; }

        @media (max-width: 420px) {
            #app { padding: 14px 12px 20px; }
            h1 { font-size: 22px; }
            .saldo-box .valor { font-size: 22px; }
            .secao .grid button { font-size: 12px; padding: 9px 0 7px; }
        }
    </style>
</head>

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══════════════════════════════════════════════════════════════
//  CONFIGURAÇÕES GERAIS
// ═══════════════════════════════════════════════════════════════
const TABELA = 'Geral';
const LIMITE_HISTORICO = 100;

let USUARIO = null;
let _cache  = null;

// Emojis por item
const EMOJI_ITEM = {
    'Madeira': '🪵',
    'Pedra':   '🪨',
    'Ouro':    '💎',
    'Poção':   '🧪'
};

// 💰 CUSTO DE PRODUÇÃO POR UNIDADE
const CUSTO_PRODUCAO = {
    'Madeira': 3,
    'Pedra':   5,
    'Ouro':    20,
    'Poção':   12
};

// ⭐ XP POR UNIDADE PRODUZIDA
const XP_PRODUCAO = {
    'Madeira': 1,   // 2 un. = 2 XP
    'Pedra':   2,   // 2 un. = 4 XP
    'Ouro':    8,   // 1 un. = 8 XP
    'Poção':   5    // 1 un. = 5 XP
};

// ⭐ NÍVEL: XP necessário para subir do nível N para N+1 = N * 100
const XP_BASE_NIVEL = 100;

// ═══════════════════════════════════════════════════════════════
//  RECUPERAR LOGIN DA SESSÃO
// ═══════════════════════════════════════════════════════════════
function obterLoginDaSessao() {
    const authKeys = Object.keys(localStorage).filter(k =>
        k.startsWith('sb-') && k.endsWith('-auth-token')
    );
    for (const k of authKeys) {
        try {
            const sess = JSON.parse(localStorage.getItem(k));
            const email = sess?.user?.email;
            if (email) return email.split('@')[0];
            const meta = sess?.user?.user_metadata?.login;
            if (meta) return meta;
        } catch (_) {}
    }

    const chaves = [
        'usuario_logado', 'login', 'login_usuario', 'usuario', 'user',
        'mm_usuario_logado', 'mm_quase_tudo_usuario'
    ];
    for (const chave of chaves) {
        const v = localStorage.getItem(chave);
        if (v) {
            try {
                const parsed = JSON.parse(v);
                if (typeof parsed === 'string') return parsed;
                if (parsed?.login)  return parsed.login;
                if (parsed?.usuario) return parsed.usuario;
                if (parsed?.email)  return parsed.email.split('@')[0];
            } catch (_) {
                return v;
            }
        }
    }

    for (const chave of chaves) {
        const v = sessionStorage.getItem(chave);
        if (v) {
            try {
                const parsed = JSON.parse(v);
                if (typeof parsed === 'string') return parsed;
                if (parsed?.login) return parsed.login;
            } catch (_) { return v; }
        }
    }

    return null;
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS SUPABASE — CRUD na tabela "Geral"
// ═══════════════════════════════════════════════════════════════

async function garantirLinha() {
    const { data, error } = await supabase
        .from(TABELA)
        .select('*')
        .eq('login', USUARIO)
        .maybeSingle();

    if (error) {
        console.error('[Supabase] erro select:', error);
        throw error;
    }

    if (data) {
        _cache = data;
        return data;
    }

    const nova = {
        nome: USUARIO,
        login: USUARIO,
        senha: '123456',
        saldo: 0.00,
        saldo_poupanca: 0.00,
        proventos_pendentes: 0.00,
        selic: 10.75,
        carteira: { 'Madeira': 5, 'Pedra': 3, 'Ouro': 2, 'Poção': 1 },
        preco_medio_compra: {},
        proventos_por_ativo: {},
        plot_data: [],
        experiencia: 0,          // ⭐ NOVO
        fazendinha_dados: {
            historico: []
        }
    };

    const { data: criado, error: errIns } = await supabase
        .from(TABELA)
        .insert(nova)
        .select()
        .single();

    if (errIns) {
        console.error('[Supabase] erro insert:', errIns);
        throw errIns;
    }

    _cache = criado;
    return criado;
}

async function atualizarCampos(campos) {
    const { data, error } = await supabase
        .from(TABELA)
        .update(campos)
        .eq('login', USUARIO)
        .select()
        .single();

    if (error) {
        console.error('[Supabase] erro update:', error);
        throw error;
    }
    _cache = data;
    return data;
}

// ═══════════════════════════════════════════════════════════════
//  ACESSO AOS DADOS
// ═══════════════════════════════════════════════════════════════

function getSaldo() {
    return parseFloat(_cache?.saldo ?? 0) || 0;
}

function getCarteira() {
    return _cache?.carteira ?? {};
}

function getItem(nome) {
    const c = getCarteira();
    return parseInt(c[nome] ?? 0, 10) || 0;
}

function getExperiencia() {
    return parseInt(_cache?.experiencia ?? 0, 10) || 0;
}

function getHistorico() {
    const fd = _cache?.fazendinha_dados ?? {};
    const h = fd.historico;
    return Array.isArray(h) ? h : [];
}

// ═══════════════════════════════════════════════════════════════
//  SISTEMA DE NÍVEL / XP
// ═══════════════════════════════════════════════════════════════

/**
 * Calcula nível e progresso a partir do XP total.
 * Regra: para subir do nível N para N+1 precisa de N * XP_BASE_NIVEL.
 *   Nível 1 → 2: 100 XP
 *   Nível 2 → 3: 200 XP
 *   Nível 3 → 4: 300 XP ... etc.
 */
function calcularNivel(xpTotal) {
    let nivel = 1;
    let xpRestante = xpTotal;
    let xpNecessario = nivel * XP_BASE_NIVEL;

    while (xpRestante >= xpNecessario) {
        xpRestante -= xpNecessario;
        nivel++;
        xpNecessario = nivel * XP_BASE_NIVEL;
    }

    return {
        nivel,
        xpNoNivel: xpRestante,       // XP dentro do nível atual
        xpNecessario,                // XP para o próximo nível
        xpTotal
    };
}

// ═══════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════

function atualizarUI() {
    const saldo = getSaldo();
    document.getElementById('saldo-display').textContent = saldo.toFixed(2);
    document.getElementById('moeda-display').textContent = `💰 ${saldo.toFixed(2)}`;
    renderXP();
    renderEstoque();
    renderHistorico();
    atualizarBotoesProducao();
}

/* ---------- XP / NÍVEL ---------- */
function renderXP() {
    const xpTotal = getExperiencia();
    const info = calcularNivel(xpTotal);

    document.getElementById('nivel-display').textContent = info.nivel;
    document.getElementById('xp-display').textContent =
        `${info.xpNoNivel} / ${info.xpNecessario} XP`;

    const pct = info.xpNecessario > 0
        ? Math.min(100, (info.xpNoNivel / info.xpNecessario) * 100)
        : 0;
    document.getElementById('xp-fill').style.width = pct + '%';
}

/* Habilita/desabilita botões de produção conforme o saldo */
function atualizarBotoesProducao() {
    const saldo = getSaldo();

    const acoes = {
        'colher-madeira': { item: 'Madeira', qtd: 2 },
        'colher-pedra':   { item: 'Pedra',   qtd: 2 },
        'colher-ouro':    { item: 'Ouro',    qtd: 1 },
        'colher-pocao':   { item: 'Poção',   qtd: 1 }
    };

    for (const [id, { item, qtd }] of Object.entries(acoes)) {
        const btn = document.getElementById(id);
        if (!btn) continue;
        const custoUnit = CUSTO_PRODUCAO[item] ?? 0;
        const custoTotal = custoUnit * qtd;
        const pode = saldo >= custoTotal;

        btn.disabled = !pode;
        btn.style.opacity = pode ? '1' : '0.45';
        btn.style.cursor  = pode ? 'pointer' : 'not-allowed';
    }
}

/* ---------- ESTOQUE ---------- */
function renderEstoque() {
    const lista = document.getElementById('estoque-lista');
    const badge = document.getElementById('estoque-badge');
    const carteira = getCarteira();

    const ordem = ['Madeira', 'Pedra', 'Ouro', 'Poção'];
    const itens = ordem.filter(nome => (parseInt(carteira[nome] ?? 0, 10) || 0) > 0);

    for (const nome of Object.keys(carteira)) {
        if (!ordem.includes(nome) && (parseInt(carteira[nome] ?? 0, 10) || 0) > 0) {
            itens.push(nome);
        }
    }

    if (itens.length === 0) {
        lista.innerHTML = `<div class="estoque-vazio">Nenhum item ainda.</div>`;
        badge.textContent = '0 itens';
        return;
    }

    let totalQtd = 0;

    lista.innerHTML = itens.map(nome => {
        const qtd = parseInt(carteira[nome] ?? 0, 10) || 0;
        totalQtd += qtd;
        const emoji = EMOJI_ITEM[nome] ?? '📦';
        return `
            <div class="estoque-item">
                <span class="nome"><span>${emoji}</span> ${nome}</span>
                <span class="qtd">${qtd}</span>
            </div>
        `;
    }).join('');

    badge.textContent = `${totalQtd} un.`;
}

/* ---------- HISTÓRICO ---------- */
function formatarData(iso) {
    try {
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    } catch (_) {
        return iso;
    }
}

function renderHistorico() {
    const lista = document.getElementById('hist-lista');
    const badge = document.getElementById('hist-badge');
    const hist = getHistorico();

    badge.textContent = hist.length;

    if (hist.length === 0) {
        lista.innerHTML = `<div class="hist-vazio">Nenhuma produção registrada.</div>`;
        return;
    }

    const recentes = [...hist].reverse().slice(0, 30);

    lista.innerHTML = recentes.map(reg => {
        const emoji = EMOJI_ITEM[reg.item] ?? '📦';
        const quando = formatarData(reg.data);

        const custoTag = (reg.custo != null)
            ? `<span class="custo-tag">-${Number(reg.custo).toFixed(2)} 💰</span>`
            : '';
        const xpTag = (reg.xp != null)
            ? `<span class="xp-tag">+${reg.xp} XP</span>`
            : '';

        return `
            <div class="hist-item">
                <span class="emoji">${emoji}</span>
                <div class="detalhe">
                    <div class="topo">+${reg.qtd} ${reg.item}</div>
                    <div class="hora">${quando}</div>
                </div>
                <div class="tags">
                    ${custoTag}
                    ${xpTag}
                </div>
            </div>
        `;
    }).join('');
}

function setStatus(texto, classe) {
    const el = document.getElementById('status-db');
    el.textContent = texto;
    el.className = 'status-db' + (classe ? ' ' + classe : '');
}

function log(emoji, mensagem) {
    const area = document.getElementById('log-area');
    area.innerHTML = `<span class="emoji">${emoji}</span><span class="msg">${mensagem}</span>`;
    clearTimeout(window._logTimeout);
    window._logTimeout = setTimeout(() => {
        area.innerHTML = `<span class="emoji">📢</span><span class="msg">Pronto para mais ação!</span>`;
    }, 3000);
}

// ═══════════════════════════════════════════════════════════════
//  AÇÕES
// ═══════════════════════════════════════════════════════════════

async function colher(nome, qtd) {
    try {
        const custoUnit  = CUSTO_PRODUCAO[nome] ?? 0;
        const custoTotal = +(custoUnit * qtd).toFixed(2);
        const xpUnit     = XP_PRODUCAO[nome] ?? 0;
        const xpGanho    = xpUnit * qtd;

        const saldoAtual = getSaldo();
        const xpAtual    = getExperiencia();

        // 💰 Verifica saldo
        if (saldoAtual < custoTotal) {
            log('❌', `Saldo insuficiente! Precisa de ${custoTotal.toFixed(2)}💰 para produzir ${qtd}x ${nome}.`);
            return;
        }

        // 1) Atualiza carteira
        const carteira = { ...getCarteira() };
        carteira[nome] = (parseInt(carteira[nome] ?? 0, 10) || 0) + qtd;

        // 2) Atualiza XP total
        const xpNovo = xpAtual + xpGanho;

        // 3) Adiciona registro ao histórico
        const fazendinha_dados = { ...(_cache?.fazendinha_dados ?? {}) };
        const historicoAtual = Array.isArray(fazendinha_dados.historico)
            ? fazendinha_dados.historico
            : [];

        const registro = {
            item: nome,
            qtd: qtd,
            data: new Date().toISOString(),
            total: carteira[nome],
            custo: custoTotal,
            custo_unitario: custoUnit,
            xp: xpGanho
        };

        let novoHistorico = [...historicoAtual, registro];
        if (novoHistorico.length > LIMITE_HISTORICO) {
            novoHistorico = novoHistorico.slice(-LIMITE_HISTORICO);
        }
        fazendinha_dados.historico = novoHistorico;

        // 4) Salva tudo de uma vez
        await atualizarCampos({
            saldo: +(saldoAtual - custoTotal).toFixed(2),
            experiencia: xpNovo,
            carteira,
            fazendinha_dados
        });

        // 5) Detecta level up
        const antes = calcularNivel(xpAtual);
        const depois = calcularNivel(xpNovo);
        if (depois.nivel > antes.nivel) {
            log('🎉', `LEVEL UP! Agora você é nível ${depois.nivel}! (+${xpGanho} XP)`);
        } else {
            log('🌱', `Colheu ${qtd}x ${nome} por ${custoTotal.toFixed(2)}💰 (+${xpGanho} XP)`);
        }

        atualizarUI();
    } catch (e) {
        console.error(e);
        log('❌', 'Erro ao colher: ' + e.message);
    }
}

async function limparHistorico() {
    if (!confirm('Tem certeza que deseja apagar todo o histórico de produção?')) return;
    try {
        const fazendinha_dados = { ...(_cache?.fazendinha_dados ?? {}) };
        fazendinha_dados.historico = [];
        await atualizarCampos({ fazendinha_dados });
        log('🗑️', 'Histórico de produção apagado.');
        atualizarUI();
    } catch (e) {
        console.error(e);
        log('❌', 'Erro ao limpar histórico: ' + e.message);
    }
}

// ═══════════════════════════════════════════════════════════════
//  EVENTOS
// ═══════════════════════════════════════════════════════════════

function bindEventos() {
    document.getElementById('colher-madeira').addEventListener('click', () => colher('Madeira', 2));
    document.getElementById('colher-pedra').addEventListener('click',   () => colher('Pedra', 2));
    document.getElementById('colher-ouro').addEventListener('click',    () => colher('Ouro', 1));
    document.getElementById('colher-pocao').addEventListener('click',   () => colher('Poção', 1));

    document.getElementById('btn-limpar-hist').addEventListener('click', limparHistorico);
}

// ═══════════════════════════════════════════════════════════════
//  INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════

async function init() {
    bindEventos();

    USUARIO = obterLoginDaSessao();

    if (!USUARIO) {
        setStatus('❌ Nenhum login encontrado', 'offline');
        log('🔒', 'Faça login primeiro! Redirecionando...');
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
        return;
    }

    try {
        await garantirLinha();
        setStatus(`✅ Conectado como ${USUARIO}`, 'online');
        atualizarUI();
        log('📢', `Bem-vindo, ${_cache.nome || USUARIO}!`);
    } catch (e) {
        console.error(e);
        setStatus('❌ Erro Supabase: ' + e.message, 'offline');
        log('❌', 'Não foi possível conectar ao banco.');
        return;
    }

    supabase
        .channel('geral-changes-' + USUARIO)
        .on('postgres_changes',
            { event: 'UPDATE', schema: 'public', table: TABELA, filter: `login=eq.${USUARIO}` },
            (payload) => {
                _cache = payload.new;
                atualizarUI();
                console.log('[Realtime] Linha atualizada:', payload.new);
            }
        )
        .subscribe();
}

init();
</script>
