<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🌾 Fazenda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0b0e14;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            touch-action: manipulation;
        }
        #app {
            max-width: 520px;
            width: 100%;
            background: #1a1f2a;
            border-radius: 24px;
            padding: 20px 18px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a3344;
        }
        h1 {
            font-size: 28px;
            color: #f0e8d0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        h1 small {
            font-size: 14px;
            font-weight: 400;
            color: #8892a8;
            margin-left: auto;
        }
        .saldo-box {
            background: #0f141e;
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #2a3344;
            margin-bottom: 18px;
        }
        .saldo-box span {
            font-size: 16px;
            color: #b0baca;
        }
        .saldo-box .valor {
            font-size: 26px;
            font-weight: 800;
            color: #f0c040;
        }
        .secao {
            background: #0f141e;
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 16px;
            border: 1px solid #2a3344;
        }
        .secao h3 {
            color: #c8d0e0;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .secao h3 .badge {
            margin-left: auto;
            font-size: 11px;
            background: #2a3344;
            color: #8892a8;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .secao .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .secao .grid button {
            flex: 1 0 calc(50% - 10px);
            min-width: 100px;
            padding: 12px 0;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            background: #2a3344;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            touch-action: manipulation;
            border: 1px solid #3a4458;
        }
        .secao .grid button:active {
            transform: scale(0.94);
        }
        .secao .grid button.colher {
            background: linear-gradient(135deg, #27ae60, #1e8449);
            border-color: #27ae60;
        }
        .secao .grid button.vender {
            background: linear-gradient(135deg, #f39c12, #d68910);
            border-color: #f39c12;
        }
        .secao .grid button.comprar {
            background: linear-gradient(135deg, #3498db, #2176ae);
            border-color: #3498db;
        }
        .secao .grid button.danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #e74c3c;
        }

        /* Estoque */
        .estoque-lista {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .estoque-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b0e14;
            border: 1px solid #1e2635;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 14px;
            color: #c8d0e0;
        }
        .estoque-item .nome {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .estoque-item .qtd {
            font-weight: 800;
            color: #f0c040;
            font-size: 16px;
        }
        .estoque-vazio {
            color: #6b7688;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
        }

        /* Histórico */
        .hist-lista {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .hist-lista::-webkit-scrollbar {
            width: 6px;
        }
        .hist-lista::-webkit-scrollbar-thumb {
            background: #2a3344;
            border-radius: 6px;
        }
        .hist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0b0e14;
            border: 1px solid #1e2635;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            color: #b0baca;
        }
        .hist-item .emoji {
            font-size: 18px;
        }
        .hist-item .detalhe {
            flex: 1;
        }
        .hist-item .detalhe .topo {
            color: #f0e8d0;
            font-weight: 700;
        }
        .hist-item .detalhe .hora {
            font-size: 11px;
            color: #6b7688;
            margin-top: 2px;
        }
        .hist-vazio {
            color: #6b7688;
            font-size: 13px;
            text-align: center;
            padding: 12px 0;
        }
        .btn-limpar {
            width: 100%;
            margin-top: 10px;
            padding: 10px 0;
            border-radius: 40px;
            border: 1px solid #e74c3c;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            transition: transform 0.1s;
        }
        .btn-limpar:active {
            transform: scale(0.96);
        }

        .log {
            background: #0b0e14;
            border-radius: 12px;
            padding: 10px 14px;
            color: #8892a8;
            font-size: 13px;
            min-height: 44px;
            border: 1px solid #1e2635;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .log .emoji {
            font-size: 20px;
        }
        .log .msg {
            flex: 1;
        }
        .nav-links {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .nav-links a {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            border-radius: 40px;
            background: #2a3344;
            color: #c8d0e0;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.15s, transform 0.1s;
            touch-action: manipulation;
            border: 1px solid #3a4458;
        }
        .nav-links a:active {
            transform: scale(0.94);
        }
        .nav-links a.mochila {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border-color: #a855f7;
            color: #fff;
        }
        .nav-links a.jogo {
            background: linear-gradient(135deg, #4a90d9, #2a5a8a);
            border-color: #4a90d9;
            color: #fff;
        }
        .status-db {
            font-size: 11px;
            color: #6b7688;
            text-align: right;
            margin-bottom: 8px;
        }
        .status-db.online { color: #27ae60; }
        .status-db.offline { color: #e74c3c; }

        @media (max-width: 420px) {
            #app { padding: 14px 12px 20px; }
            h1 { font-size: 22px; }
            .saldo-box .valor { font-size: 22px; }
            .secao .grid button { font-size: 12px; padding: 10px 0; }
        }
    </style>
</head>
<body>
<div id="app">
    <h1>
        🌾 Fazenda
    <div class="nav-links">
        <a href="../../dashboard.html" class="nav-link fazenda">🎮 Dashboard</a>
    </div>
        <small id="moeda-display">💰 0,00</small>
    </h1>
    <div class="status-db" id="status-db">⏳ Conectando ao Supabase...</div>

    <div class="saldo-box">
        <span>💰 Saldo</span>
        <span class="valor" id="saldo-display">0,00</span>
    </div>
    <!-- LOG -->
    <div class="log" id="log-area">
        <span class="emoji">📢</span>
        <span class="msg">Bem-vindo à fazenda!</span>
    </div>
    <!-- COLHER / PRODUZIR -->
    <div class="secao">
        <h3>🌱 Produção</h3>
        <div class="grid">
            <button class="colher" id="colher-madeira">🪵 Madeira (+2)</button>
            <button class="colher" id="colher-pedra">🪨 Pedra (+2)</button>
            <button class="colher" id="colher-ouro">💎 Ouro (+1)</button>
            <button class="colher" id="colher-pocao">🧪 Poção (+1)</button>
        </div>
    </div>

    <!-- ESTOQUE -->
    <div class="secao">
        <h3>🎒 Estoque <span class="badge" id="estoque-badge">0 itens</span></h3>
        <div class="estoque-lista" id="estoque-lista">
            <div class="estoque-vazio">Nenhum item ainda.</div>
        </div>
    </div>

    <!-- HISTÓRICO DE PRODUÇÃO -->
    <div class="secao">
        <h3>📜 Histórico de Produção <span class="badge" id="hist-badge">0</span></h3>
        <div class="hist-lista" id="hist-lista">
            <div class="hist-vazio">Nenhuma produção registrada.</div>
        </div>
        <button class="btn-limpar" id="btn-limpar-hist">🗑️ Limpar histórico</button>
    </div>


</div>

<!-- ═══════════════════════════════════════════════════════════════
     SUPABASE SDK (via CDN, ES module)
     ═══════════════════════════════════════════════════════════════ -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ═══════════════════════════════════════════════════════════════
//  CONFIGURAÇÃO DO SUPABASE
// ═══════════════════════════════════════════════════════════════
const SUPABASE_URL      = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══════════════════════════════════════════════════════════════
//  CONFIGURAÇÕES GERAIS
// ═══════════════════════════════════════════════════════════════
const TABELA = 'Geral';
const LIMITE_HISTORICO = 100; // máximo de registros guardados

// ⚠️ USUARIO agora vem da sessão de login (login.html)
let USUARIO = null;
let _cache  = null;

// Emojis por item (para o histórico e estoque)
const EMOJI_ITEM = {
    'Madeira': '🪵',
    'Pedra':   '🪨',
    'Ouro':    '💎',
    'Poção':   '🧪'
};

// ═══════════════════════════════════════════════════════════════
//  RECUPERAR LOGIN DA SESSÃO
// ═══════════════════════════════════════════════════════════════
function obterLoginDaSessao() {
    // 1) Supabase Auth nativo
    const authKeys = Object.keys(localStorage).filter(k =>
        k.startsWith('sb-') && k.endsWith('-auth-token')
    );
    for (const k of authKeys) {
        try {
            const sess = JSON.parse(localStorage.getItem(k));
            const email = sess?.user?.email;
            if (email) return email.split('@')[0];
            const meta = sess?.user?.user_metadata?.login;
            if (meta) return meta;
        } catch (_) {}
    }

    // 2) Chaves customizadas
    const chaves = [
        'usuario_logado', 'login', 'login_usuario', 'usuario', 'user',
        'mm_usuario_logado', 'mm_quase_tudo_usuario'
    ];
    for (const chave of chaves) {
        const v = localStorage.getItem(chave);
        if (v) {
            try {
                const parsed = JSON.parse(v);
                if (typeof parsed === 'string') return parsed;
                if (parsed?.login)  return parsed.login;
                if (parsed?.usuario) return parsed.usuario;
                if (parsed?.email)  return parsed.email.split('@')[0];
            } catch (_) {
                return v;
            }
        }
    }

    // 3) Session storage
    for (const chave of chaves) {
        const v = sessionStorage.getItem(chave);
        if (v) {
            try {
                const parsed = JSON.parse(v);
                if (typeof parsed === 'string') return parsed;
                if (parsed?.login) return parsed.login;
            } catch (_) { return v; }
        }
    }

    return null;
}

// ═══════════════════════════════════════════════════════════════
//  HELPERS SUPABASE — CRUD na tabela "Geral"
// ═══════════════════════════════════════════════════════════════

async function garantirLinha() {
    const { data, error } = await supabase
        .from(TABELA)
        .select('*')
        .eq('login', USUARIO)
        .maybeSingle();

    if (error) {
        console.error('[Supabase] erro select:', error);
        throw error;
    }

    if (data) {
        _cache = data;
        return data;
    }

    const nova = {
        nome: USUARIO,
        login: USUARIO,
        senha: '123456',
        saldo: 0.00,
        saldo_poupanca: 0.00,
        proventos_pendentes: 0.00,
        selic: 10.75,
        carteira: { 'Madeira': 5, 'Pedra': 3, 'Ouro': 2, 'Poção': 1 },
        preco_medio_compra: {},
        proventos_por_ativo: {},
        plot_data: [],
        fazendinha_dados: {
            historico: []   // ← histórico de produção
        }
    };

    const { data: criado, error: errIns } = await supabase
        .from(TABELA)
        .insert(nova)
        .select()
        .single();

    if (errIns) {
        console.error('[Supabase] erro insert:', errIns);
        throw errIns;
    }

    _cache = criado;
    return criado;
}

async function atualizarCampos(campos) {
    const { data, error } = await supabase
        .from(TABELA)
        .update(campos)
        .eq('login', USUARIO)
        .select()
        .single();

    if (error) {
        console.error('[Supabase] erro update:', error);
        throw error;
    }
    _cache = data;
    return data;
}

// ═══════════════════════════════════════════════════════════════
//  ACESSO AOS DADOS
// ═══════════════════════════════════════════════════════════════

function getSaldo() {
    return parseFloat(_cache?.saldo ?? 0) || 0;
}

function getCarteira() {
    return _cache?.carteira ?? {};
}

function getItem(nome) {
    const c = getCarteira();
    return parseInt(c[nome] ?? 0, 10) || 0;
}

function getHistorico() {
    const fd = _cache?.fazendinha_dados ?? {};
    const h = fd.historico;
    return Array.isArray(h) ? h : [];
}

// ═══════════════════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════════════════

function atualizarUI() {
    const saldo = getSaldo();
    document.getElementById('saldo-display').textContent = saldo.toFixed(2);
    document.getElementById('moeda-display').textContent = `💰 ${saldo.toFixed(2)}`;
    renderEstoque();
    renderHistorico();
}

/* ---------- ESTOQUE ---------- */
function renderEstoque() {
    const lista = document.getElementById('estoque-lista');
    const badge = document.getElementById('estoque-badge');
    const carteira = getCarteira();

    // Ordem fixa dos itens conhecidos
    const ordem = ['Madeira', 'Pedra', 'Ouro', 'Poção'];
    const itens = ordem.filter(nome => (parseInt(carteira[nome] ?? 0, 10) || 0) > 0);

    // Itens extras que o jogador possa ter
    for (const nome of Object.keys(carteira)) {
        if (!ordem.includes(nome) && (parseInt(carteira[nome] ?? 0, 10) || 0) > 0) {
            itens.push(nome);
        }
    }

    if (itens.length === 0) {
        lista.innerHTML = `<div class="estoque-vazio">Nenhum item ainda.</div>`;
        badge.textContent = '0 itens';
        return;
    }

    let totalTipos = itens.length;
    let totalQtd = 0;

    lista.innerHTML = itens.map(nome => {
        const qtd = parseInt(carteira[nome] ?? 0, 10) || 0;
        totalQtd += qtd;
        const emoji = EMOJI_ITEM[nome] ?? '📦';
        return `
            <div class="estoque-item">
                <span class="nome"><span>${emoji}</span> ${nome}</span>
                <span class="qtd">${qtd}</span>
            </div>
        `;
    }).join('');

    badge.textContent = `${totalQtd} un.`;
}

/* ---------- HISTÓRICO ---------- */
function formatarData(iso) {
    try {
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', {
            day: '2-digit', month: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    } catch (_) {
        return iso;
    }
}

function renderHistorico() {
    const lista = document.getElementById('hist-lista');
    const badge = document.getElementById('hist-badge');
    const hist = getHistorico();

    badge.textContent = hist.length;

    if (hist.length === 0) {
        lista.innerHTML = `<div class="hist-vazio">Nenhuma produção registrada.</div>`;
        return;
    }

    // Mostra os mais recentes primeiro (últimos 30)
    const recentes = [...hist].reverse().slice(0, 30);

    lista.innerHTML = recentes.map(reg => {
        const emoji = EMOJI_ITEM[reg.item] ?? '📦';
        const quando = formatarData(reg.data);
        return `
            <div class="hist-item">
                <span class="emoji">${emoji}</span>
                <div class="detalhe">
                    <div class="topo">+${reg.qtd} ${reg.item}</div>
                    <div class="hora">${quando}</div>
                </div>
            </div>
        `;
    }).join('');
}

function setStatus(texto, classe) {
    const el = document.getElementById('status-db');
    el.textContent = texto;
    el.className = 'status-db' + (classe ? ' ' + classe : '');
}

function log(emoji, mensagem) {
    const area = document.getElementById('log-area');
    area.innerHTML = `<span class="emoji">${emoji}</span><span class="msg">${mensagem}</span>`;
    clearTimeout(window._logTimeout);
    window._logTimeout = setTimeout(() => {
        area.innerHTML = `<span class="emoji">📢</span><span class="msg">Pronto para mais ação!</span>`;
    }, 3000);
}

// ═══════════════════════════════════════════════════════════════
//  AÇÕES
// ═══════════════════════════════════════════════════════════════

async function colher(nome, qtd) {
    try {
        // 1) Atualiza carteira
        const carteira = { ...getCarteira() };
        carteira[nome] = (parseInt(carteira[nome] ?? 0, 10) || 0) + qtd;

        // 2) Adiciona registro ao histórico (dentro de fazendinha_dados)
        const fazendinha_dados = { ...(_cache?.fazendinha_dados ?? {}) };
        const historicoAtual = Array.isArray(fazendinha_dados.historico)
            ? fazendinha_dados.historico
            : [];

        const registro = {
            item: nome,
            qtd: qtd,
            data: new Date().toISOString(),
            total: carteira[nome]
        };

        let novoHistorico = [...historicoAtual, registro];
        // Limita tamanho (mantém os últimos N)
        if (novoHistorico.length > LIMITE_HISTORICO) {
            novoHistorico = novoHistorico.slice(-LIMITE_HISTORICO);
        }
        fazendinha_dados.historico = novoHistorico;

        // 3) Salva tudo de uma vez no Supabase
        await atualizarCampos({ carteira, fazendinha_dados });

        log('🌱', `Colheu ${qtd}x ${nome}! (total: ${carteira[nome]})`);
        atualizarUI();
    } catch (e) {
        console.error(e);
        log('❌', 'Erro ao colher: ' + e.message);
    }
}

async function limparHistorico() {
    if (!confirm('Tem certeza que deseja apagar todo o histórico de produção?')) return;
    try {
        const fazendinha_dados = { ...(_cache?.fazendinha_dados ?? {}) };
        fazendinha_dados.historico = [];
        await atualizarCampos({ fazendinha_dados });
        log('🗑️', 'Histórico de produção apagado.');
        atualizarUI();
    } catch (e) {
        console.error(e);
        log('❌', 'Erro ao limpar histórico: ' + e.message);
    }
}

// ═══════════════════════════════════════════════════════════════
//  EVENTOS
// ═══════════════════════════════════════════════════════════════

function bindEventos() {
    document.getElementById('colher-madeira').addEventListener('click', () => colher('Madeira', 2));
    document.getElementById('colher-pedra').addEventListener('click',   () => colher('Pedra', 2));
    document.getElementById('colher-ouro').addEventListener('click',    () => colher('Ouro', 1));
    document.getElementById('colher-pocao').addEventListener('click',   () => colher('Poção', 1));

    document.getElementById('btn-limpar-hist').addEventListener('click', limparHistorico);
}

// ═══════════════════════════════════════════════════════════════
//  INICIALIZAÇÃO
// ═══════════════════════════════════════════════════════════════

async function init() {
    bindEventos();

    // 1) Descobre quem está logado
    USUARIO = obterLoginDaSessao();

    if (!USUARIO) {
        setStatus('❌ Nenhum login encontrado', 'offline');
        log('🔒', 'Faça login primeiro! Redirecionando...');
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
        return;
    }

    // 2) Conecta ao Supabase com esse login
    try {
        await garantirLinha();
        setStatus(`✅ Conectado como ${USUARIO}`, 'online');
        atualizarUI();
        log('📢', `Bem-vindo, ${_cache.nome || USUARIO}!`);
    } catch (e) {
        console.error(e);
        setStatus('❌ Erro Supabase: ' + e.message, 'offline');
        log('❌', 'Não foi possível conectar ao banco.');
        return;
    }

    // 3) Realtime
    supabase
        .channel('geral-changes-' + USUARIO)
        .on('postgres_changes',
            { event: 'UPDATE', schema: 'public', table: TABELA, filter: `login=eq.${USUARIO}` },
            (payload) => {
                _cache = payload.new;
                atualizarUI();
                console.log('[Realtime] Linha atualizada:', payload.new);
            }
        )
        .subscribe();
}

init();
</script>
</body>
</html>
