<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Mercado - MM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --neon-yellow: #fbbf24;
            --bg-primary: #0a0a0f;
            --bg-secondary: #111122;
            --bg-card: #1a1a2e;
            --bg-input: #0d0d1a;
            --text-primary: #e8e8ff;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --border-neon: 0 0 15px rgba(0, 255, 136, 0.3);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px 28px 32px;
            border: 1px solid rgba(0, 255, 136, 0.12);
            box-shadow: var(--shadow-card);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.08);
            margin-bottom: 16px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-secondary);
            padding: 8px 16px 8px 10px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--bg-primary);
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .user-info { display: flex; flex-direction: column; line-height: 1.3; }
        .user-nick { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
        .user-balance { font-size: 0.8rem; color: var(--neon-yellow); font-family: 'Share Tech Mono', monospace; font-weight: 600; }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.1));
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 136, 0.15);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .btn-voltar:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
            border-color: var(--neon-green);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-secondary);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 136, 0.06);
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: var(--neon-green); box-shadow: 0 0 12px rgba(0, 255, 136, 0.6); }
        .dot.offline { background: #ff4444; }
        .dot.checking { background: var(--neon-yellow); animation: pulse-dot 1s ease-in-out infinite; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .status-item .value.online { color: var(--neon-green); }
        .status-item .value.offline { color: #ff4444; }
        .status-item .value.checking { color: var(--neon-yellow); }

        .status-reconnect {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .status-reconnect:hover { color: var(--neon-blue); }

        .level-widget {
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.04), rgba(0, 212, 255, 0.04));
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .lw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .lw-badge { display: flex; align-items: center; gap: 14px; }
        .lw-num {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .lw-label { font-family: 'Orbitron', monospace; font-size: 0.55rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        .lw-title { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
        .lw-exp { flex: 1; min-width: 150px; max-width: 350px; }
        .lw-bar { width: 100%; height: 6px; background: var(--bg-secondary); border-radius: 50px; overflow: hidden; border: 1px solid rgba(0, 255, 136, 0.05); }
        .lw-fill { height: 100%; background: linear-gradient(90deg, var(--neon-green), var(--neon-blue)); border-radius: 50px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .lw-text { display: flex; justify-content: space-between; font-size: 0.7rem; font-family: 'Share Tech Mono', monospace; color: var(--text-secondary); margin-top: 4px; }
        .lw-cur { color: var(--neon-green); font-weight: 700; }
        .lw-nxt { color: var(--text-muted); }

        .lw-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 255, 136, 0.06);
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-secondary);
        }
        .lw-stats span { display: flex; align-items: center; gap: 6px; }
        .lw-stats .hp-c { color: #ff4444; font-weight: 600; }
        .lw-stats .mp-c { color: var(--neon-blue); font-weight: 600; }
        .lw-stats .sm-c { color: var(--neon-yellow); font-weight: 600; }
        .lw-stats .atk-c { color: #ff6b6b; font-weight: 600; }
        .lw-stats .def-c { color: #4ecdc4; font-weight: 600; }
        .lw-stats .mag-c { color: var(--neon-purple); font-weight: 600; }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .market-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .market-header h2 i { -webkit-text-fill-color: initial; color: var(--neon-green); margin-right: 8px; }
        .saldo-box {
            background: var(--bg-secondary);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .saldo-box .label { color: var(--text-muted); font-size: 0.75rem; }
        .saldo-box .value { color: var(--neon-yellow); font-weight: 700; font-size: 1.1rem; }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .market-item {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(0, 255, 136, 0.06);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .market-item:hover {
            border-color: rgba(0, 255, 136, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .item-icon {
            font-size: 2rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 136, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.06);
        }
        .item-name { font-family: 'Orbitron', monospace; font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }
        .item-sub { font-size: 0.7rem; color: var(--text-muted); }
        .item-price { font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--neon-yellow); margin: 6px 0 4px; }
        .item-price span { font-size: 0.7rem; font-weight: 400; color: var(--text-muted); }
        .item-stock { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; }
        .item-stock strong { color: var(--text-secondary); }

        .item-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .qty-group { display: flex; align-items: center; }
        .qty-input {
            width: 56px;
            padding: 6px 4px;
            background: var(--bg-input);
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            text-align: center;
        }
        .qty-input:focus { outline: none; border-color: var(--neon-green); }
        .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .qty-input[type="number"] { -moz-appearance: textfield; }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-buy {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.12), rgba(0, 212, 255, 0.12));
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 136, 0.15);
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
        }
        .btn-buy:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-sell {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(251, 146, 60, 0.08));
            color: var(--neon-yellow);
            border: 1px solid rgba(251, 191, 36, 0.12);
        }
        .btn-sell:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 146, 60, 0.15));
        }
        .btn-sell:disabled { opacity: 0.3; cursor: not-allowed; }

        .player-inventory {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(0, 255, 136, 0.06);
            margin-top: 4px;
        }
        .player-inventory h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .player-inventory h3 i { color: var(--neon-green); margin-right: 8px; }
        .inv-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
        .inv-item {
            background: var(--bg-input);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 255, 136, 0.06);
            transition: var(--transition);
            font-family: 'Rajdhani', sans-serif;
        }
        .inv-item:hover { border-color: rgba(0, 255, 136, 0.15); background: rgba(0, 255, 136, 0.04); }
        .inv-item .qty { color: var(--neon-yellow); font-weight: 700; font-family: 'Share Tech Mono', monospace; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.12);
            box-shadow: var(--shadow-card);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        #loginModal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        #loginModal.show { display: flex; }

        .modal-box {
            background: var(--bg-card);
            padding: 40px 44px;
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(0, 255, 136, 0.08);
            box-shadow: var(--shadow-card);
        }
        .modal-box h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .modal-box .sub { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid rgba(0, 255, 136, 0.06);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus { outline: none; border-color: var(--neon-green); }
        .login-error { color: #ff4444; font-size: 0.8rem; min-height: 24px; text-align: center; margin-top: 4px; }
        .btn-login-modal {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-green), #00b368);
            border: none;
            border-radius: 12px;
            color: var(--bg-primary);
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .btn-login-modal:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0, 255, 136, 0.2); }

        .modal-actions { display: flex; justify-content: center; gap: 16px; margin-top: 16px; }
        .modal-actions button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            padding: 4px 12px;
            border-radius: 8px;
        }
        .modal-actions button:hover { color: var(--neon-green); background: rgba(0, 255, 136, 0.04); }

        @media (max-width: 768px) {
            .card { padding: 16px 14px 24px; }
            .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
            .user-profile { width: 100%; justify-content: center; }
            .market-grid { grid-template-columns: 1fr; }
            .modal-box { padding: 28px 20px; margin: 16px; }
            .lw-header { flex-direction: column; align-items: stretch; }
            .lw-badge { justify-content: center; }
            .lw-exp { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">

        <nav class="nav-bar">
            <div class="user-profile" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-nick" id="userName">Visitante</span>
                    <span class="user-balance" id="userBalanceDisplay">💰 R$ 0,00</span>
                </div>
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <a href="planta.html" class="btn-voltar" style="background:linear-gradient(135deg,#27ae60,#1e8449);border-color:#27ae60;">🌽 Fazenda</a>
                <a href="mochila.html" class="btn-voltar" style="background:linear-gradient(135deg,#f59e0b,#d97706);border-color:#f59e0b;">🎒 Mochila</a>
                <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>
            </div>

            <div class="status-bar" id="statusBar">
                <div class="status-item">
                    <span class="dot checking" id="supabaseDot"></span>
                    <span class="label">Supabase:</span>
                    <span class="value checking" id="supabaseStatus">Verificando...</span>
                    <button class="status-reconnect" id="btnReconnectSupabase" title="Reconectar">🔄</button>
                </div>
                <div class="status-item" style="margin-left:auto;">
                    <span>💰 R$ <span id="headerSaldo">0,00</span></span>
                </div>
            </div>
        </nav>

        <div class="level-widget" id="levelWidget">
            <div class="lw-header">
                <div class="lw-badge">
                    <span class="lw-num" id="lwNivel">1</span>
                    <div>
                        <div class="lw-label">NÍVEL</div>
                        <div class="lw-title" id="lwTitulo">🌱 Iniciante</div>
                    </div>
                </div>
                <div class="lw-exp">
                    <div class="lw-bar">
                        <div class="lw-fill" id="lwExpFill" style="width:0%"></div>
                    </div>
                    <div class="lw-text">
                        <span class="lw-cur" id="lwExpAtual">0</span>
                        <span>/ <span class="lw-nxt" id="lwExpProx">100</span> EXP</span>
                    </div>
                </div>
            </div>

            <div class="lw-stats">
                <span>❤️ HP<span class="hp-c" id="lwHp">100/100</span></span>
                <span>💧 MANA<span class="mp-c" id="lwMp">50/50</span></span>
                <span>⚡ STAMINA<span class="sm-c" id="lwSm">100/100</span></span>
                <span>⚔️ FORCA<span class="atk-c" id="lwAtk">15</span></span>
                <span>🛡️ DEFESA<span class="def-c" id="lwDef">10</span></span>
                <span>🔮 MAGIA<span class="mag-c" id="lwMag">8</span></span>
            </div>
        </div>

        <div class="market-header">
            <h2><i class="fas fa-store"></i> Mercado</h2>
            <div class="saldo-box">
                <span class="label">💰 Saldo:</span>
                <span class="value" id="marketSaldo">R$ 0,00</span>
            </div>
        </div>

        <div class="market-grid" id="marketGrid"></div>

        <div class="player-inventory">
            <h3><i class="fas fa-box"></i> Seu Estoque</h3>
            <div class="inv-grid" id="inventoryGrid">
                <span style="color:var(--text-muted); font-size:0.8rem;">Carregando...</span>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <div id="loginModal">
        <div class="modal-box">
            <h2>🌾 Mercado</h2>
            <p class="sub"><i class="fas fa-store" style="color:#f59e0b;"></i> Entre para comprar e vender</p>
            <div class="form-group">
                <label>Usuário</label>
                <input type="text" id="loginUser" placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" placeholder="Digite sua senha">
            </div>
            <div class="login-error" id="loginError"></div>
            <button class="btn-login-modal" id="btnLogin">Entrar</button>
            <div class="modal-actions">
                <button id="btnRegister">Criar conta</button>
                <button id="btnGuest">Visitante</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
            const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
            const TABELA = 'Geral';

            let supabaseOnline = false;
            let usuarioLogado = null;
            let toastTimeout = null;
            let salvando = false;

            // ============================================================
            // ITENS DO MERCADO
            // ============================================================
            const ITENS_MERCADO = [
                { id: 'sementes', nome: 'Sementes', emoji: '🌰', descricao: 'Plante no milharal', precoBase: 5, precoAtual: 5, qtdDisponivel: 100, qtdMaxima: 200 },
                { id: 'milho', nome: 'Milho', emoji: '🌽', descricao: 'Colheita do milharal', precoBase: 8, precoAtual: 8, qtdDisponivel: 80, qtdMaxima: 150 },
                { id: 'ovos', nome: 'Ovos', emoji: '🥚', descricao: 'Produzidos por galinhas', precoBase: 3, precoAtual: 3, qtdDisponivel: 120, qtdMaxima: 200 },
                { id: 'galinhas', nome: 'Galinhas', emoji: '🐔', descricao: 'Produzem ovos', precoBase: 25, precoAtual: 25, qtdDisponivel: 30, qtdMaxima: 60 },
                { id: 'madeira', nome: 'Madeira', emoji: '🪵', descricao: 'Recurso básico', precoBase: 10, precoAtual: 10, qtdDisponivel: 150, qtdMaxima: 300 },
                { id: 'pedra', nome: 'Pedra', emoji: '🪨', descricao: 'Recurso básico', precoBase: 15, precoAtual: 15, qtdDisponivel: 120, qtdMaxima: 250 },
                { id: 'ouro', nome: 'Ouro', emoji: '💎', descricao: 'Recurso valioso', precoBase: 50, precoAtual: 50, qtdDisponivel: 40, qtdMaxima: 100 },
                { id: 'pocao', nome: 'Poção', emoji: '🧪', descricao: 'Item mágico', precoBase: 25, precoAtual: 25, qtdDisponivel: 60, qtdMaxima: 120 },
                { id: 'balde', nome: 'Balde', emoji: '🪣', descricao: 'Útil para carregar líquidos', precoBase: 12, precoAtual: 12, qtdDisponivel: 80, qtdMaxima: 150 }
            ];

            let inventario = {};
            let saldo = 0;

            function initInventario() {
                inventario = {};
                ITENS_MERCADO.forEach(item => { inventario[item.id] = 0; });
            }
            initInventario();

            // ============================================================
            // DOM REFS
            // ============================================================
            const marketGrid = document.getElementById('marketGrid');
            const inventoryGrid = document.getElementById('inventoryGrid');
            const marketSaldo = document.getElementById('marketSaldo');
            const headerSaldo = document.getElementById('headerSaldo');
            const userBalanceDisplay = document.getElementById('userBalanceDisplay');

            // ============================================================
            // FUNÇÕES AUXILIARES
            // ============================================================
            function formatSaldo(valor) {
                return Number(valor).toFixed(2).replace('.', ',');
            }

            function getSaldoTotal() {
                return saldo || 0;
            }

            function atualizarSaldoGlobal() {
                const total = getSaldoTotal();
                if (headerSaldo) headerSaldo.textContent = formatSaldo(total);
                if (marketSaldo) marketSaldo.textContent = `R$ ${formatSaldo(total)}`;
                if (userBalanceDisplay) userBalanceDisplay.textContent = `💰 R$ ${formatSaldo(total)}`;
            }

            function showToast(text, duration = 2200) {
                const toastEl = document.getElementById('toast');
                if (toastTimeout) { clearTimeout(toastTimeout); toastEl.classList.remove('show'); }
                toastEl.textContent = text;
                toastEl.classList.add('show');
                toastTimeout = setTimeout(() => { toastEl.classList.remove('show'); toastTimeout = null; }, duration);
            }

            // ============================================================
            // FUNÇÕES DE NÍVEL
            // ============================================================
            function getTitulo(nivel) {
                const titulos = [
                    { min: 1, titulo: '🌱 Iniciante' },
                    { min: 5, titulo: '🌿 Aprendiz' },
                    { min: 10, titulo: '⚔️ Guerreiro' },
                    { min: 20, titulo: '🛡️ Mestre' },
                    { min: 35, titulo: '🏆 Lendário' },
                    { min: 50, titulo: '👑 Herói' },
                    { min: 75, titulo: '⚡ Deus da Guerra' },
                    { min: 100, titulo: '🌟 Imortal' },
                ];
                let titulo = titulos[0].titulo;
                for (const t of titulos) {
                    if (nivel >= t.min) titulo = t.titulo;
                }
                return titulo;
            }

            function atualizarLevelWidget(dados) {
                if (!dados) return;
                const nivel = dados.nivel || 1;
                const exp = dados.experiencia || 0;
                const expProx = dados.exp_next || 100;
                const pct = (exp / expProx) * 100;

                document.getElementById('lwNivel').textContent = nivel;
                document.getElementById('lwTitulo').textContent = getTitulo(nivel);
                document.getElementById('lwExpFill').style.width = Math.min(pct, 100) + '%';
                document.getElementById('lwExpAtual').textContent = exp;
                document.getElementById('lwExpProx').textContent = expProx;
                document.getElementById('lwHp').textContent = `${dados.hp || 100}/${dados.max_hp || 100}`;
                document.getElementById('lwMp').textContent = `${dados.mp || 50}/${dados.max_mp || 50}`;
                document.getElementById('lwSm').textContent = `${dados.sm || 100}/${dados.max_sm || 100}`;
                document.getElementById('lwAtk').textContent = dados.atk || 15;
                document.getElementById('lwDef').textContent = dados.def || 10;
                document.getElementById('lwMag').textContent = dados.mag || 8;
            }

            // ============================================================
            // STATUS UI
            // ============================================================
            function atualizarStatusSupabase(online, texto) {
                const dot = document.getElementById('supabaseDot');
                const status = document.getElementById('supabaseStatus');
                if (dot) dot.className = 'dot ' + (online ? 'online' : 'offline');
                if (status) {
                    status.className = 'value ' + (online ? 'online' : 'offline');
                    status.textContent = texto;
                }
                supabaseOnline = online;
            }

            // ============================================================
            // VERIFICAÇÃO DE CONEXÃO
            // ============================================================
            async function verificarSupabase() {
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?select=id&limit=1`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    });
                    if (response.ok) {
                        supabaseOnline = true;
                        atualizarStatusSupabase(true, 'Online');
                        return true;
                    } else {
                        supabaseOnline = false;
                        atualizarStatusSupabase(false, `Erro ${response.status}`);
                        return false;
                    }
                } catch (error) {
                    supabaseOnline = false;
                    atualizarStatusSupabase(false, 'Falha');
                    return false;
                }
            }

            // ============================================================
            // AUTENTICAÇÃO
            // ============================================================
            function carregarUsuario() {
                try {
                    const data = localStorage.getItem('usuario_logado');
                    if (data) {
                        usuarioLogado = JSON.parse(data);
                        return true;
                    }
                } catch (e) { console.error(e); }
                return false;
            }

            function salvarUsuarioLocal(usuario) {
                try {
                    localStorage.setItem('usuario_logado', JSON.stringify(usuario));
                    usuarioLogado = usuario;
                } catch (e) { console.error(e); }
            }

            function atualizarInterfaceUsuario() {
                const avatarEl = document.getElementById('userAvatar');
                const nomeEl = document.getElementById('userName');

                if (usuarioLogado && usuarioLogado.login) {
                    const nome = usuarioLogado.nome || usuarioLogado.login;
                    const inicial = nome.charAt(0).toUpperCase();
                    if (avatarEl) avatarEl.textContent = inicial;
                    if (nomeEl) nomeEl.textContent = nome;
                } else {
                    if (avatarEl) avatarEl.textContent = '?';
                    if (nomeEl) nomeEl.textContent = 'Visitante';
                }
                atualizarSaldoGlobal();
            }

            function mostrarLogin() {
                document.getElementById('loginModal').classList.add('show');
            }
            function esconderLogin() {
                document.getElementById('loginModal').classList.remove('show');
            }

            // ============================================================
            // AUTENTICAÇÃO COM SUPABASE
            // ============================================================
            async function autenticarUsuario(login, senha, criar = false) {
                const url = criar ?
                    `${SUPABASE_URL}/rest/v1/${TABELA}` :
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(login)}`;

                const options = {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                };

                if (criar) {
                    options.method = 'POST';
                    options.headers['Content-Type'] = 'application/json';

                    const invInicial = {};
                    ITENS_MERCADO.forEach(item => { invInicial[item.id] = 0; });

                    const mercadoInicial = {};
                    ITENS_MERCADO.forEach(item => { mercadoInicial[item.id] = item.qtdMaxima; });

                    options.body = JSON.stringify({
                        login: login,
                        nome: login,
                        senha: senha,
                        saldo: 50.00,
                        seeds: 0,
                        nivel: 1,
                        experiencia: 0,
                        hp: 100,
                        max_hp: 100,
                        mp: 50,
                        max_mp: 50,
                        sm: 100,
                        max_sm: 100,
                        atk: 15,
                        def: 10,
                        mag: 8,
                        carteira: {
                            'Madeira': 0,
                            'Pedra': 0,
                            'Ouro': 0,
                            'Poção': 0,
                            'Balde': 0
                        },
                        fazendinha_dados: {
                            inventario: invInicial,
                            plantio: { active: false, stage: 0, progress: 0 },
                            incubacao: { active: false, stage: 0, progress: 0 },
                            saldo: 50.00,
                            mercado_estoque: mercadoInicial
                        }
                    });
                }

                try {
                    const response = await fetch(url, options);

                    if (!response.ok) {
                        if (criar && response.status === 409) {
                            document.getElementById('loginError').textContent = '❌ Usuário já existe!';
                            return false;
                        }
                        document.getElementById('loginError').textContent = `❌ Erro ${response.status}`;
                        return false;
                    }

                    if (criar) {
                        document.getElementById('loginError').textContent = '✅ Conta criada! Faça login.';
                        return false;
                    }

                    const data = await response.json();
                    if (!data || data.length === 0) {
                        document.getElementById('loginError').textContent = '❌ Usuário não encontrado';
                        return false;
                    }

                    const usuario = data[0];
                    if (usuario.senha !== senha) {
                        document.getElementById('loginError').textContent = '❌ Senha incorreta';
                        return false;
                    }

                    salvarUsuarioLocal({ login: usuario.login, nome: usuario.nome || usuario.login });
                    document.getElementById('loginError').textContent = '';
                    esconderLogin();
                    atualizarInterfaceUsuario();
                    await carregarDadosDoJogador();
                    showToast(`👋 Bem-vindo, ${usuario.nome || usuario.login}!`, 2500);
                    return true;

                } catch (error) {
                    document.getElementById('loginError').textContent = '❌ Erro de conexão';
                    console.error('Erro autenticação:', error);
                    return false;
                }
            }

            // ============================================================
            // CARREGAR E SALVAR DADOS
            // ============================================================
            async function carregarDadosDoJogador() {
                if (!usuarioLogado) return;

                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );

                    if (!response.ok) throw new Error(`Erro ao carregar: ${response.status}`);

                    const data = await response.json();
                    if (!data || data.length === 0) return;

                    const d = data[0];
                    saldo = Number(d.saldo ?? 50.00);

                    // Carregar estoque do mercado
                    if (d.fazendinha_dados && d.fazendinha_dados.mercado_estoque) {
                        const mercadoEstoque = d.fazendinha_dados.mercado_estoque;
                        ITENS_MERCADO.forEach(item => {
                            if (mercadoEstoque[item.id] !== undefined) {
                                item.qtdDisponivel = Number(mercadoEstoque[item.id]) || 0;
                            }
                        });
                    } else {
                        ITENS_MERCADO.forEach(item => {
                            item.qtdDisponivel = item.qtdMaxima;
                        });
                    }

                    // Carregar inventário
                    initInventario();
                    if (d.fazendinha_dados && d.fazendinha_dados.inventario) {
                        const inv = d.fazendinha_dados.inventario;
                        ITENS_MERCADO.forEach(item => {
                            if (inv[item.id] !== undefined) {
                                inventario[item.id] = Number(inv[item.id]) || 0;
                            }
                        });
                    }

                    if (d.carteira) {
                        const c = d.carteira;
                        const map = {
                            'Madeira': 'madeira',
                            'Pedra': 'pedra',
                            'Ouro': 'ouro',
                            'Poção': 'pocao',
                            'Balde': 'balde'
                        };
                        Object.keys(map).forEach(key => {
                            if (c[key] !== undefined) {
                                inventario[map[key]] = Number(c[key]) || 0;
                            }
                        });
                    }

                    atualizarLevelWidget(d);
                    atualizarSaldoGlobal();
                    renderizarMercado();
                    renderizarInventario();

                } catch (error) {
                    console.error('❌ Erro ao carregar dados:', error);
                    showToast('❌ Erro ao carregar dados: ' + error.message, 3000);
                }
            }

            async function salvarDadosDoJogador() {
                if (!usuarioLogado || !supabaseOnline || salvando) return;
                salvando = true;

                try {
                    const invCompleto = {};
                    ITENS_MERCADO.forEach(item => {
                        invCompleto[item.id] = inventario[item.id] || 0;
                    });

                    const mercadoEstoque = {};
                    ITENS_MERCADO.forEach(item => {
                        mercadoEstoque[item.id] = item.qtdDisponivel;
                    });

                    // Buscar dados atuais para preservar outros campos
                    const responseGet = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );
                    const data = await responseGet.json();
                    const dadosAtuais = data[0] || {};

                    const fazendinhaDados = dadosAtuais.fazendinha_dados || {
                        inventario: invCompleto,
                        plantio: { active: false, stage: 0, progress: 0 },
                        incubacao: { active: false, stage: 0, progress: 0 },
                        saldo: saldo
                    };

                    fazendinhaDados.inventario = invCompleto;
                    fazendinhaDados.saldo = saldo;
                    fazendinhaDados.mercado_estoque = mercadoEstoque;

                    const payload = {
                        saldo: Number(saldo).toFixed(2),
                        carteira: {
                            'Madeira': inventario.madeira || 0,
                            'Pedra': inventario.pedra || 0,
                            'Ouro': inventario.ouro || 0,
                            'Poção': inventario.pocao || 0,
                            'Balde': inventario.balde || 0
                        },
                        fazendinha_dados: fazendinhaDados,
                        updated_at: new Date().toISOString()
                    };

                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            },
                            body: JSON.stringify(payload)
                        }
                    );

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Erro ao salvar:', response.status, errorText);
                        throw new Error(`Erro ao salvar: ${response.status}`);
                    }

                    console.log('✅ Dados salvos com sucesso!');

                } catch (error) {
                    console.error('❌ Erro ao salvar:', error);
                    showToast('❌ Erro ao salvar: ' + error.message, 3000);
                } finally {
                    salvando = false;
                }
            }

            // ============================================================
            // FUNÇÕES DO MERCADO
            // ============================================================
            function gerarPrecos() {
                ITENS_MERCADO.forEach(item => {
                    const variacao = (Math.random() - 0.5) * 0.4;
                    item.precoAtual = Math.max(0.5, item.precoBase * (1 + variacao));
                    item.precoAtual = Math.round(item.precoAtual * 100) / 100;
                });
            }

            function renderizarMercado() {
                let html = '';
                ITENS_MERCADO.forEach(item => {
                    const qtd = inventario[item.id] || 0;
                    const preco = item.precoAtual.toFixed(2);

                    html += `
                        <div class="market-item">
                            <div class="item-header">
                                <span class="item-icon">${item.emoji}</span>
                                <div>
                                    <div class="item-name">${item.nome}</div>
                                    <div class="item-sub">${item.descricao}</div>
                                </div>
                            </div>
                            <div class="item-price">
                                R$ ${preco} <span>cada</span>
                            </div>
                            <div class="item-stock">
                                Você tem: <strong>${qtd}</strong> | Mercado: <strong style="color:var(--neon-blue);">${item.qtdDisponivel}</strong> disponíveis
                            </div>
                            <div class="item-actions">
                                <div class="qty-group">
                                    <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" max="99">
                                </div>
                                <button class="btn btn-buy" id="buy_${item.id}" onclick="window.comprarItem('${item.id}')">
                                    <i class="fas fa-shopping-cart"></i> Comprar
                                </button>
                                <button class="btn btn-sell" id="sell_${item.id}" onclick="window.venderItem('${item.id}')" ${qtd <= 0 ? 'disabled' : ''}>
                                    <i class="fas fa-coins"></i> Vender
                                </button>
                            </div>
                        </div>
                    `;
                });
                marketGrid.innerHTML = html;
            }

            function renderizarInventario() {
                let html = '';
                let temItem = false;

                ITENS_MERCADO.forEach(item => {
                    const qtd = inventario[item.id] || 0;
                    if (qtd > 0) {
                        temItem = true;
                        html += `
                            <span class="inv-item">
                                ${item.emoji} ${item.nome}: <span class="qty">${qtd}</span>
                            </span>
                        `;
                    }
                });

                if (!temItem) {
                    html = '<span style="color:var(--text-muted); font-size:0.8rem;">📭 Nenhum item no estoque</span>';
                }

                inventoryGrid.innerHTML = html;
            }

            // ============================================================
            // COMPRAR E VENDER
            // ============================================================
            window.comprarItem = async function(itemId) {
                if (!usuarioLogado) { showToast('👤 Faça login para comprar!', 2000); return; }
                if (!supabaseOnline) { showToast('⚠️ Sem conexão com o banco!', 2000); return; }

                const item = ITENS_MERCADO.find(i => i.id === itemId);
                if (!item) return;

                const qtyInput = document.getElementById(`qty_${itemId}`);
                const qty = parseInt(qtyInput.value) || 1;
                if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

                const custo = item.precoAtual * qty;

                if (saldo < custo) {
                    showToast(`😅 Saldo insuficiente! Precisa de R$ ${formatSaldo(custo)}`, 2000);
                    return;
                }

                if (item.qtdDisponivel < qty) {
                    showToast(`😅 Mercado tem apenas ${item.qtdDisponivel} disponíveis`, 2000);
                    return;
                }

                try {
                    saldo -= custo;
                    saldo = Math.round(saldo * 100) / 100;
                    item.qtdDisponivel -= qty;
                    inventario[itemId] = (inventario[itemId] || 0) + qty;

                    atualizarSaldoGlobal();
                    renderizarMercado();
                    renderizarInventario();

                    await salvarDadosDoJogador();
                    showToast(`✅ Comprou ${qty} ${item.nome} por R$ ${formatSaldo(custo)}`, 2500);

                } catch (error) {
                    console.error('❌ Erro na compra:', error);
                    showToast('❌ Erro ao processar compra: ' + error.message, 3000);
                }
            };

            window.venderItem = async function(itemId) {
                if (!usuarioLogado) { showToast('👤 Faça login para vender!', 2000); return; }
                if (!supabaseOnline) { showToast('⚠️ Sem conexão com o banco!', 2000); return; }

                const item = ITENS_MERCADO.find(i => i.id === itemId);
                if (!item) return;

                const qtyInput = document.getElementById(`qty_${itemId}`);
                const qty = parseInt(qtyInput.value) || 1;
                if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

                const qtdAtual = inventario[itemId] || 0;
                if (qtdAtual < qty) {
                    showToast(`😅 Você tem apenas ${qtdAtual} ${item.nome}`, 2000);
                    return;
                }

                try {
                    const precoVenda = item.precoAtual * 0.7;
                    const total = precoVenda * qty;

                    saldo += total;
                    saldo = Math.round(saldo * 100) / 100;
                    inventario[itemId] = qtdAtual - qty;
                    item.qtdDisponivel += qty;

                    atualizarSaldoGlobal();
                    renderizarMercado();
                    renderizarInventario();

                    await salvarDadosDoJogador();
                    showToast(`💰 Vendeu ${qty} ${item.nome} por R$ ${formatSaldo(total)}`, 2500);

                } catch (error) {
                    console.error('❌ Erro na venda:', error);
                    showToast('❌ Erro ao processar venda: ' + error.message, 3000);
                }
            };

            // ============================================================
            // EVENTOS
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                const loginBtn = document.getElementById('btnLogin');
                const registerBtn = document.getElementById('btnRegister');
                const guestBtn = document.getElementById('btnGuest');
                const loginUser = document.getElementById('loginUser');
                const loginPass = document.getElementById('loginPass');

                if (loginBtn) {
                    loginBtn.addEventListener('click', async function() {
                        const user = loginUser.value.trim();
                        const pass = loginPass.value.trim();
                        if (!user || !pass) {
                            document.getElementById('loginError').textContent = '⚠️ Preencha usuário e senha';
                            return;
                        }
                        loginBtn.disabled = true;
                        loginBtn.textContent = '⏳ Entrando...';
                        await autenticarUsuario(user, pass, false);
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Entrar';
                    });
                }

                if (registerBtn) {
                    registerBtn.addEventListener('click', async function() {
                        const user = loginUser.value.trim();
                        const pass = loginPass.value.trim();
                        if (!user || !pass) {
                            document.getElementById('loginError').textContent = '⚠️ Preencha usuário e senha';
                            return;
                        }
                        if (pass.length < 4) {
                            document.getElementById('loginError').textContent = '⚠️ Senha deve ter pelo menos 4 caracteres';
                            return;
                        }
                        registerBtn.disabled = true;
                        registerBtn.textContent = '⏳ Criando...';
                        await autenticarUsuario(user, pass, true);
                        registerBtn.disabled = false;
                        registerBtn.textContent = 'Criar conta';
                    });
                }

                if (guestBtn) {
                    guestBtn.addEventListener('click', function() {
                        esconderLogin();
                        showToast('👤 Modo visitante - dados não serão salvos.', 3000);
                        initInventario();
                        saldo = 50.00;
                        ITENS_MERCADO.forEach(item => {
                            item.qtdDisponivel = item.qtdMaxima;
                        });
                        atualizarInterfaceUsuario();
                        atualizarSaldoGlobal();
                        renderizarMercado();
                        renderizarInventario();
                    });
                }

                document.getElementById('btnReconnectSupabase')?.addEventListener('click', function() {
                    verificarSupabase();
                    showToast('🔄 Verificando conexão...', 1500);
                });

                if (loginUser) {
                    loginUser.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') loginPass.focus();
                    });
                }
                if (loginPass) {
                    loginPass.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter') loginBtn.click();
                    });
                }

                if (!usuarioLogado && loginUser) {
                    setTimeout(() => loginUser.focus(), 500);
                }
            });

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            verificarSupabase();
            carregarUsuario();
            gerarPrecos();
            renderizarMercado();
            renderizarInventario();
            atualizarInterfaceUsuario();

            if (usuarioLogado) {
                esconderLogin();
                setTimeout(() => {
                    if (supabaseOnline) {
                        carregarDadosDoJogador();
                    } else {
                        showToast('⚠️ Sem conexão com o banco.', 3000);
                    }
                }, 600);
                showToast(`👋 Olá, ${usuarioLogado.nome || usuarioLogado.login}!`, 2500);
            } else {
                mostrarLogin();
                setTimeout(() => showToast('👤 Faça login para comprar e vender.', 3000), 800);
            }

            setInterval(() => {
                gerarPrecos();
                renderizarMercado();
            }, 60000);

            setInterval(() => verificarSupabase(), 30000);

            setInterval(() => {
                if (usuarioLogado && supabaseOnline && !salvando) {
                    salvarDadosDoJogador();
                }
            }, 30000);

            window.addEventListener('beforeunload', function() {
                if (usuarioLogado && supabaseOnline && !salvando) {
                    salvarDadosDoJogador();
                }
            });

            console.log('🌾 Mercado carregado!');

        })();
    </script>
</body>
</html>
