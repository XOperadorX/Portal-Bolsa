<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🛒 Mercado – mercado.html</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-dark: #0a0b10;
            --card-bg: #121520;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-green: #00ff66;
            --neon-pink: #ff00aa;
            --text-color: #f0f4f8;
            --text-muted: #8a99ad;
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --gold: #f9a825;
            --gold-dark: #f57f17;
            --soil: #8d6e63;
            --soil-light: #a1887f;
            --water-blue: #42a5f5;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
        }

        .card {
            background: var(--card-bg);
            max-width: 900px;
            width: 100%;
            padding: 1.6rem 1.4rem 1.4rem;
            border-radius: var(--radius);
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: var(--shadow-glow), 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            transition: transform var(--transition);
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 21, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 10px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 240, 255, 0.08);
            padding: 4px 14px 4px 8px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            cursor: default;
        }
        .user-profile:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }
        .user-avatar {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }
        .user-info { display: flex; flex-direction: column; line-height: 1.2; }
        .user-nick {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #fff;
        }
        .user-balance {
            font-size: 0.7rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .user-balance::before { content: "💰"; font-size: 0.6rem; }

        .btn-voltar {
            background: linear-gradient(135deg, var(--neon-purple), #8b5cf6);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-voltar:hover {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.4);
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 500;
            border: 1px solid rgba(0, 240, 255, 0.08);
            margin-bottom: 16px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-muted);
        }
        .status-item .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s;
        }
        .status-item .dot.online {
            background: var(--neon-green);
            box-shadow: 0 0 8px rgba(0, 255, 102, 0.5);
        }
        .status-item .dot.offline {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.3);
        }
        .status-item .dot.checking {
            background: #f59e0b;
            animation: pulse-dot 1s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .status-item .value { font-weight: 600; color: var(--text-color); }
        .status-item .value.online { color: var(--neon-green); }
        .status-item .value.offline { color: #ef4444; }
        .status-item .value.checking { color: #f59e0b; }

        .status-reconnect {
            background: none;
            border: none;
            color: #8a99ad;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.7rem;
        }
        .status-reconnect:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }

        .saldo-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(112, 0, 255, 0.15);
            border: 1px solid var(--neon-purple);
            padding: 0.15rem 0.7rem 0.15rem 0.5rem;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(112, 0, 255, 0.2);
        }
        .saldo-badge i { font-size: 0.9rem; color: var(--neon-purple); }
        .saldo-badge .num { color: #fff; }

        .market-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1rem;
            padding: 0 0.2rem;
        }
        .market-title i { color: var(--gold); }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 1rem;
        }

        .market-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 14px 12px 12px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .market-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .market-item:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 240, 255, 0.35);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 240, 255, 0.08);
        }
        .market-item:hover::before { opacity: 1; }

        .market-item .item-icon {
            font-size: 2.4rem;
            line-height: 1;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.4));
            transition: transform 0.3s;
        }
        .market-item:hover .item-icon { transform: scale(1.12); }

        .market-item .item-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .market-item .item-desc {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            line-height: 1.3;
            min-height: 2.2em;
        }
        .market-item .item-price {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            background: rgba(249, 168, 37, 0.15);
            border: 1px solid rgba(249, 168, 37, 0.4);
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .market-item .item-price i { font-size: 0.7rem; }

        .market-item .btn-buy {
            width: 100%;
            padding: 0.35rem 0.6rem;
            border-radius: 30px;
            border: none;
            font-weight: 700;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            box-shadow: 0 2px 10px rgba(0, 200, 83, 0.3);
        }
        .market-item .btn-buy:hover:not(:disabled) {
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.45);
        }
        .market-item .btn-buy:active:not(:disabled) { transform: scale(0.95); }
        .market-item .btn-buy:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .market-item .item-stock {
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .message {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            min-height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            border: 1px solid rgba(0, 240, 255, 0.05);
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .message .highlight { color: var(--neon-green); font-weight: 700; }
        .message .gold-highlight { color: var(--gold); font-weight: 700; }

        /* ===== HISTÓRICO ===== */
        .history-section {
            margin-top: 1.2rem;
            border-top: 1px solid rgba(0, 240, 255, 0.1);
            padding-top: 1rem;
        }
        .history-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 0.6rem;
        }
        .history-title i { color: var(--neon-blue); }

        .history-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 240, 255, 0.06);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 0.68rem;
            transition: all 0.2s;
        }
        .history-item:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.15);
        }
        .history-item .h-left {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
        }
        .history-item .h-icon { font-size: 1rem; flex-shrink: 0; }
        .history-item .h-info { display: flex; flex-direction: column; min-width: 0; }
        .history-item .h-name {
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item .h-date {
            font-size: 0.58rem;
            color: var(--text-muted);
        }
        .history-item .h-value {
            font-weight: 700;
            color: #ef4444;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .history-item .h-value.sale { color: var(--neon-green); }
        .history-item .h-qty {
            font-size: 0.58rem;
            color: var(--text-muted);
            margin-left: 2px;
        }
        .history-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 0.8rem;
            font-style: italic;
        }

        @media (max-width: 520px) {
            .card { padding: 0.8rem 0.6rem; }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.3rem;
                padding: 8px 12px;
            }
            .market-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .market-item { padding: 10px 8px 8px; }
            .market-item .item-icon { font-size: 1.8rem; }
            .market-item .item-name { font-size: 0.65rem; }
            .market-item .item-desc { font-size: 0.55rem; }
            .market-item .btn-buy { font-size: 0.6rem; padding: 0.25rem 0.4rem; }
            .history-item { font-size: 0.6rem; padding: 5px 8px; }
        }
    </style>
</head>

<body>

    <div class="card">

        <nav class="nav-bar">
            <div class="user-profile" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-nick" id="userName">Visitante</span>
                    <span class="user-balance" id="userBalanceDisplay">💰 R$ 0,00</span>
                </div>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>
            </div>

            <div class="status-bar" id="statusBar">
                <div class="status-item">
                    <span class="dot checking" id="supabaseDot"></span>
                    <span class="label">Supabase:</span>
                    <span class="value checking" id="supabaseStatus">Verificando...</span>
                    <button class="status-reconnect" id="btnReconnectSupabase" title="Reconectar">🔄</button>
                </div>
                <div class="status-item" style="margin-left:auto;">
                    <span>💰 R$ <span id="headerSaldo">0,00</span></span>
                </div>
            </div>
        </nav>

        <div class="market-title">
            <i class="fas fa-store"></i>
            Mercado
            <span class="saldo-badge" style="margin-left:auto;">
                <i class="fas fa-coins"></i>
                <span class="num" id="saldoDisplayValue">R$ 0,00</span>
            </span>
        </div>

        <div class="market-grid" id="marketGrid">
            <!-- Itens renderizados via JS -->
        </div>

        <div class="message" id="message">
            <i class="fas fa-shopping-cart"></i>
            Compre <span class="highlight">sementes</span> e <span class="highlight">baldes</span> para cuidar do seu milharal!
        </div>

        <!-- ===== HISTÓRICO DE COMPRAS ===== -->
        <div class="history-section">
            <div class="history-title">
                <i class="fas fa-history"></i>
                Histórico de Compras
            </div>
            <div class="history-list" id="historyList">
                <div class="history-empty">Nenhuma compra registrada ainda.</div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIGURAÇÕES
            // ============================================================
            const CONFIG = {
                SUPABASE_URL: 'https://xrcxvizzdumcxbylmkvn.supabase.co',
                SUPABASE_KEY: 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD',
                TABELA: 'Geral',
                AUTO_SAVE_INTERVAL: 30000,
                SYNC_INTERVAL: 15000,
                MAX_HISTORICO: 50, // máximo de registros exibidos
            };

            // ============================================================
            // ITENS DO MERCADO
            // ============================================================
            const MARKET_ITEMS = [
                {
                    id: 'seeds_1',
                    icon: '🌰',
                    name: 'Sementes x1',
                    desc: 'Uma semente de milho para plantar.',
                    price: 2.00,
                    type: 'seeds',
                    amount: 1,
                },
                {
                    id: 'seeds_5',
                    icon: '🌰',
                    name: 'Sementes x5',
                    desc: 'Pacote com 5 sementes. Economize!',
                    price: 8.00,
                    type: 'seeds',
                    amount: 5,
                },
                {
                    id: 'seeds_10',
                    icon: '🌰',
                    name: 'Sementes x10',
                    desc: 'Pacote com 10 sementes. Melhor preço!',
                    price: 14.00,
                    type: 'seeds',
                    amount: 10,
                },
                {
                    id: 'bucket_1',
                    icon: '🪣',
                    name: 'Balde x1',
                    desc: 'Rega um canteiro com +30% de crescimento.',
                    price: 5.00,
                    type: 'buckets',
                    amount: 1,
                },
                {
                    id: 'bucket_5',
                    icon: '🪣',
                    name: 'Baldes x5',
                    desc: 'Pacote com 5 baldes. Economize!',
                    price: 20.00,
                    type: 'buckets',
                    amount: 5,
                },
                {
                    id: 'bucket_10',
                    icon: '🪣',
                    name: 'Baldes x10',
                    desc: 'Pacote com 10 baldes. Melhor preço!',
                    price: 35.00,
                    type: 'buckets',
                    amount: 10,
                },
            ];

            // ============================================================
            // ESTADO GLOBAL
            // ============================================================
            const state = {
                online: false,
                usuario: null,
                salvando: false,
                carregando: false,
                toastTimer: null,
                syncTimer: null,
                autoSaveTimer: null,
                reconnectTimer: null,
                dadosDB: null,

                jogo: {
                    saldo: 0,
                    seeds: 0,
                    buckets: 0,
                    stock: 0,
                    planted: 0,
                    harvested: 0,
                    nivel: 1,
                    experiencia: 0,
                    historico: [], // <-- HISTÓRICO
                }
            };

            function getJogo() { return state.jogo; }

            // ============================================================
            // DOM REFS
            // ============================================================
            const DOM = {};

            function initDOM() {
                DOM.marketGrid = document.getElementById('marketGrid');
                DOM.message = document.getElementById('message');
                DOM.headerSaldo = document.getElementById('headerSaldo');
                DOM.userAvatar = document.getElementById('userAvatar');
                DOM.userName = document.getElementById('userName');
                DOM.userBalance = document.getElementById('userBalanceDisplay');
                DOM.saldoDisplayValue = document.getElementById('saldoDisplayValue');
                DOM.historyList = document.getElementById('historyList');

                DOM.supabaseDot = document.getElementById('supabaseDot');
                DOM.supabaseStatus = document.getElementById('supabaseStatus');
                DOM.btnReconnectSupabase = document.getElementById('btnReconnectSupabase');
            }

            // ============================================================
            // AUXILIARES
            // ============================================================
            function formatSaldo(valor) {
                return Number(valor || 0).toFixed(2).replace('.', ',');
            }

            function formatarDataHora(isoString) {
                if (!isoString) return '—';
                try {
                    const d = new Date(isoString);
                    if (isNaN(d.getTime())) return '—';
                    const dia = String(d.getDate()).padStart(2, '0');
                    const mes = String(d.getMonth() + 1).padStart(2, '0');
                    const ano = d.getFullYear();
                    const hora = String(d.getHours()).padStart(2, '0');
                    const min = String(d.getMinutes()).padStart(2, '0');
                    const seg = String(d.getSeconds()).padStart(2, '0');
                    return `${dia}/${mes}/${ano} ${hora}:${min}:${seg}`;
                } catch (e) {
                    return '—';
                }
            }

            function showToast(text, duration = 2200) {
                let toast = document.getElementById('_toast_dynamic');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = '_toast_dynamic';
                    toast.style.cssText = `
                        position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px);
                        background: rgba(10, 11, 16, 0.95); backdrop-filter: blur(8px); color: #fff;
                        padding: 0.5rem 1.4rem; border-radius: 60px; font-weight: 600; font-size: 0.8rem;
                        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 240, 255, 0.1);
                        opacity: 0; transition: all 0.45s ease; pointer-events: none; z-index: 999;
                        border: 1px solid rgba(0, 240, 255, 0.15); text-align: center;
                    `;
                    document.body.appendChild(toast);
                }
                if (state.toastTimer) {
                    clearTimeout(state.toastTimer);
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(80px)';
                }
                toast.textContent = text;
                requestAnimationFrame(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(-50%) translateY(0)';
                });
                state.toastTimer = setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(-50%) translateY(80px)';
                    state.toastTimer = null;
                }, duration);
            }

            function atualizarStatusSupabase(online, texto) {
                DOM.supabaseDot.className = 'dot ' + (online ? 'online' : 'offline');
                DOM.supabaseStatus.className = 'value ' + (online ? 'online' : 'offline');
                DOM.supabaseStatus.textContent = texto;
                state.online = online;
            }

            function atualizarSaldoGlobal() {
                const total = getJogo().saldo || 0;
                if (DOM.headerSaldo) DOM.headerSaldo.textContent = formatSaldo(total);
                if (DOM.userBalance) DOM.userBalance.textContent = `💰 R$ ${formatSaldo(total)}`;
                if (DOM.saldoDisplayValue) DOM.saldoDisplayValue.textContent = `R$ ${formatSaldo(total)}`;
            }

            // ============================================================
            // HISTÓRICO
            // ============================================================
            function adicionarAoHistorico(registro) {
                const j = getJogo();
                if (!Array.isArray(j.historico)) j.historico = [];
                j.historico.unshift(registro); // mais recente primeiro
                // Limitar tamanho para não estourar o jsonb
                if (j.historico.length > CONFIG.MAX_HISTORICO) {
                    j.historico = j.historico.slice(0, CONFIG.MAX_HISTORICO);
                }
                renderHistorico();
            }

            function renderHistorico() {
                const j = getJogo();
                const lista = Array.isArray(j.historico) ? j.historico : [];

                if (lista.length === 0) {
                    DOM.historyList.innerHTML = '<div class="history-empty">Nenhuma compra registrada ainda.</div>';
                    return;
                }

                let html = '';
                for (const h of lista) {
                    const isVenda = h.tipo === 'venda';
                    const sinal = isVenda ? '+' : '-';
                    const valorClass = isVenda ? 'sale' : '';
                    const qtd = h.quantidade ? `x${h.quantidade}` : '';
                    const valor = formatSaldo(h.valor || 0);
                    const data = formatarDataHora(h.data);
                    const icone = h.icon || (isVenda ? '💰' : '🛒');

                    html += `
                        <div class="history-item">
                            <div class="h-left">
                                <span class="h-icon">${icone}</span>
                                <div class="h-info">
                                    <span class="h-name">${h.item || 'Item'} <span class="h-qty">${qtd}</span></span>
                                    <span class="h-date">${data}</span>
                                </div>
                            </div>
                            <span class="h-value ${valorClass}">${sinal} R$ ${valor}</span>
                        </div>
                    `;
                }
                DOM.historyList.innerHTML = html;
            }

            // ============================================================
            // RENDERIZAÇÃO DO MERCADO
            // ============================================================
            function renderMarket() {
                const j = getJogo();
                const saldo = j.saldo || 0;

                let html = '';
                for (const item of MARKET_ITEMS) {
                    const canAfford = saldo >= item.price;
                    const disabled = !canAfford || !state.online;

                    html += `
                        <div class="market-item" data-item-id="${item.id}">
                            <span class="item-icon">${item.icon}</span>
                            <span class="item-name">${item.name}</span>
                            <span class="item-desc">${item.desc}</span>
                            <span class="item-price">
                                <i class="fas fa-coins"></i>
                                R$ ${formatSaldo(item.price)}
                            </span>
                            <button class="btn-buy" data-item-id="${item.id}" ${disabled ? 'disabled' : ''}>
                                <i class="fas fa-shopping-cart"></i>
                                Comprar
                            </button>
                        </div>
                    `;
                }
                DOM.marketGrid.innerHTML = html;
                atualizarSaldoGlobal();

                // Atualizar mensagem
                if (!state.online) {
                    DOM.message.innerHTML = '⚠️ <span class="highlight">Sem conexão</span> com o banco de dados. Não é possível comprar.';
                } else if (saldo <= 0) {
                    DOM.message.innerHTML = '😅 Você está <span class="highlight">sem saldo</span>. Venda milho no milharal para ganhar dinheiro!';
                } else {
                    DOM.message.innerHTML = `🛒 Saldo disponível: <span class="gold-highlight">R$ ${formatSaldo(saldo)}</span> — Escolha seus itens!`;
                }
            }

            // ============================================================
            // COMPRA
            // ============================================================
            function comprarItem(itemId) {
                const j = getJogo();
                const item = MARKET_ITEMS.find(i => i.id === itemId);
                if (!item) return;

                if (!state.online) {
                    showToast('⚠️ Sem conexão com o banco. Não é possível comprar.', 2500);
                    return;
                }

                if (j.saldo < item.price) {
                    showToast(`😅 Saldo insuficiente! Precisa de R$ ${formatSaldo(item.price)}`, 2000);
                    return;
                }

                // Deduzir saldo
                j.saldo = Number((j.saldo - item.price).toFixed(2));

                // Adicionar item
                if (item.type === 'seeds') {
                    j.seeds = (j.seeds || 0) + item.amount;
                    showToast(`🌰 +${item.amount} semente(s) comprada(s)! (-R$ ${formatSaldo(item.price)})`, 2200);
                } else if (item.type === 'buckets') {
                    j.buckets = (j.buckets || 0) + item.amount;
                    showToast(`🪣 +${item.amount} balde(s) comprado(s)! (-R$ ${formatSaldo(item.price)})`, 2200);
                }

                // ===== REGISTRAR NO HISTÓRICO =====
                adicionarAoHistorico({
                    tipo: 'compra',
                    item: item.name,
                    icon: item.icon,
                    quantidade: item.amount,
                    valor: item.price,
                    data: new Date().toISOString(),
                    saldo_apos: j.saldo,
                });

                renderMarket();
                salvarDadosCompletos();
            }

            // ============================================================
            // SUPABASE - SALVAR/CARREGAR
            // ============================================================
            async function verificarSupabase() {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);

                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?select=id&limit=1`, {
                            headers: {
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                            },
                            cache: 'no-store',
                            signal: controller.signal
                        }
                    );
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        state.online = true;
                        atualizarStatusSupabase(true, 'Online');
                        return true;
                    } else {
                        state.online = false;
                        atualizarStatusSupabase(false, `Erro ${response.status}`);
                        return false;
                    }
                } catch (error) {
                    state.online = false;
                    atualizarStatusSupabase(false, 'Falha');
                    console.error('Erro ao verificar Supabase:', error);
                    return false;
                }
            }

            async function carregarDadosCompletos() {
                if (!state.usuario || !state.online || state.carregando) return;
                if (state.salvando) {
                    console.log('⏸️ Carregamento adiado - salvando em andamento...');
                    return;
                }

                state.carregando = true;
                try {
                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?login=eq.${encodeURIComponent(state.usuario.login)}&select=*`, {
                            headers: {
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                            },
                            cache: 'no-store',
                        }
                    );
                    if (!response.ok) throw new Error(`Erro ao carregar: ${response.status}`);
                    const data = await response.json();
                    if (!data || data.length === 0) {
                        state.dadosDB = null;
                        return;
                    }
                    if (state.salvando) {
                        console.log('⏸️ Carregamento cancelado - save começou durante o fetch');
                        return;
                    }

                    state.dadosDB = data[0];
                    const db = data[0];
                    const j = getJogo();

                    j.saldo     = Number(db.saldo ?? 0);
                    j.seeds     = db.seeds     ?? 0;
                    j.buckets   = db.buckets   ?? 0;
                    j.stock     = db.stock     ?? 0;
                    j.planted   = db.planted   ?? 0;
                    j.harvested = db.harvested ?? 0;
                    j.nivel     = db.nivel     ?? 1;
                    j.experiencia = db.experiencia ?? 0;

                    // ===== CARREGAR HISTÓRICO DO BANCO =====
                    let hist = db.historico;
                    if (typeof hist === 'string') {
                        try { hist = JSON.parse(hist); } catch (e) { hist = []; }
                    }
                    j.historico = Array.isArray(hist) ? hist : [];

                    console.log(`📥 Dados carregados. Saldo: ${j.saldo}, Seeds: ${j.seeds}, Buckets: ${j.buckets}, Histórico: ${j.historico.length}`);
                    renderMarket();
                    renderHistorico();
                } catch (error) {
                    console.error('Erro ao carregar:', error);
                } finally {
                    state.carregando = false;
                }
            }

            async function salvarDadosCompletos() {
                if (!state.usuario || !state.online || state.salvando) return;
                state.salvando = true;
                try {
                    const j = getJogo();
                    const payload = {
                        saldo: Number(j.saldo || 0).toFixed(2),
                        seeds: j.seeds || 0,
                        buckets: j.buckets || 0,
                        stock: j.stock || 0,
                        planted: j.planted || 0,
                        harvested: j.harvested || 0,
                        nivel: j.nivel || 1,
                        experiencia: j.experiencia || 0,
                        historico: j.historico || [], // <-- SALVAR HISTÓRICO
                        updated_at: new Date().toISOString(),
                    };

                    console.log(`💾 Salvando... Saldo: ${payload.saldo}, Seeds: ${payload.seeds}, Buckets: ${payload.buckets}, Histórico: ${payload.historico.length}`);

                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABELA}?login=eq.${encodeURIComponent(state.usuario.login)}`, {
                            method: 'PATCH',
                            headers: {
                                'Content-Type': 'application/json',
                                'apikey': CONFIG.SUPABASE_KEY,
                                'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
                                'Prefer': 'return=representation',
                            },
                            body: JSON.stringify(payload),
                        }
                    );
                    if (!response.ok) throw new Error(`Erro ao salvar: ${response.status}`);

                    const updated = await response.json();
                    if (Array.isArray(updated) && updated.length > 0) {
                        state.dadosDB = updated[0];
                        console.log(`✅ Salvo! Saldo no banco: ${updated[0].saldo}`);
                    }
                } catch (error) {
                    console.error('Erro ao salvar:', error);
                } finally {
                    state.salvando = false;
                }
            }

            // ============================================================
            // AUTH
            // ============================================================
            function carregarUsuario() {
                try {
                    const data = localStorage.getItem('usuario_logado');
                    if (data) {
                        state.usuario = JSON.parse(data);
                        return true;
                    }
                } catch (e) {
                    console.error('Erro ao carregar usuário:', e);
                }
                return false;
            }

            function atualizarInterfaceUsuario() {
                if (state.usuario && state.usuario.login) {
                    const nome = state.usuario.nome || state.usuario.login;
                    DOM.userAvatar.textContent = nome.charAt(0).toUpperCase();
                    DOM.userName.textContent = nome;
                } else {
                    DOM.userAvatar.textContent = '?';
                    DOM.userName.textContent = 'Visitante';
                }
                atualizarSaldoGlobal();
            }

            // ============================================================
            // EVENTOS
            // ============================================================
            function setupEvents() {
                DOM.marketGrid.addEventListener('click', function(e) {
                    const btn = e.target.closest('.btn-buy');
                    if (!btn) return;
                    const itemId = btn.dataset.itemId;
                    if (itemId) comprarItem(itemId);
                });

                DOM.btnReconnectSupabase?.addEventListener('click', async function() {
                    showToast('🔄 Verificando conexão...', 1500);
                    const ok = await verificarSupabase();
                    if (ok) {
                        await carregarDadosCompletos();
                        renderMarket();
                        renderHistorico();
                        showToast('✅ Reconectado!', 1500);
                    } else {
                        showToast('❌ Falha na reconexão.', 2000);
                        renderMarket();
                    }
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            async function init() {
                initDOM();
                setupEvents();

                const temUsuario = carregarUsuario();
                if (!temUsuario || !state.usuario || !state.usuario.login) {
                    window.location.href = 'login.html';
                    return;
                }

                atualizarInterfaceUsuario();

                await verificarSupabase();

                if (state.online) {
                    await carregarDadosCompletos();
                    showToast(`👋 Olá, ${state.usuario.nome || state.usuario.login}! Bem-vindo ao mercado.`, 2500);
                } else {
                    showToast('⚠️ Sem conexão com o banco. Modo offline.', 3000);
                }

                renderMarket();
                renderHistorico();

                // Sincronização periódica
                state.syncTimer = setInterval(() => {
                    if (state.usuario && state.online && !state.salvando && !state.carregando) {
                        carregarDadosCompletos();
                    }
                }, CONFIG.SYNC_INTERVAL);

                // Reconexão automática
                state.reconnectTimer = setInterval(async () => {
                    if (!state.online) {
                        const ok = await verificarSupabase();
                        if (ok) {
                            await carregarDadosCompletos();
                            renderMarket();
                            renderHistorico();
                        }
                    }
                }, 30000);

                // Auto-save
                state.autoSaveTimer = setInterval(() => {
                    if (state.usuario && state.online && !state.salvando) {
                        salvarDadosCompletos();
                    }
                }, CONFIG.AUTO_SAVE_INTERVAL);

                // Salvar ao sair
                window.addEventListener('beforeunload', function() {
                    if (state.syncTimer) clearInterval(state.syncTimer);
                    if (state.autoSaveTimer) clearInterval(state.autoSaveTimer);
                    if (state.reconnectTimer) clearInterval(state.reconnectTimer);
                    if (state.usuario && state.online && !state.salvando) {
                        salvarDadosCompletos();
                    }
                });

                console.log('🛒 Mercado carregado com sucesso!');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>

</body>
</html>
