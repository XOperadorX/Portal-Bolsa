<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 Mercado - MM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --neon-yellow: #fbbf24;
            --bg-primary: #0a0a0f;
            --bg-secondary: #111122;
            --bg-card: #1a1a2e;
            --bg-input: #0d0d1a;
            --text-primary: #e8e8ff;
            --text-secondary: #a0a0c0;
            --text-muted: #6a6a8a;
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            background: var(--bg-card);
            border-radius: 24px;
            padding: 24px 28px 32px;
            border: 1px solid rgba(0, 255, 136, 0.12);
            box-shadow: var(--shadow-card);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.08);
            margin-bottom: 16px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            background: var(--bg-secondary);
            padding: 8px 16px 8px 10px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--bg-primary);
            font-family: 'Orbitron', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        .user-info { display: flex; flex-direction: column; line-height: 1.3; }
        .user-nick { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
        .user-balance { font-size: 0.8rem; color: var(--neon-yellow); font-family: 'Share Tech Mono', monospace; font-weight: 600; }
        .user-seeds { font-size: 0.75rem; color: #8be28b; font-family: 'Share Tech Mono', monospace; font-weight: 600; }

        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(0, 212, 255, 0.1));
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(0, 255, 136, 0.15);
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
        .btn-voltar:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
            border-color: var(--neon-green);
        }

        .btn-logout {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.1), rgba(255, 100, 100, 0.1));
            border: 1px solid rgba(255, 68, 68, 0.2);
            color: #ff8888;
            padding: 8px 14px;
            border-radius: 50px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: var(--transition);
        }
        .btn-logout:hover {
            background: linear-gradient(135deg, rgba(255, 68, 68, 0.2), rgba(255, 100, 100, 0.2));
            border-color: #ff4444;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            background: var(--bg-secondary);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 136, 0.06);
        }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.online { background: var(--neon-green); box-shadow: 0 0 12px rgba(0, 255, 136, 0.6); }
        .dot.offline { background: #ff4444; }
        .dot.checking { background: var(--neon-yellow); animation: pulse-dot 1s ease-in-out infinite; }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }
        .status-item .value.online { color: var(--neon-green); }
        .status-item .value.offline { color: #ff4444; }
        .status-item .value.checking { color: var(--neon-yellow); }

        .status-reconnect {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition);
        }
        .status-reconnect:hover { color: var(--neon-blue); }

        .level-widget {
            background: linear-gradient(145deg, rgba(0, 255, 136, 0.04), rgba(0, 212, 255, 0.04));
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .lw-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .lw-badge { display: flex; align-items: center; gap: 14px; }
        .lw-num {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .lw-label { font-family: 'Orbitron', monospace; font-size: 0.55rem; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }
        .lw-title { font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
        .lw-exp { flex: 1; min-width: 150px; max-width: 350px; }
        .lw-bar { width: 100%; height: 6px; background: var(--bg-secondary); border-radius: 50px; overflow: hidden; border: 1px solid rgba(0, 255, 136, 0.05); }
        .lw-fill { height: 100%; background: linear-gradient(90deg, var(--neon-green), var(--neon-blue)); border-radius: 50px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .lw-text { display: flex; justify-content: space-between; font-size: 0.7rem; font-family: 'Share Tech Mono', monospace; color: var(--text-secondary); margin-top: 4px; }
        .lw-cur { color: var(--neon-green); font-weight: 700; }
        .lw-nxt { color: var(--text-muted); }

        .lw-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0, 255, 136, 0.06);
            font-size: 0.75rem;
            font-family: 'Share Tech Mono', monospace;
            color: var(--text-secondary);
        }
        .lw-stats span { display: flex; align-items: center; gap: 6px; }
        .lw-stats .hp-c { color: #ff4444; font-weight: 600; }
        .lw-stats .mp-c { color: var(--neon-blue); font-weight: 600; }
        .lw-stats .sm-c { color: var(--neon-yellow); font-weight: 600; }
        .lw-stats .atk-c { color: #ff6b6b; font-weight: 600; }
        .lw-stats .def-c { color: #4ecdc4; font-weight: 600; }
        .lw-stats .mag-c { color: var(--neon-purple); font-weight: 600; }

        .market-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .market-header h2 {
            font-family: 'Orbitron', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .market-header h2 i { -webkit-text-fill-color: initial; color: var(--neon-green); margin-right: 8px; }
        .saldo-box {
            background: var(--bg-secondary);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(251, 191, 36, 0.15);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .saldo-box .label { color: var(--text-muted); font-size: 0.75rem; }
        .saldo-box .value { color: var(--neon-yellow); font-weight: 700; font-size: 1.1rem; }
        .saldo-box .seeds-value { color: #8be28b; font-weight: 700; font-size: 1.1rem; }

        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .market-item {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px 18px;
            border: 1px solid rgba(0, 255, 136, 0.06);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .market-item:hover {
            border-color: rgba(0, 255, 136, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .item-icon {
            font-size: 2rem;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 255, 136, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.06);
        }
        .item-name { font-family: 'Orbitron', monospace; font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }
        .item-sub { font-size: 0.7rem; color: var(--text-muted); }
        .item-price { font-family: 'Share Tech Mono', monospace; font-size: 1.2rem; font-weight: 700; color: var(--neon-yellow); margin: 6px 0 4px; }
        .item-price span { font-size: 0.7rem; font-weight: 400; color: var(--text-muted); }
        .item-stock { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px; }
        .item-stock strong { color: var(--text-secondary); }

        .item-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .qty-group { display: flex; align-items: center; }
        .qty-input {
            width: 56px;
            padding: 6px 4px;
            background: var(--bg-input);
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            text-align: center;
        }
        .qty-input:focus { outline: none; border-color: var(--neon-green); }
        .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .qty-input[type="number"] { -moz-appearance: textfield; }

        .btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-buy {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.12), rgba(0, 212, 255, 0.12));
            color: var(--neon-green);
            border: 1px solid rgba(0, 255, 136, 0.15);
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 212, 255, 0.2));
        }
        .btn-buy:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-sell {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08), rgba(251, 146, 60, 0.08));
            color: var(--neon-yellow);
            border: 1px solid rgba(251, 191, 36, 0.12);
        }
        .btn-sell:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 146, 60, 0.15));
        }
        .btn-sell:disabled { opacity: 0.3; cursor: not-allowed; }

        .player-inventory {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(0, 255, 136, 0.06);
            margin-top: 4px;
        }
        .player-inventory h3 {
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .player-inventory h3 i { color: var(--neon-green); margin-right: 8px; }
        .inv-grid { display: flex; flex-wrap: wrap; gap: 8px; min-height: 36px; }
        .inv-item {
            background: var(--bg-input);
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            border: 1px solid rgba(0, 255, 136, 0.06);
            transition: var(--transition);
            font-family: 'Rajdhani', sans-serif;
        }
        .inv-item:hover { border-color: rgba(0, 255, 136, 0.15); background: rgba(0, 255, 136, 0.04); }
        .inv-item .qty { color: var(--neon-yellow); font-weight: 700; font-family: 'Share Tech Mono', monospace; }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.12);
            box-shadow: var(--shadow-card);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 90%;
            text-align: center;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .card { padding: 16px 14px 24px; }
            .nav-bar { flex-direction: column; align-items: stretch; gap: 10px; }
            .user-profile { width: 100%; justify-content: center; }
            .market-grid { grid-template-columns: 1fr; }
            .lw-header { flex-direction: column; align-items: stretch; }
            .lw-badge { justify-content: center; }
            .lw-exp { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">

        <nav class="nav-bar">
            <div class="user-profile" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <div class="user-info">
                    <span class="user-nick" id="userName">Carregando...</span>
                    <span class="user-balance" id="userBalanceDisplay">💰 R$ 0,00</span>
                    <span class="user-seeds" id="userSeedsDisplay">🌰 0 sementes</span>
                </div>
            </div>

            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <a href="../../dashboard.html" class="btn-voltar">🏠 Voltar</a>
            </div>

            <div class="status-bar" id="statusBar">
                <div class="status-item">
                    <span class="dot checking" id="supabaseDot"></span>
                    <span class="label">Supabase:</span>
                    <span class="value checking" id="supabaseStatus">Verificando...</span>
                    <button class="status-reconnect" id="btnReconnectSupabase" title="Reconectar">🔄</button>
                </div>
                <div class="status-item">
                    <span>🌰 <span id="headerSeeds">0</span></span>
                </div>
                <div class="status-item" style="margin-left:auto;">
                    <span>💰 R$ <span id="headerSaldo">0,00</span></span>
                </div>
            </div>
        </nav>

        <div class="level-widget" id="levelWidget">
            <div class="lw-header">
                <div class="lw-badge">
                    <span class="lw-num" id="lwNivel">1</span>
                    <div>
                        <div class="lw-label">NÍVEL</div>
                        <div class="lw-title" id="lwTitulo">🌱 Iniciante</div>
                    </div>
                </div>
                <div class="lw-exp">
                    <div class="lw-bar">
                        <div class="lw-fill" id="lwExpFill" style="width:0%"></div>
                    </div>
                    <div class="lw-text">
                        <span class="lw-cur" id="lwExpAtual">0</span>
                        <span>/ <span class="lw-nxt" id="lwExpProx">100</span> EXP</span>
                    </div>
                </div>
            </div>

            <div class="lw-stats">
                <span>❤️ HP<span class="hp-c" id="lwHp">100/100</span></span>
                <span>💧 MANA<span class="mp-c" id="lwMp">50/50</span></span>
                <span>⚡ STAMINA<span class="sm-c" id="lwSm">100/100</span></span>
                <span>⚔️ FORCA<span class="atk-c" id="lwAtk">0</span></span>
                <span>🛡️ DEFESA<span class="def-c" id="lwDef">0</span></span>
                <span>🔮 MAGIA<span class="mag-c" id="lwMag">0</span></span>
            </div>
        </div>

        <div class="market-header">
            <h2><i class="fas fa-store"></i> Mercado</h2>
            <div class="saldo-box">
                <span class="label">💰 Saldo:</span>
                <span class="value" id="marketSaldo">R$ 0,00</span>
                <span class="label" style="margin-left:12px;">🌰 Seeds:</span>
                <span class="seeds-value" id="marketSeeds">0</span>
            </div>
        </div>

        <div class="market-grid" id="marketGrid"></div>

        <div class="player-inventory">
            <h3><i class="fas fa-box"></i> Seu Estoque</h3>
            <div class="inv-grid" id="inventoryGrid">
                <span style="color:var(--text-muted); font-size:0.8rem;">Carregando...</span>
            </div>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        'use strict';

        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================
        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
        const TABELA       = 'Geral';

        const LOGIN_PAGE   = 'login.html';
        const DASHBOARD    = '../../dashboard.html';

        let supabaseOnline = false;
        let usuarioLogado  = null;
        let toastTimeout   = null;
        let salvando       = false;

        // ============================================================
        // ITENS DO MERCADO
        // ============================================================
        const ITENS_MERCADO = [
            { id: 'sementes', nome: 'Sementes', emoji: '🌰', descricao: 'Plante no milharal',         precoBase: 5,  precoAtual: 5,  qtdDisponivel: 100, qtdMaxima: 200 },
            { id: 'milho',    nome: 'Milho',    emoji: '🌽', descricao: 'Colheita do milharal',        precoBase: 8,  precoAtual: 8,  qtdDisponivel: 80,  qtdMaxima: 150 },
            { id: 'ovos',     nome: 'Ovos',     emoji: '🥚', descricao: 'Produzidos por galinhas',     precoBase: 3,  precoAtual: 3,  qtdDisponivel: 120, qtdMaxima: 200 },
            { id: 'galinhas', nome: 'Galinhas', emoji: '🐔', descricao: 'Produzem ovos',               precoBase: 25, precoAtual: 25, qtdDisponivel: 30,  qtdMaxima: 60  },
            { id: 'madeira',  nome: 'Madeira',  emoji: '🪵', descricao: 'Recurso básico',              precoBase: 10, precoAtual: 10, qtdDisponivel: 150, qtdMaxima: 300 },
            { id: 'pedra',    nome: 'Pedra',    emoji: '🪨', descricao: 'Recurso básico',              precoBase: 15, precoAtual: 15, qtdDisponivel: 120, qtdMaxima: 250 },
            { id: 'ouro',     nome: 'Ouro',     emoji: '💎', descricao: 'Recurso valioso',             precoBase: 50, precoAtual: 50, qtdDisponivel: 40,  qtdMaxima: 100 },
            { id: 'pocao',    nome: 'Poção',    emoji: '🧪', descricao: 'Item mágico',                 precoBase: 25, precoAtual: 25, qtdDisponivel: 60,  qtdMaxima: 120 },
            { id: 'balde',    nome: 'Balde',    emoji: '🪣', descricao: 'Útil para carregar líquidos', precoBase: 12, precoAtual: 12, qtdDisponivel: 80,  qtdMaxima: 150 }
        ];

        let inventario = {};
        let saldo      = 0;
        let seeds      = 0;

        function initInventario() {
            inventario = {};
            ITENS_MERCADO.forEach(item => { inventario[item.id] = 0; });
        }
        initInventario();

        // ============================================================
        // DOM
        // ============================================================
        const marketGrid         = document.getElementById('marketGrid');
        const inventoryGrid      = document.getElementById('inventoryGrid');
        const marketSaldo        = document.getElementById('marketSaldo');
        const marketSeeds        = document.getElementById('marketSeeds');
        const headerSaldo        = document.getElementById('headerSaldo');
        const headerSeeds        = document.getElementById('headerSeeds');
        const userBalanceDisplay = document.getElementById('userBalanceDisplay');
        const userSeedsDisplay   = document.getElementById('userSeedsDisplay');

        // ============================================================
        // AUXILIARES
        // ============================================================
        function formatSaldo(valor) {
            return Number(valor).toFixed(2).replace('.', ',');
        }
        function getSaldoTotal() { return saldo || 0; }

        function atualizarSaldoGlobal() {
            const total = getSaldoTotal();
            if (headerSaldo)        headerSaldo.textContent = formatSaldo(total);
            if (marketSaldo)        marketSaldo.textContent = `R$ ${formatSaldo(total)}`;
            if (userBalanceDisplay) userBalanceDisplay.textContent = `💰 R$ ${formatSaldo(total)}`;
        }

        function atualizarSeedsGlobal() {
            const s = Number(seeds) || 0;
            if (headerSeeds)      headerSeeds.textContent = s;
            if (marketSeeds)      marketSeeds.textContent = s;
            if (userSeedsDisplay) userSeedsDisplay.textContent = `🌰 ${s} sementes`;
        }

        function showToast(text, duration = 2200) {
            const toastEl = document.getElementById('toast');
            if (!toastEl) return;
            if (toastTimeout) { clearTimeout(toastTimeout); toastEl.classList.remove('show'); }
            toastEl.textContent = text;
            toastEl.classList.add('show');
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');
                toastTimeout = null;
            }, duration);
        }

        // ============================================================
        // NÍVEL
        // ============================================================
        function getTitulo(nivel) {
            const titulos = [
                { min: 1,   titulo: '🌱 Iniciante' },
                { min: 5,   titulo: '🌿 Aprendiz' },
                { min: 10,  titulo: '⚔️ Guerreiro' },
                { min: 20,  titulo: '🛡️ Mestre' },
                { min: 35,  titulo: '🏆 Lendário' },
                { min: 50,  titulo: '👑 Herói' },
                { min: 75,  titulo: '⚡ Deus da Guerra' },
                { min: 100, titulo: '🌟 Imortal' }
            ];
            let t = titulos[0].titulo;
            for (const x of titulos) if (nivel >= x.min) t = x.titulo;
            return t;
        }

        function atualizarLevelWidget(dados) {
            if (!dados) return;

            const nivel   = Number(dados.nivel)        || 1;
            const exp     = Number(dados.experiencia)  || 0;
            const expProx = Number(dados.exp_proximo)  || 100;
            const pct     = expProx > 0 ? (exp / expProx) * 100 : 0;

            const hpAtual = Number(dados.hp_atual) || 0;
            const hpMax   = Number(dados.hp_max)   || 100;
            const mpAtual = Number(dados.mp_atual) || 0;
            const mpMax   = Number(dados.mp_max)   || 50;
            const smAtual = Number(dados.sm_atual) || 0;
            const smMax   = Number(dados.sm_max)   || 100;

            document.getElementById('lwNivel').textContent    = nivel;
            document.getElementById('lwTitulo').textContent   = getTitulo(nivel);
            document.getElementById('lwExpFill').style.width  = Math.min(pct, 100) + '%';
            document.getElementById('lwExpAtual').textContent = exp;
            document.getElementById('lwExpProx').textContent  = expProx;
            document.getElementById('lwHp').textContent  = `${hpAtual}/${hpMax}`;
            document.getElementById('lwMp').textContent  = `${mpAtual}/${mpMax}`;
            document.getElementById('lwSm').textContent  = `${smAtual}/${smMax}`;
            document.getElementById('lwAtk').textContent = Number(dados.ataque_base) || 0;
            document.getElementById('lwDef').textContent = Number(dados.defesa_base) || 0;
            document.getElementById('lwMag').textContent = Number(dados.magia_base)  || 0;
        }

        // ============================================================
        // STATUS SUPABASE
        // ============================================================
        function atualizarStatusSupabase(online, texto) {
            const dot    = document.getElementById('supabaseDot');
            const status = document.getElementById('supabaseStatus');
            if (dot)    dot.className    = 'dot '   + (online ? 'online'  : 'offline');
            if (status) {
                status.className   = 'value ' + (online ? 'online' : 'offline');
                status.textContent = texto;
            }
            supabaseOnline = online;
        }

        async function verificarSupabase() {
            try {
                const r = await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}?select=id&limit=1`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (r.ok) { atualizarStatusSupabase(true, 'Online'); return true; }
                atualizarStatusSupabase(false, `Erro ${r.status}`);
                return false;
            } catch (e) {
                atualizarStatusSupabase(false, 'Falha');
                return false;
            }
        }

        // ============================================================
        // USUÁRIO
        // ============================================================
        function carregarUsuario() {
            try {
                const data = localStorage.getItem('usuario_logado');
                if (data) {
                    usuarioLogado = JSON.parse(data);
                    return !!(usuarioLogado && usuarioLogado.login);
                }
            } catch (e) { console.error(e); }
            return false;
        }

        function salvarUsuarioLocal(usuario) {
            try {
                localStorage.setItem('usuario_logado', JSON.stringify(usuario));
                usuarioLogado = usuario;
            } catch (e) { console.error(e); }
        }

        function atualizarInterfaceUsuario() {
            const avatarEl = document.getElementById('userAvatar');
            const nomeEl   = document.getElementById('userName');

            if (usuarioLogado && usuarioLogado.login) {
                const nome = usuarioLogado.nome || usuarioLogado.login;
                if (avatarEl) avatarEl.textContent = nome.charAt(0).toUpperCase();
                if (nomeEl)   nomeEl.textContent   = nome;
            } else {
                if (avatarEl) avatarEl.textContent = '?';
                if (nomeEl)   nomeEl.textContent   = 'Visitante';
            }
            atualizarSaldoGlobal();
            atualizarSeedsGlobal();
        }

        function redirecionarLogin(msg) {
            if (msg) showToast(msg, 1800);
            setTimeout(() => { window.location.href = LOGIN_PAGE; }, 500);
        }

        function fazerLogout() {
            localStorage.removeItem('usuario_logado');
            showToast('👋 Saindo...', 1200);
            setTimeout(() => { window.location.href = LOGIN_PAGE; }, 800);
        }

        // ============================================================
        // REGISTRO COMPLETO
        // ============================================================
        function montarRegistroCompleto(login, senha) {
            const invInicial = {};
            ITENS_MERCADO.forEach(i => { invInicial[i.id] = 0; });

            const mercadoInicial = {};
            ITENS_MERCADO.forEach(i => { mercadoInicial[i.id] = i.qtdMaxima; });

            return {
                login:        login,
                nome:         login,
                senha:        senha || 'sem_senha',
                saldo:        50.00,
                seeds:        0,
                nivel:        1,
                experiencia:  0,
                exp_proximo:  100,

                hp_atual: 100, hp_max: 100,
                mp_atual: 50,  mp_max: 50,
                sm_atual: 100, sm_max: 100,

                ataque_base: 0,
                defesa_base: 0,
                magia_base:  0,

                carteira: {
                    'Madeira': 0, 'Pedra': 0, 'Ouro': 0, 'Poção': 0, 'Balde': 0
                },
                fazendinha_dados: {
                    inventario: invInicial,
                    plantio:    { active: false, stage: 0, progress: 0 },
                    incubacao:  { active: false, stage: 0, progress: 0 },
                    saldo: 50.00,
                    mercado_estoque: mercadoInicial
                }
            };
        }

        async function criarRegistroSeNaoExistir(usuario) {
            const r = await fetch(
                `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuario.login)}&select=id`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
            );
            const data = await r.json();
            if (data && data.length > 0) return false;

            const payload = montarRegistroCompleto(usuario.login, usuario.senha);
            const cr = await fetch(`${SUPABASE_URL}/rest/v1/${TABELA}`, {
                method: 'POST',
                headers: {
                    'Content-Type':  'application/json',
                    'apikey':        SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Prefer':        'return=minimal'
                },
                body: JSON.stringify(payload)
            });

            if (cr.ok || cr.status === 201 || cr.status === 204) {
                console.log('✅ Registro criado automaticamente para', usuario.login);
                return true;
            }
            console.warn('⚠️ Falha ao criar registro:', cr.status, await cr.text());
            return false;
        }

        // ============================================================
        // CARREGAR / SALVAR
        // ============================================================
        async function carregarDadosDoJogador() {
            if (!usuarioLogado) return;

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`,
                    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
                );

                if (!response.ok) throw new Error(`Erro ${response.status}`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    showToast('📝 Criando seu registro no banco...', 1500);
                    await criarRegistroSeNaoExistir(usuarioLogado);
                    return carregarDadosDoJogador();
                }

                const d = data[0];
                saldo = Number(d.saldo ?? 50.00);
                seeds = Number(d.seeds ?? 0);

                if (d.nome && d.nome !== usuarioLogado.nome) {
                    salvarUsuarioLocal({ login: usuarioLogado.login, nome: d.nome });
                    atualizarInterfaceUsuario();
                }

                // Estoque do mercado
                if (d.fazendinha_dados && d.fazendinha_dados.mercado_estoque) {
                    const me = d.fazendinha_dados.mercado_estoque;
                    ITENS_MERCADO.forEach(i => {
                        if (me[i.id] !== undefined) i.qtdDisponivel = Number(me[i.id]) || 0;
                    });
                } else {
                    ITENS_MERCADO.forEach(i => { i.qtdDisponivel = i.qtdMaxima; });
                }

                // Inventário
                initInventario();
                if (d.fazendinha_dados && d.fazendinha_dados.inventario) {
                    const inv = d.fazendinha_dados.inventario;
                    ITENS_MERCADO.forEach(i => {
                        if (inv[i.id] !== undefined) inventario[i.id] = Number(inv[i.id]) || 0;
                    });
                }

                // Carteira legado — mescla
                if (d.carteira) {
                    const c = d.carteira;
                    const map = { 'Madeira': 'madeira', 'Pedra': 'pedra', 'Ouro': 'ouro', 'Poção': 'pocao', 'Balde': 'balde' };
                    Object.keys(map).forEach(k => {
                        if (c[k] !== undefined) inventario[map[k]] = Number(c[k]) || 0;
                    });
                }

                atualizarLevelWidget(d);
                atualizarSaldoGlobal();
                atualizarSeedsGlobal();
                renderizarMercado();
                renderizarInventario();

            } catch (error) {
                console.error('❌ Erro ao carregar:', error);
                showToast('❌ Erro ao carregar: ' + error.message, 3000);
            }
        }

        async function salvarDadosDoJogador() {
            if (!usuarioLogado || !supabaseOnline || salvando) return;
            salvando = true;

            try {
                const invCompleto = {};
                ITENS_MERCADO.forEach(i => { invCompleto[i.id] = inventario[i.id] || 0; });

                const mercadoEstoque = {};
                ITENS_MERCADO.forEach(i => { mercadoEstoque[i.id] = i.qtdDisponivel; });

                const rGet = await fetch(
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`,
                    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
                );
                const data  = await rGet.json();
                const atual = (data && data[0]) || {};

                if (!atual.id) {
                    await criarRegistroSeNaoExistir(usuarioLogado);
                    salvando = false;
                    return;
                }

                const fazendinhaDados = atual.fazendinha_dados || {
                    inventario: invCompleto,
                    plantio:    { active: false, stage: 0, progress: 0 },
                    incubacao:  { active: false, stage: 0, progress: 0 },
                    saldo: saldo
                };

                fazendinhaDados.inventario      = invCompleto;
                fazendinhaDados.saldo           = saldo;
                fazendinhaDados.mercado_estoque = mercadoEstoque;

                // ⚠️ seeds NÃO é enviado — o mercado só lê, outra página controla.
                //    Descomente a linha "seeds: seeds" abaixo se quiser que o
                //    mercado também possa alterar seeds.
                const payload = {
                    saldo: Number(saldo).toFixed(2),
                    carteira: {
                        'Madeira': inventario.madeira || 0,
                        'Pedra':   inventario.pedra   || 0,
                        'Ouro':    inventario.ouro    || 0,
                        'Poção':   inventario.pocao   || 0,
                        'Balde':   inventario.balde   || 0
                    },
                    fazendinha_dados: fazendinhaDados
                    // seeds: seeds
                };

                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}`,
                    {
                        method: 'PATCH',
                        headers: {
                            'Content-Type':  'application/json',
                            'apikey':        SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Prefer':        'return=minimal'
                        },
                        body: JSON.stringify(payload)
                    }
                );

                if (!response.ok) {
                    const err = await response.text();
                    console.warn('⚠️ Erro ao salvar:', response.status, err);
                } else {
                    console.log('✅ Dados salvos!');
                }
            } catch (error) {
                console.error('❌ Erro ao salvar:', error);
            } finally {
                salvando = false;
            }
        }

        // ============================================================
        // SINCRONIZA SEEDS COM O BANCO (leitura leve, não sobrescreve)
        // ============================================================
        async function sincronizarSeedsComBanco() {
            if (!usuarioLogado || !supabaseOnline) return;
            try {
                const r = await fetch(
                    `${SUPABASE_URL}/rest/v1/${TABELA}?login=eq.${encodeURIComponent(usuarioLogado.login)}&select=seeds`,
                    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
                );
                if (!r.ok) return;
                const data = await r.json();
                if (!data || !data[0]) return;

                const novoSeeds = Number(data[0].seeds) || 0;
                if (novoSeeds !== seeds) {
                    seeds = novoSeeds;
                    atualizarSeedsGlobal();
                    console.log('🔄 seeds sincronizadas:', seeds);
                }
            } catch (e) {
                // silencioso
            }
        }

        // ============================================================
        // MERCADO
        // ============================================================
        function gerarPrecos() {
            ITENS_MERCADO.forEach(item => {
                const variacao = (Math.random() - 0.5) * 0.4;
                item.precoAtual = Math.max(0.5, item.precoBase * (1 + variacao));
                item.precoAtual = Math.round(item.precoAtual * 100) / 100;
            });
        }

        function renderizarMercado() {
            let html = '';
            ITENS_MERCADO.forEach(item => {
                const qtd   = inventario[item.id] || 0;
                const preco = item.precoAtual.toFixed(2);
                html += `
                    <div class="market-item">
                        <div class="item-header">
                            <span class="item-icon">${item.emoji}</span>
                            <div>
                                <div class="item-name">${item.nome}</div>
                                <div class="item-sub">${item.descricao}</div>
                            </div>
                        </div>
                        <div class="item-price">R$ ${preco} <span>cada</span></div>
                        <div class="item-stock">
                            Você tem: <strong>${qtd}</strong> | Mercado:
                            <strong style="color:var(--neon-blue);">${item.qtdDisponivel}</strong> disponíveis
                        </div>
                        <div class="item-actions">
                            <div class="qty-group">
                                <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" max="99">
                            </div>
                            <button class="btn btn-buy" onclick="window.comprarItem('${item.id}')">
                                <i class="fas fa-shopping-cart"></i> Comprar
                            </button>
                            <button class="btn btn-sell" onclick="window.venderItem('${item.id}')" ${qtd <= 0 ? 'disabled' : ''}>
                                <i class="fas fa-coins"></i> Vender
                            </button>
                        </div>
                    </div>
                `;
            });
            marketGrid.innerHTML = html;
        }

        function renderizarInventario() {
            let html = '';
            let temItem = false;
            ITENS_MERCADO.forEach(item => {
                const qtd = inventario[item.id] || 0;
                if (qtd > 0) {
                    temItem = true;
                    html += `<span class="inv-item">${item.emoji} ${item.nome}: <span class="qty">${qtd}</span></span>`;
                }
            });
            if (!temItem) {
                html = '<span style="color:var(--text-muted); font-size:0.8rem;">📭 Nenhum item no estoque</span>';
            }
            inventoryGrid.innerHTML = html;
        }

        // ============================================================
        // COMPRAR / VENDER
        // ============================================================
        window.comprarItem = async function(itemId) {
            if (!usuarioLogado)  { redirecionarLogin('👤 Faça login primeiro!'); return; }
            if (!supabaseOnline) { showToast('⚠️ Sem conexão com o banco!', 2000); return; }

            const item = ITENS_MERCADO.find(i => i.id === itemId);
            if (!item) return;

            const qty = parseInt(document.getElementById(`qty_${itemId}`).value) || 1;
            if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

            const custo = item.precoAtual * qty;
            if (saldo < custo)            { showToast(`😅 Saldo insuficiente! Precisa R$ ${formatSaldo(custo)}`, 2000); return; }
            if (item.qtdDisponivel < qty) { showToast(`😅 Mercado tem só ${item.qtdDisponivel}`, 2000); return; }

            saldo = Math.round((saldo - custo) * 100) / 100;
            item.qtdDisponivel -= qty;
            inventario[itemId] = (inventario[itemId] || 0) + qty;

            atualizarSaldoGlobal();
            renderizarMercado();
            renderizarInventario();

            await salvarDadosDoJogador();
            showToast(`✅ Comprou ${qty} ${item.nome} por R$ ${formatSaldo(custo)}`, 2500);
        };

        window.venderItem = async function(itemId) {
            if (!usuarioLogado)  { redirecionarLogin('👤 Faça login primeiro!'); return; }
            if (!supabaseOnline) { showToast('⚠️ Sem conexão com o banco!', 2000); return; }

            const item = ITENS_MERCADO.find(i => i.id === itemId);
            if (!item) return;

            const qty = parseInt(document.getElementById(`qty_${itemId}`).value) || 1;
            if (qty <= 0) { showToast('⚠️ Quantidade inválida', 1500); return; }

            const qtdAtual = inventario[itemId] || 0;
            if (qtdAtual < qty) { showToast(`😅 Você tem apenas ${qtdAtual} ${item.nome}`, 2000); return; }

            const total = item.precoAtual * 0.7 * qty;
            saldo = Math.round((saldo + total) * 100) / 100;
            inventario[itemId] = qtdAtual - qty;
            item.qtdDisponivel += qty;

            atualizarSaldoGlobal();
            renderizarMercado();
            renderizarInventario();

            await salvarDadosDoJogador();
            showToast(`💰 Vendeu ${qty} ${item.nome} por R$ ${formatSaldo(total)}`, 2500);
        };

        // ============================================================
        // EVENTOS
        // ============================================================
        document.getElementById('btnReconnectSupabase')?.addEventListener('click', function() {
            verificarSupabase();
            showToast('🔄 Verificando conexão...', 1500);
        });

        document.getElementById('btnLogout')?.addEventListener('click', function() {
            if (confirm('Deseja sair da sua conta?')) fazerLogout();
        });

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        (async function init() {
            await verificarSupabase();

            if (!carregarUsuario()) {
                redirecionarLogin('👤 Faça login para acessar o mercado.');
                return;
            }

            gerarPrecos();
            renderizarMercado();
            renderizarInventario();
            atualizarInterfaceUsuario();

            if (supabaseOnline) {
                await carregarDadosDoJogador();
                await sincronizarSeedsComBanco();
                showToast(`👋 Olá, ${usuarioLogado.nome || usuarioLogado.login}!`, 2000);
            } else {
                showToast('⚠️ Sem conexão com o banco.', 3000);
            }

            // Preços flutuam a cada 60s
            setInterval(() => { gerarPrecos(); renderizarMercado(); }, 60000);

            // Verifica conexão a cada 30s
            setInterval(() => verificarSupabase(), 30000);

            // Salva dados a cada 30s (NÃO envia seeds)
            setInterval(() => {
                if (usuarioLogado && supabaseOnline && !salvando) salvarDadosDoJogador();
            }, 30000);

            // Sincroniza seeds a cada 15s (só leitura)
            setInterval(sincronizarSeedsComBanco, 15000);

            // Salva ao sair
            window.addEventListener('beforeunload', function() {
                if (usuarioLogado && supabaseOnline && !salvando) {
                    salvarDadosDoJogador();
                }
            });

            console.log('🌾 Mercado carregado!');
        })();
    })();
    </script>
</body>
</html>
