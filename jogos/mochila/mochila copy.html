<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎒 Mochila</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============================================================
     1. RESET E VARIÁVEIS
  ============================================================ */
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    /* Cores base */
    --bg:        #0a0e16;
    --bg-radial: #16233a;
    --card:      #121a28;
    --card2:     #18222f;
    --line:      #233046;

    /* Texto */
    --txt:       #e7eefb;
    --mut:       #8ea0bb;

    /* Acentos */
    --pri:       #4f8cff;
    --pri2:      #2f6fe0;
    --ok:        #22c55e;
    --ok-dark:   #16a34a;
    --warn:      #f59e0b;
    --err:       #ef4444;
    --purple:    #8b5cf6;
    --purple-d:  #7000ff;
    --gold:      #f5c542;

    /* Utilidades */
    --radius:    14px;
    --radius-lg: 16px;
    --shadow:    0 0 15px rgba(139, 92, 246, .35);
    --transition: .15s ease;
  }

  /* ============================================================
     2. BASE
  ============================================================ */
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, var(--bg-radial) 0%, var(--bg) 60%);
    color: var(--txt);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ============================================================
     3. BOTÕES DE NAVEGAÇÃO RÁPIDA (topo)
  ============================================================ */
  .nav-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 20px;
    background: rgba(10, 14, 22, .65);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    justify-content: center;
  }

  .btn-bolsa,
  .btn-sair {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--purple), var(--purple-d));
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    transition: transform var(--transition), filter var(--transition), box-shadow var(--transition);
    white-space: nowrap;
  }

  .btn-bolsa:hover,
  .btn-sair:hover {
    filter: brightness(1.15);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, .35);
  }

  .btn-bolsa:active,
  .btn-sair:active {
    transform: scale(.97);
  }

  .btn-sair {
    background: linear-gradient(135deg, #b91c1c, #7f1d1d);
  }

  .btn-diario   { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .btn-codex    { background: linear-gradient(135deg, #22c55e, #16a34a); }

  /* ============================================================
     4. HEADER DA PÁGINA
  ============================================================ */
  header.page-header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 14, 22, .75);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand small {
    font-weight: 400;
    font-size: 12px;
    color: var(--mut);
    margin-left: 6px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .user-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }

  .user-info .nick {
    font-weight: 700;
    color: #4ade80;
  }

  /* ============================================================
     5. BOTÕES GENÉRICOS (.btn)
  ============================================================ */
  .btn {
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    background: var(--card2);
    color: var(--txt);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    transition: filter var(--transition), transform var(--transition);
  }

  .btn:hover  { filter: brightness(1.2); }
  .btn:active { transform: scale(.98); }

  .btn.pri {
    background: linear-gradient(180deg, var(--pri), var(--pri2));
    border-color: transparent;
    color: #fff;
  }

  .btn.ghost { background: transparent; }

  .btn.danger {
    color: #ff8b8b;
    border-color: #5a2530;
  }
  .btn.danger:hover { background: #2a1418; }

  /* ============================================================
     6. LAYOUT PRINCIPAL
  ============================================================ */
  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 18px;
  }

  /* ============================================================
     7. RESUMO (cards de estatística)
  ============================================================ */
  .resumo {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 18px;
    margin-bottom: 20px;
  }

  .stat { text-align: center; }

  .stat .v {
    font-size: 22px;
    font-weight: 800;
  }

  .stat .l {
    font-size: 11.5px;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-top: 4px;
  }

  /* ============================================================
     8. BARRA DE BUSCA
  ============================================================ */
  .barra {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .barra h2 {
    margin: 0;
    font-size: 17px;
  }

  .busca {
    max-width: 280px;
    width: 100%;
  }

  input {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--txt);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  input:focus {
    border-color: var(--pri);
    box-shadow: 0 0 0 3px rgba(79, 140, 255, .15);
  }

  /* ============================================================
     9. GRID DE ITENS
  ============================================================ */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: up .25s ease;
  }

  @keyframes up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  .item-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .item .emoji {
    font-size: 26px;
    line-height: 1;
  }

  .item .qtd {
    font-size: 12px;
    font-weight: 700;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px 9px;
    color: #fbbf24;
  }

  .item .nome {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    word-break: break-word;
  }

  .item .tipo {
    font-size: 11px;
    color: var(--mut);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ============================================================
     10. ESTADOS VAZIOS / ERRO / DEBUG
  ============================================================ */
  .vazio,
  .erro-box {
    text-align: center;
    color: var(--mut);
    padding: 40px 20px;
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
  }

  .erro-box {
    background: rgba(239, 68, 68, .1);
    border-color: rgba(239, 68, 68, .35);
    color: #fca5a5;
    text-align: left;
    padding: 16px 18px;
    line-height: 1.6;
  }

  .erro-box a {
    color: var(--pri);
    text-decoration: none;
  }
  .erro-box a:hover { text-decoration: underline; }

  .debug {
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--mut);
    margin-bottom: 16px;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* ============================================================
     11. LOADING SPINNER
  ============================================================ */
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--mut);
    border-top-color: var(--pri);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ============================================================
     12. RESPONSIVIDADE
  ============================================================ */
  @media (max-width: 640px) {
    .nav-buttons {
      padding: 10px 12px;
      gap: 8px;
    }

    .btn-bolsa,
    .btn-sair {
      padding: 8px 12px;
      font-size: 12.5px;
    }

    header.page-header {
      padding: 12px 16px;
    }

    .brand { font-size: 17px; }

    .barra {
      flex-direction: column;
      align-items: stretch;
    }

    .busca { max-width: none; }

    .stat .v { font-size: 18px; }
  }
</style>
</head>

<script>
/* ============================================================
   CONFIG
============================================================ */
const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyY3h2aXp6ZHVtY3hieWxta3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjA0NzIsImV4cCI6MjEwMjIzNjQ3Mn0.ohB4tW0UQ-k1PcwoZxm4u9XSGNLsFphv1_UwTWoklOM';
const TABELA       = 'Geral';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Chaves possíveis — testa todas até achar a que tem dados */
const SESSION_KEYS = [
  'usuario_logado',
  'usuarioLogado',
  'user',
  'usuario',
  'jogador',
  'session',
  'sessao',
  'login',
  'portal_bolsa_user',
  'user_data',
  'dados_usuario'
];
const TIMESTAMP_KEYS = [
  'session_timestamp',
  'login_time',
  'timestamp',
  'login_timestamp',
  'session_time'
];
const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24h

/* Emojis */
const EMOJIS = {
  'Espada':'⚔️','Poção':'🧪','Escudo':'🛡️','Anel':'💍','Cristal':'💎',
  'Mapa':'🗺️','Chave':'🔑','Machado':'🪓','Capa':'🧥','Armadura':'🛡️',
  'Arco':'🏹','Flecha':'🎯','Elixir':'⚗️','Bota':'👢','Amuleto':'📿',
  'Sementes':'🌱','Milho':'🌽','Balde':'🪣','Planta':'🌿','Colheita':'🌾'
};

function emojiItem(nome) {
  for (const [k, v] of Object.entries(EMOJIS)) {
    if (nome.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '📦';
}

/* ============================================================
   HELPERS
============================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (v) => Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

function mostrarDebug(msg) {
  const el = $('#debug');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}

/* ============================================================
   LER SESSÃO — tenta TODAS as chaves conhecidas
============================================================ */
function lerSessao() {
  // 1. Tenta cada chave de sessão conhecida
  for (const key of SESSION_KEYS) {
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const obj = JSON.parse(raw);

      // Aceita formato direto { login, nome, email } ou dentro de .user
      const u = obj?.user || obj?.usuario || obj;

      if (u && (u.login || u.nome || u.email || u.id)) {
        // Verifica timestamp se existir
        for (const tkey of TIMESTAMP_KEYS) {
          const ts = localStorage.getItem(tkey);
          if (ts) {
            const t = parseInt(ts, 10);
            if (!isNaN(t) && (Date.now() - t) >= SESSION_DURATION) {
              console.warn(`[mochila] Sessão de ${key} expirada`);
              return null;
            }
          }
        }
        mostrarDebug(`✅ Sessão encontrada em localStorage["${key}"]`);
        return {
          id:    u.id,
          login: u.login || u.nome || u.email?.split('@')[0] || u.username,
          nome:  u.nome || u.login || u.email?.split('@')[0] || u.username,
          email: u.email
        };
      }
    } catch (e) {
      // Não é JSON, tenta usar como string pura
      if (raw.length > 0 && raw.length < 100) {
        mostrarDebug(`✅ Sessão (string) encontrada em localStorage["${key}"]`);
        return { login: raw, nome: raw };
      }
    }
  }

  // 2. Fallback: procura chave sb-*-auth-token (Supabase Auth)
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
      try {
        const obj = JSON.parse(localStorage.getItem(k));
        const u = obj?.user || obj?.session?.user;
        if (u) {
          const login = u.user_metadata?.login ||
                        u.user_metadata?.nick ||
                        u.user_metadata?.nome ||
                        u.email?.split('@')[0];
          mostrarDebug(`✅ Sessão Supabase Auth em "${k}"`);
          return { id: u.id, login, nome: login, email: u.email };
        }
      } catch (_) {}
    }
  }

  // 3. Último recurso: mostra todas as chaves para o usuário diagnosticar
  mostrarDebug('❌ Nenhuma chave de sessão encontrada.');
  mostrarDebug('Chaves disponíveis no localStorage:');
  Object.keys(localStorage).forEach(k => {
    mostrarDebug('  • ' + k + ' = ' + (localStorage.getItem(k) || '').slice(0, 80));
  });
  return null;
}

/* ============================================================
   EXTRAIR ITENS
============================================================ */
function extrairItens(d) {
  const itens = [];

  // 1. carteira (JSONB objeto)
  if (d.carteira && typeof d.carteira === 'object' && !Array.isArray(d.carteira)) {
    Object.entries(d.carteira).forEach(([nome, qtd]) => {
      const q = Number(qtd) || 0;
      if (q > 0) itens.push({ nome, quantidade: q, tipo: 'carteira' });
    });
  }

  // 2. itens (array)
  if (Array.isArray(d.itens)) {
    d.itens.forEach(it => {
      if (it && it.nome) {
        const q = Number(it.quantidade) || 0;
        if (q > 0) itens.push({ nome: it.nome, quantidade: q, tipo: 'item' });
      }
    });
  }
  // 3. itens (objeto)
  else if (d.itens && typeof d.itens === 'object') {
    Object.entries(d.itens).forEach(([nome, qtd]) => {
      const q = Number(qtd) || 0;
      if (q > 0) itens.push({ nome, quantidade: q, tipo: 'item' });
    });
  }

  // 4. Colunas numéricas
  const diretas = {
    seeds: 'Sementes', stock: 'Milho', buckets: 'Balde',
    planted: 'Planta', harvested: 'Colheita'
  };
  Object.entries(diretas).forEach(([col, nome]) => {
    const q = Number(d[col]) || 0;
    if (q > 0) itens.push({ nome, quantidade: q, tipo: 'recurso' });
  });

  itens.sort((a, b) => b.quantidade - a.quantidade);
  return itens;
}

/* ============================================================
   RENDER
============================================================ */
let TODOS_ITENS = [];

function renderResumo(d) {
  $('#resumo').innerHTML = `
    <div class="stat"><div class="v">${money(d.saldo)}</div><div class="l">💰 Saldo</div></div>
    <div class="stat"><div class="v">${Number(d.seeds) || 0}</div><div class="l">🌱 Sementes</div></div>
    <div class="stat"><div class="v">${Number(d.stock) || 0}</div><div class="l">🌽 Milho</div></div>
    <div class="stat"><div class="v">${Number(d.buckets) || 0}</div><div class="l">🪣 Baldes</div></div>
    <div class="stat"><div class="v">${Number(d.planted) || 0}</div><div class="l">🌿 Plantados</div></div>
    <div class="stat"><div class="v">${Number(d.harvested) || 0}</div><div class="l">🌾 Colhidos</div></div>
  `;
}

function renderItens(filtro = '') {
  const conteudo = $('#conteudo');
  const q = filtro.trim().toLowerCase();
  const filtrados = q
    ? TODOS_ITENS.filter(i => i.nome.toLowerCase().includes(q))
    : TODOS_ITENS;

  if (!filtrados.length) {
    conteudo.innerHTML = TODOS_ITENS.length === 0
      ? `<div class="vazio">🎒 Mochila vazia. Nenhum item encontrado.</div>`
      : `<div class="vazio">🔍 Nenhum item corresponde à busca.</div>`;
    return;
  }

  conteudo.innerHTML = `<div class="grid">${
    filtrados.map(it => `
      <div class="item">
        <div class="item-top">
          <span class="emoji">${emojiItem(it.nome)}</span>
          <span class="qtd">×${it.quantidade}</span>
        </div>
        <div class="nome">${esc(it.nome)}</div>
        <div class="tipo">${esc(it.tipo)}</div>
      </div>
    `).join('')
  }</div>`;
}

function renderUsuario(u) {
  $('#user-area').innerHTML = `
    <span>👤 <span class="nick">${esc(u.nome || u.login)}</span></span>
    <button class="btn ghost danger" id="btn-sair">Sair</button>
  `;
  $('#btn-sair').addEventListener('click', () => {
    SESSION_KEYS.forEach(k => localStorage.removeItem(k));
    TIMESTAMP_KEYS.forEach(k => localStorage.removeItem(k));
    location.href = 'https://xoperadorx.github.io/Portal-Bolsa/login.html';
  });
}

function mostrarErro(msg) {
  $('#conteudo').innerHTML = `<div class="erro-box">${msg}</div>`;
}

/* ============================================================
   CARREGAR
============================================================ */
async function carregar() {
  const u = lerSessao();

  if (!u || !u.login) {
    $('#user-area').innerHTML = `
      <span style="color:#fbbf24;font-size:13px">⚠️ Não logado</span>
      <a class="btn pri" href="https://xoperadorx.github.io/Portal-Bolsa/login.html">Fazer login</a>`;
    mostrarErro(`⚠️ Nenhuma sessão ativa encontrada.
      <br><br>Faça login no portal primeiro:
      <a href="https://xoperadorx.github.io/Portal-Bolsa/login.html">login.html</a>
      <br><br>Depois volte para esta página.`);
    return;
  }

  renderUsuario(u);

  const { data, error } = await db
    .from(TABELA)
    .select('*')
    .eq('login', u.login)
    .limit(1);

  if (error) {
    mostrarErro(`⚠️ Erro ao consultar o banco: <strong>${esc(error.message)}</strong>`);
    return;
  }

  if (!data || data.length === 0) {
    mostrarErro(`⚠️ Jogador <strong>${esc(u.login)}</strong> não encontrado na tabela <code>${TABELA}</code>.
      <br><br>Certifique-se de que o jogador existe no banco ou rode o SQL de população.`);
    return;
  }

  const d = data[0];
  renderResumo(d);

  TODOS_ITENS = extrairItens(d);
  $('#total-itens').textContent = `${TODOS_ITENS.length} itens`;
  renderItens();
}

  $('#busca').addEventListener('input', (e) => renderItens(e.target.value));

    console.log('localStorage["' + k + '"] =', localStorage.getItem(k));
  });

  carregar();
});
</script>
