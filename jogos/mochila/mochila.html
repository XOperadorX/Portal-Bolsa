<script>
/* ============================================================
   CONFIG
============================================================ */
const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyY3h2aXp6ZHVtY3hieWxta3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NjA0NzIsImV4cCI6MjEwMjIzNjQ3Mn0.ohB4tW0UQ-k1PcwoZxm4u9XSGNLsFphv1_UwTWoklOM';
const TABELA       = 'Geral';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Chaves possíveis — testa todas até achar a que tem dados */
const SESSION_KEYS = [
  'usuario_logado',
  'usuarioLogado',
  'user',
  'usuario',
  'jogador',
  'session',
  'sessao',
  'login',
  'portal_bolsa_user',
  'user_data',
  'dados_usuario'
];
const TIMESTAMP_KEYS = [
  'session_timestamp',
  'login_time',
  'timestamp',
  'login_timestamp',
  'session_time'
];
const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24h

/* Emojis */
const EMOJIS = {
  'Espada':'⚔️','Poção':'🧪','Escudo':'🛡️','Anel':'💍','Cristal':'💎',
  'Mapa':'🗺️','Chave':'🔑','Machado':'🪓','Capa':'🧥','Armadura':'🛡️',
  'Arco':'🏹','Flecha':'🎯','Elixir':'⚗️','Bota':'👢','Amuleto':'📿',
  'Sementes':'🌱','Milho':'🌽','Balde':'🪣','Planta':'🌿','Colheita':'🌾'
};

function emojiItem(nome) {
  for (const [k, v] of Object.entries(EMOJIS)) {
    if (nome.toLowerCase().includes(k.toLowerCase())) return v;
  }
  return '📦';
}

/* ============================================================
   HELPERS
============================================================ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = (v) => Number(v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

function mostrarDebug(msg) {
  const el = $('#debug');
  el.style.display = 'block';
  el.textContent += msg + '\n';
}

/* ============================================================
   LER SESSÃO — tenta TODAS as chaves conhecidas
============================================================ */
function lerSessao() {
  // 1. Tenta cada chave de sessão conhecida
  for (const key of SESSION_KEYS) {
    const raw = localStorage.getItem(key);
    if (!raw) continue;
    try {
      const obj = JSON.parse(raw);

      // Aceita formato direto { login, nome, email } ou dentro de .user
      const u = obj?.user || obj?.usuario || obj;

      if (u && (u.login || u.nome || u.email || u.id)) {
        // Verifica timestamp se existir
        for (const tkey of TIMESTAMP_KEYS) {
          const ts = localStorage.getItem(tkey);
          if (ts) {
            const t = parseInt(ts, 10);
            if (!isNaN(t) && (Date.now() - t) >= SESSION_DURATION) {
              console.warn(`[mochila] Sessão de ${key} expirada`);
              return null;
            }
          }
        }
        mostrarDebug(`✅ Sessão encontrada em localStorage["${key}"]`);
        return {
          id:    u.id,
          login: u.login || u.nome || u.email?.split('@')[0] || u.username,
          nome:  u.nome || u.login || u.email?.split('@')[0] || u.username,
          email: u.email
        };
      }
    } catch (e) {
      // Não é JSON, tenta usar como string pura
      if (raw.length > 0 && raw.length < 100) {
        mostrarDebug(`✅ Sessão (string) encontrada em localStorage["${key}"]`);
        return { login: raw, nome: raw };
      }
    }
  }

  // 2. Fallback: procura chave sb-*-auth-token (Supabase Auth)
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('sb-') && k.endsWith('-auth-token')) {
      try {
        const obj = JSON.parse(localStorage.getItem(k));
        const u = obj?.user || obj?.session?.user;
        if (u) {
          const login = u.user_metadata?.login ||
                        u.user_metadata?.nick ||
                        u.user_metadata?.nome ||
                        u.email?.split('@')[0];
          mostrarDebug(`✅ Sessão Supabase Auth em "${k}"`);
          return { id: u.id, login, nome: login, email: u.email };
        }
      } catch (_) {}
    }
  }

  // 3. Último recurso: mostra todas as chaves para o usuário diagnosticar
  mostrarDebug('❌ Nenhuma chave de sessão encontrada.');
  mostrarDebug('Chaves disponíveis no localStorage:');
  Object.keys(localStorage).forEach(k => {
    mostrarDebug('  • ' + k + ' = ' + (localStorage.getItem(k) || '').slice(0, 80));
  });
  return null;
}

/* ============================================================
   EXTRAIR ITENS
============================================================ */
function extrairItens(d) {
  const itens = [];

  // 1. carteira (JSONB objeto)
  if (d.carteira && typeof d.carteira === 'object' && !Array.isArray(d.carteira)) {
    Object.entries(d.carteira).forEach(([nome, qtd]) => {
      const q = Number(qtd) || 0;
      if (q > 0) itens.push({ nome, quantidade: q, tipo: 'carteira' });
    });
  }

  // 2. itens (array)
  if (Array.isArray(d.itens)) {
    d.itens.forEach(it => {
      if (it && it.nome) {
        const q = Number(it.quantidade) || 0;
        if (q > 0) itens.push({ nome: it.nome, quantidade: q, tipo: 'item' });
      }
    });
  }
  // 3. itens (objeto)
  else if (d.itens && typeof d.itens === 'object') {
    Object.entries(d.itens).forEach(([nome, qtd]) => {
      const q = Number(qtd) || 0;
      if (q > 0) itens.push({ nome, quantidade: q, tipo: 'item' });
    });
  }

  // 4. Colunas numéricas
  const diretas = {
    seeds: 'Sementes', stock: 'Milho', buckets: 'Balde',
    planted: 'Planta', harvested: 'Colheita'
  };
  Object.entries(diretas).forEach(([col, nome]) => {
    const q = Number(d[col]) || 0;
    if (q > 0) itens.push({ nome, quantidade: q, tipo: 'recurso' });
  });

  itens.sort((a, b) => b.quantidade - a.quantidade);
  return itens;
}

/* ============================================================
   RENDER
============================================================ */
let TODOS_ITENS = [];

function renderResumo(d) {
  $('#resumo').innerHTML = `
    <div class="stat"><div class="v">${money(d.saldo)}</div><div class="l">💰 Saldo</div></div>
    <div class="stat"><div class="v">${Number(d.seeds) || 0}</div><div class="l">🌱 Sementes</div></div>
    <div class="stat"><div class="v">${Number(d.stock) || 0}</div><div class="l">🌽 Milho</div></div>
    <div class="stat"><div class="v">${Number(d.buckets) || 0}</div><div class="l">🪣 Baldes</div></div>
    <div class="stat"><div class="v">${Number(d.planted) || 0}</div><div class="l">🌿 Plantados</div></div>
    <div class="stat"><div class="v">${Number(d.harvested) || 0}</div><div class="l">🌾 Colhidos</div></div>
  `;
}

function renderItens(filtro = '') {
  const conteudo = $('#conteudo');
  const q = filtro.trim().toLowerCase();
  const filtrados = q
    ? TODOS_ITENS.filter(i => i.nome.toLowerCase().includes(q))
    : TODOS_ITENS;

  if (!filtrados.length) {
    conteudo.innerHTML = TODOS_ITENS.length === 0
      ? `<div class="vazio">🎒 Mochila vazia. Nenhum item encontrado.</div>`
      : `<div class="vazio">🔍 Nenhum item corresponde à busca.</div>`;
    return;
  }

  conteudo.innerHTML = `<div class="grid">${
    filtrados.map(it => `
      <div class="item">
        <div class="item-top">
          <span class="emoji">${emojiItem(it.nome)}</span>
          <span class="qtd">×${it.quantidade}</span>
        </div>
        <div class="nome">${esc(it.nome)}</div>
        <div class="tipo">${esc(it.tipo)}</div>
      </div>
    `).join('')
  }</div>`;
}

function renderUsuario(u) {
  $('#user-area').innerHTML = `
    <span>👤 <span class="nick">${esc(u.nome || u.login)}</span></span>
    <button class="btn ghost danger" id="btn-sair">Sair</button>
  `;
  $('#btn-sair').addEventListener('click', () => {
    SESSION_KEYS.forEach(k => localStorage.removeItem(k));
    TIMESTAMP_KEYS.forEach(k => localStorage.removeItem(k));
    location.href = 'https://xoperadorx.github.io/Portal-Bolsa/login.html';
  });
}

function mostrarErro(msg) {
  $('#conteudo').innerHTML = `<div class="erro-box">${msg}</div>`;
}

/* ============================================================
   CARREGAR
============================================================ */
async function carregar() {
  const u = lerSessao();

  if (!u || !u.login) {
    $('#user-area').innerHTML = `
      <span style="color:#fbbf24;font-size:13px">⚠️ Não logado</span>
      <a class="btn pri" href="https://xoperadorx.github.io/Portal-Bolsa/login.html">Fazer login</a>`;
    mostrarErro(`⚠️ Nenhuma sessão ativa encontrada.
      <br><br>Faça login no portal primeiro:
      <a href="https://xoperadorx.github.io/Portal-Bolsa/login.html">login.html</a>
      <br><br>Depois volte para esta página.`);
    return;
  }

  renderUsuario(u);

  const { data, error } = await db
    .from(TABELA)
    .select('*')
    .eq('login', u.login)
    .limit(1);

  if (error) {
    mostrarErro(`⚠️ Erro ao consultar o banco: <strong>${esc(error.message)}</strong>`);
    return;
  }

  if (!data || data.length === 0) {
    mostrarErro(`⚠️ Jogador <strong>${esc(u.login)}</strong> não encontrado na tabela <code>${TABELA}</code>.
      <br><br>Certifique-se de que o jogador existe no banco ou rode o SQL de população.`);
    return;
  }

  const d = data[0];
  renderResumo(d);

  TODOS_ITENS = extrairItens(d);
  $('#total-itens').textContent = `${TODOS_ITENS.length} itens`;
  renderItens();
}

/* ============================================================
   INIT
============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  $('#busca').addEventListener('input', (e) => renderItens(e.target.value));

  // Log de diagnóstico (visível no console)
  console.log('=== MOCHILA DEBUG ===');
  Object.keys(localStorage).forEach(k => {
    console.log('localStorage["' + k + '"] =', localStorage.getItem(k));
  });

  carregar();
});
</script>
