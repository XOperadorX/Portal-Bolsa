<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏛️ Mercado - MM World</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
        /* ===== MESMO ESTILO DO PERSONAGEM ===== */
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #121520;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-green: #00ff66;
            --text-color: #f0f4f8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            background-image:
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(18, 21, 32, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 12px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #a0aec0;
            text-decoration: none;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .nav-links a.active {
            background: rgba(0, 240, 255, 0.2);
            border-color: var(--neon-blue);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 240, 255, 0.08);
            padding: 6px 16px 6px 12px;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            cursor: default;
        }

        .user-profile:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .user-nick {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .user-balance {
            font-size: 0.8rem;
            color: var(--neon-green);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .user-balance::before {
            content: "💰";
            font-size: 0.7rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.8);
        }

        .card {
            background: rgba(18, 21, 32, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            padding: 20px 22px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 240, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
            padding-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .card-title .badge {
            font-size: 0.6rem;
            background: var(--neon-purple);
            padding: 2px 10px;
            border-radius: 20px;
            color: #fff;
            text-transform: uppercase;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .stat-box:hover {
            border-color: rgba(0, 240, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }

        .stat-box label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a99ad;
            display: block;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .stat-box .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f0f4f8;
            word-break: break-all;
            font-family: 'Orbitron', sans-serif;
        }

        .stat-box .value.btc { color: var(--neon-green); }
        .stat-box .value.sm { color: #f59e0b; }

        .flex {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .mt-2 {
            margin-top: 16px;
        }

        .btn {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
            font-family: 'Rajdhani', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .btn-success:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .btn-sm {
            padding: 4px 14px;
            font-size: 0.7rem;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
        }

        .btn-sm:hover {
            background: rgba(0, 240, 255, 0.2);
            transform: scale(1.05);
        }

        input[type="number"] {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f0f4f8;
            padding: 8px 12px;
            border-radius: 30px;
            width: 90px;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Rajdhani', sans-serif;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .market-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 16px;
            border-radius: 12px;
            margin-bottom: 6px;
            border-left: 3px solid var(--neon-blue);
            gap: 8px;
            transition: all 0.3s;
        }

        .market-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-left-color: var(--neon-purple);
        }

        .market-item .name {
            font-weight: 700;
            min-width: 80px;
            color: #f0f4f8;
        }

        .market-item .price {
            color: var(--neon-green);
            font-weight: 600;
        }

        .market-item .qty {
            color: #8a99ad;
            font-size: 0.85rem;
        }

        .menu-notice {
            text-align: center;
            padding: 12px;
            background: rgba(0, 240, 255, 0.05);
            border-radius: 12px;
            border: 1px dashed rgba(0, 240, 255, 0.15);
            color: #8a99ad;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #3b82f6;
            z-index: 9999;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            max-width: 90%;
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
        }

        .toast.show {
            display: block;
            opacity: 1;
        }

        @media (max-width: 700px) {
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 16px;
            }
            .nav-links {
                justify-content: center;
            }
            .nav-links a {
                font-size: 0.7rem;
                padding: 6px 12px;
            }
            .user-profile {
                justify-content: center;
            }
            .grid-2 {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 8px;
            }
            .stat-box {
                padding: 8px 10px;
            }
            .stat-box .value {
                font-size: 1rem;
            }
            .card-title {
                font-size: 1rem;
            }
            .market-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 400px) {
            .grid-2 {
                grid-template-columns: repeat(2, 1fr);
            }
            .nav-links a {
                font-size: 0.6rem;
                padding: 4px 8px;
            }
            input[type="number"] {
                width: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="personagem.html">🧙 Personagem</a>
                <a href="mercado.html" class="active">🏛️ Mercado</a>
                <a href="minerar.html">⛏️ Mineração</a>
            </div>

            <div class="user-profile" id="userProfile">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-info">
                    <span class="user-nick" id="nomeJogador">Desconectado</span>
                    <span class="user-balance" id="saldosaldo">R$ 0,00</span>
                </div>
            </div>

            <button class="btn-login" id="btnLogin" onclick="redirecionarLogin()">🔑 Login</button>
        </nav>

        <div class="card">
            <div class="card-title">🏛️ Mercado · Itens <span class="badge">FLUTUA</span></div>
            <div id="listaMercado"></div>
        </div>

        <div class="card">
            <div class="card-title">₿ Câmbio BTC <span class="badge">LIVE</span></div>
            <div class="grid-2">
                <div class="stat-box"><label>📈 Compra (1 BTC)</label><div class="value" id="btcCompra">10,000</div></div>
                <div class="stat-box"><label>📉 Venda (1 BTC)</label><div class="value" id="btcVenda">999</div></div>
                <div class="stat-box"><label>📊 Spread</label><div class="value" id="spread">90.01%</div></div>
            </div>
            <div class="flex mt-2">
                <input type="number" id="qtdBTC" value="1" min="0.00000001" step="0.00000001">
                <button class="btn btn-success" onclick="comprarBTC()">⬆️ Comprar BTC</button>
                <button class="btn btn-danger" onclick="venderBTC()">⬇️ Vender BTC</button>
            </div>
            <div style="margin-top: 8px; font-size: 0.75rem; color: #8a99ad;">
                💡 Compra: 1 BTC = 10,000 saldo | Venda: 1 BTC = 999 saldo
            </div>
        </div>

        <div class="card">
            <div class="card-title">⚡ Stamina (SM) <span class="badge">ENERGIA</span></div>
            <div class="grid-2">
                <div class="stat-box"><label>📈 Compra</label><div class="value">12 saldo</div></div>
                <div class="stat-box"><label>📉 Venda</label><div class="value">8 saldo</div></div>
            </div>
            <div class="flex mt-2">
                <input type="number" id="qtdStamina" value="1" min="1" step="1">
                <button class="btn btn-success" onclick="comprarStamina()">⬆️ Comprar SM</button>
                <button class="btn btn-danger" onclick="venderStamina()">⬇️ Vender SM</button>
                <button class="btn btn-secondary" onclick="adicionarMoeda()">➕ +1000 saldo</button>
            </div>
        </div>

        <div class="menu-notice">🧭 Use o menu acima para navegar entre as seções</div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ============================================================
        // CONFIGURAÇÕES SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
        const TABELA = 'Geral';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const PRECO_COMPRA_BTC = 10000;
        const PRECO_VENDA_BTC = 999;
        const PRECO_COMPRA_SM = 12;
        const PRECO_VENDA_SM = 8;

        let usuarioAtual = null;
        let estado = {
            id: null,
            login: '',
            saldo: 500,
            btc: 0,
            sm: 40,
            maxSm: 40,
            itens: []
        };

        // ============================================================
        // FUNÇÕES
        // ============================================================
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderLeftColor = isError ? '#ef4444' : '#00f0ff';
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function redirecionarLogin() {
            window.location.href = 'login.html';
        }

        // ============================================================
        // VERIFICAR LOGIN
        // ============================================================
        function verificarLogin() {
            const usuarioLogado = localStorage.getItem('usuario_logado');
            
            if (!usuarioLogado) {
                showToast('❌ Faça login primeiro!', true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return false;
            }

            try {
                const user = JSON.parse(usuarioLogado);
                if (!user || !user.login) {
                    localStorage.removeItem('usuario_logado');
                    showToast('❌ Sessão inválida!', true);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                    return false;
                }
                return user;
            } catch (e) {
                localStorage.removeItem('usuario_logado');
                showToast('❌ Sessão inválida!', true);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
                return false;
            }
        }

        // ============================================================
        // CARREGAR DADOS
        // ============================================================
        async function carregarDadosDoUsuario(login) {
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('*')
                    .eq('login', login)
                    .single();

                if (error) throw error;

                if (data) {
                    usuarioAtual = data;
                    carregarEstadoDoUsuario(data);
                    return true;
                }
                return false;

            } catch (err) {
                console.error('Erro ao carregar dados:', err);
                showToast('❌ Erro ao carregar dados', true);
                return false;
            }
        }

        function carregarEstadoDoUsuario(data) {
            estado.id = data.id;
            estado.login = data.login;
            estado.saldo = parseFloat(data.saldo) || 500;
            estado.btc = parseFloat(data.btc) || 0;
            estado.sm = parseFloat(data.sm) || 40;
            estado.maxSm = parseFloat(data.max_sm) || 40;
            estado.itens = data.itens || [];
            atualizarUI();
        }

        // ============================================================
        // SALVAR
        // ============================================================
        async function salvarNoBanco() {
            if (!usuarioAtual) return;
            try {
                const { error } = await supabase
                    .from(TABELA)
                    .update({
                        saldo: estado.saldo,
                        btc: estado.btc,
                        sm: estado.sm,
                        max_sm: estado.maxSm,
                        itens: estado.itens,
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', estado.id);

                if (error) throw error;
            } catch (err) {
                console.error('Erro ao salvar:', err);
            }
        }

        // ============================================================
        // ATUALIZAR UI
        // ============================================================
        function atualizarUI() {
            const avatar = document.getElementById('userAvatar');
            const nick = document.getElementById('nomeJogador');
            const saldo = document.getElementById('saldosaldo');

            nick.textContent = estado.login || 'Desconectado';
            avatar.textContent = estado.login ? estado.login.charAt(0).toUpperCase() : '👤';
            saldo.textContent = new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(estado.saldo);

            document.getElementById('btcCompra').textContent = PRECO_COMPRA_BTC.toFixed(0);
            document.getElementById('btcVenda').textContent = PRECO_VENDA_BTC.toFixed(0);
            const spread = ((PRECO_COMPRA_BTC - PRECO_VENDA_BTC) / PRECO_COMPRA_BTC * 100);
            document.getElementById('spread').textContent = spread.toFixed(2) + '%';
            renderizarItens();
            salvarNoBanco();
        }

        function renderizarItens() {
            const container = document.getElementById('listaMercado');
            container.innerHTML = '';
            estado.itens.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'market-item';
                div.innerHTML = `
                    <span class="name">${item.nome}</span>
                    <span class="price">${item.preco.toFixed(2)} saldo</span>
                    <span class="qty">Qtd: ${item.qtd}</span>
                    <div>
                        <button class="btn-sm" onclick="comprarItem(${idx})">🟢 Comprar</button>
                        <button class="btn-sm" onclick="venderItem(${idx})">🔴 Vender</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // ============================================================
        // FUNÇÕES DO MERCADO
        // ============================================================
        function comprarItem(idx) {
            const item = estado.itens[idx];
            if (estado.saldo < item.preco) { showToast('❌ saldo insuficiente!', true); return; }
            if (item.qtd <= 0) { showToast('❌ Item esgotado!', true); return; }
            estado.saldo -= item.preco;
            item.qtd -= 1;
            atualizarUI();
            showToast(`✅ Comprou ${item.nome} por ${item.preco.toFixed(2)} saldo`);
        }

        function venderItem(idx) {
            const item = estado.itens[idx];
            const precoVenda = item.preco * 0.6;
            estado.saldo += precoVenda;
            item.qtd += 1;
            atualizarUI();
            showToast(`✅ Vendeu ${item.nome} por ${precoVenda.toFixed(2)} saldo`);
        }

        function getQtdBTC() {
            const input = document.getElementById('qtdBTC');
            let val = parseFloat(input.value);
            if (isNaN(val) || val <= 0) val = 0.00000001;
            if (val < 0.00000001) val = 0.00000001;
            input.value = val;
            return val;
        }

        async function comprarBTC() {
            if (!usuarioAtual) { showToast('❌ Faça login primeiro!', true); return; }
            const qtd = getQtdBTC();
            const custo = qtd * PRECO_COMPRA_BTC;

            if (estado.saldo < custo) {
                showToast(`❌ Saldo insuficiente! Precisa de ${custo.toFixed(2)} saldo`, true);
                return;
            }

            estado.saldo -= custo;
            estado.btc += qtd;
            atualizarUI();
            showToast(`✅ Comprou ${qtd.toFixed(8)} BTC por ${custo.toFixed(2)} saldo`);
        }

        async function venderBTC() {
            if (!usuarioAtual) { showToast('❌ Faça login primeiro!', true); return; }
            const qtd = getQtdBTC();

            if (estado.btc < qtd) {
                showToast(`❌ BTC insuficiente! Tem ${estado.btc.toFixed(8)} BTC`, true);
                return;
            }

            const valor = qtd * PRECO_VENDA_BTC;
            estado.btc -= qtd;
            estado.saldo += valor;
            atualizarUI();
            showToast(`✅ Vendeu ${qtd.toFixed(8)} BTC por ${valor.toFixed(2)} saldo`);
        }

        function getQtdStamina() {
            const input = document.getElementById('qtdStamina');
            let val = parseInt(input.value);
            if (isNaN(val) || val < 1) val = 1;
            input.value = val;
            return val;
        }

        function comprarStamina() {
            if (!usuarioAtual) { showToast('❌ Faça login primeiro!', true); return; }
            const qtd = getQtdStamina();
            const custo = qtd * PRECO_COMPRA_SM;

            if (estado.saldo < custo) {
                showToast(`❌ Saldo insuficiente! Precisa de ${custo} saldo`, true);
                return;
            }
            if (estado.sm + qtd > estado.maxSm) {
                showToast(`❌ Máximo ${estado.maxSm} SM. Pode comprar no máximo ${estado.maxSm - estado.sm}`, true);
                return;
            }

            estado.saldo -= custo;
            estado.sm += qtd;
            atualizarUI();
            showToast(`✅ Comprou ${qtd} SM por ${custo} saldo`);
        }

        function venderStamina() {
            if (!usuarioAtual) { showToast('❌ Faça login primeiro!', true); return; }
            const qtd = getQtdStamina();

            if (estado.sm < qtd) {
                showToast(`❌ Você só tem ${estado.sm} SM`, true);
                return;
            }

            estado.sm -= qtd;
            estado.saldo += qtd * PRECO_VENDA_SM;
            atualizarUI();
            showToast(`✅ Vendeu ${qtd} SM por ${qtd * PRECO_VENDA_SM} saldo`);
        }

        function adicionarMoeda() {
            if (!usuarioAtual) { showToast('❌ Faça login primeiro!', true); return; }
            estado.saldo += 1000;
            atualizarUI();
            showToast('✅ +1000 saldo adicionados!');
        }

        function atualizarMercado() {
            if (!usuarioAtual) return;
            estado.itens.forEach(item => {
                const variacao = (Math.random() - 0.5) * 2.5;
                item.preco = Math.max(0.5, Math.round((item.preco + variacao) * 100) / 100);
            });
            renderizarItens();
            salvarNoBanco();
        }

        async function carregarDadosAtualizados() {
            if (!usuarioAtual) return;
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('saldo, btc, sm, max_sm, itens')
                    .eq('id', estado.id)
                    .single();

                if (error) throw error;

                estado.saldo = parseFloat(data.saldo) || 500;
                estado.btc = parseFloat(data.btc) || 0;
                estado.sm = parseFloat(data.sm) || 40;
                estado.maxSm = parseFloat(data.max_sm) || 40;
                estado.itens = data.itens || [];

                atualizarUI();
            } catch (err) {
                console.error('Erro ao atualizar dados:', err);
            }
        }

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        async function init() {
            const user = verificarLogin();
            if (!user) return;

            const carregado = await carregarDadosDoUsuario(user.login);
            if (!carregado) {
                showToast('❌ Erro ao carregar dados', true);
                return;
            }

            // 3. Atualiza botão para Dashboard
            const btnLogin = document.getElementById('btnLogin');
            btnLogin.textContent = '🏠 DASHBOARD';
            btnLogin.onclick = function() {
                window.location.href = '../../dashboard.html';
            };

            setInterval(() => {
                if (usuarioAtual) carregarDadosAtualizados();
            }, 15000);

            setInterval(() => {
                if (usuarioAtual) atualizarMercado();
            }, 8000);

            showToast(`✅ Bem-vindo, ${estado.login}!`);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
