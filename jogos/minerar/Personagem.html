<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧙 Personagem - MM World</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/personagem.css">
</head>
<body>
    <div class="game-container">
        <!-- ============================================================
        NAVBAR
        ============================================================ -->
        <nav class="nav-bar">
            <div class="nav-links">
                <a href="index.html">🏠 Dashboard</a>
                <a href="personagem.html" class="active">🧙 Personagem</a>
                <a href="mercado.html">🏛️ Mercado</a>
                <a href="minerar.html">⛏️ Mineração</a>
            </div>

            <div class="user-profile" id="userProfile">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-info">
                    <span class="user-nick" id="nomeJogador">Desconectado</span>
                    <span class="user-balance" id="saldosaldo">R$ 0,00</span>
                </div>
            </div>

            <button class="btn-login" id="btnLogin">🔑 Login</button>
        </nav>

        <!-- ============================================================
        SISTEMA DE NÍVEL + ATRIBUTOS
        ============================================================ -->
        <div class="card">
            <div class="card-title">🧙 Ficha do Herói <span class="badge">NÍVEL</span></div>

            <!-- BADGE DE NÍVEL -->
            <div class="level-badge-container">
                <div class="level-badge">
                    <span class="level-number" id="levelNumber">1</span>
                    <div>
                        <div class="level-label">Nível</div>
                        <div class="level-title" id="levelTitle">🌱 Iniciante</div>
                    </div>
                </div>
            </div>

            <!-- BARRA DE EXP -->
            <div class="exp-container">
                <div class="exp-bar">
                    <div class="exp-fill" id="expFill" style="width: 0%;"></div>
                </div>
                <div class="exp-text">
                    <span class="exp-current" id="expCurrent">0</span>
                    <span>/ <span class="exp-next" id="expNext">100</span> EXP</span>
                </div>
            </div>

            <!-- STATS GRID -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-box">
                    <label>❤️ HP</label>
                    <div class="value hp" id="statHp">100/100</div>
                </div>
                <div class="stat-box">
                    <label>💧 MP</label>
                    <div class="value mp" id="statMp">50/50</div>
                </div>
                <div class="stat-box">
                    <label>⚡ SM</label>
                    <div class="value sm" id="statSm">40/40</div>
                </div>
                <div class="stat-box">
                    <label>⚔️ ATK</label>
                    <div class="value atk" id="statAtk">15</div>
                </div>
                <div class="stat-box">
                    <label>🛡️ DEF</label>
                    <div class="value def" id="statDef">10</div>
                </div>
                <div class="stat-box">
                    <label>🔮 MAG</label>
                    <div class="value mag" id="statMag">8</div>
                </div>
            </div>

            <!-- RECURSOS EXTRAS -->
            <div class="extra-stats">
                <div class="stat-box">
                    <label>⚡ Poder Hash</label>
                    <div class="value hash" id="poderHash">1.0 MH/s</div>
                </div>
                <div class="stat-box">
                    <label>🛒 Itens</label>
                    <div class="value" id="qtdItens">0</div>
                </div>
                <div class="stat-box">
                    <label>₿ BTC</label>
                    <div class="value btc" id="btcValue">0.00000000</div>
                </div>
            </div>
        </div>

        <!-- ============================================================
        AÇÕES DO SISTEMA DE NÍVEL
        ============================================================ -->
        <div class="card">
            <div class="card-title">🎮 Ações <span class="badge">TREINAR</span></div>

            <div class="level-actions">
                <button class="btn-level btn-treinar" id="btnTreinar">🏋️ Treinar (+EXP)</button>
                <button class="btn-level btn-descansar" id="btnDescansar">🛌 Descansar</button>
                <button class="btn-level btn-reset" id="btnResetLevel">🔄 Resetar Nível</button>
            </div>

            <div class="sm-actions">
                <button class="btn-sm btn-sm-ganhar" id="btnSmGanhar">➕ Ganhar 50 SM</button>
                <button class="btn-sm btn-sm-gastar" id="btnSmGastar">➖ Gastar 30 SM</button>
                <button class="btn-sm btn-sm-resetar" id="btnSmResetar">🔄 Resetar SM</button>
            </div>
        </div>

        <!-- ============================================================
        MENU NOTICE
        ============================================================ -->
        <div class="menu-notice">🧭 Use o menu acima para navegar entre as seções</div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div id="levelToast" class="toast"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">
    </script>
    <script type="module" src="script/personagem.js"></script>
</body>
</html>
