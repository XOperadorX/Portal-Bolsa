<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Registro - MM World</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-green: #00ff66;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: #0a0b10;
            color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            padding: 20px;
        }

        .register-container {
            background: rgba(18, 21, 32, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(0, 240, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .register-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-subtitle {
            text-align: center;
            color: #8a99ad;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            color: #a0aec0;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f0f4f8;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }

        .form-group input::placeholder {
            color: #4a5568;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-green), #10b981);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 255, 102, 0.4);
        }

        .btn-register:active {
            transform: scale(0.97);
        }

        .btn-back {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #8a99ad;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Rajdhani', sans-serif;
            margin-top: 10px;
        }

        .btn-back:hover {
            border-color: var(--neon-blue);
            color: #fff;
            background: rgba(0, 240, 255, 0.05);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(8px);
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-left: 4px solid #3b82f6;
            z-index: 9999;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            opacity: 1;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 24px;
            }
            .register-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h1 class="register-title">MM World</h1>
        <p class="register-subtitle">📝 Criar nova conta</p>

        <div class="form-group">
            <label>👤 Usuário</label>
            <input type="text" id="loginInput" placeholder="Escolha um nome de usuário">
        </div>

        <div class="form-group">
            <label>🔒 Senha</label>
            <input type="password" id="senhaInput" placeholder="Crie uma senha">
        </div>

        <div class="form-group">
            <label>🔒 Confirmar Senha</label>
            <input type="password" id="confirmSenhaInput" placeholder="Confirme sua senha">
        </div>

        <button class="btn-register" onclick="registrar()">📝 Criar conta</button>
        <button class="btn-back" onclick="voltarLogin()">← Voltar para o login</button>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD';
        const TABELA = 'Geral';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderLeftColor = isError ? '#ef4444' : '#00f0ff';
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function registrar() {
            const login = document.getElementById('loginInput').value.trim();
            const senha = document.getElementById('senhaInput').value.trim();
            const confirmSenha = document.getElementById('confirmSenhaInput').value.trim();

            if (!login || !senha || !confirmSenha) {
                showToast('❌ Preencha todos os campos!', true);
                return;
            }

            if (senha !== confirmSenha) {
                showToast('❌ As senhas não coincidem!', true);
                return;
            }

            if (senha.length < 4) {
                showToast('❌ A senha deve ter pelo menos 4 caracteres!', true);
                return;
            }

            try {
                const { data: existingUser } = await supabase
                    .from(TABELA)
                    .select('login')
                    .eq('login', login)
                    .single();

                if (existingUser) {
                    showToast('❌ Usuário já existe!', true);
                    return;
                }

                const novoUsuario = {
                    login: login,
                    senha: senha,
                    saldo: 0,
                    btc: 0,
                    hp: 100,
                    max_hp: 100,
                    mp: 50,
                    max_mp: 50,
                    sm: 100,
                    max_sm: 100,
                    atk: 15,
                    def: 10,
                    mag: 8,
                    nivel: 1,
                    experiencia: 0,
                    exp_next: 100,
                    poder_hash: 1.0,
                    itens: [
                        { nome: 'Poção de Vida', preco: 50, qtd: 3 },
                        { nome: 'Poção de Mana', preco: 40, qtd: 2 },
                        { nome: 'Espada de Madeira', preco: 100, qtd: 1 }
                    ]
                };

                const { error } = await supabase
                    .from(TABELA)
                    .insert([novoUsuario]);

                if (error) throw error;

                showToast('✅ Conta criada com sucesso!');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                console.error('Erro ao registrar:', err);
                showToast('❌ Erro ao criar conta', true);
            }
        }

        function voltarLogin() {
            window.location.href = 'login.html';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                registrar();
            }
        });

        const usuarioLogado = localStorage.getItem('usuario_logado');
        if (usuarioLogado) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
