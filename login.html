<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MM Quase Tudo</title>
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏦 MM Quase Tudo</h1>
            <span>Loguinho</span>
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="mensagemSucesso" class="mensagem-sucesso"></div>

        <form id="formLogin">
            <div class="form-group">
                <label for="login">Login (Usuário)</label>
                <input type="text" id="login" placeholder="Digite seu login" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">🔐 Entrar</button>
        </form>

        <div class="links">
            <a href="cadastro.html">📝 Criar conta</a>
            <a href="esqueci-senha.html">🔑 Esqueci a senha</a>
            <a href="esqueci-login.html">👤 Esqueci o login</a>
        </div>

        <div id="statusSupabase" class="status-supabase">☁️ Verificando conexão...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>

    <script type="module" src="script/login.js"></script>
</body>
</html>
