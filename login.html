<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MM Quase Tudo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002e5d, #001a33);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2rem;
            color: #002e5d;
        }

        .logo span {
            font-size: 1.2rem;
            color: #4a6f8f;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #002e5d;
            background: white;
            box-shadow: 0 0 0 4px rgba(0,46,93,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #002e5d, #001a33);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,46,93,0.3);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .links a {
            color: #002e5d;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #f59e0b;
            text-decoration: underline;
        }

        .mensagem-erro {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #b91c1c;
        }

        .mensagem-erro.show {
            display: block;
        }

        .mensagem-sucesso {
            background: #dcfce7;
            color: #0a5c3e;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            border-left: 4px solid #10b981;
        }

        .mensagem-sucesso.show {
            display: block;
        }

        .status-supabase {
            text-align: center;
            font-size: 0.75rem;
            color: #6c86a3;
            margin-top: 20px;
            padding: 8px;
            border-radius: 8px;
            background: #f1f5f9;
        }

        .status-supabase.online {
            color: #10b981;
        }

        .status-supabase.offline {
            color: #ef4444;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #002e5d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 24px;
            }
            .links {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🏦 Loguinho</h1>
            <span>MM Quase Tudo</span>
        </div>

        <div id="mensagemErro" class="mensagem-erro"></div>
        <div id="mensagemSucesso" class="mensagem-sucesso"></div>

        <form id="formLogin">
            <div class="form-group">
                <label for="login">Login (Usuário)</label>
                <input type="text" id="login" placeholder="Digite seu login" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btnLogin">🔐 Entrar</button>
        </form>

        <div class="links">
            <a href="cadastro.html">📝 Criar conta</a>
            <a href="esqueci-senha.html">🔑 Esqueci a senha</a>
            <a href="esqueci-login.html">👤 Esqueci o login</a>
        </div>

        <div id="statusSupabase" class="status-supabase">☁️ Verificando conexão...</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
    }
    </script>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        // ==================== CONFIGURAÇÕES ====================
        const SUPABASE_URL = 'https://xrcxvizzdumcxbylmkvn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_E-g3G3wW4EySbCsXLXp8KQ_FnmERMcD'; // COLOQUE SUA CHAVE AQUI
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
        const TABELA = 'Geral';

        // ==================== ELEMENTOS ====================
        const formLogin = document.getElementById('formLogin');
        const loginInput = document.getElementById('login');
        const senhaInput = document.getElementById('senha');
        const btnLogin = document.getElementById('btnLogin');
        const mensagemErro = document.getElementById('mensagemErro');
        const mensagemSucesso = document.getElementById('mensagemSucesso');
        const statusSupabase = document.getElementById('statusSupabase');

        // ==================== FUNÇÕES ====================
        function mostrarErro(mensagem) {
            mensagemErro.textContent = mensagem;
            mensagemErro.className = 'mensagem-erro show';
            mensagemSucesso.className = 'mensagem-sucesso';
        }

        function mostrarSucesso(mensagem) {
            mensagemSucesso.textContent = mensagem;
            mensagemSucesso.className = 'mensagem-sucesso show';
            mensagemErro.className = 'mensagem-erro';
        }

        function ocultarMensagens() {
            mensagemErro.className = 'mensagem-erro';
            mensagemSucesso.className = 'mensagem-sucesso';
        }

        async function verificarSupabase() {
            try {
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('id')
                    .limit(1);
                
                if (error) {
                    statusSupabase.textContent = '⚠️ Erro ao conectar ao Supabase';
                    statusSupabase.className = 'status-supabase offline';
                    return false;
                }
                
                statusSupabase.textContent = '✅ Conectado ao Supabase';
                statusSupabase.className = 'status-supabase online';
                return true;
            } catch (error) {
                statusSupabase.textContent = '❌ Erro ao conectar ao Supabase';
                statusSupabase.className = 'status-supabase offline';
                return false;
            }
        }

        async function fazerLogin(login, senha) {
            try {
                // Buscar usuário pelo login
                const { data, error } = await supabase
                    .from(TABELA)
                    .select('id, login, senha, nome, saldo, saldo_poupanca, carteira')
                    .eq('login', login)
                    .single();

                if (error) {
                    if (error.code === 'PGRST116') {
                        mostrarErro('❌ Usuário não encontrado!');
                        return false;
                    }
                    throw error;
                }

                if (!data) {
                    mostrarErro('❌ Usuário não encontrado!');
                    return false;
                }

                // Verificar senha
                if (data.senha !== senha) {
                    mostrarErro('❌ Senha incorreta!');
                    return false;
                }

                // Login bem-sucedido - salvar dados do usuário
                localStorage.setItem('usuario_logado', JSON.stringify({
                    id: data.id,
                    login: data.login,
                    nome: data.nome || data.login,
                    saldo: data.saldo || 0,
                    saldo_poupanca: data.saldo_poupanca || 0,
                    carteira: data.carteira || {}
                }));

                mostrarSucesso('✅ Login realizado com sucesso! Redirecionando...');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

                return true;

            } catch (error) {
                console.error('Erro no login:', error);
                mostrarErro('❌ Erro ao realizar login. Tente novamente.');
                return false;
            }
        }

        // ==================== EVENT LISTENERS ====================
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            ocultarMensagens();

            const login = loginInput.value.trim();
            const senha = senhaInput.value.trim();

            if (!login || !senha) {
                mostrarErro('⚠️ Preencha todos os campos!');
                return;
            }

            // Verificar Supabase
            const online = await verificarSupabase();
            if (!online) {
                mostrarErro('❌ Sem conexão com o banco de dados. Tente novamente mais tarde.');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="loading"></span> Entrando...';

            await fazerLogin(login, senha);

            btnLogin.disabled = false;
            btnLogin.innerHTML = '🔐 Entrar';
        });

        // Verificar conexão ao carregar
        verificarSupabase();

        // Verificar se já está logado
        const usuarioLogado = localStorage.getItem('usuario_logado');
        if (usuarioLogado) {
            try {
                const user = JSON.parse(usuarioLogado);
                if (user && user.login) {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                localStorage.removeItem('usuario_logado');
            }
        }

        // Enter para submeter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                formLogin.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
